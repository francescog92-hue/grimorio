<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grimorio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E2A6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>window.GRIMORIO_PWA = true; window.GRIMORIO_VERSION = "26/09/2026 · 8463f2";</script>
</head>
<body>
<title>Libro degli Incantesimi</title>
<style>
:root{
  color-scheme: light;
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F3F4F8; --ink:#1A1E2C; --ink-2:#4F566B; --ink-3:#7F869A;
  --line:#D8DCE5; --line-2:#C2C7D4; --accent:#3346A8; --accent-2:#26388F; --accent-soft:#E3E7FA; --on-accent:#FFFFFF;
  --star:#A8700C; --warn:#8F5200; --warn-soft:#FBEACB; --danger:#B0362A; --scrim:rgba(14,17,32,.45);
  --s-abi:#2F6FB0; --s-amm:#B03B72; --s-div:#1F7C79; --s-evo:#98660A; --s-ill:#7050BC; --s-inv:#C0431D; --s-nec:#4B6832; --s-tra:#875726;
  --shadow:0 1px 2px rgba(22,28,52,.06),0 10px 28px rgba(22,28,52,.08);
  --radius:12px;
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Alegreya Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --hdr:210px;
  --opt-bg:#1C2347; --opt-ink:#FFFFFF; --pill-dark:#1E2A6E; --pill-dark-lab:#C3CBFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1120; --surface:#161A2C; --surface-2:#1C2135; --ink:#E7E9F3; --ink-2:#A7ADC5; --ink-3:#747B97;
    --line:#272D48; --line-2:#363D5E; --accent:#97A4FF; --accent-2:#B6BEFF; --accent-soft:#242B52; --on-accent:#0E1120;
    --star:#E8B44F; --warn:#F2B75A; --warn-soft:#3A2C12; --danger:#F2826F; --scrim:rgba(0,0,0,.6);
    --s-abi:#74AAEA; --s-amm:#E680B0; --s-div:#5BC4C0; --s-evo:#E5B24F; --s-ill:#AF90F3; --s-inv:#F58561; --s-nec:#94B66D; --s-tra:#D29C62;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1120; --surface:#161A2C; --surface-2:#1C2135; --ink:#E7E9F3; --ink-2:#A7ADC5; --ink-3:#747B97;
  --line:#272D48; --line-2:#363D5E; --accent:#97A4FF; --accent-2:#B6BEFF; --accent-soft:#242B52; --on-accent:#0E1120;
  --star:#E8B44F; --warn:#F2B75A; --warn-soft:#3A2C12; --danger:#F2826F; --scrim:rgba(0,0,0,.6);
  --s-abi:#74AAEA; --s-amm:#E680B0; --s-div:#5BC4C0; --s-evo:#E5B24F; --s-ill:#AF90F3; --s-inv:#F58561; --s-nec:#94B66D; --s-tra:#D29C62;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
html.lock, html.lock body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.s-abi{--sc:var(--s-abi)} .s-amm{--sc:var(--s-amm)} .s-div{--sc:var(--s-div)} .s-evo{--sc:var(--s-evo)}
.s-ill{--sc:var(--s-ill)} .s-inv{--sc:var(--s-inv)} .s-nec{--sc:var(--s-nec)} .s-tra{--sc:var(--s-tra)}

.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* ---------- Testata ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 12px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px}
.pg{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:none;border:0;padding:4px 0;min-width:0;text-align:left;margin-right:auto}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.pg-name{font-family:var(--display);font-size:26px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pg-name .caret{font-family:var(--body);font-size:14px;color:var(--ink-3);margin-left:6px}
.sync{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.ok::before{background:#3FA66B}.sync.busy::before{background:var(--warn)}.sync.err::before{background:var(--danger)}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.field-pill{display:flex;align-items:center;gap:6px;height:44px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 6px 0 12px}
.field-pill .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field-pill select{border:0;background:transparent;font-size:16px;font-weight:700;height:40px;padding-right:4px;max-width:170px}
.field-pill.cls-pill{background:var(--pill-dark);border-color:var(--pill-dark)}
.field-pill.cls-pill .lab{color:var(--pill-dark-lab)}
.field-pill.cls-pill select{color:#FFFFFF;color-scheme:dark}
select option,select optgroup{background-color:var(--opt-bg);color:var(--opt-ink)}
.stepper button{width:34px;height:34px;border-radius:8px;border:0;background:var(--surface-2);font-size:20px;line-height:1;font-weight:700}
.stepper output{min-width:26px;text-align:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.stat{display:flex;align-items:baseline;gap:6px;height:44px;padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);align-self:center}
.stat .v{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;align-self:center}
.stat.warn{background:var(--warn-soft);border-color:transparent}.stat.warn .v{color:var(--warn)}

.tabs{display:flex;gap:4px;margin-top:12px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tab{height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .n{font-weight:500;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}

/* ---------- Colonne ---------- */
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-top:16px}
@media (min-width:900px){
  .panes{grid-template-columns:minmax(0,1fr) minmax(0,450px)}
  .detail-pane{position:sticky;top:calc(var(--hdr) + 16px);align-self:start;max-height:calc(100vh - var(--hdr) - 32px);overflow:auto;border-radius:var(--radius)}
  .d-close{display:none}
}
@media (max-width:899.98px){
  .detail-pane{display:none}
  html.detail-open .detail-pane{display:block}
  html.detail-open #listPane{display:none}
  .detail-pane.empty{display:none!important}
}

/* ---------- Filtri ---------- */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;height:44px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.chips select{height:40px;border-radius:999px;border:1px solid var(--pill-dark);background:var(--pill-dark);padding:0 12px;font-weight:700;font-size:15px;color:#FFFFFF;color-scheme:dark}
.countbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px;color:var(--ink-3);font-size:14px}

.hint{background:var(--accent-soft);color:var(--ink);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.hint p{margin:0;flex:1}
.hint button{border:0;background:none;color:var(--accent);font-weight:800;min-height:32px}

/* ---------- Elenco ---------- */
.group{margin-bottom:18px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 6px}
.group-h h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.group-h .aside{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 16px;border-top:1px solid var(--line);position:relative;cursor:pointer;min-height:62px}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row.hid{opacity:.5}
.row-main{flex:1;min-width:0}
.nm{font-weight:800;font-size:17px}
.en{font-style:italic;color:var(--ink-3);font-size:14px;margin-left:6px}
.row-meta{font-size:14px;color:var(--ink-2);margin-top:1px}
.sch{color:var(--sc);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;font-size:11px;font-weight:800;border:1px solid var(--line-2);color:var(--ink-2);margin-left:4px;vertical-align:1px}
.badge.al{border-color:var(--accent);color:var(--accent)}
.row-acts{display:flex;gap:4px;flex:none}
.tg{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;color:var(--ink-3);display:grid;place-items:center;font-size:18px;font-weight:800;line-height:1}
.tg.prep.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tg.prep.always{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent)}
.tg.book.on{border-color:var(--star);color:var(--star);background:transparent}
.empty-list{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);padding:22px;text-align:center;color:var(--ink-2)}
.empty-list p{margin:0 0 12px}

/* ---------- Slot ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.panel-h h3{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.slot-row{display:flex;align-items:center;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.slot-row:first-of-type{border-top:0}
.slot-lv{width:74px;flex:none;font-family:var(--display);font-size:20px;line-height:1.1}
.slot-lv small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-3)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.pip::after{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);transform:rotate(45deg);border-radius:5px}
.pip.spent::after{background:transparent;opacity:.55}
.slot-left{margin-left:auto;font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.conc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.conc p{margin:0;flex:1;min-width:180px}
.conc b{font-family:var(--display);font-weight:400;font-size:19px}
.note{font-size:14px;color:var(--ink-3);margin:6px 0 0}

/* ---------- Pulsanti ---------- */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Scheda incantesimo ---------- */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px 22px;box-shadow:var(--shadow)}
.d-close{margin-bottom:12px}
.lvl-line{margin:0;color:var(--sc);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.d-title{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.08;margin:6px 0 2px;text-wrap:balance}
.d-en{color:var(--ink-3);font-style:italic;margin:0 0 14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0 0 16px;padding:14px 0;border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:800}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.d-desc p{margin:0 0 10px;line-height:1.58;max-width:65ch}
.d-higher{background:var(--surface-2);border-radius:10px;padding:10px 14px;margin:14px 0}
.d-higher h4{margin:0 0 2px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.d-higher p{margin:0}
.d-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
.cls-chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.cls-chip.me{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.d-src{font-size:14px;color:var(--ink-3);margin:6px 0 0}
.d-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.d-block h4{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.cast-btn{flex-direction:column;gap:0;line-height:1.1;min-width:70px;padding:6px 12px}
.cast-btn small{font-weight:500;font-size:12px;opacity:.8}
.d-empty{padding:28px 24px;text-align:left}
.d-empty h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 8px}
.d-empty ul{margin:10px 0 0;padding-left:20px;color:var(--ink-2)}
.d-empty li{margin:4px 0}
.pg-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 0 20px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.pg-card .pc-name{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.1;margin:0 0 4px;overflow-wrap:anywhere}
.pg-card .pc-meta{margin:0 0 14px;color:var(--ink-2);font-size:15px}
.pc-frame{display:block;width:min(340px,100%);aspect-ratio:3/4;padding:0;border:4px solid var(--pill-dark);border-radius:14px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);cursor:pointer}
.pc-frame.sq{aspect-ratio:1/1;width:min(360px,100%)}
.pc-frame.ell{border-radius:50%}
.pc-frame img{width:100%;height:100%;object-fit:cover;display:block}
.pc-frame.empty{width:min(220px,100%);border-style:dashed;border-color:var(--line-2);box-shadow:none;display:grid;place-items:center;color:var(--ink-3);font-family:var(--display);font-size:80px}
.pg-card .pc-add{margin-top:10px;font-size:14px;font-weight:700;color:var(--accent)}
.d-card .pg-card{border-bottom:0;margin-bottom:0;padding-top:8px}
.pc-tip{text-align:center;color:var(--ink-3);font-size:14px;margin:0 0 4px}
.d-empty .d-hint{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px}
.edited-tag{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}

/* ---------- Fogli modali ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;z-index:60;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:18px;max-height:86vh}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 12px}
.sheet h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px}
.sheet p{margin:0 0 10px;color:var(--ink-2)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start}
.form{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:520px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.form input[type=text],.form select,.form textarea,.sheet textarea,.sheet input[type=text]{font-size:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.form textarea,.sheet textarea{min-height:130px;line-height:1.5;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check,.form .check{flex-direction:row;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--danger);font-weight:700;margin:0}
.flabel{display:block;margin-bottom:6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.char{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);text-align:left;min-height:56px}
.char.on{border:2px solid var(--accent);background:var(--accent-soft)}
.char .c-name{font-family:var(--display);font-size:21px}
.char .c-meta{font-size:14px;color:var(--ink-3)}
.form select{color-scheme:dark;background-color:var(--pill-dark);color:#FFFFFF;border-color:var(--pill-dark)}
.is-list{margin-top:12px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.is-list .row{cursor:default}
.is-list .note{padding:10px 14px;margin:0}
.sheet-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}

<div class="app">

<script>
(() => {
"use strict";

/* ================= Dati ================= */
const RAW = [["acid-splash","Acid Splash","Spruzzo Acido",0,"evo","a","18 m","V, S","Istantanea","","ASM","PHB","Scagli una bolla di acido contro una creatura entro gittata, oppure contro due creature che si trovano entro 1,5 m l'una dall'altra. Ogni bersaglio deve superare un TS su Destrezza o subire 1d6 danni da acido.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["blade-ward","Blade Ward","Interdizione alle Lame",0,"abi","a","Sé","V, S","1 round","","BSWM","PHB","Tracci un segno protettivo nell'aria. Fino alla fine del tuo prossimo turno hai resistenza ai danni contundenti, perforanti e taglienti inflitti dagli attacchi con armi.",""],["chill-touch","Chill Touch","Tocco Gelido",0,"nec","a","36 m","V, S","1 round","","SWM","PHB","Una mano spettrale afferra una creatura: fai un attacco a distanza con incantesimo. Se colpisci infligge 1d8 danni necrotici e il bersaglio non può recuperare punti ferita fino all'inizio del tuo prossimo turno. Se è un non morto, ha anche svantaggio ai tiri per colpire contro di te fino ad allora.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["dancing-lights","Dancing Lights","Luci Danzanti",0,"inv","a","36 m","V, S, M","1 minuto","c","ABSM","PHB","Crei fino a quattro luci simili a torce (oppure le unisci in una forma luminosa vagamente umanoide) che fluttuano nell'aria e fanno luce fioca in un raggio di 3 m. Con un'azione bonus puoi spostarle fino a 18 m; devono restare entro 6 m l'una dall'altra e svaniscono se escono dalla gittata.",""],["druidcraft","Druidcraft","Artificio Druidico",0,"tra","a","9 m","V, S","Istantanea","","D","PHB","Piccoli prodigi naturali: prevedi il tempo atmosferico locale per le prossime 24 ore, fai sbocciare un fiore o schiudere un seme, crei un innocuo effetto sensoriale (foglie che cadono, una brezza, un profumo) in un cubo di 1,5 m, oppure accendi o spegni una candela, una torcia o un piccolo fuoco.",""],["eldritch-blast","Eldritch Blast","Deflagrazione Occulta",0,"inv","a","36 m","V, S","Istantanea","","W","PHB","Un raggio di energia crepitante sfreccia verso una creatura: fai un attacco a distanza con incantesimo. Se colpisce infligge 1d10 danni da forza.","Crei più raggi: due al 5° livello del personaggio, tre all'11°, quattro al 17°. Ogni raggio può colpire lo stesso bersaglio o bersagli diversi, con un tiro per colpire separato."],["fire-bolt","Fire Bolt","Dardo di Fuoco",0,"inv","a","36 m","V, S","Istantanea","","ASM","PHB","Scagli una scheggia di fuoco contro una creatura o un oggetto: fai un attacco a distanza con incantesimo, 1d10 danni da fuoco se colpisce. Un oggetto infiammabile colpito che non sia indossato né trasportato prende fuoco.","Il danno aumenta di 1d10 al 5° livello del personaggio (2d10), all'11° (3d10) e al 17° (4d10)."],["friends","Friends","Amicizia",0,"amm","a","Sé","S, M","1 minuto","c","BSWM","PHB","Per la durata hai vantaggio a tutte le prove di Carisma dirette contro una creatura non ostile a tua scelta. Quando l'incantesimo termina, la creatura capisce di essere stata influenzata con la magia e potrebbe diventare ostile, a discrezione del DM.",""],["guidance","Guidance","Guida",0,"div","a","Contatto","V, S","1 minuto","c","ACD","PHB","Tocchi una creatura consenziente. Una volta prima che l'incantesimo termini, può tirare 1d4 e aggiungerlo a una prova di caratteristica a sua scelta, prima o dopo aver tirato il dado. Poi l'incantesimo termina.",""],["light","Light","Luce",0,"inv","a","Contatto","V, M","1 ora","","ABCSM","PHB","Un oggetto che tocchi, non più grande di 3 m per lato, emette luce intensa in un raggio di 6 m e luce fioca per altri 6 m, del colore che preferisci. Coprirlo completamente blocca la luce. Se l'oggetto è tenuto o indossato da una creatura ostile, questa può evitarlo con un TS su Destrezza. Lanciarlo di nuovo termina l'effetto precedente.",""],["mage-hand","Mage Hand","Mano Magica",0,"evo","a","9 m","V, S","1 minuto","","ABSWM","PHB","Crei una mano spettrale fluttuante che controlli con un'azione: manipola oggetti, apre porte o contenitori non chiusi a chiave, ripone o recupera oggetti, versa liquidi. Ogni volta che la usi può spostarsi fino a 9 m. Non può attaccare, attivare oggetti magici né trasportare più di 5 kg. Svanisce se si allontana oltre 9 m da te.",""],["mending","Mending","Riparare",0,"tra","1 minuto","Contatto","V, S, M","Istantanea","","ABCDSM","PHB","Ripari una singola rottura o lacerazione in un oggetto che tocchi (una catena spezzata, una chiave rotta, un mantello strappato, un otre che perde), purché non più grande di 30 cm in ogni dimensione. Può riparare un oggetto magico ma non ne ripristina la magia.",""],["message","Message","Messaggio",0,"tra","a","36 m","V, S, M","1 round","","ABSM","PHB","Indichi una creatura entro gittata e le sussurri un messaggio: solo lei lo sente e può risponderti con un sussurro che senti solo tu. Il messaggio aggira ostacoli e angoli, ma è bloccato da 30 cm di pietra, 2,5 cm di metallo comune, un sottile foglio di piombo o 90 cm di legno.",""],["minor-illusion","Minor Illusion","Illusione Minore",0,"ill","a","9 m","S, M","1 minuto","","BSWM","PHB","Crei un suono oppure l'immagine di un oggetto non più grande di un cubo di 1,5 m. L'immagine non emette luce, suono o odore, e chi la tocca capisce che è falsa. Una creatura può usare un'azione per esaminarla: con una prova di Intelligenza (Indagare) contro la tua CD la riconosce come illusione.",""],["poison-spray","Poison Spray","Spruzzo Velenoso",0,"evo","a","3 m","V, S","Istantanea","","ADSWM","PHB","Proietti uno sbuffo di gas tossico dal palmo verso una creatura entro gittata: deve superare un TS su Costituzione o subire 1d12 danni da veleno.","Il danno aumenta di 1d12 al 5° livello del personaggio (2d12), all'11° (3d12) e al 17° (4d12)."],["prestidigitation","Prestidigitation","Prestidigitazione",0,"tra","a","3 m","V, S","Fino a 1 ora","","ABSWM","PHB","Piccoli trucchi magici: un innocuo effetto sensoriale istantaneo (scintille, una folata, una nota musicale, un odore), accendere o spegnere una candela o un piccolo fuoco, pulire o sporcare un oggetto, scaldare, raffreddare o insaporire del cibo, far comparire un piccolo segno per 1 ora, oppure creare un ninnolo o un'immagine illusoria che sta in mano fino al tuo prossimo turno. Fino a tre effetti non istantanei attivi insieme.",""],["produce-flame","Produce Flame","Produrre Fiamma",0,"evo","a","Sé","V, S","10 minuti","","D","PHB","Una fiamma tremolante compare nella tua mano: non ti brucia e fa luce intensa in 3 m e fioca per altri 3 m. Puoi scagliarla, anche nel turno in cui la crei, con un attacco a distanza con incantesimo contro una creatura entro 9 m: 1d8 danni da fuoco, poi l'incantesimo termina.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["ray-of-frost","Ray of Frost","Raggio di Gelo",0,"inv","a","18 m","V, S","Istantanea","","ASM","PHB","Un raggio azzurro e gelido sfreccia verso una creatura: fai un attacco a distanza con incantesimo. Se colpisci infligge 1d8 danni da freddo e la velocità del bersaglio si riduce di 3 m fino all'inizio del tuo prossimo turno.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["resistance","Resistance","Resistenza",0,"abi","a","Contatto","V, S, M","1 minuto","c","ACD","PHB","Tocchi una creatura consenziente. Una volta prima che l'incantesimo termini, può tirare 1d4 e aggiungerlo a un tiro salvezza a sua scelta, prima o dopo aver tirato il dado. Poi l'incantesimo termina.",""],["sacred-flame","Sacred Flame","Fiamma Sacra",0,"inv","a","18 m","V, S","Istantanea","","C","PHB","Una fiamma radiosa scende su una creatura che puoi vedere: deve superare un TS su Destrezza o subire 1d8 danni radiosi. Il bersaglio non ottiene alcun beneficio dalla copertura per questo tiro salvezza.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["shillelagh","Shillelagh","Randello Incantato",0,"tra","ab","Contatto","V, S, M","1 minuto","","D","PHB","Il legno di un randello o di un bastone ferrato che impugni si riempie del potere della natura. Per la durata puoi usare la tua caratteristica da incantatore invece della Forza per i tiri per colpire e per i danni in mischia con quell'arma, il suo dado di danno diventa un d8 e l'arma conta come magica. Termina se lo lanci di nuovo o se lasci l'arma.",""],["shocking-grasp","Shocking Grasp","Stretta Folgorante",0,"inv","a","Contatto","V, S","Istantanea","","ASM","PHB","Un fulmine scaturisce dalla tua mano: fai un attacco in mischia con incantesimo, con vantaggio se il bersaglio indossa un'armatura di metallo. Se colpisci infligge 1d8 danni da fulmine e il bersaglio non può effettuare reazioni fino all'inizio del suo prossimo turno.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["spare-the-dying","Spare the Dying","Salvare i Morenti",0,"nec","a","Contatto","V, S","Istantanea","","AC","PHB","Tocchi una creatura vivente che ha 0 punti ferita: diventa stabile. Non ha effetto su non morti e costrutti.",""],["thaumaturgy","Thaumaturgy","Taumaturgia",0,"tra","a","9 m","V","Fino a 1 minuto","","C","PHB","Manifesti un piccolo prodigio divino: la tua voce tuona tre volte più forte, le fiamme tremolano o cambiano colore, il terreno vibra leggermente, risuona un suono improvviso, una porta o finestra non chiusa si spalanca o sbatte, oppure i tuoi occhi cambiano aspetto. Fino a tre effetti da 1 minuto attivi insieme.",""],["true-strike","True Strike","Colpo Accurato",0,"div","a","9 m","S","1 round","c","BSWM","PHB","Punti un dito verso un bersaglio e intuisci le sue difese. Nel tuo prossimo turno hai vantaggio al primo tiro per colpire contro di esso, purché l'incantesimo non sia già terminato.",""],["vicious-mockery","Vicious Mockery","Scherno Crudele",0,"amm","a","18 m","V","Istantanea","","B","PHB","Scagli insulti intrisi di magia contro una creatura che può sentirti, anche se non ti capisce: deve superare un TS su Saggezza o subire 1d4 danni psichici e avere svantaggio al prossimo tiro per colpire che effettua prima della fine del suo prossimo turno.","Il danno aumenta di 1d4 al 5° livello del personaggio (2d4), all'11° (3d4) e al 17° (4d4)."],["control-flames","Control Flames","Controllare Fiamme",0,"tra","a","18 m","S","Istantanea o 1 ora","","DSM","XGE","Scegli una fiamma non magica che occupi al massimo un cubo di 1,5 m: puoi farla espandere istantaneamente di 1,5 m in una direzione (se c'è combustibile), spegnerla, raddoppiarne o dimezzarne la luce e cambiarne il colore per 1 ora, oppure farle assumere forme semplici che si animano a tuo piacimento per 1 ora. Fino a tre effetti non istantanei attivi insieme.",""],["create-bonfire","Create Bonfire","Creare Falò",0,"evo","a","18 m","V, S","1 minuto","c","ADSWM","XGE","Crei un falò su un terreno che puoi vedere, in un cubo di 1,5 m. Una creatura che si trova in quello spazio quando lo lanci, o che vi entra o vi termina il turno, deve superare un TS su Destrezza o subire 1d8 danni da fuoco. Il falò incendia gli oggetti infiammabili non indossati né trasportati.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["frostbite","Frostbite","Morso del Gelo",0,"inv","a","18 m","V, S","Istantanea","","ADSWM","XGE","Una brina gelida si forma su una creatura che puoi vedere: deve superare un TS su Costituzione o subire 1d6 danni da freddo e avere svantaggio al prossimo tiro per colpire con un'arma che effettua prima della fine del suo prossimo turno.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["gust","Gust","Folata",0,"tra","a","9 m","V, S","Istantanea","","DSM","XGE","Afferri l'aria e la fai muovere: spingi di 1,5 m lontano da te una creatura Media o più piccola (se fallisce un TS su Forza), sposti di 3 m un oggetto di massimo 2,5 kg non indossato né trasportato, oppure crei un innocuo effetto sensoriale d'aria (foglie che frusciano, imposte che sbattono).",""],["infestation","Infestation","Infestazione",0,"evo","a","9 m","V, S, M","Istantanea","","DSWM","XGE","Una nube di acari, pulci e altri parassiti compare su una creatura: deve superare un TS su Costituzione o subire 1d6 danni da veleno e spostarsi di 1,5 m in una direzione casuale (tira 1d4), se può muoversi, senza provocare attacchi di opportunità.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["magic-stone","Magic Stone","Pietra Magica",0,"tra","ab","Contatto","V, S","1 minuto","","ADW","XGE","Tocchi fino a tre sassolini e li infondi di magia. Tu o un'altra creatura potete fare un attacco a distanza con incantesimo lanciandoli (gittata 18 m) o scagliandoli con una fionda; si usa la tua caratteristica da incantatore per il tiro per colpire. Se colpisce infligge 1d6 + il tuo modificatore da incantatore danni contundenti. Lanciarlo di nuovo annulla le pietre precedenti.",""],["mold-earth","Mold Earth","Modellare Terra",0,"tra","a","9 m","S","Istantanea o 1 ora","","DSM","XGE","Scegli un'area di terra sciolta o fango (non pietra) in un cubo di 1,5 m: puoi scavarla e spostarla di 1,5 m, tracciare forme, colori o scritte sulla superficie per 1 ora, oppure rendere il terreno difficile o normale per 1 ora. Fino a due effetti non istantanei attivi insieme.",""],["primal-savagery","Primal Savagery","Ferocia Primordiale",0,"tra","a","Sé","S","Istantanea","","D","XGE","I tuoi denti o le tue unghie si allungano diventando armi naturali: fai un attacco in mischia con incantesimo contro una creatura entro 1,5 m. Se colpisce infligge 1d10 danni da acido. Poi tornano normali.","Il danno aumenta di 1d10 al 5° livello del personaggio (2d10), all'11° (3d10) e al 17° (4d10)."],["shape-water","Shape Water","Plasmare Acqua",0,"tra","a","9 m","S","Istantanea o 1 ora","","DSM","XGE","Controlli l'acqua in un cubo di 1,5 m: la sposti fino a 1,5 m (senza forza sufficiente a ferire), le fai assumere forme semplici e animate per 1 ora, ne cambi colore od opacità per 1 ora, oppure la congeli, se non contiene creature, per 1 ora. Fino a due effetti non istantanei attivi insieme.",""],["thunderclap","Thunderclap","Tuono",0,"inv","a","Sé (raggio 1,5 m)","S","Istantanea","","ABDSWM","XGE","Crei un'esplosione di suono tonante udibile fino a 30 m. Ogni creatura entro 1,5 m da te, tranne te, deve superare un TS su Costituzione o subire 1d6 danni da tuono.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["toll-the-dead","Toll the Dead","Rintocco dei Morti",0,"nec","a","18 m","V, S","Istantanea","","CWM","XGE","Il suono di una campana a morto riecheggia attorno a una creatura che puoi vedere: deve superare un TS su Saggezza o subire 1d8 danni necrotici. Se le mancano già dei punti ferita, subisce invece 1d12 danni necrotici.","Il danno aumenta di un dado (d8 o d12) al 5° livello del personaggio, all'11° e al 17°."],["word-of-radiance","Word of Radiance","Parola Radiosa",0,"inv","a","Sé (raggio 1,5 m)","V, M","Istantanea","","C","XGE","Pronunci una parola divina e una luce ardente esplode da te. Ogni creatura a tua scelta che puoi vedere entro 1,5 m deve superare un TS su Costituzione o subire 1d6 danni radiosi.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["alarm","Alarm","Allarme",1,"abi","1 minuto","9 m","V, S, M","8 ore","r","ARM","PHB","Imposti un allarme contro le intrusioni su una porta, una finestra o un'area non più grande di un cubo di 6 m. Quando una creatura Minuscola o più grande tocca o entra nell'area senza essere stata esclusa da te, l'allarme scatta: mentale (solo tu lo percepisci, svegliandoti se dormi, entro 1,5 km) oppure udibile (il suono di un campanello per 10 secondi, udibile entro 18 m).",""],["animal-friendship","Animal Friendship","Amicizia con gli Animali",1,"amm","a","9 m","V, S, M","24 ore","","BDR","PHB","Convinci una bestia che non intendi farle del male. Scegli una bestia che puoi vedere e che ti sente: se ha Intelligenza 4 o più l'incantesimo fallisce, altrimenti deve superare un TS su Saggezza o restare affascinata da te per la durata. Termina se tu o i tuoi compagni la ferite.","Puoi influenzare una bestia aggiuntiva per ogni livello di slot sopra il 1°."],["armor-of-agathys","Armor of Agathys","Armatura di Agathys",1,"abi","a","Sé","V, S, M","1 ora","","W","PHB","Una brina spettrale ti ricopre: ottieni 5 punti ferita temporanei. Se una creatura ti colpisce con un attacco in mischia mentre hai questi PF temporanei, subisce 5 danni da freddo. L'incantesimo termina quando i PF temporanei si esauriscono.","PF temporanei e danni da freddo aumentano di 5 per ogni livello di slot sopra il 1°."],["arms-of-hadar","Arms of Hadar","Braccia di Hadar",1,"evo","a","Sé (raggio 3 m)","V, S","Istantanea","","W","PHB","Tentacoli di energia oscura eruttano da te. Ogni creatura entro 3 m effettua un TS su Forza: se fallisce subisce 2d6 danni necrotici e non può effettuare reazioni fino al suo prossimo turno; se lo supera subisce metà danni e nessun altro effetto.","+1d6 danni per ogni livello di slot sopra il 1°."],["bane","Bane","Anatema",1,"amm","a","9 m","V, S, M","1 minuto","c","BC","PHB","Fino a tre creature a tua scelta che puoi vedere entro gittata effettuano un TS su Carisma. Chi fallisce deve sottrarre 1d4 da ogni tiro per colpire e tiro salvezza che effettua per la durata.","Una creatura aggiuntiva per ogni livello di slot sopra il 1°."],["bless","Bless","Benedizione",1,"amm","a","9 m","V, S, M","1 minuto","c","CP","PHB","Benedici fino a tre creature a tua scelta entro gittata. Per la durata, ogni volta che un bersaglio effettua un tiro per colpire o un tiro salvezza, aggiunge 1d4 al risultato.","Un bersaglio aggiuntivo per ogni livello di slot sopra il 1°."],["burning-hands","Burning Hands","Mani Brucianti",1,"inv","a","Sé (cono di 4,5 m)","V, S","Istantanea","","SM","PHB","Un velo di fiamme si sprigiona dalle tue dita. Ogni creatura nel cono effettua un TS su Destrezza: 3d6 danni da fuoco se fallisce, metà se lo supera. Il fuoco incendia gli oggetti infiammabili nell'area non indossati né trasportati.","+1d6 per ogni livello di slot sopra il 1°."],["charm-person","Charm Person","Charme su Persone",1,"amm","a","9 m","V, S","1 ora","","BDSWM","PHB","Tenti di affascinare un umanoide che puoi vedere. Deve superare un TS su Saggezza (con vantaggio se tu o i tuoi compagni lo state combattendo) o restare affascinato da te finché l'incantesimo non termina o finché tu o i tuoi compagni non gli fate qualcosa di dannoso. Ti considera un conoscente amichevole. Al termine sa di essere stato affascinato.","Una creatura aggiuntiva per ogni livello di slot sopra il 1° (entro 9 m l'una dall'altra)."],["chromatic-orb","Chromatic Orb","Globo Cromatico",1,"inv","a","27 m","V, S, M (diamante del valore di 50 mo)","Istantanea","","SM","PHB","Scagli una sfera di energia di un tipo a tua scelta tra acido, freddo, fuoco, fulmine, veleno o tuono. Fai un attacco a distanza con incantesimo: se colpisce, il bersaglio subisce 3d8 danni del tipo scelto.","+1d8 per ogni livello di slot sopra il 1°."],["color-spray","Color Spray","Spruzzo Colorato",1,"ill","a","Sé (cono di 4,5 m)","V, S, M","1 round","","SM","PHB","Un ventaglio abbagliante di luci colorate. Tira 6d10: è il totale di punti ferita di creature che puoi influenzare. Partendo dalla creatura con meno PF attuali nel cono (ignorando quelle prive di sensi o che non possono vedere), ognuna resta accecata fino alla fine del tuo prossimo turno; sottrai i suoi PF dal totale prima di passare alla successiva.","+2d10 per ogni livello di slot sopra il 1°."],["command","Command","Comando",1,"amm","a","18 m","V","1 round","","CP","PHB","Pronunci un comando di una sola parola a una creatura che puoi vedere: deve superare un TS su Saggezza o eseguirlo nel suo prossimo turno. Non ha effetto sui non morti, su chi non capisce la tua lingua o se il comando le sarebbe direttamente dannoso. Esempi: Avvicinati, Lascia, Fuggi, Striscia, Fermo.","Una creatura aggiuntiva per ogni livello di slot sopra il 1° (entro 9 m l'una dall'altra)."],["compelled-duel","Compelled Duel","Duello Obbligato",1,"amm","ab","9 m","V","1 minuto","c","P","PHB","Sfidi una creatura che puoi vedere: deve superare un TS su Saggezza o essere attirata verso di te. Ha svantaggio ai tiri per colpire contro creature diverse da te e deve superare un TS su Saggezza ogni volta che tenta di allontanarsi a più di 9 m da te. Termina se attacchi altre creature o lanci incantesimi su nemici diversi dal bersaglio, se un tuo alleato lo danneggia o se finite un turno a più di 9 m di distanza.",""],["comprehend-languages","Comprehend Languages","Comprensione dei Linguaggi",1,"div","a","Sé","V, S, M","1 ora","r","BSWM","PHB","Per la durata comprendi il significato letterale di qualsiasi lingua parlata che senti e di qualsiasi lingua scritta che vedi, purché tocchi la superficie su cui è scritta (circa 1 minuto per pagina). Non decifra codici segreti né rivela messaggi magici come i glifi.",""],["create-or-destroy-water","Create or Destroy Water","Creare o Distruggere Acqua",1,"tra","a","9 m","V, S, M","Istantanea","","CD","PHB","Crei fino a 40 litri di acqua pulita in un contenitore aperto (o come pioggia in un cubo di 9 m che spegne le fiamme libere), oppure distruggi fino a 40 litri di acqua in un contenitore aperto o dissolvi la nebbia in un cubo di 9 m.","Crei o distruggi 40 litri in più, oppure il cubo aumenta di 1,5 m, per ogni livello di slot sopra il 1°."],["cure-wounds","Cure Wounds","Cura Ferite",1,"inv","a","Contatto","V, S","Istantanea","","ABCDPR","PHB","Una creatura che tocchi recupera punti ferita pari a 1d8 + il tuo modificatore di caratteristica da incantatore. Non ha effetto su non morti e costrutti.","+1d8 per ogni livello di slot sopra il 1°."],["detect-evil-and-good","Detect Evil and Good","Individuazione del Bene e del Male",1,"div","a","Sé","V, S","10 minuti","c","CP","PHB","Per la durata sai se aberrazioni, celestiali, elementali, folletti, immondi o non morti si trovano entro 9 m da te, e dove. Percepisci anche luoghi e oggetti consacrati o dissacrati. È bloccato da 30 cm di pietra, 2,5 cm di metallo comune, un sottile foglio di piombo o 90 cm di legno o terra.",""],["detect-magic","Detect Magic","Individuazione del Magico",1,"div","a","Sé","V, S","10 minuti","cr","ABCDPRSM","PHB","Per la durata percepisci la presenza di magia entro 9 m da te. Con un'azione puoi vedere un'aura attorno a ogni creatura o oggetto visibile che porta magia e scoprirne la scuola, se ne ha una. È bloccato da 30 cm di pietra, 2,5 cm di metallo comune, un sottile foglio di piombo o 90 cm di legno o terra.",""],["detect-poison-and-disease","Detect Poison and Disease","Individuazione delle Malattie e del Veleno",1,"div","a","Sé","V, S, M","10 minuti","cr","CDPR","PHB","Per la durata percepisci presenza e posizione di veleni, creature velenose e malattie entro 9 m da te, e ne identifichi il tipo. Stessi ostacoli di Individuazione del Magico.",""],["disguise-self","Disguise Self","Camuffare Se Stessi",1,"ill","a","Sé","V, S","1 ora","","ABSM","PHB","Cambi il tuo aspetto, compresi vestiti, armatura, armi e oggetti che porti: puoi sembrare 30 cm più alto o più basso, più magro o più robusto, ma devi mantenere la stessa struttura corporea. È un'illusione e non inganna il tatto. Una creatura può usare un'azione per esaminarti e, con una prova di Intelligenza (Indagare) contro la tua CD, capire che sei camuffato.",""],["dissonant-whispers","Dissonant Whispers","Sussurri Dissonanti",1,"amm","a","18 m","V","Istantanea","","B","PHB","Sussurri una melodia discordante che solo una creatura a tua scelta può sentire. Effettua un TS su Saggezza: se fallisce subisce 3d6 danni psichici e deve usare subito la sua reazione, se disponibile, per allontanarsi da te il più possibile (senza entrare in zone ovviamente pericolose); se lo supera subisce metà danni. Una creatura assordata supera automaticamente il TS.","+1d6 per ogni livello di slot sopra il 1°."],["divine-favor","Divine Favor","Favore Divino",1,"inv","ab","Sé","V, S","1 minuto","c","P","PHB","La tua preghiera ti infonde di radiosità divina: fino alla fine dell'incantesimo i tuoi attacchi con arma infliggono 1d4 danni radiosi extra quando colpiscono.",""],["ensnaring-strike","Ensnaring Strike","Colpo Intrappolante",1,"evo","ab","Sé","V","1 minuto","c","R","PHB","La prossima volta che colpisci una creatura con un attacco con arma prima della fine dell'incantesimo, rovi spinosi spuntano attorno a lei: deve superare un TS su Forza (vantaggio se è Grande o più grande) o restare trattenuta. Finché è trattenuta subisce 1d6 danni perforanti all'inizio di ogni suo turno. Con un'azione può effettuare una prova di Forza contro la tua CD per liberarsi.","+1d6 per ogni livello di slot sopra il 1°."],["entangle","Entangle","Intralciare",1,"evo","a","27 m","V, S","1 minuto","c","D","PHB","Erbacce e rampicanti spuntano dal terreno in un quadrato di 6 m di lato entro gittata, che diventa terreno difficile. Ogni creatura nell'area quando lanci l'incantesimo deve superare un TS su Forza o restare trattenuta. Una creatura trattenuta può usare un'azione per effettuare una prova di Forza contro la tua CD e liberarsi.",""],["expeditious-retreat","Expeditious Retreat","Ritirata Rapida",1,"tra","ab","Sé","V, S","10 minuti","c","ASWM","PHB","Ti muovi a velocità incredibile. Quando lanci l'incantesimo, e poi con un'azione bonus in ogni tuo turno fino alla sua fine, puoi effettuare l'azione di Scatto.",""],["faerie-fire","Faerie Fire","Luminescenza",1,"inv","a","18 m","V","1 minuto","c","ABD","PHB","Ogni oggetto in un cubo di 6 m entro gittata viene delineato da una luce blu, verde o viola (a tua scelta), e ogni creatura nel cubo deve superare un TS su Destrezza o essere delineata anch'essa. Chi è delineato emette luce fioca in un raggio di 3 m, non può beneficiare dell'invisibilità, e i tiri per colpire contro di lui hanno vantaggio se l'attaccante può vederlo.",""],["false-life","False Life","Vita Falsata",1,"nec","a","Sé","V, S, M","1 ora","","ASM","PHB","Ti rinforzi con un simulacro necromantico di vita: ottieni 1d4 + 4 punti ferita temporanei per la durata.","+5 PF temporanei per ogni livello di slot sopra il 1°."],["feather-fall","Feather Fall","Caduta Morbida",1,"tra","r","18 m","V, M","1 minuto","","ABSM","PHB","Reazione da usare quando tu o una creatura entro 18 m state cadendo. Scegli fino a cinque creature in caduta entro gittata: la loro velocità di discesa si riduce a 18 m per round fino alla fine dell'incantesimo. Se atterrano prima che termini, non subiscono danni da caduta e atterrano in piedi.",""],["find-familiar","Find Familiar","Trova Famiglio",1,"evo","1 ora","3 m","V, S, M (carbone, incenso ed erbe del valore di 10 mo, consumati)","Istantanea","r","M","PHB","Ottieni i servigi di un famiglio, uno spirito che prende la forma di un animale a scelta (gufo, gatto, corvo, pipistrello, rana, falco, lucertola, piovra, ratto, serpente velenoso, pesce, donnola, granchio, ragno, cavalluccio marino). È un celestiale, folletto o immondo, agisce da solo ma obbedisce ai tuoi comandi e non può attaccare. Entro 30 m comunicate telepaticamente e con un'azione puoi usare i suoi sensi. Può trasmettere i tuoi incantesimi a contatto. A 0 PF scompare; puoi congedarlo, richiamarlo o evocarlo di nuovo.",""],["fog-cloud","Fog Cloud","Nube di Nebbia",1,"evo","a","36 m","V, S","1 ora","c","DRSM","PHB","Crei una sfera di nebbia di 6 m di raggio centrata su un punto entro gittata. La nebbia si estende dietro gli angoli e l'area è pesantemente oscurata. Dura per la durata o finché un vento di almeno moderata intensità non la disperde.","Il raggio aumenta di 6 m per ogni livello di slot sopra il 1°."],["goodberry","Goodberry","Bacche Benefiche",1,"tra","a","Contatto","V, S, M","Istantanea","","DR","PHB","Nella tua mano compaiono fino a dieci bacche magiche che restano potenti per 24 ore. Una creatura può usare un'azione per mangiarne una: recupera 1 punto ferita e ne ricava nutrimento sufficiente per un giorno intero.",""],["grease","Grease","Unto",1,"evo","a","18 m","V, S, M","1 minuto","","AM","PHB","Un grasso scivoloso ricopre un quadrato di 3 m di lato a terra, che diventa terreno difficile. Quando compare, ogni creatura in piedi nell'area deve superare un TS su Destrezza o cadere prona. Lo stesso TS vale per chi entra nell'area o vi termina il turno.",""],["guiding-bolt","Guiding Bolt","Dardo Tracciante",1,"inv","a","36 m","V, S","1 round","","C","PHB","Un lampo di luce saetta verso una creatura: fai un attacco a distanza con incantesimo. Se colpisce subisce 4d6 danni radiosi, e il prossimo tiro per colpire contro di lei prima della fine del tuo prossimo turno ha vantaggio, grazie a un luccichio mistico.","+1d6 per ogni livello di slot sopra il 1°."],["hail-of-thorns","Hail of Thorns","Grandine di Spine",1,"evo","ab","Sé","V","1 minuto","c","R","PHB","La prossima volta che colpisci una creatura con un attacco con arma a distanza prima della fine dell'incantesimo, il proiettile genera una pioggia di spine. Oltre agli effetti normali, il bersaglio e ogni creatura entro 1,5 m da esso effettuano un TS su Destrezza: 1d10 danni perforanti se falliscono, metà se lo superano.","+1d10 per ogni livello di slot sopra il 1° (massimo 6d10)."],["healing-word","Healing Word","Parola Guaritrice",1,"inv","ab","18 m","V","Istantanea","","BCD","PHB","Una creatura a tua scelta che puoi vedere recupera punti ferita pari a 1d4 + il tuo modificatore di caratteristica da incantatore. Non ha effetto su non morti e costrutti.","+1d4 per ogni livello di slot sopra il 1°."],["hellish-rebuke","Hellish Rebuke","Rimprovero Infernale",1,"inv","r","18 m","V, S","Istantanea","","W","PHB","Reazione da usare quando subisci danni da una creatura entro 18 m che puoi vedere. Quella creatura viene avvolta da fiamme infernali ed effettua un TS su Destrezza: 2d10 danni da fuoco se fallisce, metà se lo supera.","+1d10 per ogni livello di slot sopra il 1°."],["heroism","Heroism","Eroismo",1,"amm","a","Contatto","V, S","1 minuto","c","BP","PHB","Una creatura consenziente che tocchi viene infusa di coraggio. Fino alla fine dell'incantesimo è immune alla condizione spaventato e all'inizio di ogni suo turno ottiene punti ferita temporanei pari al tuo modificatore da incantatore.","Una creatura aggiuntiva per ogni livello di slot sopra il 1°."],["hex","Hex","Maleficio",1,"amm","ab","27 m","V, S, M","1 ora","c","W","PHB","Maledici una creatura che puoi vedere. Finché dura infliggi 1d6 danni necrotici extra ogni volta che la colpisci con un attacco, e scegli una caratteristica: il bersaglio ha svantaggio alle prove di quella caratteristica. Se scende a 0 PF prima della fine, in un tuo turno successivo puoi usare un'azione bonus per maledire un'altra creatura. Rimuovi Maledizione pone fine all'effetto.","Con slot di 3° o 4° la concentrazione dura fino a 8 ore; con slot di 5° o superiore fino a 24 ore."],["hunters-mark","Hunter's Mark","Marchio del Cacciatore",1,"div","ab","27 m","V","1 ora","c","R","PHB","Marchi come tua preda una creatura che puoi vedere. Fino alla fine infliggi 1d6 danni extra ogni volta che la colpisci con un attacco con arma, e hai vantaggio alle prove di Saggezza (Percezione) e Saggezza (Sopravvivenza) per trovarla. Se scende a 0 PF, in un tuo turno successivo puoi usare un'azione bonus per marchiare un'altra creatura.","Con slot di 3° o 4° la concentrazione dura fino a 8 ore; con slot di 5° o superiore fino a 24 ore."],["identify","Identify","Identificare",1,"div","1 minuto","Contatto","V, S, M (perla del valore di 100 mo e una piuma di gufo)","Istantanea","r","ABM","PHB","Scegli un oggetto da toccare durante il lancio. Se è magico o infuso di magia ne apprendi proprietà e modo d'uso, se richiede sintonia e quante cariche ha, oltre a eventuali incantesimi attivi su di esso. Se tocchi una creatura, scopri quali incantesimi la stanno influenzando.",""],["illusory-script","Illusory Script","Scritto Illusorio",1,"ill","1 minuto","Contatto","S, M (inchiostro a base di piombo del valore di 10 mo, consumato)","10 giorni","r","BWM","PHB","Scrivi su pergamena, carta o simili un messaggio con inchiostro magico. Per te e per le creature che designi è leggibile normalmente; per tutti gli altri sembra scritto in una lingua sconosciuta o appare come un messaggio del tutto diverso a tua scelta. Visione del Vero rivela il messaggio nascosto.",""],["inflict-wounds","Inflict Wounds","Infliggi Ferite",1,"nec","a","Contatto","V, S","Istantanea","","C","PHB","Fai un attacco in mischia con incantesimo contro una creatura che puoi raggiungere. Se colpisci subisce 3d10 danni necrotici.","+1d10 per ogni livello di slot sopra il 1°."],["jump","Jump","Saltare",1,"tra","a","Contatto","V, S, M","1 minuto","","ADRSM","PHB","Tocchi una creatura: la sua distanza di salto viene triplicata fino alla fine dell'incantesimo.",""],["longstrider","Longstrider","Passo Veloce",1,"tra","a","Contatto","V, S, M","1 ora","","ABDRM","PHB","Tocchi una creatura: la sua velocità aumenta di 3 m fino alla fine dell'incantesimo.","Una creatura aggiuntiva per ogni livello di slot sopra il 1°."],["mage-armor","Mage Armor","Armatura Magica",1,"abi","a","Contatto","V, S, M","8 ore","","SM","PHB","Tocchi una creatura consenziente che non indossa armatura: una forza magica protettiva la circonda e la sua CA base diventa 13 + il suo modificatore di Destrezza. Termina se il bersaglio indossa un'armatura o se lo congedi con un'azione.",""],["magic-missile","Magic Missile","Dardo Incantato",1,"inv","a","36 m","V, S","Istantanea","","SM","PHB","Crei tre dardi luminosi di forza magica. Ogni dardo colpisce automaticamente una creatura a tua scelta che puoi vedere entro gittata, infliggendo 1d4 + 1 danni da forza. I dardi colpiscono simultaneamente e puoi indirizzarli verso una o più creature.","Un dardo aggiuntivo per ogni livello di slot sopra il 1°."],["protection-from-evil-and-good","Protection from Evil and Good","Protezione dal Bene e dal Male",1,"abi","a","Contatto","V, S, M (acqua santa o polvere d'argento e ferro, consumate)","10 minuti","c","CPWM","PHB","Una creatura consenziente che tocchi è protetta contro aberrazioni, celestiali, elementali, folletti, immondi e non morti: queste creature hanno svantaggio ai tiri per colpire contro di lei, e il bersaglio non può essere affascinato, spaventato o posseduto da loro. Se lo è già, ha vantaggio a ogni nuovo TS contro quell'effetto.",""],["purify-food-and-drink","Purify Food and Drink","Purificare Cibo e Bevande",1,"tra","a","3 m","V, S","Istantanea","r","ACDP","PHB","Tutto il cibo e le bevande non magici in una sfera di 1,5 m di raggio centrata su un punto entro gittata vengono purificati e liberati da veleni e malattie.",""],["ray-of-sickness","Ray of Sickness","Raggio di Infermità",1,"nec","a","18 m","V, S","Istantanea","","SM","PHB","Un raggio di energia verdastra saetta verso una creatura: fai un attacco a distanza con incantesimo. Se colpisci infligge 2d8 danni da veleno e il bersaglio deve superare un TS su Costituzione o restare avvelenato fino alla fine del tuo prossimo turno.","+1d8 per ogni livello di slot sopra il 1°."],["sanctuary","Sanctuary","Santuario",1,"abi","ab","9 m","V, S, M","1 minuto","","AC","PHB","Proteggi una creatura entro gittata. Chiunque la prenda di mira con un attacco o un incantesimo dannoso deve prima superare un TS su Saggezza: se fallisce deve scegliere un altro bersaglio o perde l'attacco o l'incantesimo. Non protegge dagli effetti ad area. Termina se la creatura protetta attacca, lancia un incantesimo che colpisce un nemico o infligge danni.",""],["searing-smite","Searing Smite","Punizione Rovente",1,"inv","ab","Sé","V","1 minuto","c","P","PHB","La prossima volta che colpisci con un attacco con arma in mischia prima della fine dell'incantesimo, l'arma arde di luce bianca: l'attacco infligge 1d6 danni da fuoco extra e il bersaglio prende fuoco. All'inizio di ogni suo turno deve superare un TS su Costituzione o subire 1d6 danni da fuoco; se lo supera l'incantesimo termina. Anche spegnere le fiamme con un'azione pone fine all'effetto.","Il danno extra iniziale aumenta di 1d6 per ogni livello di slot sopra il 1°."],["shield","Shield","Scudo",1,"abi","r","Sé","V, S","1 round","","SM","PHB","Reazione da usare quando vieni colpito da un attacco o bersagliato da Dardo Incantato. Una barriera invisibile di forza ti protegge: fino all'inizio del tuo prossimo turno hai +5 alla CA, anche contro l'attacco che l'ha innescata, e non subisci danni da Dardo Incantato.",""],["shield-of-faith","Shield of Faith","Scudo della Fede",1,"abi","ab","18 m","V, S, M","10 minuti","c","CP","PHB","Un campo scintillante circonda una creatura a tua scelta entro gittata e le conferisce +2 alla CA per la durata.",""],["silent-image","Silent Image","Immagine Silenziosa",1,"ill","a","18 m","V, S, M","10 minuti","c","BSM","PHB","Crei l'immagine di un oggetto, di una creatura o di un altro fenomeno visibile, non più grande di un cubo di 4,5 m. È solo visiva: niente suoni, odori o altri effetti. Con un'azione puoi farla muovere entro gittata. L'interazione fisica rivela che è un'illusione; una creatura può esaminarla con un'azione e, con una prova di Intelligenza (Indagare) contro la tua CD, capirne la natura.",""],["sleep","Sleep","Sonno",1,"amm","a","27 m","V, S, M","1 minuto","","BSM","PHB","Fai cadere le creature in un sonno magico. Tira 5d8: è il totale di punti ferita di creature influenzabili entro 6 m da un punto scelto. Partendo dalla creatura con meno PF attuali, ognuna cade priva di sensi finché l'incantesimo non termina, finché non subisce danni o finché qualcuno non usa un'azione per svegliarla; sottrai i suoi PF dal totale prima di passare alla successiva. Non ha effetto su non morti e creature immuni allo charme.","+2d8 per ogni livello di slot sopra il 1°."],["speak-with-animals","Speak with Animals","Parlare con gli Animali",1,"div","a","Sé","V, S","10 minuti","r","BDR","PHB","Per la durata puoi comprendere le bestie e comunicare verbalmente con loro. La loro conoscenza è limitata dalla loro intelligenza, ma possono darti informazioni sui luoghi e sui mostri vicini e su ciò che hanno percepito nell'ultimo giorno. A discrezione del DM potresti convincerle a farti un piccolo favore.",""],["tashas-hideous-laughter","Tasha's Hideous Laughter","Risata Incontenibile di Tasha",1,"amm","a","9 m","V, S, M","1 minuto","c","BM","PHB","Una creatura che puoi vedere trova tutto esilarante. Deve superare un TS su Saggezza o cadere prona in preda alle risate, incapacitata e impossibilitata a rialzarsi. Le creature con Intelligenza 4 o meno non ne sono influenzate. Alla fine di ogni suo turno, e ogni volta che subisce danni, ripete il TS (con vantaggio se innescato dai danni); se lo supera l'incantesimo termina.",""],["tensers-floating-disk","Tenser's Floating Disk","Disco Fluttuante di Tenser",1,"evo","a","9 m","V, S, M","1 ora","r","M","PHB","Crei un disco orizzontale di forza di 90 cm di diametro che fluttua a 90 cm da terra e sostiene fino a 250 kg. Ti segue restando entro 6 m da te, supera terreni irregolari e scale ma non dislivelli di 3 m o più. Se ti allontani oltre 30 m o il carico supera la capacità, svanisce e il contenuto cade.",""],["thunderous-smite","Thunderous Smite","Punizione Tonante",1,"inv","ab","Sé","V","1 minuto","c","P","PHB","La prima volta che colpisci con un attacco con arma in mischia prima della fine dell'incantesimo, l'arma rimbomba di un tuono udibile entro 90 m. L'attacco infligge 2d6 danni da tuono extra e, se il bersaglio è una creatura, deve superare un TS su Forza o essere spinto di 3 m lontano da te e cadere prono.",""],["thunderwave","Thunderwave","Onda Tonante",1,"inv","a","Sé (cubo di 4,5 m)","V, S","Istantanea","","BDSM","PHB","Un'onda di forza tonante si sprigiona da te. Ogni creatura in un cubo di 4,5 m che parte da te effettua un TS su Costituzione: se fallisce subisce 2d8 danni da tuono ed è spinta di 3 m lontano da te; se lo supera subisce metà danni e non viene spinta. Anche gli oggetti non fissati nell'area vengono spinti di 3 m. Il boato si sente fino a 90 m.","+1d8 per ogni livello di slot sopra il 1°."],["unseen-servant","Unseen Servant","Servitore Inosservato",1,"evo","a","18 m","V, S, M","1 ora","r","BWM","PHB","Crei una forza invisibile e senza mente che esegue compiti semplici al tuo comando (CA 10, 1 PF, Forza 2, non può attaccare). Con un'azione bonus puoi ordinarle di muoversi fino a 4,5 m e interagire con un oggetto: prendere, pulire, riparare, piegare vestiti, accendere il fuoco, servire cibo, versare vino. Svanisce se si allontana oltre 18 m da te.",""],["witch-bolt","Witch Bolt","Dardo Stregato",1,"inv","a","9 m","V, S, M","1 minuto","c","SWM","PHB","Un raggio di energia blu crepitante colpisce una creatura: fai un attacco a distanza con incantesimo. Se colpisci infligge 1d12 danni da fulmine e, in ogni tuo turno successivo, puoi usare un'azione per infliggere automaticamente altri 1d12 danni da fulmine. Termina se usi l'azione per altro o se il bersaglio esce dalla gittata o ottiene copertura totale.","Il danno iniziale aumenta di 1d12 per ogni livello di slot sopra il 1°."],["wrathful-smite","Wrathful Smite","Punizione Irata",1,"inv","ab","Sé","V","1 minuto","c","P","PHB","La prossima volta che colpisci con un attacco con arma in mischia prima della fine dell'incantesimo, l'attacco infligge 1d6 danni psichici extra. Se il bersaglio è una creatura, deve superare un TS su Saggezza o restare spaventato da te fino alla fine dell'incantesimo. Con un'azione può effettuare una prova di Saggezza contro la tua CD per porvi fine.",""],["absorb-elements","Absorb Elements","Assorbire Elementi",1,"abi","r","Sé","S","1 round","","ADRSM","XGE","Reazione da usare quando subisci danni da acido, freddo, fuoco, fulmine o tuono. Catturi parte dell'energia: hai resistenza a quel tipo di danno contro l'attacco che l'ha innescata e fino all'inizio del tuo prossimo turno. Inoltre, la prima volta che colpisci con un attacco in mischia nel tuo prossimo turno, il bersaglio subisce 1d6 danni extra di quel tipo.","Il danno extra aumenta di 1d6 per ogni livello di slot sopra il 1°."],["beast-bond","Beast Bond","Legame Bestiale",1,"div","a","Contatto","V, S, M","10 minuti","c","DR","XGE","Stabilisci un legame telepatico con una bestia che tocchi, amichevole verso di te o affascinata da te (se ha Intelligenza 4 o più l'incantesimo fallisce). Finché siete in vista l'uno dell'altra potete scambiarvi concetti semplici, e la bestia ha vantaggio ai tiri per colpire contro le creature entro 1,5 m da te che puoi vedere.",""],["catapult","Catapult","Catapulta",1,"tra","a","18 m","S","Istantanea","","ASM","XGE","Scegli un oggetto da 0,5 a 2,5 kg entro gittata, non indossato né trasportato: vola in linea retta fino a 27 m nella direzione che scegli. Se colpisce una creatura, questa deve superare un TS su Destrezza o subire 3d8 danni contundenti, e l'oggetto si ferma. Se colpisce qualcosa di solido, anche l'oggetto subisce gli stessi danni.","Il peso massimo aumenta di 2,5 kg e il danno di 1d8 per ogni livello di slot sopra il 1°."],["cause-fear","Cause Fear","Incutere Paura",1,"nec","a","18 m","V","1 minuto","c","WM","XGE","Risvegli il senso della mortalità in una creatura che puoi vedere: deve superare un TS su Saggezza o restare spaventata da te fino alla fine dell'incantesimo. Alla fine di ogni suo turno ripete il TS, terminando l'effetto se lo supera. Costrutti e non morti sono immuni.","Una creatura aggiuntiva per ogni livello di slot sopra il 1° (entro 9 m l'una dall'altra)."],["ceremony","Ceremony","Cerimonia",1,"abi","1 ora","Contatto","V, S, M (polvere d'argento del valore di 25 mo, consumata)","Istantanea","r","CP","XGE","Celebri un rito religioso a scelta: Espiazione (una creatura consenziente può ripristinare il proprio allineamento con una prova di Saggezza (Intuizione) CD 20), Benedire l'acqua (una fiala d'acqua diventa acqua santa), Maggiore età (+1d4 a una prova di caratteristica per 24 ore), Dedicazione (+1d4 a un tiro salvezza per 24 ore), Rito funebre (il cadavere non può diventare non morto per 7 giorni), Matrimonio (+2 alla CA finché gli sposi sono entro 9 m l'uno dall'altro, per 7 giorni).",""],["chaos-bolt","Chaos Bolt","Dardo del Caos",1,"inv","a","36 m","V, S","Istantanea","","S","XGE","Scagli un globo ondeggiante di energia caotica: fai un attacco a distanza con incantesimo. Se colpisci infligge 2d8 + 1d6 danni; uno dei d8 decide il tipo (1 acido, 2 freddo, 3 fuoco, 4 forza, 5 fulmine, 6 veleno, 7 psichico, 8 tuono). Se i due d8 mostrano lo stesso numero, l'energia rimbalza su un'altra creatura a tua scelta entro 9 m dal bersaglio: nuovo tiro per colpire e nuovi danni, e può rimbalzare ancora.","Ogni bersaglio subisce 1d6 danni extra per ogni livello di slot sopra il 1°."],["earth-tremor","Earth Tremor","Tremore della Terra",1,"inv","a","Sé (raggio 3 m)","V, S","Istantanea","","BDSM","XGE","Provochi una scossa nel terreno attorno a te. Ogni creatura diversa da te entro 3 m effettua un TS su Destrezza: se fallisce subisce 1d6 danni contundenti e cade prona. Se il terreno è terra sciolta o pietra, diventa terreno difficile finché non viene sgomberato.","+1d6 per ogni livello di slot sopra il 1°."],["ice-knife","Ice Knife","Pugnale di Ghiaccio",1,"evo","a","18 m","S, M","Istantanea","","DSM","XGE","Crei una scheggia di ghiaccio e la scagli contro una creatura: attacco a distanza con incantesimo, 1d10 danni perforanti se colpisce. Che colpisca o manchi, la scheggia esplode: il bersaglio e ogni creatura entro 1,5 m da esso devono superare un TS su Destrezza o subire 2d6 danni da freddo.","Il danno da freddo aumenta di 1d6 per ogni livello di slot sopra il 1°."],["snare","Snare","Laccio",1,"abi","1 minuto","Contatto","S, M (8 m di corda, consumata)","8 ore","","ADRM","XGE","Trasformi una corda in una trappola magica quasi invisibile, un cerchio di 1,5 m di raggio a terra; trovarla richiede una prova di Intelligenza (Indagare) contro la tua CD. Quando una creatura Piccola, Media o Grande entra nell'area deve superare un TS su Destrezza o restare appesa a testa in giù a 90 cm da terra, trattenuta. Ripete il TS alla fine di ogni turno (con svantaggio) o può essere liberata da qualcuno con una prova di Intelligenza (Arcano).",""],["zephyr-strike","Zephyr Strike","Colpo di Zefiro",1,"tra","ab","Sé","V","1 minuto","c","R","XGE","Ti muovi come il vento. Finché dura, i tuoi movimenti non provocano attacchi di opportunità. Una volta prima che termini, puoi darti vantaggio a un attacco con arma nel tuo turno: se colpisce infligge 1d8 danni da forza extra, e fino alla fine del turno la tua velocità aumenta di 9 m.",""],["aid","Aid","Aiuto",2,"abi","a","9 m","V, S, M","8 ore","","ACP","PHB","Infondi vigore e determinazione ai tuoi alleati. Scegli fino a tre creature entro gittata: il loro massimo di punti ferita e i loro punti ferita attuali aumentano di 5 per la durata.","+5 PF per ogni livello di slot sopra il 2°."],["alter-self","Alter Self","Alterare Se Stessi",2,"tra","a","Sé","V, S","1 ora","c","ASM","PHB","Assumi una forma diversa. Scegli un'opzione (con un'azione puoi passare a un'altra): Adattamento acquatico (respiri sott'acqua e ottieni velocità di nuoto pari alla tua velocità base), Cambiare aspetto (modifichi altezza, peso, lineamenti, voce, capelli e colore restando della tua specie), Armi naturali (artigli, zanne o corna da 1d6 danni, attacchi magici con +1 al tiro per colpire e ai danni).",""],["animal-messenger","Animal Messenger","Messaggero Animale",2,"amm","a","9 m","V, S, M","24 ore","r","BDR","PHB","Una bestia Minuscola che puoi vedere (uno scoiattolo, un uccello, un pipistrello) porta un messaggio. Indichi un luogo che hai visitato e descrivi il destinatario, poi le affidi un messaggio fino a 25 parole. La bestia viaggia per la durata (circa 75 km al giorno, 150 km se vola) e, trovato il destinatario, riproduce il messaggio con la tua voce.","La durata aumenta di 48 ore per ogni livello di slot sopra il 2°."],["arcane-lock","Arcane Lock","Serratura Arcana",2,"abi","a","Contatto","V, S, M (polvere d'oro del valore di 25 mo, consumata)","Fino a dissolto","","AM","PHB","Tocchi una porta, una finestra, un cancello, un forziere o un altro ingresso chiuso: resta bloccato. Tu e le creature che designi potete aprirlo normalmente, e puoi stabilire una parola d'ordine che lo sopprime per 1 minuto. Per gli altri è invalicabile finché non viene rotto o l'incantesimo dissolto; Scassinare lo sopprime per 10 minuti. La CD per forzarlo o scassinarlo aumenta di 10.",""],["augury","Augury","Presagio",2,"div","1 minuto","Sé","V, S, M (bastoncini, ossa o simili del valore di 25 mo)","Istantanea","r","C","PHB","Lanciando bastoncini ingemmati, ossa di drago o simili ricevi un presagio da un'entità ultraterrena sull'esito di un'azione specifica che intendi compiere entro 30 minuti: Fortuna (esito buono), Sventura (esito cattivo), Fortuna e sventura, oppure Niente. Ogni lancio aggiuntivo prima di un riposo lungo ha una probabilità cumulativa del 25% di dare un risultato casuale.",""],["barkskin","Barkskin","Pelle di Corteccia",2,"tra","a","Contatto","V, S, M","1 ora","c","DR","PHB","Tocchi una creatura consenziente: fino alla fine dell'incantesimo la sua pelle diventa ruvida come corteccia e la sua CA non può essere inferiore a 16, qualunque armatura indossi.",""],["beast-sense","Beast Sense","Sensi Bestiali",2,"div","a","Contatto","S","1 ora","cr","DR","PHB","Tocchi una bestia consenziente. Per la durata puoi usare la tua azione per vedere e sentire attraverso i suoi sensi fino all'inizio del tuo prossimo turno, beneficiando dei suoi sensi speciali. Nel frattempo sei cieco e sordo rispetto al tuo corpo.",""],["blindness-deafness","Blindness/Deafness","Cecità/Sordità",2,"nec","a","9 m","V","1 minuto","","BCSM","PHB","Puoi accecare o assordare un nemico. Scegli una creatura che puoi vedere: deve superare un TS su Costituzione o restare accecata o assordata (a tua scelta) per la durata. Alla fine di ogni suo turno ripete il TS, terminando l'effetto se lo supera.","Una creatura aggiuntiva per ogni livello di slot sopra il 2°."],["blur","Blur","Sfocatura",2,"ill","a","Sé","V","1 minuto","c","ASM","PHB","Il tuo corpo diventa sfocato e ondeggiante. Per la durata, qualsiasi creatura ha svantaggio ai tiri per colpire contro di te. Non influenza chi non si affida alla vista (vista cieca) o chi vede attraverso le illusioni (visione del vero).",""],["branding-smite","Branding Smite","Punizione Marchiante",2,"inv","ab","Sé","V","1 minuto","c","P","PHB","La prossima volta che colpisci una creatura con un attacco con arma prima della fine dell'incantesimo, l'arma brilla di radiosità astrale: l'attacco infligge 2d6 danni radiosi extra. Se il bersaglio è invisibile diventa visibile; emette luce fioca in un raggio di 1,5 m e non può diventare invisibile fino alla fine dell'incantesimo.","+1d6 danni extra per ogni livello di slot sopra il 2°."],["calm-emotions","Calm Emotions","Calmare Emozioni",2,"amm","a","18 m","V, S","1 minuto","c","BC","PHB","Tenti di placare le emozioni forti in un gruppo. Ogni umanoide in una sfera di 6 m di raggio entro gittata effettua un TS su Carisma (chi vuole può fallirlo volontariamente). Per chi fallisce scegli: sopprimi ogni effetto che lo rende affascinato o spaventato, oppure lo rendi indifferente verso le creature ostili che scegli (termina se viene attaccato o danneggiato).",""],["cloud-of-daggers","Cloud of Daggers","Nube di Pugnali",2,"evo","a","18 m","V, S, M","1 minuto","c","BSWM","PHB","Riempi un cubo di 1,5 m entro gittata di pugnali roteanti. Una creatura subisce 4d4 danni taglienti quando entra nell'area per la prima volta in un turno o vi inizia il turno.","+2d4 per ogni livello di slot sopra il 2°."],["continual-flame","Continual Flame","Fiamma Perenne",2,"inv","a","Contatto","V, S, M (polvere di rubino del valore di 50 mo, consumata)","Fino a dissolto","","ACM","PHB","Una fiamma simile a quella di una torcia scaturisce da un oggetto che tocchi. Non produce calore né consuma ossigeno; può essere coperta o nascosta ma non soffocata o spenta con l'acqua.",""],["cordon-of-arrows","Cordon of Arrows","Cordone di Frecce",2,"tra","a","1,5 m","V, S, M","8 ore","","R","PHB","Pianti nel terreno fino a quattro munizioni non magiche (frecce o quadrelli) che diventano guardiani. Quando una creatura diversa da te entra per la prima volta in un turno entro 9 m da esse o vi termina il turno, una munizione vola a colpirla: deve superare un TS su Destrezza o subire 1d6 danni perforanti. Puoi designare le creature da non bersagliare.","Due munizioni aggiuntive per ogni livello di slot sopra il 2°."],["crown-of-madness","Crown of Madness","Corona di Follia",2,"amm","a","36 m","V, S","1 minuto","c","BSWM","PHB","Un umanoide che puoi vedere deve superare un TS su Saggezza o restare affascinato da te, con una corona di ferro frastagliato sulla testa. Prima di muoversi, in ogni suo turno deve fare un attacco in mischia contro una creatura che scegli mentalmente. Nei tuoi turni devi usare la tua azione per mantenere il controllo, altrimenti l'incantesimo termina. Ripete il TS alla fine di ogni suo turno.",""],["darkness","Darkness","Oscurità",2,"inv","a","18 m","V, M","10 minuti","c","SWM","PHB","Un'oscurità magica si diffonde da un punto entro gittata riempiendo una sfera di 4,5 m di raggio. Si estende dietro gli angoli; nemmeno la scurovisione vi penetra e la luce non magica non la illumina. Se scegli un oggetto che porti, l'oscurità si muove con esso; coprirlo la blocca. Dissolve gli incantesimi di luce di 2° livello o inferiore con cui si sovrappone.",""],["darkvision","Darkvision","Scurovisione",2,"tra","a","Contatto","V, S, M","8 ore","","ADRSM","PHB","Tocchi una creatura consenziente e le conferisci la capacità di vedere al buio: ottiene scurovisione entro 18 m per la durata.",""],["detect-thoughts","Detect Thoughts","Individuazione dei Pensieri",2,"div","a","Sé","V, S, M","1 minuto","c","BSM","PHB","Puoi leggere i pensieri. Con un'azione ti concentri su una creatura entro 9 m che puoi vedere e ne apprendi i pensieri superficiali (se ha Intelligenza 4 o più e parla una lingua). Con un'azione puoi sondare più a fondo: il bersaglio effettua un TS su Saggezza e, se fallisce, scopri ragionamenti, stato emotivo e ciò che occupa la sua mente. Puoi anche percepire creature pensanti invisibili entro 9 m.",""],["enhance-ability","Enhance Ability","Potenziare Caratteristica",2,"tra","a","Contatto","V, S, M","1 ora","c","ABCDS","PHB","Tocchi una creatura e scegli un effetto: Resistenza dell'Orso (vantaggio alle prove di Costituzione e 2d6 PF temporanei), Forza del Toro (vantaggio alle prove di Forza, capacità di carico raddoppiata), Grazia del Gatto (vantaggio alle prove di Destrezza, nessun danno da cadute fino a 6 m), Splendore dell'Aquila (vantaggio alle prove di Carisma), Astuzia della Volpe (Intelligenza), Saggezza del Gufo (Saggezza).","Una creatura aggiuntiva per ogni livello di slot sopra il 2°."],["enlarge-reduce","Enlarge/Reduce","Ingrandire/Ridurre",2,"tra","a","9 m","V, S, M","1 minuto","c","ASM","PHB","Fai crescere o rimpicciolire una creatura o un oggetto non indossato né trasportato; una creatura non consenziente può resistere con un TS su Costituzione. Ingrandire: dimensioni raddoppiate, taglia +1, vantaggio alle prove e ai TS su Forza, le sue armi infliggono 1d4 danni extra. Ridurre: dimensioni dimezzate, taglia −1, svantaggio alle prove e ai TS su Forza, le sue armi infliggono 1d4 danni in meno (minimo 1).",""],["enthrall","Enthrall","Affascinare",2,"amm","a","18 m","V, S","1 minuto","","BW","PHB","Intrecci parole che distraggono. Ogni creatura che puoi vedere entro gittata e che ti sente deve superare un TS su Saggezza (vantaggio se la stai combattendo). Chi fallisce ha svantaggio alle prove di Saggezza (Percezione) per notare creature diverse da te fino alla fine dell'incantesimo o finché non smette di sentirti. Termina se sei incapacitato o non puoi parlare.",""],["find-steed","Find Steed","Trova Destriero",2,"evo","10 minuti","9 m","V, S","Istantanea","","P","PHB","Evochi uno spirito che assume la forma di una cavalcatura intelligente, forte e leale: cavallo da guerra, pony, cammello, alce o mastino (altre a discrezione del DM). È un celestiale, folletto o immondo, ha Intelligenza 6 e capisce una tua lingua. Comunicate telepaticamente entro 1,5 km, e un incantesimo che bersaglia solo te può bersagliare anche lui. Se muore puoi evocarlo di nuovo; ne puoi avere uno solo.",""],["find-traps","Find Traps","Trova Trappole",2,"div","a","36 m","V, S","Istantanea","","CDR","PHB","Percepisci la presenza di qualsiasi trappola entro gittata e in linea di vista, comprese aree od oggetti incantati per causare effetti dannosi (come Glifo di Interdizione). Sai che c'è una trappola e ne intuisci la natura generale, ma non la sua posizione esatta.",""],["flame-blade","Flame Blade","Lama Infuocata",2,"inv","ab","Sé","V, S, M","10 minuti","c","D","PHB","Evochi nella mano libera una lama di fuoco simile a una scimitarra. Con un'azione puoi fare un attacco in mischia con incantesimo: se colpisce infligge 3d6 danni da fuoco. La lama fa luce intensa in 3 m e fioca per altri 3 m. Se la lasci svanisce, ma puoi evocarla di nuovo con un'azione bonus.","+1d6 danni ogni due livelli di slot sopra il 2°."],["flaming-sphere","Flaming Sphere","Sfera Infuocata",2,"evo","a","18 m","V, S, M","1 minuto","c","DM","PHB","Una sfera di fuoco di 1,5 m di diametro compare in uno spazio libero entro gittata. Ogni creatura che termina il turno entro 1,5 m da essa effettua un TS su Destrezza: 2d6 danni da fuoco se fallisce, metà se lo supera. Con un'azione bonus puoi spostarla fino a 9 m; se la fai scontrare con una creatura, questa effettua il TS e la sfera si ferma. Incendia gli oggetti infiammabili e fa luce.","+1d6 per ogni livello di slot sopra il 2°."],["gentle-repose","Gentle Repose","Riposo Inviolato",2,"nec","a","Contatto","V, S, M (due monete di rame da posare sugli occhi)","10 giorni","r","CM","PHB","Tocchi un cadavere o altri resti: per la durata sono protetti dalla decomposizione e non possono diventare non morti. I giorni passati sotto questo effetto non contano per il limite di tempo di incantesimi come Rianimare Morti.",""],["gust-of-wind","Gust of Wind","Folata di Vento",2,"inv","a","Sé (linea di 18 m)","V, S, M","1 minuto","c","DSM","PHB","Una linea di vento forte lunga 18 m e larga 3 m soffia da te nella direzione che scegli. Ogni creatura che inizia il turno nella linea deve superare un TS su Forza o essere spinta di 4,5 m nella direzione del vento. Avanzare verso di te costa il doppio del movimento. Disperde gas e vapori e spegne candele, torce e fiamme libere. Con un'azione bonus puoi cambiarne la direzione.",""],["heat-metal","Heat Metal","Riscaldare il Metallo",2,"tra","a","18 m","V, S, M","1 minuto","c","ABD","PHB","Scegli un oggetto di metallo lavorato che puoi vedere (un'arma, un'armatura di metallo): diventa incandescente. Chi è in contatto con l'oggetto subisce 2d8 danni da fuoco al lancio, e con un'azione bonus in ogni tuo turno puoi infliggere di nuovo quel danno. Chi lo tiene o lo indossa deve superare un TS su Costituzione o lasciarlo cadere se può; altrimenti ha svantaggio ai tiri per colpire e alle prove di caratteristica fino all'inizio del tuo prossimo turno.","+1d8 per ogni livello di slot sopra il 2°."],["hold-person","Hold Person","Blocca Persone",2,"amm","a","18 m","V, S, M","1 minuto","c","BCDSWM","PHB","Scegli un umanoide che puoi vedere: deve superare un TS su Saggezza o restare paralizzato per la durata. Alla fine di ogni suo turno ripete il TS, terminando l'effetto se lo supera.","Un umanoide aggiuntivo per ogni livello di slot so
