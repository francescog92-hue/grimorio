 legare all'area un effetto aggiuntivo: coraggio, oscurità, luce del giorno, protezione o vulnerabilità a un'energia, riposo eterno, disturbo extradimensionale, paura, silenzio o lingue.",""],["hold-monster","Hold Monster","Blocca Mostri",5,"amm","a","27 m","V, S, M","1 minuto","c","BSWM","PHB","Scegli una creatura che puoi vedere: deve superare un TS su Saggezza o restare paralizzata per la durata. Non ha effetto sui non morti. Alla fine di ogni suo turno ripete il TS, terminando l'effetto se lo supera.","Una creatura aggiuntiva per ogni livello di slot sopra il 5° (entro 9 m l'una dall'altra)."],["insect-plague","Insect Plague","Piaga di Insetti",5,"evo","a","90 m","V, S, M","10 minuti","c","CDS","PHB","Uno sciame di locuste fameliche riempie una sfera di 6 m di raggio centrata su un punto entro gittata. La sfera aggira gli angoli, l'area è leggermente oscurata e terreno difficile. Chi vi entra per la prima volta in un turno o vi inizia il turno effettua un TS su Costituzione: 4d10 danni perforanti se fallisce, metà se lo supera.","+1d10 per ogni livello di slot sopra il 5°."],["legend-lore","Legend Lore","Conoscenza delle Leggende",5,"div","10 minuti","Sé","V, S, M (incenso del valore di almeno 250 mo, consumato, e quattro strisce d'avorio del valore di 50 mo ciascuna)","Istantanea","","BCM","PHB","Nomini o descrivi una persona, un luogo o un oggetto importante e ne ottieni un breve riassunto delle leggende più significative: storie note, racconti dimenticati o sapere segreto. Se non ha rilevanza leggendaria non ottieni nulla. Più ne sai già, più precise e dettagliate saranno le informazioni.",""],["mass-cure-wounds","Mass Cure Wounds","Cura Ferite di Massa",5,"inv","a","18 m","V, S","Istantanea","","BCD","PHB","Un'ondata di energia curativa si diffonde da un punto entro gittata. Fino a sei creature a tua scelta in una sfera di 9 m di raggio recuperano ciascuna punti ferita pari a 3d8 + il tuo modificatore da incantatore. Non ha effetto su non morti e costrutti.","+1d8 per ogni livello di slot sopra il 5°."],["mislead","Mislead","Fuorviare",5,"ill","a","Sé","S","1 ora","c","BM","PHB","Diventi invisibile e nello stesso istante un tuo doppio illusorio compare dove ti trovi. L'invisibilità termina se attacchi o lanci un incantesimo. Con un'azione puoi muovere il doppio fino al doppio della tua velocità e farlo parlare e gesticolare come vuoi; con un'azione bonus puoi passare dai tuoi sensi ai suoi e viceversa.",""],["modify-memory","Modify Memory","Modificare Memoria",5,"amm","a","9 m","V, S","1 minuto","c","BM","PHB","Tenti di rimodellare i ricordi di una creatura: deve effettuare un TS su Saggezza (vantaggio se la state combattendo) e, se fallisce, resta affascinata e incapacitata per la durata. Puoi alterare il suo ricordo di un evento delle ultime 24 ore durato non più di 10 minuti: cancellarlo, farlo ricordare con precisione, cambiarne i dettagli o crearne uno nuovo.","Puoi alterare ricordi più lontani: fino a 7 giorni con slot di 6°, 30 giorni con slot di 7°, 1 anno con slot di 8°, qualsiasi momento con slot di 9°."],["passwall","Passwall","Passapareti",5,"tra","a","9 m","V, S, M","1 ora","","M","PHB","Un passaggio compare in un punto che puoi vedere su una superficie di legno, intonaco o pietra (muro, soffitto, pavimento) entro gittata: largo fino a 1,5 m, alto 2,5 m e profondo 6 m, senza rendere instabile la struttura. Quando l'incantesimo termina, chi è ancora dentro viene espulso in sicurezza nello spazio libero più vicino.",""],["planar-binding","Planar Binding","Legame Planare",5,"abi","1 ora","18 m","V, S, M (un gioiello del valore di almeno 1.000 mo, consumato)","24 ore","","BCDWM","PHB","Tenti di vincolare al tuo servizio un celestiale, un elementale, un folletto o un immondo che resti entro gittata per tutto il lancio (di solito già evocato o intrappolato in un Cerchio Magico). Deve superare un TS su Carisma o servirti per la durata, eseguendo al meglio i tuoi ordini.","Con slot di 6° dura 10 giorni, di 7° 30 giorni, di 8° 180 giorni, di 9° un anno e un giorno."],["raise-dead","Raise Dead","Rianimare Morti",5,"nec","1 ora","Contatto","V, S, M (un diamante del valore di almeno 500 mo, consumato)","Istantanea","","BCP","PHB","Riporti in vita una creatura che tocchi, morta da non più di 10 giorni, se la sua anima è libera e consenziente. Torna con 1 PF, guarita dai veleni e dalle malattie non magiche, ma non da maledizioni né parti del corpo mancanti. Il ritorno è duro: −4 a tutti i tiri per colpire, TS e prove di caratteristica, penalità che si riduce di 1 a ogni riposo lungo.",""],["rarys-telepathic-bond","Rary's Telepathic Bond","Legame Telepatico di Rary",5,"div","a","9 m","V, S, M","1 ora","r","M","PHB","Crei un legame telepatico tra fino a otto creature consenzienti entro gittata (quelle con Intelligenza 2 o meno non ne sono influenzate). Per la durata possono comunicare telepaticamente tra loro, anche senza una lingua comune, a qualsiasi distanza purché sullo stesso piano.",""],["reincarnate","Reincarnate","Reincarnazione",5,"tra","1 ora","Contatto","V, S, M (oli e unguenti rari del valore di almeno 1.000 mo, consumati)","Istantanea","","D","PHB","Tocchi un umanoide morto da non più di 10 giorni, o un suo pezzo: se la sua anima è libera e consenziente, l'incantesimo crea un nuovo corpo adulto e ve la richiama. La specie del nuovo corpo si tira con 1d100 sulla tabella del manuale. La creatura ricorda la vita passata e conserva le capacità di classe, ma cambia i tratti di specie.",""],["scrying","Scrying","Scrutare",5,"div","10 minuti","Sé","V, S, M (un focus del valore di almeno 1.000 mo, come una sfera di cristallo, uno specchio d'argento o un fonte d'acqua santa)","10 minuti","c","BCDWM","PHB","Osservi e ascolti una creatura a tua scelta sul tuo stesso piano. Il bersaglio effettua un TS su Saggezza modificato da quanto lo conosci (da +5 a −5) e dal legame che hai con lui (da −2 a −10 con un ritratto, un oggetto o una parte del corpo). Se lo supera non puoi riprovare su di lui per 24 ore; se fallisce, un sensore invisibile compare entro 3 m da lui e lo segue.",""],["seeming","Seeming","Sembrare",5,"ill","a","9 m","V, S","8 ore","","BSM","PHB","Cambi l'aspetto di qualsiasi numero di creature che puoi vedere entro gittata, vestiti e oggetti compresi (una creatura non consenziente può resistere con un TS su Carisma). Funziona come Camuffare Se Stessi: altezza di ±30 cm e stessa struttura corporea. Una creatura può scoprire l'illusione con una prova di Intelligenza (Indagare) contro la tua CD.",""],["swift-quiver","Swift Quiver","Faretra Veloce",5,"tra","ab","Contatto","V, S, M","1 minuto","c","R","PHB","La tua faretra produce una scorta infinita di munizioni non magiche. In ogni tuo turno, fino alla fine dell'incantesimo, puoi usare un'azione bonus per fare due attacchi con un'arma che usa le munizioni della faretra. Ogni munizione svanisce dopo aver colpito o mancato.",""],["telekinesis","Telekinesis","Telecinesi",5,"tra","a","18 m","V, S","10 minuti","c","SM","PHB","Muovi o manipoli creature e oggetti con il pensiero. Con un'azione nei tuoi turni: una creatura Enorme o più piccola (prova contrapposta della tua caratteristica da incantatore contro la sua Forza: se vinci la sposti di 9 m e la trattieni) oppure un oggetto fino a 500 kg (lo sposti di 9 m; se è tenuto da qualcuno serve una prova contrapposta). Puoi anche compiere manipolazioni delicate.",""],["teleportation-circle","Teleportation Circle","Cerchio di Teletrasporto",5,"evo","1 minuto","3 m","V, M (gessi e inchiostri rari del valore di 50 mo, consumati)","1 round","","BSM","PHB","Tracci a terra un cerchio di 3 m di diametro con sigilli che lo collegano a un cerchio di teletrasporto permanente di cui conosci la sequenza di sigilli, sullo stesso piano. Si apre un portale che resta aperto fino alla fine del tuo prossimo turno: chi vi entra compare entro 1,5 m dal cerchio di destinazione. Lanciarlo nello stesso punto ogni giorno per un anno rende il cerchio permanente.",""],["tree-stride","Tree Stride","Camminare negli Alberi",5,"evo","a","Sé","V, S","1 minuto","c","DR","PHB","Puoi entrare in un albero ed uscire da un altro albero dello stesso tipo entro 150 m. Entrambi devono essere vivi e almeno grandi quanto te. Puoi farlo una volta per round per la durata, spendendo 1,5 m di movimento, e devi terminare ogni turno fuori da un albero.",""],["wall-of-force","Wall of Force","Muro di Forza",5,"inv","a","36 m","V, S, M","10 minuti","c","M","PHB","Un muro invisibile di forza compare entro gittata con l'orientamento che vuoi: una cupola o una sfera fino a 3 m di raggio, oppure una superficie di dieci pannelli contigui di 3 × 3 m. Nulla può attraversarlo fisicamente, è immune a tutti i danni e Dissolvi Magie non ha effetto; Disintegrazione lo distrugge all'istante. Si estende anche nel Piano Etereo.",""],["wall-of-stone","Wall of Stone","Muro di Pietra",5,"inv","a","36 m","V, S, M","10 minuti","c","ADSM","PHB","Un muro di pietra non magica si forma entro gittata: dieci pannelli di 3 × 3 m spessi 15 cm, oppure dieci pannelli di 3 × 6 m spessi 7,5 cm. Se compare nello spazio di una creatura, questa viene spinta da un lato (con un TS su Destrezza sceglie quale). Ogni pannello ha CA 15 e 30 PF per ogni 2,5 cm di spessore. Se mantieni la concentrazione per tutta la durata, il muro diventa permanente.",""],["control-winds","Control Winds","Controllare Venti",5,"tra","a","90 m","V, S","1 ora","c","DSM","XGE","Controlli l'aria in un cubo di 30 m entro gittata. Scegli un effetto, che puoi cambiare con un'azione: Raffiche (il vento soffia in una direzione, svantaggio agli attacchi a distanza e fatica per chi vola controvento), Corrente discendente (spinge a terra chi vola, svantaggio agli attacchi a distanza), Corrente ascendente (chi cade non subisce danni e può essere sollevato).",""],["danse-macabre","Danse Macabre","Danza Macabra",5,"nec","a","18 m","V, S","1 ora","c","WM","XGE","Energia oscura anima fino a cinque cadaveri Piccoli o Medi entro gittata, che diventano zombi o scheletri a tua scelta sotto il tuo controllo. Con un'azione bonus dai loro ordini mentali, e aggiungono il tuo modificatore da incantatore ai tiri per colpire e ai danni. Quando l'incantesimo termina tornano cadaveri.","Due cadaveri in più per ogni livello di slot sopra il 5°."],["dawn","Dawn","Alba",5,"inv","a","18 m","V, S, M (un medaglione solare del valore di 100 mo)","1 minuto","c","CM","XGE","La luce dell'alba riempie un cilindro di 9 m di raggio e 12 m di altezza centrato su un punto entro gittata, con luce intensa pari alla luce solare. Quando compare, e quando una creatura vi termina il turno, ogni creatura dentro effettua un TS su Costituzione: 4d10 danni radiosi se fallisce, metà se lo supera. Con un'azione bonus puoi spostare il cilindro di 18 m.",""],["enervation","Enervation","Snervamento",5,"nec","a","18 m","V, S","1 minuto","c","SWM","XGE","Un filamento di energia nera si aggancia a una creatura entro gittata, che effettua un TS su Destrezza. Se lo supera subisce 2d8 danni necrotici e l'incantesimo termina. Se lo fallisce subisce 4d8 danni necrotici e tu recuperi PF pari alla metà; nei turni successivi puoi usare un'azione per ripetere automaticamente il danno. Termina se usi l'azione per altro o se il bersaglio esce dalla gittata o ottiene copertura totale.","+1d8 per ogni livello di slot sopra il 5°."],["far-step","Far Step","Passo Lontano",5,"evo","ab","Sé","V","1 minuto","c","SWM","XGE","Ti teletrasporti fino a 18 m in uno spazio libero che puoi vedere. In ogni tuo turno successivo, fino alla fine dell'incantesimo, puoi usare un'azione bonus per teletrasportarti di nuovo allo stesso modo.",""],["holy-weapon","Holy Weapon","Arma Sacra",5,"inv","ab","Contatto","V, S","1 ora","c","CP","XGE","Un'arma che tocchi diventa magica, fa luce intensa in 9 m e fioca per altri 9 m, e i suoi attacchi infliggono 2d8 danni radiosi extra. Con un'azione bonus puoi porre fine all'incantesimo facendo esplodere la radiosità: ogni creatura a tua scelta entro 9 m deve superare un TS su Costituzione o subire 4d8 danni radiosi e restare accecata per 1 minuto (metà danni e nessuna cecità se lo supera).",""],["immolation","Immolation","Immolazione",5,"inv","a","27 m","V","1 minuto","c","SM","XGE","Fiamme avvolgono una creatura che puoi vedere: effettua un TS su Destrezza, 8d6 danni da fuoco se fallisce, metà se lo supera. Se fallisce continua a bruciare, fa luce intensa in 9 m e alla fine di ogni suo turno ripete il TS: 4d6 danni da fuoco se lo fallisce, mentre se lo supera l'incantesimo termina. Chi muore così viene ridotto in cenere.",""],["infernal-calling","Infernal Calling","Richiamo Infernale",5,"evo","1 minuto","27 m","V, S, M (un rubino del valore di almeno 999 mo)","1 ora","c","WM","XGE","Evochi dai Nove Inferi un diavolo di GS 6 o inferiore. Non è tenuto a obbedirti: ascolta le tue richieste ma decide da sé, e spesso va convinto o pagato. Se possiedi il suo talismano puoi costringerlo a obbedire. Se perdi la concentrazione resta ancora per 3d6 minuti libero di agire, poi torna al suo piano.","Il GS aumenta di 1 per ogni livello di slot sopra il 5°."],["maelstrom","Maelstrom","Maelstrom",5,"evo","a","36 m","V, S, M","1 minuto","c","D","XGE","Una massa d'acqua profonda 1,5 m turbina in un raggio di 9 m attorno a un punto entro gittata; l'area è terreno difficile. Chi inizia il turno nell'area deve superare un TS su Forza o subire 6d6 danni contundenti ed essere trascinato di 3 m verso il centro.",""],["negative-energy-flood","Negative Energy Flood","Flusso di Energia Negativa",5,"nec","a","18 m","V, M","Istantanea","","WM","XGE","Invii un'ondata di energia negativa contro una creatura che puoi vedere. Se non è un non morto effettua un TS su Costituzione: 5d12 danni necrotici se fallisce, metà se lo supera; se muore, all'inizio del tuo prossimo turno si rialza come zombi e attacca la creatura più vicina. Se è un non morto, non effettua il TS: ottiene PF temporanei pari alla metà di 5d12.",""],["skill-empowerment","Skill Empowerment","Potenziamento Abilità",5,"tra","a","Contatto","V, S","1 ora","c","ABSWM","XGE","Tocchi una creatura consenziente e scegli un'abilità in cui è competente: per la durata raddoppia il bonus di competenza alle prove di quell'abilità, se non è già raddoppiato.",""],["steel-wind-strike","Steel Wind Strike","Colpo del Vento d'Acciaio",5,"evo","a","9 m","S, M (un'arma da mischia del valore di almeno 1 ma)","Istantanea","","RM","XGE","Brandisci l'arma e svanisci, colpendo come il vento. Scegli fino a cinque creature che puoi vedere entro gittata e fai un attacco in mischia con incantesimo contro ciascuna: 6d10 danni da forza se colpisci. Poi ti teletrasporti in uno spazio libero che puoi vedere entro 1,5 m da uno dei bersagli.",""],["synaptic-static","Synaptic Static","Statica Sinaptica",5,"amm","a","36 m","V, S","Istantanea","","BSWM","XGE","Un'esplosione di energia psichica erompe da un punto entro gittata. Ogni creatura in una sfera di 6 m di raggio effettua un TS su Intelligenza: 8d6 danni psichici se fallisce, metà se lo supera (le creature con Intelligenza 2 o meno sono immuni). Chi fallisce resta confuso per 1 minuto: sottrae 1d6 da tiri per colpire, prove di caratteristica e TS su Costituzione per la concentrazione, e ripete il TS alla fine di ogni suo turno.",""],["transmute-rock","Transmute Rock","Trasmutare Roccia",5,"tra","a","36 m","V, S, M","Fino a dissolto","","ADM","XGE","Scegli un'area di pietra o di fango in un cubo di 12 m. Roccia in fango: la pietra diventa fango profondo, terreno difficile in cui si può restare trattenuti, e i soffitti sopra l'area crollano. Fango in roccia: il fango diventa pietra, e chi vi si trova deve superare un TS su Destrezza o restare intrappolato finché non viene liberato.",""],["wall-of-light","Wall of Light","Muro di Luce",5,"inv","a","36 m","V, S, M","10 minuti","c","SWM","XGE","Un muro di luce scintillante lungo 18 m, alto 3 m e spesso 1,5 m compare entro gittata: blocca la vista ma non il movimento e fa luce intensa in 36 m. Quando compare, ogni creatura nella sua area effettua un TS su Costituzione: 4d8 danni radiosi e cecità per 1 minuto se fallisce, metà danni se lo supera; chi termina il turno nel muro subisce 4d8 danni radiosi. Con un'azione puoi scagliarne un raggio (attacco a distanza con incantesimo, 4d8 danni radiosi), accorciando il muro di 3 m.","+1d8 per ogni livello di slot sopra il 5°."],["wrath-of-nature","Wrath of Nature","Ira della Natura",5,"inv","a","36 m","V, S","1 minuto","c","DR","XGE","Risvegli gli spiriti della natura in un cubo di 18 m entro gittata. Alberi: chi inizia il turno entro 3 m da un albero deve superare un TS su Destrezza o subire 4d6 danni taglienti. Radici e rampicanti: il terreno diventa difficile per i tuoi nemici. Rocce: con un'azione bonus puoi scagliare una pietra (attacco a distanza con incantesimo, 3d8 danni contundenti e TS su Forza per non cadere proni).",""],["arcane-gate","Arcane Gate","Portale Arcano",6,"evo","a","150 m","V, S","10 minuti","c","SWM","PHB","Crei due portali di teletrasporto collegati: uno in uno spazio libero che puoi vedere entro 3 m, l'altro entro 150 m. Sono cerchi luminosi di 3 m di diametro, attivi da un solo lato. Chi entra in un portale esce dall'altro come se fossero adiacenti. Con un'azione bonus puoi cambiarne l'orientamento.",""],["blade-barrier","Blade Barrier","Barriera di Lame",6,"inv","a","27 m","V, S","10 minuti","c","C","PHB","Crei un muro verticale di lame di energia vorticanti e affilate: lungo fino a 30 m, alto 6 m e spesso 1,5 m, oppure un anello di 18 m di diametro. Dà copertura di tre quarti ed è terreno difficile. Chi vi entra per la prima volta in un turno o vi inizia il turno effettua un TS su Destrezza: 6d10 danni taglienti se fallisce, metà se lo supera.",""],["chain-lightning","Chain Lightning","Catena di Fulmini",6,"inv","a","45 m","V, S, M","Istantanea","","SM","PHB","Un fulmine colpisce un bersaglio entro gittata e poi salta su fino a tre altri bersagli entro 9 m dal primo; ogni bersaglio, creatura o oggetto, può essere colpito una sola volta. Ognuno effettua un TS su Destrezza: 10d8 danni da fulmine se fallisce, metà se lo supera.","Un bersaglio aggiuntivo per ogni livello di slot sopra il 6°."],["circle-of-death","Circle of Death","Cerchio di Morte",6,"nec","a","45 m","V, S, M (polvere di una perla nera del valore di almeno 500 mo)","Istantanea","","SWM","PHB","Una sfera di energia negativa si espande per 18 m di raggio da un punto entro gittata. Ogni creatura nell'area effettua un TS su Costituzione: 8d6 danni necrotici se fallisce, metà se lo supera.","+2d6 per ogni livello di slot sopra il 6°."],["conjure-fey","Conjure Fey","Evocare Folletti",6,"evo","1 minuto","27 m","V, S","1 ora","c","DW","PHB","Evochi una creatura fatata di GS 6 o inferiore, o uno spirito fatato in forma di bestia di GS 6 o inferiore, in uno spazio libero entro gittata. È amichevole verso di te e i tuoi compagni e obbedisce ai tuoi comandi. Se perdi la concentrazione non svanisce ma diventa ostile, e resta fino alla fine della durata.","Il GS aumenta di 1 per ogni livello di slot sopra il 6°."],["contingency","Contingency","Contingenza",6,"inv","10 minuti","Sé","V, S, M (una tua statuetta in avorio decorata di gemme del valore di almeno 1.500 mo)","10 giorni","","M","PHB","Scegli un incantesimo di 5° livello o inferiore che puoi lanciare, con tempo di lancio di 1 azione e che possa bersagliarti: lo lanci subito (spendendo lo slot) ma resta sospeso, e si attiverà quando si verificherà una condizione che descrivi. Quando scatta, ha effetto immediato e Contingenza termina. Puoi avere una sola Contingenza attiva alla volta.",""],["create-undead","Create Undead","Creare Non Morti",6,"nec","1 minuto","3 m","V, S, M (un vaso di terra di tomba, uno di acqua salmastra e un'onice nera del valore di 150 mo per ogni cadavere)","Istantanea","","CWM","PHB","Si può lanciare solo di notte. Fino a tre cadaveri di umanoidi Medi o Piccoli entro gittata diventano ghoul sotto il tuo controllo. Con un'azione bonus dai ordini mentali a qualsiasi creatura animata con questo incantesimo entro 36 m. Il controllo dura 24 ore; per mantenerlo devi rilanciare l'incantesimo prima che scada.","Con slot di 7° controlli quattro ghoul; con slot di 8° cinque ghoul o due ghast o wight; con slot di 9° sei ghoul, tre ghast o wight, oppure due mummie."],["disintegrate","Disintegrate","Disintegrazione",6,"tra","a","18 m","V, S, M","Istantanea","","SM","PHB","Un sottile raggio verde parte dal tuo dito verso un bersaglio che puoi vedere. Una creatura deve superare un TS su Destrezza o subire 10d6 + 40 danni da forza; se scende a 0 PF viene disintegrata in un mucchietto di polvere (solo Resurrezione Pura o Desiderio possono riportarla in vita). Disintegra automaticamente un oggetto non magico Grande o più piccolo, una sezione di 3 m di uno più grande, o un Muro di Forza.","+3d6 per ogni livello di slot sopra il 6°."],["drawmijs-instant-summons","Drawmij's Instant Summons","Richiamo Istantaneo di Drawmij",6,"evo","1 minuto","Contatto","V, S, M (uno zaffiro del valore di 1.000 mo)","Fino a dissolto","r","M","PHB","Tocchi un oggetto di massimo 5 kg e lungo al massimo 1,8 m: vi lasci un segno invisibile e ne incidi il nome nello zaffiro. In qualsiasi momento, con un'azione, pronunci il nome e frantumi lo zaffiro: l'oggetto compare all'istante nella tua mano, a qualsiasi distanza, anche da un altro piano. Se lo tiene un'altra creatura, scopri invece chi è e dove si trova.",""],["eyebite","Eyebite","Sguardo Malefico",6,"nec","a","Sé","V, S","1 minuto","c","BSWM","PHB","I tuoi occhi diventano pozzi d'inchiostro. Al lancio e poi con un'azione in ogni tuo turno, scegli una creatura entro 18 m che puoi vedere: deve superare un TS su Saggezza o subire un effetto a tua scelta. Addormentato (cade privo di sensi finché non viene svegliato o ferito), Terrorizzato (spaventato, deve allontanarsi da te), Nauseato (svantaggio ai tiri per colpire e alle prove di caratteristica).",""],["find-the-path","Find the Path","Trova la Via",6,"div","1 minuto","Sé","V, S, M (strumenti di divinazione del valore di 100 mo e un oggetto proveniente dalla destinazione)","1 giorno","c","BCD","PHB","Trovi il percorso fisico più breve e diretto verso un luogo fisso che conosci, sullo stesso piano. Per la durata conosci distanza e direzione della meta, e ogni volta che devi scegliere tra più strade sai quale è la più breve e diretta.",""],["flesh-to-stone","Flesh to Stone","Carne in Pietra",6,"tra","a","18 m","V, S, M","1 minuto","c","WM","PHB","Tenti di pietrificare una creatura di carne che puoi vedere. Effettua un TS su Costituzione: se fallisce è trattenuta mentre la carne si indurisce. Alla fine di ogni suo turno ripete il TS: tre successi fermano l'incantesimo, tre fallimenti la pietrificano. Se mantieni la concentrazione per l'intero minuto, la pietrificazione dura finché non viene rimossa.",""],["forbiddance","Forbiddance","Divieto",6,"abi","10 minuti","Contatto","V, S, M (acqua santa, incenso raro e polvere di rubino del valore di almeno 1.000 mo)","1 giorno","r","C","PHB","Crei un'interdizione contro i viaggi magici su un'area fino a 3.600 m² e alta 9 m: nessuno può teletrasportarsi dentro o entrarvi con portali o viaggi planari. Scegli anche uno o più tipi tra celestiali, elementali, folletti, immondi e non morti: quando uno di loro entra nell'area per la prima volta in un turno o vi inizia il turno subisce 5d10 danni radiosi o necrotici. Lanciato ogni giorno per 30 giorni diventa permanente.",""],["globe-of-invulnerability","Globe of Invulnerability","Globo di Invulnerabilità",6,"abi","a","Sé (raggio 3 m)","V, S, M","1 minuto","c","SM","PHB","Una barriera immobile e scintillante si estende da te in un raggio di 3 m. Gli incantesimi di 5° livello o inferiore lanciati dall'esterno non hanno effetto su creature e oggetti al suo interno, anche se lanciati con slot più alti: possono bersagliarli, ma senza alcun risultato.","La barriera blocca incantesimi di un livello più alto per ogni livello di slot sopra il 6°."],["guards-and-wards","Guards and Wards","Guardie e Interdizioni",6,"abi","10 minuti","Contatto","V, S, M (incenso, zolfo, olio, un filo annodato, sangue di mostro e una bacchetta d'argento del valore di almeno 10 mo)","24 ore","","BM","PHB","Proteggi fino a 225 m² di pavimento (ad esempio un quadrato di 15 m di lato) con una serie di difese: corridoi pieni di nebbia, porte bloccate magicamente, porte illusorie, scale coperte di ragnatele, più un effetto magico a scelta (luci danzanti, bocca magica, nube maleodorante, folata di vento o suggestione). Lanciato ogni giorno per un anno diventa permanente.",""],["harm","Harm","Ferire",6,"nec","a","18 m","V, S","Istantanea","","C","PHB","Scateni una malattia virulenta su una creatura che puoi vedere: effettua un TS su Costituzione, 14d6 danni necrotici se fallisce, metà se lo supera. Il danno non può ridurla sotto 1 PF. Se fallisce il TS, anche il suo massimo di PF si riduce di un ammontare pari ai danni subiti per 1 ora.",""],["heal","Heal","Guarigione",6,"inv","a","18 m","V, S","Istantanea","","CD","PHB","Un'ondata di energia positiva attraversa una creatura che puoi vedere: recupera 70 punti ferita e guarisce da cecità, sordità e qualsiasi malattia. Non ha effetto su costrutti e non morti.","+10 PF per ogni livello di slot sopra il 6°."],["heroes-feast","Heroes' Feast","Banchetto degli Eroi",6,"evo","10 minuti","9 m","V, S, M (una coppa ingemmata del valore di almeno 1.000 mo, consumata)","Istantanea","","CD","PHB","Imbandisci un banchetto magnifico per fino a dodici creature, che richiede 1 ora per essere consumato. Per le 24 ore successive i commensali sono guariti da malattie e veleni, immuni al veleno e alla condizione spaventato, hanno vantaggio ai TS su Saggezza, e il loro massimo di PF (e i PF attuali) aumenta di 2d10.",""],["magic-jar","Magic Jar","Giara Magica",6,"nec","1 minuto","Sé","V, S, M (una gemma, un cristallo, un reliquiario o un contenitore ornamentale del valore di almeno 500 mo)","Fino a dissolto","","M","PHB","Il tuo corpo cade in catalessi e la tua anima entra nel contenitore. Da lì percepisci i dintorni e, con un'azione, puoi tentare di possedere un umanoide entro 30 m, che resiste con un TS su Carisma. Se riesci, usi il suo corpo mantenendo Intelligenza, Saggezza, Carisma e personalità, mentre la sua anima resta intrappolata nel contenitore.",""],["mass-suggestion","Mass Suggestion","Suggestione di Massa",6,"amm","a","18 m","V, M","24 ore","","BSWM","PHB","Suggerisci un'azione ragionevole (una o due frasi) a fino a dodici creature che puoi vedere entro gittata e che ti sentono e ti capiscono. Chi fallisce un TS su Saggezza segue il suggerimento al meglio. Chiedere di fare qualcosa di palesemente dannoso pone fine all'effetto per quella creatura.","Con slot di 7° dura 10 giorni, di 8° 30 giorni, di 9° un anno e un giorno."],["move-earth","Move Earth","Muovere il Terreno",6,"tra","a","36 m","V, S, M","2 ore","c","DSM","PHB","Rimodelli terra, sabbia o argilla in un'area fino a 12 m di lato entro gittata: alzi o abbassi il terreno, scavi o riempi fossati, erigi o abbatti argini, formi colonne. Le modifiche richiedono 10 minuti; poi puoi scegliere una nuova area. Non influenza la pietra naturale né le costruzioni in pietra.",""],["otilukes-freezing-sphere","Otiluke's Freezing Sphere","Sfera Congelante di Otiluke",6,"inv","a","90 m","V, S, M","Istantanea","","M","PHB","Un globo di energia gelida parte dalla tua mano ed esplode in una sfera di 18 m di raggio su un punto entro gittata. Ogni creatura nell'area effettua un TS su Costituzione: 10d6 danni da freddo se fallisce, metà se lo supera. Se colpisce una superficie d'acqua la congela. Puoi anche trattenere il globo e lanciarlo entro 1 minuto, a mano o con una fionda.","+1d6 per ogni livello di slot sopra il 6°."],["ottos-irresistible-dance","Otto's Irresistible Dance","Danza Irresistibile di Otto",6,"amm","a","9 m","V","1 minuto","c","BM","PHB","Una creatura che puoi vedere inizia una danza comica sul posto (le creature immuni allo charme non ne sono influenzate). Deve usare tutto il suo movimento per ballare senza lasciare lo spazio, ha svantaggio ai TS su Destrezza e ai tiri per colpire, e gli altri hanno vantaggio ad attaccarla. Con un'azione può effettuare un TS su Saggezza per riprendere il controllo.",""],["planar-ally","Planar Ally","Alleato Planare",6,"evo","10 minuti","18 m","V, S","Istantanea","","C","PHB","Supplichi un'entità ultraterrena, che ti invia un celestiale, un elementale o un immondo a lei fedele. Il servitore non è obbligato ad aiutarti: di solito chiede un compenso commisurato al compito (oro, oggetti magici, un servizio), ad esempio 100 mo al minuto per un incarico breve e molto di più per uno lungo.",""],["programmed-illusion","Programmed Illusion","Illusione Programmata",6,"ill","a","36 m","V, S, M (polvere di giada del valore di almeno 25 mo)","Fino a dissolto","","BM","PHB","Crei l'illusione di un oggetto, una creatura o un fenomeno, non più grande di un cubo di 9 m, che si attiva quando si verifica una condizione a tua scelta. Fino ad allora è invisibile; quando scatta si svolge secondo il copione che hai stabilito, suoni inclusi, per al massimo 5 minuti, poi torna inattiva e può riattivarsi dopo 10 minuti. Si può scoprire con una prova di Intelligenza (Indagare).",""],["sunbeam","Sunbeam","Raggio di Sole",6,"inv","a","Sé (linea di 18 m)","V, S, M","1 minuto","c","DSM","PHB","Un raggio di luce abbagliante parte dalla tua mano in una linea lunga 18 m e larga 1,5 m. Ogni creatura nella linea effettua un TS su Costituzione: 6d8 danni radiosi e cecità fino al tuo prossimo turno se fallisce, metà danni se lo supera; non morti e melme hanno svantaggio. Finché dura, puoi creare una nuova linea con un'azione, e la tua mano emette luce solare.",""],["transport-via-plants","Transport via Plants","Trasporto Vegetale",6,"evo","a","3 m","V, S","1 round","","D","PHB","Crei un collegamento magico tra una pianta inanimata Grande o più grande entro gittata e un'altra pianta sullo stesso piano, a qualsiasi distanza, che hai visto o toccato almeno una volta. Per la durata chiunque può entrare nella prima pianta e uscire dalla seconda spendendo 1,5 m di movimento.",""],["true-seeing","True Seeing","Visione del Vero",6,"div","a","Contatto","V, S, M (un unguento del valore di 25 mo, consumato)","1 ora","","BCSWM","PHB","Una creatura consenziente che tocchi ottiene visione del vero entro 36 m: nota le porte segrete nascoste dalla magia, vede nel Piano Etereo, vede creature e oggetti invisibili, riconosce le illusioni visive e vede la vera forma di mutaforma e creature trasformate.",""],["wall-of-ice","Wall of Ice","Muro di Ghiaccio",6,"inv","a","36 m","V, S, M","10 minuti","c","M","PHB","Crei un muro di ghiaccio su una superficie solida: una cupola o sfera fino a 3 m di raggio, oppure dieci pannelli contigui di 3 × 3 m spessi 30 cm. Chi si trova nel suo spazio viene spinto fuori ed effettua un TS su Destrezza: 10d6 danni da freddo se fallisce, metà se lo supera. Ogni sezione ha CA 12 e 30 PF; una sezione distrutta lascia un velo d'aria gelida che infligge 5d6 danni da freddo (TS su Costituzione) a chi lo attraversa.","+2d6 ai danni iniziali e +1d6 a quelli dell'aria gelida per ogni livello di slot sopra il 6°."],["wall-of-thorns","Wall of Thorns","Muro di Spine",6,"evo","a","36 m","V, S, M","10 minuti","c","D","PHB","Crei un muro di rovi spinosi: lungo fino a 18 m, alto 3 m e spesso 1,5 m, oppure un anello di 6 m di diametro. Blocca la vista. Quando compare, ogni creatura nella sua area effettua un TS su Destrezza: 7d8 danni perforanti se fallisce, metà se lo supera. Attraversarlo costa quattro volte il movimento, e chi vi entra per la prima volta in un turno o vi termina il turno effettua un TS su Destrezza: 7d8 danni taglienti se fallisce, metà se lo supera.","Entrambi i danni aumentano di 1d8 per ogni livello di slot sopra il 6°."],["wind-walk","Wind Walk","Camminare nel Vento",6,"tra","1 minuto","9 m","V, S, M","8 ore","","D","PHB","Tu e fino a dieci creature consenzienti entro gittata assumete forma gassosa, simile a nuvole. Avete velocità di volo di 90 m e resistenza ai danni da armi non magiche, e le uniche azioni possibili sono Scatto o tornare alla forma normale, cosa che richiede 1 minuto di incapacità. Chi torna normale in volo scende di 18 m per round per 1 minuto.",""],["word-of-recall","Word of Recall","Parola del Ritorno",6,"evo","a","1,5 m","V","Istantanea","","C","PHB","Tu e fino a cinque creature consenzienti entro 1,5 m vi teletrasportate all'istante in un santuario che hai designato in precedenza, un luogo consacrato alla tua divinità. Se non hai preparato un santuario, l'incantesimo non ha effetto.",""],["bones-of-the-earth","Bones of the Earth","Ossa della Terra",6,"tra","a","36 m","V, S","Istantanea","","D","XGE","Fino a sei pilastri di pietra spuntano dal terreno in punti entro gittata: cilindri di 1,5 m di diametro alti fino a 9 m. Una creatura sopra un pilastro deve superare un TS su Destrezza o essere sollevata; se resta schiacciata contro un soffitto subisce 6d6 danni contundenti ed è trattenuta. Ogni pilastro ha CA 5 e 30 PF.","Due pilastri in più per ogni livello di slot sopra il 6°."],["create-homunculus","Create Homunculus","Creare Homunculus",6,"tra","1 ora","Contatto","V, S, M (argilla, cenere e radice di mandragora, consumate, e un pugnale ingemmato del valore di almeno 1.000 mo)","Istantanea","","M","XGE","Durante il lancio ti ferisci con il pugnale (2d4 danni perforanti non riducibili) e bagni gli ingredienti del tuo sangue: crei un homunculus legato a te. Comunicate telepaticamente e con un'azione puoi usarne i sensi. Finché vive, il tuo massimo di PF è ridotto di 2d4; se muore lo recuperi.",""],["druid-grove","Druid Grove","Boschetto Druidico",6,"abi","10 minuti","Contatto","V, S, M (vischio raccolto con un falcetto d'oro sotto la luna piena, consumato)","24 ore","","D","XGE","Chiami gli spiriti della natura a proteggere un'area (un cubo da 9 a 27 m). Scegli gli effetti: nebbia solida, rampicanti e sottobosco, alberi guardiani che si animano per difendere, e un effetto aggiuntivo tra Folata di Vento, Crescita di Spine, Luce del Giorno, Parlare con i Vegetali e Nube di Nebbia. Chi designi al lancio non ne è influenzato. Lanciato ogni giorno per un anno diventa permanente.",""],["investiture-of-flame","Investiture of Flame","Investitura della Fiamma",6,"tra","a","Sé","V, S","10 minuti","c","DSWM","XGE","Fiamme ti avvolgono: fai luce intensa in 9 m, sei immune ai danni da fuoco e hai resistenza a quelli da freddo. Chi si muove entro 1,5 m da te per la prima volta in un turno o vi termina il turno subisce 1d10 danni da fuoco. Con un'azione puoi creare una linea di fuoco lunga 4,5 m e larga 1,5 m: TS su Destrezza, 4d8 danni da fuoco se fallito, metà se superato.",""],["investiture-of-ice","Investiture of Ice","Investitura del Ghiaccio",6,"tra","a","Sé","V, S","10 minuti","c","DSWM","XGE","Il ghiaccio ti ricopre: sei immune ai danni da freddo, hai resistenza a quelli da fuoco e ti muovi su ghiaccio e neve senza penalità. Il terreno entro 3 m da te diventa ghiacciato e difficile per gli altri. Con un'azione puoi creare un cono di vento gelido di 4,5 m: TS su Costituzione, 4d6 danni da freddo e velocità dimezzata fino al tuo prossimo turno se fallito, metà danni se superato.",""],["investiture-of-stone","Investiture of Stone","Investitura della Pietra",6,"tra","a","Sé","V, S","10 minuti","c","DSWM","XGE","Frammenti di roccia ti ricoprono: hai resistenza ai danni contundenti, perforanti e taglienti da armi non magiche. Ti muovi attraverso terreno difficile di terra o pietra senza penalità e puoi attraversare la terra e la pietra solida. Con un'azione puoi provocare una scossa in un raggio di 4,5 m: le altre creature devono superare un TS su Destrezza o cadere prone.",""],["investiture-of-wind","Investiture of Wind","Investitura del Vento",6,"tra","a","Sé","V, S","10 minuti","c","DSWM","XGE","Venti turbinano attorno a te: gli attacchi con armi a distanza contro di te hanno svantaggio e ottieni velocità di volo di 18 m (se sei in volo quando termina, cadi). Con un'azione puoi creare un cubo di 4,5 m di vento vorticoso entro 18 m: ogni creatura dentro effettua un TS su Costituzione, 2d10 danni contundenti se fallisce, metà se lo supera; le creature Grandi o più piccole che falliscono vengono anche spinte di 3 m.",""],["mental-prison","Mental Prison","Prigione Mentale",6,"ill","a","18 m","S","1 minuto","c","SWM","XGE","Imprigioni una creatura che puoi vedere in una gabbia illusoria che percepisce solo lei (fiamme, lame, un abisso). Effettua un TS su Intelligenza: se lo supera subisce 5d10 danni psichici e l'incantesimo termina; se lo fallisce subisce 5d10 danni psichici e resta trattenuta. Se tenta di uscire dall'illusione o di attaccare attraverso di essa subisce 10d10 danni psichici e l'incantesimo termina.",""],["primordial-ward","Primordial Ward","Interdizione Primordiale",6,"abi","a","Sé","V, S","1 minuto","c","D","XGE","Hai resistenza ai danni da acido, freddo, fuoco, fulmine e tuono. Quando subisci danni di uno di questi tipi puoi usare la reazione per ottenere immunità a quel tipo, anche contro il colpo che l'ha innescata: le resistenze svaniscono e l'immunità dura fino alla fine del tuo prossimo turno, quando l'incantesimo termina.",""],["scatter","Scatter","Dispersione",6,"evo","a","9 m","V","Istantanea","","SWM","XGE","L'aria vibra attorno a fino a cinque creature a tua scelta che puoi vedere entro gittata; quelle non consenzienti possono resistere con un TS su Saggezza. Teletrasporti ognuna delle altre in uno spazio libero che puoi vedere entro 36 m da te, a terra o su un pavimento.",""],["soul-cage","Soul Cage","Gabbia dell'Anima",6,"nec","r","18 m","V, S, M (una minuscola gabbia d'argento del valore di 100 mo)","8 ore","","WM","XGE","Reazione da usare quando un umanoide che puoi vedere entro 18 m muore: ne catturi l'anima nella gabbia. Finché la tieni puoi sfruttarla fino a sei volte: Rubare la vita (con un'azione bonus recuperi 2d8 PF), Interrogare (una domanda a cui deve rispondere sinceramente), Prendere in prestito l'esperienza (vantaggio a un tiro per colpire, una prova o un TS), Occhi dei morti (vedi un luogo che il defunto ha visto in vita).",""],["tensers-transformation","Tenser's Transformation","Trasformazione di Tenser",6,"tra","a","Sé","V, S, M","10 minuti","c","M","XGE","Diventi una macchina da guerra: ottieni 50 PF temporanei, vantaggio agli attacchi con armi, 2d12 danni da forza extra quando colpisci con un'arma, competenza con tutte le armature, gli scudi, le armi semplici e da guerra e nei TS su Forza e Costituzione, e puoi attaccare due volte con l'azione di Attacco. Non puoi lanciare incantesimi. Al termine devi superare un TS su Costituzione CD 15 o subire un livello di indebolimento.",""],["conjure-celestial","Conjure Celestial","Evocare Celestiale",7,"evo","1 minuto","27 m","V, S","1 ora","c","C","PHB","Evochi un celestiale di GS 4 o inferiore in uno spazio libero entro gittata. È amichevole verso di te e i tuoi compagni, ha la sua iniziativa e obbedisce ai tuoi comandi verbali; senza ordini si difende. Scompare a 0 PF o alla fine dell'incantesimo.","Con slot di 9° evochi un celestiale di GS 5 o inferiore."],["delayed-blast-fireball","Delayed Blast Fireball","Palla di Fuoco Ritardata",7,"inv","a","45 m","V, S, M","1 minuto","c","SM","PHB","Un raggio giallo si condensa in una perla luminosa su un punto entro gittata. Quando l'incantesimo termina (perdi la concentrazione o decidi tu), la perla esplode in una sfera di 6 m di raggio: TS su Destrezza, danni da fuoco pari al totale accumulato se fallito, metà se superato. Il danno parte da 12d6 e aumenta di 1d6 alla fine di ogni tuo turno. Una creatura può toccare o raccogliere la perla e lanciarla altrove.","Il danno base aumenta di 1d6 per ogni livello di slot sopra il 7°."],["divine-word","Divine Word","Parola Divina",7,"inv","ab","9 m","V","Istantanea","","C","PHB","Pronunci una parola intrisa del potere che ha plasmato il mondo. Ogni creatura a tua scelta entro gittata che ti sente effettua un TS su Carisma; chi fallisce subisce un effetto in base ai PF attuali: 50 o meno, assordata per 1 minuto; 40 o meno, anche accecata per 10 minuti; 30 o meno, anche stordita per 1 ora; 20 o meno, muore. Celestiali, elementali, folletti e immondi che falliscono vengono rispediti al loro piano.",""],["etherealness","Etherealness","Forma Eterea",7,"tra","a","Sé","V, S","Fino a 8 ore","","BCSWM","PHB","Entri nella regione di confine del Piano Etereo, sovrapposta al piano in cui ti trovi, e vi resti per la durata o finché non congedi l'incantesimo con un'azione. Ti muovi in ogni direzione (salire e scendere costa il doppio), vedi e senti il piano d'origine in toni di grigio fino a 18 m e interagisci solo con creature eteree. Al termine torni nel piano d'origine.","Puoi portare con te tre creature consenzienti in più (te compreso) per ogni livello di slot sopra il 7°."],["finger-of-death","Finger of Death","Dito della Morte",7,"nec","a","18 m","V, S","Istantanea","","SWM","PHB","Invii energia negativa in una creatura che puoi vedere: effettua un TS su Costituzione, 7d8 + 30 danni necrotici se fallisce, metà se lo supera. Un umanoide ucciso così si rialza all'inizio del tuo prossimo turno come zombi permanentemente ai tuoi ordini.",""],["fire-storm","Fire Storm","Tempesta di Fuoco",7,"inv","a","45 m","V, S","Istantanea","","CDS","PHB","Una tempesta di fiamme ruggenti riempie fino a dieci cubi di 3 m entro gittata, disposti come vuoi purché ognuno tocchi almeno un altro cubo. Ogni creatura nell'area effettua un TS su Destrezza: 7d10 danni da fuoco se fallisce, metà se lo supera. Incendia gli oggetti infiammabili; puoi scegliere di risparmiare la vegetazione.",""],["forcecage","Forcecage","Gabbia di Forza",7,"inv","a","30 m","V, S, M (polvere di rubino del valore di 1.500 mo, consumata)","1 ora","","BWM","PHB","Una prigione cubica di forza, immobile e invisibile, compare attorno a un'area entro gittata: una gabbia con sbarre (lato 6 m) o una scatola chiusa (lato 3 m). Chi è interamente dentro resta intrappolato; chi è a metà viene spinto fuori. Non si esce con mezzi non magici, e per uscire teletrasportandosi o con viaggio planare serve un TS su Carisma. Dissolvi Magie non ha effetto.",""],["mirage-arcane","Mirage Arcane","Miraggio Arcano",7,"ill","10 minuti","Vista","V, S","10 giorni","","BDM","PHB","Fai sembrare il terreno di un'area fino a 1,5 km di lato un altro tipo di terreno, per vista, udito, olfatto e perfino tatto: un campo può diventare una strada, una collina un burrone, e puoi alterare o aggiungere strutture. L'illusione è così concreta che un ponte illusorio può essere attraversato. Chi ha visione del vero la vede per ciò che è.",""],["mordenkainens-magnificent-mansion","Mordenkainen's Magnificent Mansion","Magnifica Dimora di Mordenkainen",7,"evo","1 minuto","90 m","V, S, M (un portale in avorio in miniatura, un pezzo di marmo levigato e un cucchiaino d'argento del valore di 5 mo ciascuno)","24 ore","","BM","PHB","Evochi una dimora extradimensionale con un ingresso scintillante visibile solo a te e a chi designi. Dentro c'è un sontuoso palazzo di stanze a tua scelta (fino a cinquanta cubi di 3 m) servito da cento servitori quasi trasparenti, con un banchetto di nove portate per cento persone. Al termine, chi è dentro viene espulso nello spazio libero più vicino all'ingresso.",""],["mordenkainens-sword","Mordenkainen's Sword","Spada di Mordenkainen",7,"inv","a","18 m","V, S, M (una spada di platino in miniatura del valore di 250 mo)","1 minuto","c","BM","PHB","Crei una spada di forza fluttuante entro gittata. Al lancio puoi fare un attacco in mischia con incantesimo contro un bersaglio entro 1,5 m dalla spada: 3d10 danni da forza se colpisce. Nei turni successivi, con un'azione bonus, puoi spostarla di 6 m e attaccare di nuovo.",""],["plane-shift","Plane Shift","Spostamento Planare",7,"evo","a","Contatto","V, S, M (una bacchetta di metallo biforcuta del valore di 250 mo, sintonizzata su un piano)","Istantanea","","CDSWM","PHB","Tu e fino a otto creature consenzienti che si tengono per mano in cerchio vi trasferite su un altro piano di esistenza, vicino alla destinazione scelta o dentro un cerchio di teletrasporto di cui conosci i sigilli. In alternativa, puoi colpire una creatura con un attacco in mischia con incantesimo: se fallisce un TS su Carisma viene spedita in un punto casuale del piano che scegli.",""],["prismatic-spray","Prismatic Spray","Spruzzo Prismatico",7,"inv","a","Sé (cono di 18 m)","V, S","Istantanea","","SM","PHB","Otto raggi di luce multicolore partono dalla tua mano in un cono di 18 m. Ogni creatura nel cono effettua un TS su Destrezza e tira 1d8 per il raggio che la colpisce: 1 rosso (10d6 fuoco), 2 arancione (10d6 acido), 3 giallo (10d6 fulmine), 4 verde (10d6 veleno), 5 blu (10d6 freddo), con metà danni se supera il TS; 6 indaco (trattenuta, poi pietrificata con TS su Costituzione falliti); 7 viola (accecata, poi spedita su un altro piano con TS su Saggezza fallito); 8 colpita da due raggi (tira altre due volte).",""],["project-image","Project Image","Proiettare Immagine",7,"ill","a","750 km","V, S, M (una tua statuetta del valore di almeno 5 mo)","1 giorno","c","BM","PHB","Crei una tua copia illusoria in un luogo entro gittata che hai già visto, a prescindere dagli ostacoli. Con un'azione puoi muoverla fino al doppio della tua velocità, farla parlare e gesticolare, e vedere e sentire attraverso di lei. Il contatto fisico rivela l'illusione, perché gli oggetti la attraversano.",""],["regenerate","Regenerate","Rigenerazione",7,"tra","1 minuto","Contatto","V, S, M","1 ora","","BCD","PHB","Tocchi una creatura e ne stimoli la guarigione naturale: recupera subito 4d8 + 15 punti ferita e, per la durata, 1 PF all'inizio di ogni suo turno. Gli arti mozzati ricrescono in 2 minuti; se tieni la parte recisa contro il moncherino, si riattacca all'istante.",""],["resurrection","Resurrection","Resurrezione",7,"nec","1 ora","Contatto","V, S, M (un diamante del valore di almeno 1.000 mo, consumato)","Istantanea","","BC","PHB","Riporti in vita una creatura morta da non più di un secolo, non di vecchiaia e non non morta, se la sua anima è libera e consenziente. Torna con tutti i PF, guarita da veleni, malattie comuni e maledizioni, con le parti del corpo mancanti ripristinate. Subisce −4 a tiri per colpire, TS e prove di caratteristica, ridotto di 1 a ogni riposo lungo. Riportare in vita chi è morto da più di un anno ti affatica fino a un riposo lungo.",""],["reverse-gravity","Reverse Gravity","Inversione della Gravità",7,"tra","a","30 m","V, S, M","1 minuto","c","DSM","PHB","Inverti la gravità in un cilindro di 15 m di raggio e 30 m di altezza entro gittata: creature e oggetti non fissati cadono verso l'alto fino alla sommità dell'area, e chi urta un soffitto subisce danni da caduta. Una creatura può aggrapparsi a un oggetto fisso a portata con un TS su Destrezza. Quando l'incantesimo termina, tutto ricade verso il basso.",""],["sequester","Sequester","Isolamento",7,"tra","a","Contatto","V, S, M (polvere di diamante, smeraldo, rubino e zaffiro del valore di almeno 5.000 mo, consumata)","Fino a dissolto","","M","PHB","Nascondi magicamente una creatura consenziente o un oggetto: diventa invisibile e non può essere individuato dalla divinazione né dai sensori di scrutamento. Una creatura cade in animazione sospesa e non invecchia. Puoi stabilire una condizione che pone fine all'incantesimo.",""],["simulacrum","Simulacrum","Simulacro",7,"ill","12 ore","Contatto","V, S, M (neve o ghiaccio per una copia a grandezza naturale, capelli o unghie dell'originale e polvere di rubino del valore di 1.500 mo, consumata)","Fino a dissolto","","M","PHB","Crei un duplicato illusorio di una bestia o di un umanoide presente per tutto il lancio. È una creatura in parte reale, con le statistiche dell'originale ma metà del suo massimo di PF e senza equipaggiamento; è amichevole e obbedisce ai tuoi ordini. Non guadagna livelli e non recupera slot o PF, se non con riparazioni in laboratorio. Lanciandolo di nuovo, il simulacro precedente si scioglie.",""],["symbol","Symbol","Simbolo",7,"abi","1 minuto","Contatto","V, S, M (mercurio, fosforo e polvere di diamante e opale del valore di almeno 1.000 mo, consumati)","Fino a dissolto o attivato","","BCM","PHB","Incidi un glifo dannoso su una superficie o in un oggetto chiudibile, quasi invisibile (prova di Intelligenza (Indagare) contro la tua CD), con le condizioni di attivazione che vuoi. Quando scatta, riempie una sfera di 18 m di raggio di luce fioca per 10 minuti e ogni creatura dentro subisce l'effetto scelto: Morte (TS su Costituzione, 10d10 necrotici), Discordia, Paura, Disperazione, Follia, Dolore, Sonno o Stordimento.",""],["teleport","Teleport","Teletrasporto",7,"evo","a","3 m","V","Istantanea","","BSM","PHB","Trasporti all'istante te e fino a otto creature consenzienti che puoi vedere entro gittata, oppure un singolo oggetto, in una destinazione sullo stesso piano. La riuscita dipende da quanto conosci il luogo (cerchio permanente, oggetto associato, molto familiare, visto spesso, visto una volta, descrizione, falsa destinazione): si tira 1d100 sulla tabella e si può arrivare a destinazione, fuori bersaglio, in un'area simile o subire un incidente (3d10 danni da forza).",""],["crown-of-stars","Crown of Stars","Corona di Stelle",7,"inv","a","Sé","V, S","1 ora","","SWM","XGE","Sette granelli di luce stellare orbitano attorno alla tua testa. Con un'azione bonus puoi scagliarne uno contro una creatura o un oggetto entro 36 m: attacco a distanza con incantesimo, 4d12 danni radiosi se colpisce. L'incantesimo termina con l'ultimo granello. Con quattro o più granelli fai luce intensa in 9 m; con meno, luce fioca in 9 m.","Due granelli in più per ogni livello di slot sopra il 7°."],["power-word-pain","Power Word Pain","Parola del Potere Dolore",7,"amm","a","18 m","V","Istantanea","","SWM","XGE","Pronunci una parola di potere che provoca un dolore insopportabile a una creatura che puoi vedere, se ha 100 PF o meno (altrimenti non ha effetto). La sua velocità non può superare 3 m, ha svantaggio ai tiri per colpire, alle prove di caratteristica e ai TS tranne quelli su Costituzione, e per lanciare un incantesimo deve prima superare un TS su Costituzione. Alla fine di ogni suo turno può effettuare un TS su Costituzione per liberarsi.",""],["temple-of-the-gods","Temple of the Gods","Tempio degli Dei",7,"evo","1 ora","36 m","V, S, M (una gemma sacra del valore di almeno 5 mo)","24 ore","","C","XGE","Fai sorgere un tempio dall'aspetto che preferisci, fino a un cubo di 36 m, dedicato alla tua divinità. Scegli uno o più tipi tra celestiali, elementali, folletti, immondi e non morti: per entrare devono superare un TS su Carisma, e dentro gli incantesimi di ammaliamento e divinazione vengono ostacolati. Chi dentro lancia un incantesimo di guarigione aggiunge il tuo modificatore di Saggezza ai PF recuperati. Lanciato ogni giorno per un anno diventa permanente.",""],["whirlwind","Whirlwind","Turbine",7,"inv","a","90 m","V, M","1 minuto","c","DSM","XGE","Un turbine ululante si abbatte su un punto a terra entro gittata: un cilindro di 3 m di raggio e 9 m di altezza. Chi si trova dentro quando compare, o vi entra, effettua un TS su Destrezza: 10d6 danni contundenti se fallisce, metà se lo supera. Una creatura Grande o più piccola che fallisce deve superare anche un TS su Forza o essere trattenuta e sollevata nel vortice. Con un'azione puoi spostare il turbine di 9 m.",""],["animal-shapes","Animal Shapes","Forme Animali",8,"tra","a","9 m","V, S","24 ore","c","D","PHB","Trasformi un qualsiasi numero di creature consenzienti che puoi vedere entro gittata in bestie Grandi o più piccole di GS 4 o inferiore; nei turni successivi, con un'azione, puoi cambiarne la forma. Ognuna assume statistiche e PF della nuova forma, conservando allineamento e personalità, finché non scende a 0 PF o l'incantesimo termina.",""],["antimagic-field","Antimagic Field","Campo Anti-Magia",8,"abi","a","Sé (sfera di 3 m di raggio)","V, S, M","1 ora","c","CM","PHB","Una sfera invisibile di anti-magia di 3 m di raggio ti circonda e si muove con te. Al suo interno non si possono lanciare incantesimi, le creature evocate svaniscono, gli oggetti magici diventano comuni e ogni effetto magico che vi entra è soppresso; gli attacchi magici contano come non magici. Non influenza artefatti e divinità, e Dissolvi Magie non ha effetto sul campo.",""],["antipathy-sympathy","Antipathy/Sympathy","Antipatia/Simpatia",8,"amm","1 ora","18 m","V, S, M (allume imbevuto di aceto per l'antipatia, una goccia di miele per la simpatia)","10 giorni","","DM","PHB","Scegli un tipo di creatura (ad esempio drago rosso o orco) o un allineamento e rendi una creatura, un oggetto o un'area (fino a un cubo di 60 m) repellente o attraente per loro. Antipatia: devono superare un TS su Saggezza o restare spaventate e allontanarsi. Simpatia: devono superare un TS su Saggezza o sentirsi spinte ad avvicinarsi e restare vicine. Ripetono il TS quando si allontanano o subiscono danni.",""],["clone","Clone","Clone",8,"nec","1 ora","Contatto","V, S, M (un diamante del valore di almeno 1.000 mo e 2,5 cm³ di carne della creatura, consumati, e un recipiente sigillabile del valore di almeno 2.000 mo)","Istantanea","","M","PHB","Fai crescere in un recipiente sigillato un duplicato inerte di una creatura vivente, come assicurazione contro la morte. Il clone matura in 120 giorni (puoi sceglierne un'età più giovane) e resta inerte a tempo indeterminato. Se la creatura originale muore e la sua anima è libera e consenziente, si trasferisce nel clone, con gli stessi ricordi e capacità ma senza equipaggiamento.",""],["control-weather","Control Weather","Controllare Tempo Atmosferico",8,"tra","10 minuti","Sé (raggio 7,5 km)","V, S, M","8 ore","c","CDM","PHB","Prendi il controllo del tempo atmosferico entro 7,5 km da te; devi essere all'aperto. Puoi cambiare precipitazioni, temperatura e vento di uno stadio alla volta, e ogni cambiamento impiega 1d4 × 10 minuti a manifestarsi. Puoi anche cambiare la direzione del vento. Quando l'incantesimo termina, il tempo torna gradualmente alla normalità.",""],["demiplane","Demiplane","Semipiano",8,"evo","a","18 m","S","1 ora","","WM","PHB","Crei una porta ombrosa su una superficie piana e solida entro gittata, che conduce a un semipiano: una stanza vuota di 9 m di lato in legno o pietra. Al termine la porta svanisce e chi è dentro resta intrappolato finché qualcuno non la riapre con questo incantesimo. Ogni lancio può creare un nuovo semipiano o ricollegarsi a uno già creato da te.",""],["dominate-monster","Dominate Monster","Dominare Mostri",8,"amm","a","18 m","V, S","1 ora","c","BSWM","PHB","Tenti di soggiogare una creatura che puoi vedere: deve superare un TS su Saggezza (vantaggio se la state combattendo) o restare affascinata da te. Finché lo è avete un legame telepatico e puoi darle ordini, oppure con un'azione controllarla completamente. Ogni volta che subisce danni ripete il TS.","Con slot di 9° la durata sale a 8 ore."],["earthquake","Earthquake","Terremoto",8,"inv","a","150 m","V, S, M","1 minuto","c","CDS","PHB","Scateni una violenta scossa in un cerchio di 30 m di raggio attorno a un punto a terra entro gittata; l'area è terreno difficile. Chi si concentra nell'area deve superare un TS su Costituzione o perdere la concentrazione. Al lancio e alla fine di ogni tuo turno, chi è a terra deve superare un TS su Destrezza o cadere prono. Si aprono fenditure profonde e le strutture subiscono 50 danni contundenti al round, crollando a 0 PF.",""],["feeblemind","Feeblemind","Debilitare Mente",8,"amm","a","45 m","V, S, M","Istantanea","","BDWM","PHB","Colpisci la mente di una creatura che puoi vedere: subisce 4d6 danni psichici e deve effettuare un TS su Intelligenza. Se fallisce, Intelligenza e Carisma diventano 1: non può lanciare incantesimi, attivare oggetti magici, capire lingue né comunicare, ma riconosce e segue gli amici. Ripete il TS ogni 30 giorni; Ristorare Superiore, Guarigione o Desiderio pongono fine all'effetto.",""],["glibness","Glibness","Parlantina",8,"tra","a","Sé","V","1 ora","","BW","PHB","Fino alla fine dell'incantesimo, quando effettui una prova di Carisma puoi sostituire il risultato del dado con un 15. Inoltre, qualunque cosa tu dica, la magia che rileva la menzogna ti considera sincero.",""],["holy-aura","Holy Aura","Aura Sacra",8,"abi","a","Sé","V, S, M (un reliquiario del valore di almeno 1.000 mo con una reliquia sacra)","1 minuto","c","C","PHB","Una luce divina si irradia da te in un'aura di 9 m. Le creature che scegli nell'area emettono luce fioca in 1,5 m, hanno vantaggio a tutti i tiri salvezza e gli altri hanno svantaggio ad attaccarle. Se un immondo o un non morto colpisce in mischia una di loro, deve superare un TS su Costituzione o restare accecato fino alla fine dell'incantesimo.",""],["incendiary-cloud","Incendiary Cloud","Nube Incendiaria",8,"evo","a","45 m","V, S","1 minuto","c","SM","PHB","Una nube di fumo pieno di braci ardenti riempie una sfera di 6 m di raggio entro gittata, aggira gli angoli e oscura pesantemente l'area. Quando compare, e quando una creatura vi entra per la prima volta in un turno o vi termina il turno, chi è dentro effettua un TS su Destrezza: 10d8 danni da fuoco se fallisce, metà se lo supera. All'inizio di ogni tuo turno la nube si allontana da te di 3 m.",""],["maze","Maze","Labirinto",8,"evo","a","18 m","V, S","10 minuti","c","M","PHB","Esili una creatura che puoi vedere in un semipiano labirintico, dove resta per la durata o finché non ne esce. Con un'azione può tentare una prova di Intelligenza CD 20: se riesce, fugge e l'incantesimo termina (i minotauri e i demoni goristro ci riescono automaticamente). Al termine riappare nello spazio che occupava, o nel più vicino libero.",""],["mind-blank","Mind Blank","Vuoto Mentale",8,"abi","a","Contatto","V, S","24 ore","","BM","PHB","Una creatura consenziente che tocchi diventa immune ai danni psichici, a ogni effetto che ne percepisca le emozioni o ne legga i pensieri, agli incantesimi di divinazione e alla condizione affascinato. Blocca anche Desiderio e gli effetti di potere simile usati per influenzarne la mente o ottenere informazioni su di lei.",""],["power-word-stun","Power Word Stun","Parola del Potere Stordire",8,"amm","a","18 m","V","Istantanea","","BSWM","PHB","Pronunci una parola di potere che sopraffà la mente di una creatura che puoi vedere: se ha 150 PF o meno è stordita, altrimenti non ha effetto. Alla fine di ogni suo turno effettua un TS su Costituzione; se lo supera, l'effetto termina.",""],["sunburst","Sunburst","Esplosione Solare",8,"inv","a","45 m","V, S, M","Istantanea","","DSM","PHB","Una luce solare abbagliante esplode in un raggio di 18 m attorno a un punto entro gittata. Ogni creatura nell'area effettua un TS su Costituzione: 12d6 danni radiosi e cecità per 1 minuto se fallisce, metà danni se lo supera; non morti e melme hanno svantaggio. Chi è accecato ripete il TS alla fine di ogni suo turno. Dissolve l'oscurità magica nell'area.",""],["telepathy","Telepathy","Telepatia",8,"inv","a","Illimitata","V, S, M","24 ore","","M","PHB","Crei un legame telepatico tra te e una creatura consenziente che ti è familiare, sullo stesso piano. Per la durata potete scambiarvi all'istante parole, immagini, suoni e altre sensazioni, e la creatura capisce le tue parole anche senza conoscere la tua lingua (se ha Intelligenza almeno 1).",""],["tsunami","Tsunami","Tsunami",8,"evo","1 minuto","Vista","V, S","6 round","c","D","PHB","Un muro d'acqua lungo fino a 90 m, alto 90 m e spesso 15 m compare in un punto entro gittata. Quando compare, ogni creatura nella sua area effettua un TS su Forza: 6d10 danni contundenti se fallisce, metà se lo supera. All'inizio di ogni tuo turno l'onda si allontana da te di 15 m trascinando con sé le creature, perde 15 m di altezza e 1d10 di danno, finché non si esaurisce.",""],["abi-dalzims-horrid-wilting","Abi-Dalzim's Horrid Wilting","Orrido Avvizzimento di Abi-Dalzim",8,"nec","a","45 m","V, S, M","Istantanea","","SM","XGE","Prosciughi l'umidità da ogni creatura in un cubo di 9 m centrato su un punto entro gittata. Ognuna effettua un TS su Costituzione: 12d8 danni necrotici se fallisce, metà se lo supera. Costrutti e non morti non ne sono influenzati; piante ed elementali dell'acqua hanno svantaggio. Le piante non magiche nell'area avvizziscono e muoiono.",""],["illusory-dragon","Illusory Dragon","Drago Illusorio",8,"ill","a","36 m","S","1 minuto","c","M","XGE","Crei l'illusione di un drago Enorme in uno spazio libero entro gittata. Quando compare, ogni creatura a tua scelta che lo vede deve superare un TS su Saggezza o restare spaventata per 1 minuto. Con un'azione bonus puoi muoverlo di 18 m e fargli esalare un soffio in un cono di 18 m: TS su Intelligenza, 7d6 danni di un tipo a scelta (acido, freddo, fuoco, fulmine, necrotico o veleno) se fallito, metà se superato.",""],["maddening-darkness","Maddening Darkness","Oscurità Folle",8,"inv","a","45 m","V, M","10 minuti","c","WM","XGE","Un'oscurità magica riempie una sfera di 18 m di raggio attorno a un punto entro gittata: nemmeno la scurovisione la penetra, la luce non magica non la illumina e gli incantesimi di luce di 8° livello o inferiore vengono dissolti. Al suo interno echeggiano urla e risate folli: chi inizia il turno nella sfera effettua un TS su Saggezza, 8d8 danni psichici se fallisce, metà se lo supera.",""],["mighty-fortress","Mighty Fortress","Fortezza Possente",8,"evo","1 minuto","1,5 km","V, S, M (un diamante del valore di almeno 500 mo, consumato)","Istantanea","","M","XGE","Una fortezza di pietra emerge dal terreno in un'area di 36 m di lato entro gittata: quattro torri, mura alte 9 m, un mastio, cancelli e un cortile, mantenuti da cento servitori invisibili. Dopo 7 giorni, o se lanci di nuovo l'incantesimo, sprofonda nel terreno. Lanciandolo nello stesso punto ogni 7 giorni per un anno diventa permanente.",""],["astral-projection","Astral Projection","Proiezione Astrale",9,"nec","1 ora","3 m","V, S, M (per ogni creatura un giacinto del valore di almeno 1.000 mo e una barra d'argento lavorata del valore di almeno 100 mo, consumati)","Speciale","","CWM","PHB","Tu e fino a otto creature consenzienti proiettate i vostri corpi astrali nel Piano Astrale, mentre quelli materiali restano in animazione sospesa. Il corpo astrale ha le tue statistiche e una copia dell'equipaggiamento, ed è legato al corpo da un cordone d'argento: se il cordone viene reciso, muori. L'incantesimo termina per tutti quando lo congedi, o per un singolo bersaglio se uno dei suoi corpi scende a 0 PF.",""],["foresight","Foresight","Preveggenza",9,"div","1 minuto","Contatto","V, S, M","8 ore","","BDWM","PHB","Una creatura consenziente che tocchi può intravedere l'immediato futuro: per la durata non può essere sorpresa, ha vantaggio ai tiri per colpire, alle prove di caratteristica e ai tiri salvezza, e le altre creature hanno svantaggio ad attaccarla. Termina se lo lanci di nuovo.",""],["gate","Gate","Portale",9,"evo","a","18 m","V, S, M (un diamante del valore di almeno 5.000 mo)","1 minuto","c","CSM","PHB","Apri un portale circolare (da 1,5 a 6 m di diametro) che collega uno spazio libero entro gittata a un luogo preciso di un altro piano; chiunque lo attraversi esce dall'altra parte. In alternativa, pronunci il nome di una specifica creatura (non una divinità): il portale si apre accanto a lei e la trascina da te, ma non la obbliga a esserti amica.",""],["imprisonment","Imprisonment","Imprigionare",9,"abi","1 minuto","9 m","V, S, M (una rappresentazione del bersaglio e un componente speciale del valore di almeno 500 mo per Dado Vita del bersaglio)","Fino a dissolto","","WM","PHB","Crei un vincolo magico per imprigionare una creatura che puoi vedere: deve superare un TS su Saggezza o restare vincolata (se lo supera diventa immune a questo incantesimo). Scegli la prigione: Sepoltura, Incatenamento, Prigione isolata, Contenimento minimo (dentro una gemma) o Sonno eterno. Stabilisci una condizione speciale che la libera.",""],["mass-heal","Mass Heal","Guarigione di Massa",9,"inv","a","18 m","V, S","Istantanea","","C","PHB","Un'ondata di energia curativa ripristina fino a 700 punti ferita, divisi come vuoi tra qualsiasi numero di creature che puoi vedere entro gittata. Le creature curate guariscono anche da malattie, cecità e sordità. Non ha effetto su non morti e costrutti.",""],["meteor-swarm","Meteor Swarm","Sciame di Meteore",9,"inv","a","1,5 km","V, S","Istantanea","","SM","PHB","Sfere di fuoco precipitano su quattro punti diversi che puoi vedere entro gittata. Ogni creatura in una sfera di 12 m di raggio attorno a ciascun punto effettua un TS su Destrezza: 20d6 danni da fuoco e 20d6 danni contundenti se fallisce, metà se lo supera. Chi è in più aree viene colpito una sola volta. Danneggia gli oggetti e incendia quelli infiammabili.",""],["power-word-heal","Power Word Heal","Parola del Potere Guarire",9,"inv","a","Contatto","V, S","Istantanea","","B","PHB","Un'ondata di energia curativa attraversa la creatura che tocchi: recupera tutti i punti ferita e termina ogni effetto che la rende affascinata, spaventata, paralizzata o stordita. Se è prona può usare la reazione per rialzarsi. Non ha effetto su non morti e costrutti.",""],["power-word-kill","Power Word Kill","Parola del Potere Uccidere",9,"amm","a","18 m","V","Istantanea","","BSWM","PHB","Pronunci una parola di potere che costringe a morire all'istante una creatura che puoi vedere, se ha 100 PF o meno. Altrimenti non ha effetto.",""],["prismatic-wall","Prismatic Wall","Muro Prismatico",9,"abi","a","18 m","V, S","10 minuti","","M","PHB","Crei un muro di luce multicolore opaco (lungo fino a 27 m, alto 9 m, spesso 2,5 cm) o una sfera di 9 m di diametro entro gittata. Chi si avvicina entro 6 m deve superare un TS su Costituzione o restare accecato per 1 minuto. Il muro ha sette strati (rosso, arancione, giallo, verde, blu, indaco, viola), ognuno con un effetto diverso su chi lo attraversa e distruttibile solo in un modo specifico.",""],["shapechange","Shapechange","Mutare Forma",9,"tra","a","Sé","V, S, M (un cerchietto di giada del valore di almeno 1.500 mo)","1 ora","c","DM","PHB","Assumi la forma di una creatura con GS pari o inferiore al tuo livello che hai già visto (non costrutti né non morti). Ottieni le sue statistiche e i suoi PF ma conservi allineamento, Intelligenza, Saggezza, Carisma, competenze e capacità di classe. Con un'azione nei turni successivi puoi cambiare forma. Se la forma scende a 0 PF torni alla tua.",""],["storm-of-vengeance","Storm of Vengeance","Tempesta di Vendetta",9,"evo","a","Vista","V, S","1 minuto","c","D","PHB","Una nube tempestosa di 108 m di raggio si forma sopra un punto che puoi vedere. Al lancio chi è sotto la nube effettua un TS su Costituzione: 2d6 danni da tuono e sordità per 5 minuti se fallisce. Nei round successivi in cui mantieni la concentrazione la tempesta scatena, in sequenza, pioggia acida (4d6 acido), fino a sei fulmini (10d6 fulmine), grandine (2d6 contundenti) e raffiche gelide (1d6 freddo).",""],["time-stop","Time Stop","Fermare il Tempo",9,"tra","a","Sé","V","Istantanea","","SM","PHB","Fermi brevemente lo scorrere del tempo per tutti tranne te: ottieni 1d4 + 1 turni consecutivi in cui puoi agire e muoverti normalmente. L'incantesimo termina se una tua azione o un effetto che crei influenza un'altra creatura o un oggetto che indossa o trasporta, o se ti allontani di oltre 300 m dal punto in cui l'hai lanciato.",""],["true-polymorph","True Polymorph","Metamorfosi Pura",9,"tra","a","9 m","V, S, M","1 ora","c","BWM","PHB","Trasformi una creatura in un'altra creatura, una creatura in un oggetto o un oggetto non magico in una creatura; un bersaglio non consenziente può resistere con un TS su Saggezza. Una nuova forma di creatura deve avere GS pari o inferiore a quello (o al livello) del bersaglio. Se mantieni la concentrazione per l'intera ora, la trasformazione diventa permanente finché non viene dissolta.",""],["true-resurrection","True Resurrection","Resurrezione Pura",9,"nec","1 ora","Contatto","V, S, M (acqua santa e diamanti del valore di almeno 25.000 mo, consumati)","Istantanea","","CD","PHB","Riporti in vita una creatura morta da non più di 200 anni per qualsiasi causa tranne la vecchiaia, se la sua anima è libera e consenziente. Torna con tutti i PF, senza ferite, veleni, malattie o maledizioni, con organi e arti ripristinati. Se il corpo non esiste più, l'incantesimo ne crea uno nuovo: basta pronunciare il nome della creatura.",""],["weird","Weird","Incubo Fatale",9,"ill","a","36 m","V, S","1 minuto","c","M","PHB","Attingi alle paure più profonde di un gruppo di creature e le fai apparire nelle loro menti. Ogni creatura in una sfera di 9 m di raggio entro gittata effettua un TS su Saggezza: se fallisce resta spaventata per la durata. Alla fine di ogni suo turno deve superare un altro TS su Saggezza o subire 4d10 danni psichici; se lo supera, l'incantesimo termina per lei.",""],["wish","Wish","Desiderio",9,"evo","a","Sé","V","Istantanea","","SM","PHB","L'incantesimo più potente per un mortale. L'uso base è duplicare qualsiasi incantesimo di 8° livello o inferiore senza soddisfarne i requisiti, componenti costose incluse. In alternativa puoi creare un oggetto non magico fino a 25.000 mo, curare completamente fino a dieci creature, concedere resistenza o immunità a un incantesimo, o annullare un evento recente. Richieste diverse sono rischiose e al giudizio del DM: lo sforzo ti indebolisce e c'è un 33% di probabilità di non poterlo mai più lanciare.",""],["invulnerability","Invulnerability","Invulnerabilità",9,"abi","a","Sé","V, S, M (un frammento di adamantio del valore di almeno 500 mo, consumato)","10 minuti","c","M","XGE","Sei immune a tutti i danni fino alla fine dell'incantesimo.",""],["mass-polymorph","Mass Polymorph","Metamorfosi di Massa",9,"tra","a","36 m","V, S, M","1 ora","c","BSM","XGE","Trasformi fino a dieci creature che puoi vedere entro gittata in bestie a tua scelta, con GS pari o inferiore al loro (o a metà del loro livello); quelle non consenzienti resistono con un TS su Saggezza e i mutaforma lo superano automaticamente. Ognuna assume statistiche e PF della bestia e torna alla forma originale quando la nuova scende a 0 PF.",""],["psychic-scream","Psychic Scream","Urlo Psichico",9,"amm","a","27 m","S","Istantanea","","BSWM","XGE","Scateni il potere della tua mente contro fino a dieci creature a tua scelta che puoi vedere entro gittata (quelle con Intelligenza 2 o meno sono immuni). Ognuna effettua un TS su Intelligenza: se fallisce subisce 14d6 danni psichici ed è stordita, se lo supera subisce metà danni. Chi muore così ha la testa che esplode. Chi è stordito ripete il TS alla fine di ogni suo turno.",""],["thorn-whip","Thorn Whip","Frusta di Spine",0,"tra","a","9 m","V, S, M","Istantanea","","AD","PHB","Crei una lunga frusta coperta di spine e sferzi una creatura entro gittata: fai un attacco in mischia con incantesimo. Se colpisci infligge 1d6 danni perforanti e, se è Grande o più piccola, la tiri fino a 3 m verso di te.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["booming-blade","Booming Blade","Lama Rimbombante",0,"inv","a","Sé (raggio 1,5 m)","S, M (un'arma da mischia del valore di almeno 1 ma)","1 round","","ASWM","TCE","Brandisci l'arma e fai un attacco in mischia con essa contro una creatura entro 1,5 m. Se colpisci, il bersaglio subisce gli effetti normali e viene avvolto da energia rimbombante fino all'inizio del tuo prossimo turno: se si muove volontariamente di 1,5 m o più, subisce 1d8 danni da tuono e l'incantesimo termina.","Al 5° livello del personaggio il colpo infligge 1d8 danni da tuono extra e il danno per il movimento diventa 2d8; all'11° 2d8 e 3d8; al 17° 3d8 e 4d8."],["green-flame-blade","Green-Flame Blade","Lama di Fiamma Verde",0,"inv","a","Sé (raggio 1,5 m)","S, M (un'arma da mischia del valore di almeno 1 ma)","Istantanea","","ASWM","TCE","Brandisci l'arma e fai un attacco in mischia con essa contro una creatura entro 1,5 m. Se colpisci, oltre agli effetti normali una fiamma verde salta su un'altra creatura a tua scelta entro 1,5 m dal bersaglio, infliggendole danni da fuoco pari al tuo modificatore da incantatore.","Al 5° livello del personaggio il colpo infligge 1d8 danni da fuoco extra e la fiamma 1d8 + modificatore; all'11° 2d8 e 2d8 + mod.; al 17° 3d8 e 3d8 + mod."],["lightning-lure","Lightning Lure","Richiamo del Fulmine",0,"inv","a","Sé (raggio 4,5 m)","V","Istantanea","","ASWM","TCE","Una frusta di fulmine sferza una creatura a tua scelta entro 4,5 m: deve superare un TS su Forza o essere tirata fino a 3 m in linea retta verso di te, e subire 1d8 danni da fulmine se finisce entro 1,5 m da te.","Il danno aumenta di 1d8 al 5° livello del personaggio (2d8), all'11° (3d8) e al 17° (4d8)."],["mind-sliver","Mind Sliver","Scheggia Mentale",0,"amm","a","18 m","V","1 round","","SWM","TCE","Conficchi una scheggia di energia psichica nella mente di una creatura che puoi vedere: deve superare un TS su Intelligenza o subire 1d6 danni psichici e sottrarre 1d4 dal prossimo TS che effettua prima della fine del tuo prossimo turno.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["sword-burst","Sword Burst","Esplosione di Lame",0,"evo","a","Sé (raggio 1,5 m)","V","Istantanea","","ASWM","TCE","Crei un cerchio effimero di lame spettrali che ruota attorno a te. Ogni altra creatura entro 1,5 m da te deve superare un TS su Destrezza o subire 1d6 danni da forza.","Il danno aumenta di 1d6 al 5° livello del personaggio (2d6), all'11° (3d6) e al 17° (4d6)."],["tashas-caustic-brew","Tasha's Caustic Brew","Intruglio Caustico di Tasha",1,"inv","a","Sé (linea di 9 m)","V, S, M","1 minuto","c","ASM","TCE","Un getto di acido parte da te in una linea lunga 9 m e larga 1,5 m. Ogni creatura nella linea deve superare un TS su Destrezza o restare ricoperta di acido per la durata, subendo 2d4 danni da acido all'inizio di ogni suo turno. Una creatura può usare un'azione per raschiare via l'acido da sé o da un'altra creatura entro 1,5 m.","Il danno aumenta di 2d4 per ogni livello di slot sopra il 1°."],["tashas-mind-whip","Tasha's Mind Whip","Frusta Mentale di Tasha",2,"amm","a","27 m","V","1 round","","SM","TCE","Sferzi psichicamente la mente di una creatura che puoi vedere: deve superare un TS su Intelligenza o subire 3d6 danni psichici, non poter effettuare reazioni fino alla fine del suo prossimo turno e, nel suo prossimo turno, scegliere tra muoversi, compiere un'azione o un'azione bonus (una sola). Se supera il TS subisce metà danni e nient'altro.","Una creatura aggiuntiva per ogni livello di slot sopra il 2° (entro 9 m l'una dall'altra)."],["intellect-fortress","Intellect Fortress","Fortezza dell'Intelletto",3,"abi","a","9 m","V","1 ora","c","ABSWM","TCE","Una creatura consenziente a tua scelta che puoi vedere è avvolta da un'aura d'energia: per la durata ha resistenza ai danni psichici e vantaggio ai TS su Intelligenza, Saggezza e Carisma.","Una creatura aggiuntiva per ogni livello di slot sopra il 3° (entro 9 m l'una dall'altra)."],["spirit-shroud","Spirit Shroud","Sudario Spirituale",3,"nec","ab","Sé","V, S","1 minuto","c","CPWM","TCE","Spiriti dei defunti ti circondano entro 3 m. Finché dura, quando colpisci una creatura entro 3 m con un attacco infliggi 1d8 danni extra (radiosi, necrotici o freddo, scelti al lancio) e il bersaglio non può recuperare PF fino all'inizio del tuo prossimo turno. Inoltre ogni creatura a tua scelta che inizia il turno entro 3 m ha velocità ridotta di 3 m fino al tuo turno successivo.","+1d8 danni ogni due livelli di slot sopra il 3°."],["summon-beast","Summon Beast","Convocare Bestia",2,"evo","a","27 m","V, S, M (una piuma, un ciuffo di pelo e una coda di pesce dentro una ghianda dorata del valore di 200 mo)","1 ora","c","DR","TCE","Evochi uno spirito bestiale in forma d'Aria, Terra o Acqua, con le statistiche dello Spirito Bestiale del manuale: CA 11 + livello dell'incantesimo, PF 20 (Aria) o 30 (Terra, Acqua) + 5 per livello sopra il 2°, attacchi pari a metà del livello dell'incantesimo con Morso da 1d8 + 4 + livello. È amichevole, agisce subito dopo di te e obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-fey","Summon Fey","Convocare Folletto",3,"evo","a","27 m","V, S, M (un fiore dorato del valore di 300 mo)","1 ora","c","DRWM","TCE","Evochi uno spirito fatato Furioso, Allegro o Ingannatore, con le statistiche dello Spirito Fatato del manuale (CA 12 + livello dell'incantesimo, PF 30 + 10 per livello sopra il 3°). Colpisce con una spada corta (2d6 + 3 + livello) e può teletrasportarsi con Passo Fatato ottenendo un effetto diverso in base alla forma. Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-shadowspawn","Summon Shadowspawn","Convocare Progenie d'Ombra",3,"evo","a","27 m","V, S, M (lacrime dentro una gemma del valore di 300 mo)","1 ora","c","WM","TCE","Evochi uno spirito d'ombra di Furia, Disperazione o Paura, con le statistiche della Progenie d'Ombra del manuale (CA 11 + livello dell'incantesimo, PF 35 + 15 per livello sopra il 3°). Attacca con Artigli Gelidi e può emettere un Urlo Terrificante che spaventa. Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-undead","Summon Undead","Convocare Non Morto",3,"nec","a","27 m","V, S, M (un teschio dorato del valore di 300 mo)","1 ora","c","WM","TCE","Evochi uno spirito non morto Spettrale, Putrido o Scheletrico, con le statistiche dello Spirito Non Morto del manuale (CA 11 + livello dell'incantesimo, PF 30 + 10 per livello sopra il 3°). Ogni forma ha attacchi diversi (tocco che spaventa, aura avvelenante, dardo di ossa a distanza). Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-aberration","Summon Aberration","Convocare Aberrazione",4,"evo","a","27 m","V, S, M (un tentacolo sotto sale e un bulbo oculare in una fiala di platino del valore di 400 mo)","1 ora","c","WM","TCE","Evochi uno spirito aberrante Osservatore, Slaad o Progenie Stellare, con le statistiche dello Spirito Aberrante del manuale (CA 11 + livello dell'incantesimo, PF 40 + 10 per livello sopra il 4°). Ogni forma ha poteri diversi (raggio psichico, artigli rigeneranti, aura di sussurri). Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-construct","Summon Construct","Convocare Costrutto",4,"evo","a","27 m","V, S, M (una scatola decorata di pietra e metallo del valore di 400 mo)","1 ora","c","AM","TCE","Evochi uno spirito di costrutto di Argilla, Metallo o Pietra, con le statistiche dello Spirito del Costrutto del manuale (CA 13 + livello dell'incantesimo, PF 40 + 15 per livello sopra il 4°). Ogni forma reagisce in modo diverso quando viene colpita (danni da fuoco, rallentamento, ritorsione). Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-elemental","Summon Elemental","Convocare Elementale",4,"evo","a","27 m","V, S, M (aria, un sassolino, cenere e acqua in una fiala intarsiata d'oro del valore di 400 mo)","1 ora","c","DRWM","TCE","Evochi uno spirito elementale di Aria, Terra, Fuoco o Acqua, con le statistiche dello Spirito Elementale del manuale (CA 11 + livello dell'incantesimo, PF 50 + 10 per livello sopra il 4°). Colpisce con uno Schianto (1d10 + 4 + livello) e ogni forma ha un tratto speciale. Obbedisce ai tuoi comandi verbali.","Usi il liv
