lse-life"],[3,"gentle-repose"],[3,"ray-of-enfeeblement"],[5,"revivify"],[5,"vampiric-touch"],[7,"blight"],[7,"death-ward"],[9,"antilife-shell"],[9,"raise-dead"]]}},{"k":"order","n":"Dominio dell'Ordine","src":"TCE","f":[{"id":"chr-order-1-competenze-bonus","l":1,"n":"Competenze Bonus","x":"Ottieni competenza con armature pesanti e in Intimidire o Persuasione."},{"id":"chr-order-1-voce-dellautorit","l":1,"n":"Voce dell'Autorità","x":"Quando lanci un incantesimo di 1° livello o superiore su un alleato, questo può usare la reazione per fare un attacco con arma."},{"id":"chr-order-2-incanalare-divinit-richiesta-dordine","l":2,"n":"Incanalare Divinità: Richiesta d'Ordine","x":"Con un'azione le creature a tua scelta entro 9 m devono superare un TS su Saggezza o restare affascinate fino al tuo prossimo turno e lasciar cadere ciò che tengono."},{"id":"chr-order-6-incarnazione-della-legge","l":6,"n":"Incarnazione della Legge","x":"Puoi lanciare incantesimi di ammaliamento di 1° livello o superiore con un'azione bonus invece di un'azione. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"chr-order-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni psichici extra (2d8 al 14° livello)."},{"id":"chr-order-17-ira-dellordine","l":17,"n":"Ira dell'Ordine","x":"Quando infliggi danni con Colpo Divino, maledici il bersaglio: il prossimo alleato che lo colpisce infligge 2d8 danni psichici extra."}],"spells":{"mode":"always","g":[[1,"command"],[1,"heroism"],[3,"hold-person"],[3,"zone-of-truth"],[5,"mass-healing-word"],[5,"slow"],[7,"compulsion"],[7,"locate-creature"],[9,"commune"],[9,"dominate-person"]]}},{"k":"peace","n":"Dominio della Pace","src":"TCE","f":[{"id":"chr-peace-1-strumento-di-pace","l":1,"n":"Strumento di Pace","x":"Ottieni competenza in Intuizione, Intrattenere o Persuasione."},{"id":"chr-peace-1-legame-incoraggiante","l":1,"n":"Legame Incoraggiante","x":"Con un'azione leghi fino a tante creature quanto la tua competenza per 10 minuti: una volta per turno, quando sono entro 9 m l'una dall'altra, aggiungono 1d4 a un tiro per colpire, una prova o un TS. Usi pari alla competenza per riposo lungo."},{"id":"chr-peace-2-incanalare-divinit-balsamo-di-pace","l":2,"n":"Incanalare Divinità: Balsamo di Pace","x":"Con un'azione ti muovi senza provocare attacchi di opportunità e curi 2d6 + mod. di Saggezza ogni creatura entro 1,5 m lungo il percorso."},{"id":"chr-peace-6-legame-protettivo","l":6,"n":"Legame Protettivo","x":"Quando una creatura legata sta per subire danni, un'altra creatura legata entro 9 m può teletrasportarsi vicino a lei e subire i danni al suo posto."},{"id":"chr-peace-8-incantesimi-potenti","l":8,"n":"Incantesimi Potenti","x":"Aggiungi il mod. di Saggezza ai danni dei trucchetti da chierico."},{"id":"chr-peace-17-legame-espansivo","l":17,"n":"Legame Espansivo","x":"I benefici del legame funzionano entro 18 m, e chi subisce danni al posto di un altro ha resistenza."}],"spells":{"mode":"always","g":[[1,"heroism"],[1,"sanctuary"],[3,"aid"],[3,"warding-bond"],[5,"beacon-of-hope"],[5,"sending"],[7,"aura-of-purity"],[7,"otilukes-resilient-sphere"],[9,"greater-restoration"],[9,"rarys-telepathic-bond"]]}},{"k":"twilight","n":"Dominio del Crepuscolo","src":"TCE","f":[{"id":"chr-twilight-1-competenze-bonus","l":1,"n":"Competenze Bonus","x":"Ottieni competenza con armi da guerra e armature pesanti."},{"id":"chr-twilight-1-occhi-della-notte","l":1,"n":"Occhi della Notte","x":"Hai scurovisione entro 90 m e con un'azione puoi condividerla con alleati per 1 ora."},{"id":"chr-twilight-1-benedizione-vigile","l":1,"n":"Benedizione Vigile","x":"Con un'azione dai a una creatura vantaggio al suo prossimo tiro di iniziativa."},{"id":"chr-twilight-2-incanalare-divinit-santuario-del-crepuscolo","l":2,"n":"Incanalare Divinità: Santuario del Crepuscolo","x":"Con un'azione crei una sfera di penombra di 9 m che dura 1 minuto: chi vi termina il turno ottiene 1d6 + livello da chierico PF temporanei oppure si libera da charme o paura."},{"id":"chr-twilight-6-passo-del-crepuscolo","l":6,"n":"Passo del Crepuscolo","x":"In luce fioca o oscurità ottieni una velocità di volo pari alla tua velocità base."},{"id":"chr-twilight-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni radiosi extra (2d8 al 14° livello)."},{"id":"chr-twilight-17-sudario-del-crepuscolo","l":17,"n":"Sudario del Crepuscolo","x":"Tu e gli alleati nel Santuario del Crepuscolo avete copertura parziale."}],"spells":{"mode":"always","g":[[1,"faerie-fire"],[1,"sleep"],[3,"moonbeam"],[3,"see-invisibility"],[5,"aura-of-vitality"],[5,"leomunds-tiny-hut"],[7,"aura-of-life"],[7,"greater-invisibility"],[9,"circle-of-power"],[9,"mislead"]]}}]},{"k":"dru","n":"Druido","src":"PHB","hd":"d8","subLabel":"Circolo Druidico","subLvl":2,"list":"D","f":[{"id":"dru-1-druidico","l":1,"n":"Druidico","x":"Conosci il druidico, la lingua segreta dei druidi, e puoi lasciarvi messaggi nascosti."},{"id":"dru-1-incantesimi","l":1,"n":"Incantesimi","x":"Sei un incantatore completo che usa la Saggezza. Ogni giorno prepari incantesimi dalla lista del druido pari a mod. di Saggezza + livello, e usi un focus druidico. Non indossi armature né scudi di metallo."},{"id":"dru-2-forma-selvatica","l":2,"n":"Forma Selvatica","x":"Con un'azione assumi la forma di una bestia che hai visto: GS 1/4 senza velocità di nuoto o volo; GS 1/2 senza volo al 4° livello; GS 1 all'8°. Dura ore pari a metà del livello; quando la forma scende a 0 PF torni normale e l'eccesso di danni si riporta. Due usi per riposo breve o lungo."},{"id":"dru-2-compagno-selvatico","l":2,"n":"Compagno Selvatico","x":"Opzionale (Tasha): con un'azione spendi un uso di Forma Selvatica per lanciare Trova Famiglio senza componenti materiali; il famiglio è un folletto e dura ore pari a metà del livello.","opt":1},{"id":"dru-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"dru-4-versatilit-dei-trucchetti","l":4,"n":"Versatilità dei Trucchetti","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi sostituire un trucchetto con un altro della lista del druido.","opt":1},{"id":"dru-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"dru-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"dru-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"dru-18-corpo-senza-tempo","l":18,"n":"Corpo Senza Tempo","x":"Invecchi un anno ogni dieci."},{"id":"dru-18-incantesimi-bestiali","l":18,"n":"Incantesimi Bestiali","x":"Puoi lanciare molti incantesimi da druido in Forma Selvatica, eseguendo componenti verbali e somatiche (non quelle materiali)."},{"id":"dru-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"dru-20-arcidruido","l":20,"n":"Arcidruido","x":"Puoi usare Forma Selvatica un numero illimitato di volte e ignori le componenti verbali, somatiche e materiali senza costo dei tuoi incantesimi da druido."}],"subs":[{"k":"land","n":"Circolo della Terra","src":"PHB","f":[{"id":"dru-land-2-trucchetto-bonus","l":2,"n":"Trucchetto Bonus","x":"Impari un trucchetto da druido aggiuntivo."},{"id":"dru-land-2-recupero-naturale","l":2,"n":"Recupero Naturale","x":"Durante un riposo breve recuperi slot con livello combinato fino a metà del tuo livello da druido (nessuno di 6° o superiore). Una volta per riposo lungo."},{"id":"dru-land-3-incantesimi-del-circolo","l":3,"n":"Incantesimi del Circolo","x":"Scegli un terreno (artico, costa, deserto, foresta, prateria, montagna, palude, Underdark): ottieni i suoi incantesimi sempre preparati al 3°, 5°, 7° e 9° livello (vedi la tabella del manuale e segnali come «Sempre preparato»)."},{"id":"dru-land-6-passo-sulla-terra","l":6,"n":"Passo sulla Terra","x":"Il terreno difficile non magico non ti rallenta e le piante non magiche non ti danneggiano; hai vantaggio ai TS contro le piante magiche."},{"id":"dru-land-10-guardiano-della-natura","l":10,"n":"Guardiano della Natura","x":"Non puoi essere affascinato né spaventato da elementali o folletti e sei immune a veleno e malattie."},{"id":"dru-land-14-santuario-della-natura","l":14,"n":"Santuario della Natura","x":"Bestie e creature vegetali devono superare un TS su Saggezza per attaccarti; se falliscono devono scegliere un altro bersaglio."}],"spells":null},{"k":"moon","n":"Circolo della Luna","src":"PHB","f":[{"id":"dru-moon-2-forma-selvatica-da-combattimento","l":2,"n":"Forma Selvatica da Combattimento","x":"Usi Forma Selvatica con un'azione bonus. In forma selvatica puoi spendere uno slot con un'azione bonus per recuperare 1d8 PF per livello dello slot."},{"id":"dru-moon-2-forme-del-circolo","l":2,"n":"Forme del Circolo","x":"Puoi trasformarti in bestie di GS 1 (senza volo né nuoto limitati come da tabella); dal 6° livello il GS massimo è pari a un terzo del tuo livello da druido."},{"id":"dru-moon-6-colpo-primordiale","l":6,"n":"Colpo Primordiale","x":"In forma bestiale i tuoi attacchi contano come magici."},{"id":"dru-moon-10-forma-selvatica-elementale","l":10,"n":"Forma Selvatica Elementale","x":"Spendendo due usi di Forma Selvatica ti trasformi in un elementale dell'aria, della terra, del fuoco o dell'acqua."},{"id":"dru-moon-14-mille-forme","l":14,"n":"Mille Forme","x":"Puoi lanciare Alterare Se Stessi a volontà."}],"spells":null},{"k":"dreams","n":"Circolo dei Sogni","src":"XGE","f":[{"id":"dru-dreams-2-balsamo-della-corte-destate","l":2,"n":"Balsamo della Corte d'Estate","x":"Hai una riserva di d6 pari al tuo livello da druido: con un'azione bonus ne spendi fino a metà del livello per curare una creatura entro 36 m, che ottiene anche 1 PF temporaneo per dado. Si ricarica con un riposo lungo."},{"id":"dru-dreams-6-focolare-di-luna-e-ombra","l":6,"n":"Focolare di Luna e Ombra","x":"Durante un riposo crei un'area protetta di 9 m: tu e gli alleati avete +5 a Furtività e Percezione e la luce di un fuoco non si vede da fuori."},{"id":"dru-dreams-10-sentieri-nascosti","l":10,"n":"Sentieri Nascosti","x":"Con un'azione bonus ti teletrasporti fino a 18 m, oppure con un'azione teletrasporti una creatura consenziente entro 1,5 m fino a 9 m. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"dru-dreams-14-viandante-nei-sogni","l":14,"n":"Viandante nei Sogni","x":"Alla fine di un riposo breve puoi lanciare senza slot Sogno, Chiaroveggenza, Scrutare o Spostamento Planare (con limitazioni). Una volta per riposo lungo."}],"spells":null},{"k":"shepherd","n":"Circolo del Pastore","src":"XGE","f":[{"id":"dru-shepherd-2-lingua-dei-boschi","l":2,"n":"Lingua dei Boschi","x":"Parli il silvano e comprendi le bestie, che ti capiscono."},{"id":"dru-shepherd-2-totem-spirituale","l":2,"n":"Totem Spirituale","x":"Con un'azione bonus evochi uno spirito totem per 1 minuto in un'area di 9 m. Orso: 5 + livello PF temporanei agli alleati e vantaggio alle prove e ai TS su Forza. Falco: reazione per dare vantaggio a un attacco. Unicorno: vantaggio a individuare creature e le tue cure curano anche chi è nell'area. Una volta per riposo breve o lungo."},{"id":"dru-shepherd-6-evocatore-possente","l":6,"n":"Evocatore Possente","x":"Le bestie e i folletti che evochi hanno 2 PF extra per Dado Vita e attacchi magici."},{"id":"dru-shepherd-10-spirito-guardiano","l":10,"n":"Spirito Guardiano","x":"Le creature evocate che terminano il turno nell'area del tuo totem recuperano PF pari a metà del tuo livello da druido."},{"id":"dru-shepherd-14-evocazioni-fedeli","l":14,"n":"Evocazioni Fedeli","x":"Quando scendi a 0 PF o sei incapacitato contro la tua volontà, lanci gratis Evocare Animali di 9° livello per proteggerti. Una volta per riposo lungo."}],"spells":null},{"k":"spores","n":"Circolo delle Spore","src":"TCE","f":[{"id":"dru-spores-2-alone-di-spore","l":2,"n":"Alone di Spore","x":"Quando una creatura che vedi si muove entro 3 m da te o vi inizia il turno, con la reazione le infliggi 1d4 danni necrotici (TS su Costituzione). Il danno cresce: 1d6 al 6° livello, 1d8 al 10°, 1d10 al 14°."},{"id":"dru-spores-2-simbiosi","l":2,"n":"Simbiosi","x":"Con un'azione spendi un uso di Forma Selvatica: ottieni 4 PF temporanei per livello da druido, l'Alone di Spore raddoppia i dadi e i tuoi attacchi in mischia infliggono 1d6 necrotici extra. Dura 10 minuti o finché hai i PF temporanei."},{"id":"dru-spores-6-infestazione-fungina","l":6,"n":"Infestazione Fungina","x":"Quando una bestia o un umanoide Piccolo o Medio muore entro 3 m, con la reazione lo rianimi come zombi per 1 ora. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"dru-spores-10-diffusione-delle-spore","l":10,"n":"Diffusione delle Spore","x":"In Simbiosi, con un'azione bonus scagli le spore in un cubo di 3 m entro 9 m, che infligge danni come l'alone per 1 minuto."},{"id":"dru-spores-14-corpo-fungino","l":14,"n":"Corpo Fungino","x":"Non puoi essere accecato, assordato, spaventato o avvelenato, e i colpi critici contro di te contano come colpi normali."}],"spells":{"mode":"always","g":[[2,"chill-touch"],[3,"blindness-deafness"],[3,"gentle-repose"],[5,"animate-dead"],[5,"gaseous-form"],[7,"blight"],[7,"confusion"],[9,"cloudkill"],[9,"contagion"]]}},{"k":"stars","n":"Circolo delle Stelle","src":"TCE","f":[{"id":"dru-stars-2-mappa-stellare","l":2,"n":"Mappa Stellare","x":"Hai una mappa stellare come focus: conosci Guida e hai sempre preparato Dardo Tracciante, che puoi lanciare gratis un numero di volte pari alla competenza per riposo lungo."},{"id":"dru-stars-2-forma-stellata","l":2,"n":"Forma Stellata","x":"Con un'azione bonus spendi un uso di Forma Selvatica e assumi una forma luminosa per 10 minuti. Arciere: azione bonus per un attacco radioso (1d8 + Saggezza). Calice: quando curi con un incantesimo, tu o un'altra creatura recuperate 1d8 + Saggezza. Drago: nelle prove di Intelligenza e Saggezza e nei TS per la concentrazione un 9 o meno conta come 10."},{"id":"dru-stars-6-presagio-cosmico","l":6,"n":"Presagio Cosmico","x":"Dopo un riposo lungo tiri un dado: pari (Fortuna, +1d6 al tiro di un alleato) o dispari (Sventura, −1d6 al tiro di un nemico), da usare con la reazione. Usi pari alla competenza."},{"id":"dru-stars-10-costellazioni-scintillanti","l":10,"n":"Costellazioni Scintillanti","x":"I dadi della Forma Stellata diventano 2d8; il Drago ti dà una velocità di volo di 6 m; puoi cambiare costellazione all'inizio di ogni tuo turno."},{"id":"dru-stars-14-pieno-di-stelle","l":14,"n":"Pieno di Stelle","x":"In Forma Stellata hai resistenza ai danni contundenti, perforanti e taglienti."}],"spells":{"mode":"always","g":[[2,"guidance"],[2,"guiding-bolt"]]}},{"k":"wildfire","n":"Circolo del Fuoco Selvaggio","src":"TCE","f":[{"id":"dru-wildfire-2-evocare-spirito-del-fuoco-selvaggio","l":2,"n":"Evocare Spirito del Fuoco Selvaggio","x":"Con un'azione spendi un uso di Forma Selvatica per evocare uno spirito del fuoco selvaggio: quando compare, le creature entro 3 m devono superare un TS su Destrezza o subire 2d6 danni da fuoco. Agisce con la tua azione bonus: attacca o teletrasporta te e gli alleati."},{"id":"dru-wildfire-6-legame-rinforzato","l":6,"n":"Legame Rinforzato","x":"Quando lo spirito è evocato, i tuoi incantesimi che infliggono danni da fuoco o curano aggiungono 1d8 a un tiro."},{"id":"dru-wildfire-10-fiamme-cauterizzanti","l":10,"n":"Fiamme Cauterizzanti","x":"Quando una creatura Piccola o più grande muore entro 9 m dallo spirito, compare una fiamma spettrale: con la reazione puoi usarla per curare o infliggere 2d10 + Saggezza a chi entra nel suo spazio. Usi pari alla competenza per riposo lungo."},{"id":"dru-wildfire-14-rinascita-infuocata","l":14,"n":"Rinascita Infuocata","x":"Se scendi a 0 PF mentre lo spirito è vicino, puoi congedarlo: torni a metà dei PF e le creature vicine subiscono 2d10 + Saggezza danni da fuoco. Una volta per riposo lungo."}],"spells":{"mode":"always","g":[[2,"burning-hands"],[2,"cure-wounds"],[3,"flaming-sphere"],[3,"scorching-ray"],[5,"plant-growth"],[5,"revivify"],[7,"aura-of-life"],[7,"fire-shield"],[9,"flame-strike"],[9,"mass-cure-wounds"]]}}]},{"k":"gue","n":"Guerriero","src":"PHB","hd":"d10","subLabel":"Archetipo Marziale","subLvl":3,"list":"","f":[{"id":"gue-1-stile-di-combattimento","l":1,"n":"Stile di Combattimento","x":"Scegli una specializzazione: Arciere (+2 agli attacchi a distanza), Difesa (+1 CA con armatura), Duellare (+2 ai danni con un'arma in una mano), Combattere con Armi Possenti (ritiri 1 e 2 ai danni), Protezione (reazione per imporre svantaggio), Combattere con Due Armi (aggiungi la caratteristica al secondo attacco). Tasha aggiunge Combattimento alla Cieca, Tecnica Superiore, Lotta senz'Armi, Intercettazione e Combattere con Armi da Lancio."},{"id":"gue-1-recuperare-energie","l":1,"n":"Recuperare Energie","x":"Con un'azione bonus recuperi 1d10 + livello da guerriero PF. Una volta per riposo breve o lungo."},{"id":"gue-2-azione-impetuosa","l":2,"n":"Azione Impetuosa","x":"Nel tuo turno puoi effettuare un'azione aggiuntiva. Una volta per riposo breve o lungo (due volte, ma una per turno, dal 17° livello)."},{"id":"gue-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Il guerriero lo ottiene al 4°, 6°, 8°, 12°, 14°, 16° e 19° livello."},{"id":"gue-4-versatilit-marziale","l":4,"n":"Versatilità Marziale","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi cambiare stile di combattimento o una manovra.","opt":1},{"id":"gue-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco attacchi due volte (tre all'11° livello, quattro al 20°)."},{"id":"gue-6-aumento-dei-punteggi-di-caratteristica","l":6,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"gue-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"gue-9-indomito","l":9,"n":"Indomito","x":"Puoi ritirare un TS fallito e devi usare il nuovo risultato. Una volta per riposo lungo (due al 13°, tre al 17°)."},{"id":"gue-11-attacco-extra-2","l":11,"n":"Attacco Extra (2)","x":"Con l'azione di Attacco attacchi tre volte."},{"id":"gue-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"gue-14-aumento-dei-punteggi-di-caratteristica","l":14,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"gue-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"gue-17-azione-impetuosa-2-usi","l":17,"n":"Azione Impetuosa (2 usi)","x":"Puoi usare Azione Impetuosa due volte prima di un riposo, ma una sola volta per turno."},{"id":"gue-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"gue-20-attacco-extra-3","l":20,"n":"Attacco Extra (3)","x":"Con l'azione di Attacco attacchi quattro volte."}],"subs":[{"k":"champion","n":"Campione","src":"PHB","f":[{"id":"gue-champion-3-critico-migliorato","l":3,"n":"Critico Migliorato","x":"I tuoi attacchi con arma mettono a segno un critico con un 19 o 20."},{"id":"gue-champion-7-atleta-straordinario","l":7,"n":"Atleta Straordinario","x":"Aggiungi metà della competenza alle prove di Forza, Destrezza e Costituzione in cui non sei competente; il salto in lungo con rincorsa aumenta."},{"id":"gue-champion-10-stile-di-combattimento-aggiuntivo","l":10,"n":"Stile di Combattimento Aggiuntivo","x":"Scegli un secondo stile di combattimento."},{"id":"gue-champion-15-critico-superiore","l":15,"n":"Critico Superiore","x":"Metti a segno un critico con un 18, 19 o 20."},{"id":"gue-champion-18-sopravvissuto","l":18,"n":"Sopravvissuto","x":"All'inizio di ogni tuo turno, se hai meno di metà PF ma almeno 1, recuperi 5 + mod. di Costituzione PF."}],"spells":null},{"k":"battlemaster","n":"Maestro di Battaglia","src":"PHB","f":[{"id":"gue-battlemaster-3-superiorit-in-combattimento","l":3,"n":"Superiorità in Combattimento","x":"Conosci tre manovre (Parata, Attacco Minaccioso, Spinta, Disarmare, Finta, Colpo Preciso, Riposizionamento e altre) e hai quattro dadi di superiorità d8, recuperati con un riposo breve. Più manovre al 7°, 10° e 15° livello; un dado in più al 7° e al 15°. CD delle manovre: 8 + competenza + mod. di Forza o Destrezza."},{"id":"gue-battlemaster-3-studioso-della-guerra","l":3,"n":"Studioso della Guerra","x":"Ottieni competenza con un tipo di strumenti da artigiano."},{"id":"gue-battlemaster-7-conosci-il-tuo-nemico","l":7,"n":"Conosci il Tuo Nemico","x":"Osservando una creatura per 1 minuto scopri se è superiore, pari o inferiore a te in due caratteristiche a scelta (Forza, CA, PF, livello…)."},{"id":"gue-battlemaster-10-superiorit-migliorata","l":10,"n":"Superiorità Migliorata","x":"I dadi di superiorità diventano d10 (d12 al 18° livello)."},{"id":"gue-battlemaster-15-implacabile","l":15,"n":"Implacabile","x":"Quando tiri l'iniziativa senza dadi di superiorità, ne recuperi uno."}],"spells":null},{"k":"eldritch","n":"Cavaliere Mistico","src":"PHB","f":[{"id":"gue-eldritch-3-incantesimi","l":3,"n":"Incantesimi","x":"Impari incantesimi da mago, soprattutto di abiurazione e invocazione, usando l'Intelligenza. Sei un incantatore per un terzo: 2 trucchetti (3 al 10°), incantesimi conosciuti e slot secondo la tabella del Cavaliere Mistico."},{"id":"gue-eldritch-3-legame-con-larma","l":3,"n":"Legame con l'Arma","x":"Con un rituale di 1 ora leghi fino a due armi: non puoi essere disarmato e puoi richiamarle in mano con un'azione bonus."},{"id":"gue-eldritch-7-magia-da-guerra","l":7,"n":"Magia da Guerra","x":"Quando usi l'azione per lanciare un trucchetto, puoi fare un attacco con arma con un'azione bonus."},{"id":"gue-eldritch-10-colpo-occulto","l":10,"n":"Colpo Occulto","x":"Quando colpisci una creatura con un'arma, ha svantaggio al prossimo TS contro un tuo incantesimo fino alla fine del tuo prossimo turno."},{"id":"gue-eldritch-15-carica-arcana","l":15,"n":"Carica Arcana","x":"Quando usi Azione Impetuosa puoi teletrasportarti fino a 9 m."},{"id":"gue-eldritch-18-magia-da-guerra-migliorata","l":18,"n":"Magia da Guerra Migliorata","x":"Quando usi l'azione per lanciare un incantesimo, puoi fare un attacco con arma con un'azione bonus."}],"spells":null},{"k":"arcanearcher","n":"Arciere Arcano","src":"XGE","f":[{"id":"gue-arcanearcher-3-conoscenze-dellarciere-arcano","l":3,"n":"Conoscenze dell'Arciere Arcano","x":"Impari Prestidigitazione o Artificio Druidico e ottieni competenza in Arcano o Natura."},{"id":"gue-arcanearcher-3-colpo-arcano","l":3,"n":"Colpo Arcano","x":"Conosci due opzioni di colpo arcano (Freccia Esiliante, Accecante, Ammaliante, Cercante, d'Ombra, Esplosiva, Indebolente, Avvolgente). Una volta per turno, quando colpisci con un arco, ne applichi una. Due usi per riposo breve; nuove opzioni al 7°, 10°, 15° e 18° livello."},{"id":"gue-arcanearcher-7-freccia-magica","l":7,"n":"Freccia Magica","x":"Le frecce che scagli con un arco contano come magiche."},{"id":"gue-arcanearcher-7-colpo-curvo","l":7,"n":"Colpo Curvo","x":"Quando manchi con una freccia magica, con un'azione bonus ritiri l'attacco contro un altro bersaglio entro 18 m."},{"id":"gue-arcanearcher-15-colpo-sempre-pronto","l":15,"n":"Colpo Sempre Pronto","x":"Quando tiri l'iniziativa senza usi di Colpo Arcano, ne recuperi uno."},{"id":"gue-arcanearcher-18-colpo-arcano-potenziato","l":18,"n":"Colpo Arcano Potenziato","x":"I danni delle opzioni di Colpo Arcano aumentano."}],"spells":null},{"k":"cavalier","n":"Cavaliere","src":"XGE","f":[{"id":"gue-cavalier-3-competenza-bonus","l":3,"n":"Competenza Bonus","x":"Ottieni competenza in un'abilità a scelta tra Addestrare Animali, Intuizione, Persuasione, Storia e Religione, oppure in una lingua."},{"id":"gue-cavalier-3-nato-in-sella","l":3,"n":"Nato in Sella","x":"Hai vantaggio a non cadere dalla cavalcatura, atterri in piedi e salire o scendere costa solo 1,5 m."},{"id":"gue-cavalier-3-marchio-incrollabile","l":3,"n":"Marchio Incrollabile","x":"Quando colpisci una creatura la marchi: ha svantaggio ad attaccare altri se sei entro 1,5 m, e se lo fa puoi fare un attacco speciale con un'azione bonus con danni extra pari a metà del livello. Usi pari al mod. di Forza."},{"id":"gue-cavalier-7-manovra-protettiva","l":7,"n":"Manovra Protettiva","x":"Con la reazione aggiungi 1d8 alla CA o al TS di un alleato entro 1,5 m. Usi pari al mod. di Forza."},{"id":"gue-cavalier-10-tenere-la-linea","l":10,"n":"Tenere la Linea","x":"Le creature provocano attacchi di opportunità anche muovendosi vicino a te, e se colpite hanno velocità 0."},{"id":"gue-cavalier-15-carica-feroce","l":15,"n":"Carica Feroce","x":"Se ti muovi di almeno 3 m in linea retta e colpisci, il bersaglio deve superare un TS su Forza o cadere prono."},{"id":"gue-cavalier-18-difensore-vigile","l":18,"n":"Difensore Vigile","x":"Hai una reazione speciale extra per gli attacchi di opportunità in ogni turno."}],"spells":null},{"k":"samurai","n":"Samurai","src":"XGE","f":[{"id":"gue-samurai-3-competenza-bonus","l":3,"n":"Competenza Bonus","x":"Ottieni competenza in un'abilità a scelta tra Storia, Intuizione, Intrattenere e Persuasione, oppure in una lingua."},{"id":"gue-samurai-3-spirito-combattivo","l":3,"n":"Spirito Combattivo","x":"Con un'azione bonus hai vantaggio agli attacchi con arma fino alla fine del turno e ottieni 5 PF temporanei (10 al 10° livello, 15 al 15°). Tre usi per riposo lungo."},{"id":"gue-samurai-7-cortigiano-elegante","l":7,"n":"Cortigiano Elegante","x":"Aggiungi il mod. di Saggezza alle prove di Persuasione e ottieni competenza nei TS su Saggezza (o Intelligenza o Carisma, se l'avevi già)."},{"id":"gue-samurai-10-spirito-instancabile","l":10,"n":"Spirito Instancabile","x":"Quando tiri l'iniziativa senza usi di Spirito Combattivo, ne recuperi uno."},{"id":"gue-samurai-15-colpo-rapido","l":15,"n":"Colpo Rapido","x":"Se hai vantaggio a un attacco, puoi rinunciarvi per fare un attacco extra."},{"id":"gue-samurai-18-forza-prima-della-morte","l":18,"n":"Forza Prima della Morte","x":"Quando scendi a 0 PF senza morire, con la reazione ottieni subito un turno extra. Una volta per riposo lungo."}],"spells":null},{"k":"psiwarrior","n":"Guerriero Psionico","src":"TCE","f":[{"id":"gue-psiwarrior-3-potere-psionico","l":3,"n":"Potere Psionico","x":"Hai dadi di energia psionica pari al doppio della competenza (d6; d8 al 5° livello, d10 all'11°, d12 al 17°). Campo Protettivo: reazione per ridurre i danni a una creatura vicina. Colpo Psionico: danni da forza extra quando colpisci. Movimento Telecinetico: sposti un oggetto o una creatura consenziente. Un dado si recupera con un riposo breve, tutti con un lungo."},{"id":"gue-psiwarrior-7-adepto-telecinetico","l":7,"n":"Adepto Telecinetico","x":"Balzo Psionico: velocità di volo per un turno. Spinta Telecinetica: dopo un Colpo Psionico il bersaglio può essere spinto o fatto cadere prono."},{"id":"gue-psiwarrior-10-mente-protetta","l":10,"n":"Mente Protetta","x":"Hai resistenza ai danni psichici e puoi spendere un dado per porre fine a charme o paura."},{"id":"gue-psiwarrior-15-baluardo-di-forza","l":15,"n":"Baluardo di Forza","x":"Con un'azione bonus dai copertura parziale a te e ad alleati entro 9 m per 1 minuto."},{"id":"gue-psiwarrior-18-maestro-telecinetico","l":18,"n":"Maestro Telecinetico","x":"Puoi lanciare Telecinesi senza componenti; mentre ti concentri, con un'azione bonus fai un attacco con arma."}],"spells":null},{"k":"runeknight","n":"Cavaliere delle Rune","src":"TCE","f":[{"id":"gue-runeknight-3-competenze-bonus","l":3,"n":"Competenze Bonus","x":"Ottieni competenza con gli strumenti da fabbro e impari il gigante."},{"id":"gue-runeknight-3-intaglio-delle-rune","l":3,"n":"Intaglio delle Rune","x":"Conosci due rune (Nuvola, Fuoco, Gelo, Pietra, Collina, Tempesta) da incidere sull'equipaggiamento: danno un beneficio passivo e un effetto attivabile una volta per riposo breve. Nuove rune al 7°, 10° e 15° livello."},{"id":"gue-runeknight-3-potere-del-gigante","l":3,"n":"Potere del Gigante","x":"Con un'azione bonus diventi Grande per 1 minuto: vantaggio alle prove e ai TS su Forza e +1d6 danni una volta per turno. Usi pari alla competenza per riposo lungo."},{"id":"gue-runeknight-7-scudo-runico","l":7,"n":"Scudo Runico","x":"Quando una creatura entro 18 m viene colpita, con la reazione costringi l'attaccante a ritirare il dado. Usi pari alla competenza."},{"id":"gue-runeknight-10-grande-statura","l":10,"n":"Grande Statura","x":"Cresci di 3d4 pollici; il dado del Potere del Gigante diventa d8."},{"id":"gue-runeknight-15-maestro-delle-rune","l":15,"n":"Maestro delle Rune","x":"Puoi usare ogni runa due volte per riposo e cambiarne l'incisione."},{"id":"gue-runeknight-18-giudice-runico","l":18,"n":"Giudice Runico","x":"Con il Potere del Gigante puoi diventare Enorme, con portata extra e dado d10."}],"spells":null}]},{"k":"lad","n":"Ladro","src":"PHB","hd":"d8","subLabel":"Archetipo Ladresco","subLvl":3,"list":"","f":[{"id":"lad-1-maestria","l":1,"n":"Maestria","x":"Scegli due abilità in cui sei competente (o una abilità e gli strumenti da scasso): raddoppi il bonus di competenza. Altre due al 6° livello."},{"id":"lad-1-attacco-furtivo","l":1,"n":"Attacco Furtivo","x":"Una volta per turno infliggi danni extra (1d6, +1d6 ogni due livelli: 10d6 al 19°) a una creatura che colpisci con un'arma accurata o a distanza, se hai vantaggio oppure un altro nemico del bersaglio è entro 1,5 m da esso e tu non hai svantaggio."},{"id":"lad-1-gergo-ladresco","l":1,"n":"Gergo Ladresco","x":"Conosci il linguaggio segreto dei ladri: parole in codice e segni nascosti."},{"id":"lad-2-azione-scaltra","l":2,"n":"Azione Scaltra","x":"Puoi effettuare Scatto, Disimpegno o Nascondersi con un'azione bonus."},{"id":"lad-3-mira-precisa","l":3,"n":"Mira Precisa","x":"Opzionale (Tasha): con un'azione bonus, se non ti sei mosso, hai vantaggio al prossimo attacco del turno; la tua velocità diventa 0 fino alla fine del turno.","opt":1},{"id":"lad-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Il ladro lo ottiene al 4°, 8°, 10°, 12°, 16° e 19° livello."},{"id":"lad-5-schivata-prodigiosa","l":5,"n":"Schivata Prodigiosa","x":"Quando un attaccante che vedi ti colpisce, con la reazione dimezzi i danni."},{"id":"lad-6-maestria","l":6,"n":"Maestria","x":"Scegli altre due abilità in cui raddoppiare il bonus di competenza."},{"id":"lad-7-elusione","l":7,"n":"Elusione","x":"Nei TS su Destrezza per dimezzare i danni, se lo superi non subisci danni e se lo fallisci ne subisci metà."},{"id":"lad-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"lad-10-aumento-dei-punteggi-di-caratteristica","l":10,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"lad-11-talento-affidabile","l":11,"n":"Talento Affidabile","x":"Nelle prove di caratteristica in cui sei competente, un 9 o meno sul d20 conta come 10."},{"id":"lad-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"lad-14-percezione-cieca","l":14,"n":"Percezione Cieca","x":"Se senti, conosci la posizione delle creature nascoste o invisibili entro 3 m."},{"id":"lad-15-mente-sfuggente","l":15,"n":"Mente Sfuggente","x":"Ottieni competenza nei TS su Saggezza."},{"id":"lad-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"lad-18-inafferrabile","l":18,"n":"Inafferrabile","x":"Nessun tiro per colpire ha vantaggio contro di te finché non sei incapacitato."},{"id":"lad-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"lad-20-colpo-di-fortuna","l":20,"n":"Colpo di Fortuna","x":"Trasformi un attacco mancato in un colpo, oppure una prova fallita in un 20 naturale. Una volta per riposo breve o lungo."}],"subs":[{"k":"thief","n":"Furfante","src":"PHB","f":[{"id":"lad-thief-3-mani-veloci","l":3,"n":"Mani Veloci","x":"Con l'azione bonus di Azione Scaltra puoi fare prove di Rapidità di Mano, usare strumenti da scasso o l'azione Usare un Oggetto."},{"id":"lad-thief-3-arrampicatore","l":3,"n":"Arrampicatore","x":"Scalare non ti costa movimento extra e il salto in lungo con rincorsa aumenta di metri pari al mod. di Destrezza × 0,3."},{"id":"lad-thief-9-furtivit-suprema","l":9,"n":"Furtività Suprema","x":"Hai vantaggio alle prove di Furtività se non ti muovi più di metà della tua velocità nel turno."},{"id":"lad-thief-13-usare-oggetti-magici","l":13,"n":"Usare Oggetti Magici","x":"Ignori i requisiti di classe, specie e livello per usare gli oggetti magici."},{"id":"lad-thief-17-riflessi-da-ladro","l":17,"n":"Riflessi da Ladro","x":"Nel primo round di ogni combattimento hai due turni (il secondo con iniziativa −10)."}],"spells":null},{"k":"assassin","n":"Assassino","src":"PHB","f":[{"id":"lad-assassin-3-competenze-bonus","l":3,"n":"Competenze Bonus","x":"Ottieni competenza con l'equipaggiamento per il travestimento e la trousse da avvelenatore."},{"id":"lad-assassin-3-assassinare","l":3,"n":"Assassinare","x":"Hai vantaggio agli attacchi contro chi non ha ancora agito nel combattimento, e ogni colpo contro una creatura sorpresa è un critico."},{"id":"lad-assassin-9-esperto-dinfiltrazione","l":9,"n":"Esperto d'Infiltrazione","x":"Crei identità false complete, con documenti e conoscenze."},{"id":"lad-assassin-13-impostore","l":13,"n":"Impostore","x":"Dopo 3 ore di studio imiti perfettamente voce, scrittura e modi di fare di una persona."},{"id":"lad-assassin-17-colpo-mortale","l":17,"n":"Colpo Mortale","x":"Quando colpisci una creatura sorpresa, deve superare un TS su Costituzione o subire danni raddoppiati."}],"spells":null},{"k":"arcanetrickster","n":"Mistificatore Arcano","src":"PHB","f":[{"id":"lad-arcanetrickster-3-incantesimi","l":3,"n":"Incantesimi","x":"Impari incantesimi da mago, soprattutto di ammaliamento e illusione, usando l'Intelligenza. Sei un incantatore per un terzo: Mano Magica più 2 trucchetti (3 al 10°), incantesimi conosciuti e slot secondo la tabella del Mistificatore Arcano."},{"id":"lad-arcanetrickster-3-mano-magica-mistificatrice","l":3,"n":"Mano Magica Mistificatrice","x":"La tua Mano Magica è invisibile e può riporre o prendere oggetti da altre creature, aprire serrature e disinnescare trappole a distanza; la controlli con l'azione bonus di Azione Scaltra."},{"id":"lad-arcanetrickster-9-imboscata-magica","l":9,"n":"Imboscata Magica","x":"Se sei nascosto quando lanci un incantesimo, il bersaglio ha svantaggio ai TS contro di esso."},{"id":"lad-arcanetrickster-13-mistificatore-versatile","l":13,"n":"Mistificatore Versatile","x":"Con un'azione bonus usi la Mano Magica per distrarre una creatura entro 1,5 m da essa: hai vantaggio agli attacchi contro di lei nel turno."},{"id":"lad-arcanetrickster-17-ladro-di-incantesimi","l":17,"n":"Ladro di Incantesimi","x":"Quando una creatura ti bersaglia con un incantesimo, con la reazione puoi costringerla a un TS: se fallisce annulli l'effetto e rubi la conoscenza dell'incantesimo per 8 ore."}],"spells":null},{"k":"inquisitive","n":"Inquisitore","src":"XGE","f":[{"id":"lad-inquisitive-3-orecchio-per-linganno","l":3,"n":"Orecchio per l'Inganno","x":"Nelle prove di Intuizione per capire se qualcuno mente, un 7 o meno sul d20 conta come 8."},{"id":"lad-inquisitive-3-occhio-per-i-dettagli","l":3,"n":"Occhio per i Dettagli","x":"Con un'azione bonus fai una prova di Percezione per notare qualcosa di nascosto o di Indagare per trovare indizi."},{"id":"lad-inquisitive-3-combattimento-intuitivo","l":3,"n":"Combattimento Intuitivo","x":"Con un'azione bonus fai una prova di Intuizione contro l'Inganno di una creatura: se vinci puoi usare l'Attacco Furtivo contro di lei per 1 minuto anche senza vantaggio."},{"id":"lad-inquisitive-9-osservatore-costante","l":9,"n":"Osservatore Costante","x":"Hai vantaggio alle prove di Percezione e Indagare se non ti muovi più di metà della velocità nel turno."},{"id":"lad-inquisitive-13-occhio-infallibile","l":13,"n":"Occhio Infallibile","x":"Con un'azione individui illusioni, mutaforma e magie che alterano l'aspetto entro 9 m. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"lad-inquisitive-17-occhio-per-le-debolezze","l":17,"n":"Occhio per le Debolezze","x":"Quando usi l'Attacco Furtivo grazie al Combattimento Intuitivo, aggiungi 3d6 danni."}],"spells":null},{"k":"mastermind","n":"Mente Criminale","src":"XGE","f":[{"id":"lad-mastermind-3-maestro-dellintrigo","l":3,"n":"Maestro dell'Intrigo","x":"Ottieni competenza con equipaggiamento da travestimento, da falsario e un gioco, impari due lingue e sai imitare accenti e parlate."},{"id":"lad-mastermind-3-maestro-della-tattica","l":3,"n":"Maestro della Tattica","x":"Puoi usare l'azione di Aiuto con un'azione bonus, anche verso un alleato entro 9 m da un nemico."},{"id":"lad-mastermind-9-manipolatore-perspicace","l":9,"n":"Manipolatore Perspicace","x":"Osservando una creatura per 1 minuto scopri se è superiore, pari o inferiore a te in due tra Intelligenza, Saggezza, Carisma e livelli di classe."},{"id":"lad-mastermind-13-deviazione","l":13,"n":"Deviazione","x":"Quando un attacco ti bersaglia e un'altra creatura entro 1,5 m ti dà copertura, con la reazione fai colpire lei."},{"id":"lad-mastermind-17-anima-dellinganno","l":17,"n":"Anima dell'Inganno","x":"I tuoi pensieri non possono essere letti e puoi presentare pensieri falsi; la magia che rileva le menzogne ti considera sincero."}],"spells":null},{"k":"scout","n":"Esploratore","src":"XGE","f":[{"id":"lad-scout-3-schermagliatore","l":3,"n":"Schermagliatore","x":"Quando un nemico termina il turno entro 1,5 m da te, con la reazione ti muovi fino a metà velocità senza provocare attacchi di opportunità."},{"id":"lad-scout-3-sopravvissuto","l":3,"n":"Sopravvissuto","x":"Ottieni competenza in Natura e Sopravvivenza, con bonus raddoppiato."},{"id":"lad-scout-9-mobilit-superiore","l":9,"n":"Mobilità Superiore","x":"La tua velocità, e quelle di scalata e nuoto, aumentano di 3 m."},{"id":"lad-scout-13-maestro-dellimboscata","l":13,"n":"Maestro dell'Imboscata","x":"Hai vantaggio all'iniziativa; la prima creatura che colpisci nel primo round dà vantaggio agli attacchi degli alleati contro di lei."},{"id":"lad-scout-17-colpo-improvviso","l":17,"n":"Colpo Improvviso","x":"Con l'azione di Attacco puoi fare un attacco extra con un'azione bonus, che può applicare un secondo Attacco Furtivo a un bersaglio diverso."}],"spells":null},{"k":"swashbuckler","n":"Spadaccino","src":"XGE","f":[{"id":"lad-swashbuckler-3-gioco-di-gambe-elegante","l":3,"n":"Gioco di Gambe Elegante","x":"Nel turno in cui attacchi in mischia una creatura, questa non può fare attacchi di opportunità contro di te."},{"id":"lad-swashbuckler-3-audacia-temeraria","l":3,"n":"Audacia Temeraria","x":"Aggiungi il mod. di Carisma all'iniziativa e puoi usare l'Attacco Furtivo se sei l'unica creatura entro 1,5 m dal bersaglio."},{"id":"lad-swashbuckler-9-panache","l":9,"n":"Panache","x":"Con un'azione fai una prova di Persuasione contro Intuizione: un nemico viene provocato (svantaggio ad attaccare altri) oppure una creatura non ostile resta affascinata da te."},{"id":"lad-swashbuckler-13-manovra-elegante","l":13,"n":"Manovra Elegante","x":"Con un'azione bonus hai vantaggio alla prossima prova di Acrobazia o Atletica del turno."},{"id":"lad-swashbuckler-17-maestro-del-duello","l":17,"n":"Maestro del Duello","x":"Quando manchi un attacco, puoi ritirarlo con vantaggio. Una volta per riposo breve o lungo."}],"spells":null},{"k":"phantom","n":"Fantasma","src":"TCE","f":[{"id":"lad-phantom-3-sussurri-dei-morti","l":3,"n":"Sussurri dei Morti","x":"Dopo un riposo ottieni competenza in un'abilità o in uno strumento a scelta, fino al riposo successivo."},{"id":"lad-phantom-3-lamenti-dalla-tomba","l":3,"n":"Lamenti dalla Tomba","x":"Dopo un Attacco Furtivo, una seconda creatura entro 9 m subisce danni necrotici pari a metà dei dadi dell'Attacco Furtivo. Usi pari alla competenza per riposo lungo."},{"id":"lad-phantom-9-pegni-dei-defunti","l":9,"n":"Pegni dei Defunti","x":"Quando una creatura muore vicino a te puoi creare un pegno dell'anima: finché lo hai, vantaggio ai TS su Costituzione e alle prove per morire; puoi distruggerlo per usare i Lamenti senza spendere usi o per porre una domanda allo spirito."},{"id":"lad-phantom-13-viandante-spettrale","l":13,"n":"Viandante Spettrale","x":"Con un'azione assumi forma spettrale per 10 minuti: velocità di volo di 3 m, attraversi oggetti e gli attacchi contro di te hanno svantaggio. Una volta per riposo lungo (o distruggendo un pegno)."},{"id":"lad-phantom-17-amico-della-morte","l":17,"n":"Amico della Morte","x":"Quando usi l'Attacco Furtivo puoi infliggere danni necrotici, e se non hai pegni ne crei uno alla fine di un riposo."}],"spells":null},{"k":"soulknife","n":"Lama Psichica","src":"TCE","f":[{"id":"lad-soulknife-3-potere-psionico","l":3,"n":"Potere Psionico","x":"Hai dadi psionici pari al doppio della competenza (d6; d8 al 5°, d10 all'11°, d12 al 17°). Abilità Psi-Assistita: aggiungi un dado a una prova fallita. Sussurri Psichici: telepatia con alcune creature per ore."},{"id":"lad-soulknife-3-lame-psichiche","l":3,"n":"Lame Psichiche","x":"Manifesti una lama psichica (1d6 psichici, accurata, lancio 18 m) e, con un'azione bonus, una seconda lama da 1d4."},{"id":"lad-soulknife-9-lame-dellanima","l":9,"n":"Lame dell'Anima","x":"Colpi Guidati: spendi un dado per aggiungerlo a un attacco mancato. Teletrasporto Psichico: lanci una lama e ti teletrasporti dove atterra."},{"id":"lad-soulknife-13-velo-psichico","l":13,"n":"Velo Psichico","x":"Con un'azione diventi invisibile per 1 ora o finché non infliggi danni. Una volta per riposo lungo."},{"id":"lad-soulknife-17-squarciare-la-mente","l":17,"n":"Squarciare la Mente","x":"Quando usi le lame per un Attacco Furtivo, il bersaglio deve superare un TS su Saggezza o restare stordito per 1 minuto."}],"spells":null}]},{"k":"mag","n":"Mago","src":"PHB","hd":"d6","subLabel":"Tradizione Arcana","subLvl":2,"list":"M","f":[{"id":"mag-1-incantesimi","l":1,"n":"Incantesimi","x":"Sei un incantatore completo che usa l'Intelligenza. Hai un libro degli incantesimi (6 incantesimi di 1° livello, +2 a ogni livello); ogni giorno prepari incantesimi dal libro pari a mod. di Intelligenza + livello. Puoi lanciare come rituale gli incantesimi rituali del libro anche se non preparati."},{"id":"mag-1-recupero-arcano","l":1,"n":"Recupero Arcano","x":"Una volta al giorno, durante un riposo breve, recuperi slot con livello combinato fino a metà del tuo livello da mago (arrotondato per eccesso), nessuno di 6° o superiore."},{"id":"mag-3-formule-dei-trucchetti","l":3,"n":"Formule dei Trucchetti","x":"Opzionale (Tasha): alla fine di un riposo lungo puoi sostituire un trucchetto da mago con un altro della lista.","opt":1},{"id":"mag-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"mag-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mag-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mag-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mag-18-maestria-negli-incantesimi","l":18,"n":"Maestria negli Incantesimi","x":"Scegli un incantesimo di 1° e uno di 2° livello dal libro: puoi lanciarli al livello base senza spendere slot quando li hai preparati."},{"id":"mag-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mag-20-incantesimi-distintivi","l":20,"n":"Incantesimi Distintivi","x":"Scegli due incantesimi di 3° livello: sono sempre preparati, non contano nel limite e puoi lanciarli una volta ciascuno al 3° livello senza slot, recuperando l'uso con un riposo breve o lungo."}],"subs":[{"k":"abjuration","n":"Scuola di Abiurazione","src":"PHB","f":[{"id":"mag-abjuration-2-studioso-di-abiurazione","l":2,"n":"Studioso di Abiurazione","x":"Copiare incantesimi di abiurazione nel libro costa metà tempo e oro."},{"id":"mag-abjuration-2-guardia-arcana","l":2,"n":"Guardia Arcana","x":"Quando lanci un incantesimo di abiurazione di 1° livello o superiore crei una guardia con PF pari a 2 × livello da mago + mod. di Intelligenza, che assorbe i danni al posto tuo. Si ricarica lanciando abiurazioni (2 PF per livello dell'incantesimo)."},{"id":"mag-abjuration-6-guardia-proiettata","l":6,"n":"Guardia Proiettata","x":"Quando una creatura entro 9 m subisce danni, con la reazione la tua Guardia Arcana li assorbe al suo posto."},{"id":"mag-abjuration-10-abiurazione-migliorata","l":10,"n":"Abiurazione Migliorata","x":"Aggiungi la competenza alle prove di caratteristica di incantesimi di abiurazione come Controincantesimo e Dissolvi Magie."},{"id":"mag-abjuration-14-resistenza-agli-incantesimi","l":14,"n":"Resistenza agli Incantesimi","x":"Hai vantaggio ai TS contro incantesimi e resistenza ai loro danni."}],"spells":null},{"k":"conjuration","n":"Scuola di Evocazione","src":"PHB","f":[{"id":"mag-conjuration-2-studioso-di-evocazione","l":2,"n":"Studioso di Evocazione","x":"Copiare incantesimi di evocazione nel libro costa metà tempo e oro."},{"id":"mag-conjuration-2-evocazione-minore","l":2,"n":"Evocazione Minore","x":"Con un'azione crei un oggetto inanimato fino a 90 cm di lato e 5 kg, che dura 1 ora o finché non subisce danni."},{"id":"mag-conjuration-6-trasposizione-benigna","l":6,"n":"Trasposizione Benigna","x":"Con un'azione ti teletrasporti fino a 9 m, oppure scambi posto con una creatura Piccola o Media consenziente. Si ricarica dopo un riposo lungo o lanciando un incantesimo di evocazione."},{"id":"mag-conjuration-10-evocazione-focalizzata","l":10,"n":"Evocazione Focalizzata","x":"Mentre ti concentri su un incantesimo di evocazione, i danni non possono farti perdere la concentrazione."},{"id":"mag-conjuration-14-evocazioni-durevoli","l":14,"n":"Evocazioni Durevoli","x":"Le creature che evochi con incantesimi di evocazione ottengono 30 PF temporanei."}],"spells":null},{"k":"divination","n":"Scuola di Divinazione","src":"PHB","f":[{"id":"mag-divination-2-studioso-di-divinazione","l":2,"n":"Studioso di Divinazione","x":"Copiare incantesimi di divinazione nel libro costa metà tempo e oro."},{"id":"mag-divination-2-presagio","l":2,"n":"Presagio","x":"Dopo un riposo lungo tiri due d20 e ne annoti i risultati: puoi sostituirli a qualsiasi tiro per colpire, TS o prova tua o di una creatura che vedi, prima del tiro. Tre d20 al 14° livello."},{"id":"mag-divination-6-divinazione-esperta","l":6,"n":"Divinazione Esperta","x":"Quando lanci un incantesimo di divinazione di 2° livello o superiore, recuperi uno slot di livello inferiore (massimo 5°)."},{"id":"mag-divination-10-il-terzo-occhio","l":10,"n":"Il Terzo Occhio","x":"Con un'azione ottieni fino al riposo successivo scurovisione, vista eterea, lettura di tutte le lingue o vista dell'invisibile entro 3 m."},{"id":"mag-divination-14-presagio-superiore","l":14,"n":"Presagio Superiore","x":"Il Presagio ti dà tre d20 invece di due."}],"spells":null},{"k":"enchantment","n":"Scuola di Ammaliamento","src":"PHB","f":[{"id":"mag-enchantment-2-studioso-di-ammaliamento","l":2,"n":"Studioso di Ammaliamento","x":"Copiare incantesimi di ammaliamento nel libro costa metà tempo e oro."},{"id":"mag-enchantment-2-sguardo-ipnotico","l":2,"n":"Sguardo Ipnotico","x":"Con un'azione una creatura entro 1,5 m deve superare un TS su Saggezza o restare affascinata e incapacitata fino alla fine del tuo prossimo turno; puoi mantenere l'effetto con un'azione in ogni turno."},{"id":"mag-enchantment-6-fascino-istintivo","l":6,"n":"Fascino Istintivo","x":"Quando una creatura entro 9 m ti attacca, con la reazione la costringi a un TS su Saggezza: se fallisce deve attaccare un'altra creatura vicina."},{"id":"mag-enchantment-10-ammaliamento-condiviso","l":10,"n":"Ammaliamento Condiviso","x":"Quando lanci un incantesimo di ammaliamento di 1° livello o superiore a bersaglio singolo, puoi bersagliare una seconda creatura."},{"id":"mag-enchantment-14-alterare-memorie","l":14,"n":"Alterare Memorie","x":"Quando affascini una creatura, puoi farle dimenticare di esserlo stata e cancellare fino a qualche ora di ricordi (TS su Intelligenza)."}],"spells":null},{"k":"evocation","n":"Scuola di Invocazione","src":"PHB","f":[{"id":"mag-evocation-2-studioso-di-invocazione","l":2,"n":"Studioso di Invocazione","x":"Copiare incantesimi di invocazione nel libro costa metà tempo e oro."},{"id":"mag-evocation-2-scolpire-incantesimi","l":2,"n":"Scolpire Incantesimi","x":"Quando lanci un incantesimo di invocazione ad area, scegli fino a 1 + livello dell'incantesimo creature che superano automaticamente il TS e non subiscono danni."},{"id":"mag-evocation-6-trucchetto-potente","l":6,"n":"Trucchetto Potente","x":"I tuoi trucchetti infliggono metà danni anche a chi supera il TS."},{"id":"mag-evocation-10-invocazione-potenziata","l":10,"n":"Invocazione Potenziata","x":"Aggiungi il mod. di Intelligenza a un tiro di danno degli incantesimi di invocazione da mago."},{"id":"mag-evocation-14-sovraccarico","l":14,"n":"Sovraccarico","x":"Quando lanci un incantesimo da mago di 5° livello o inferiore che infligge danni, puoi infliggere il massimo. Dal secondo uso prima di un riposo lungo subisci 2d12 danni necrotici per livello dell'incantesimo, e aumentano a ogni uso."}],"spells":null},{"k":"illusion","n":"Scuola di Illusione","src":"PHB","f":[{"id":"mag-illusion-2-studioso-di-illusione","l":2,"n":"Studioso di Illusione","x":"Copiare incantesimi di illusione nel libro costa metà tempo e oro."},{"id":"mag-illusion-2-illusione-minore-migliorata","l":2,"n":"Illusione Minore Migliorata","x":"Conosci Illusione Minore e con essa puoi creare insieme un suono e un'immagine."},{"id":"mag-illusion-6-illusioni-malleabili","l":6,"n":"Illusioni Malleabili","x":"Con un'azione modifichi le illusioni che stai mantenendo con durata di almeno 1 minuto."},{"id":"mag-illusion-10-io-illusorio","l":10,"n":"Io Illusorio","x":"Quando una creatura ti attacca, con la reazione interponi un duplicato illusorio: l'attacco manca. Una volta per riposo breve o lungo."},{"id":"mag-illusion-14-realt-illusoria","l":14,"n":"Realtà Illusoria","x":"Quando lanci un'illusione di 1° livello o superiore, con un'azione bonus rendi reale per 1 minuto un oggetto inanimato non magico che ne fa parte (non può infliggere danni)."}],"spells":null},{"k":"necromancy","n":"Scuola di Necromanzia","src":"PHB","f":[{"id":"mag-necromancy-2-studioso-di-necromanzia","l":2,"n":"Studioso di Necromanzia","x":"Copiare incantesimi di necromanzia nel libro costa metà tempo e oro."},{"id":"mag-necromancy-2-raccolto-macabro","l":2,"n":"Raccolto Macabro","x":"Una volta per turno, quando uccidi con un incantesimo di 1° livello o superiore, recuperi PF pari al doppio del livello dell'incantesimo (il triplo se di necromanzia)."},{"id":"mag-necromancy-6-servitori-non-morti","l":6,"n":"Servitori Non Morti","x":"Aggiungi Animare Morti al libro; i non morti che crei hanno PF extra pari al livello da mago e aggiungono la competenza ai danni. Puoi animare un non morto in più."},{"id":"mag-necromancy-10-assuefatto-alla-non-morte","l":10,"n":"Assuefatto alla Non Morte","x":"Hai resistenza ai danni necrotici e il tuo massimo di PF non può essere ridotto."},{"id":"mag-necromancy-14-comandare-non-morti","l":14,"n":"Comandare Non Morti","x":"Con un'azione un non morto entro 18 m deve superare un TS su Carisma o diventare tuo alleato in modo permanente (vantaggio al TS per quelli intelligenti)."}],"spells":null},{"k":"transmutation","n":"Scuola di Trasmutazione","src":"PHB","f":[{"id":"mag-transmutation-2-studioso-di-trasmutazione","l":2,"n":"Studioso di Trasmutazione","x":"Copiare incantesimi di trasmutazione nel libro costa metà tempo e oro."},{"id":"mag-transmutation-2-alchimia-minore","l":2,"n":"Alchimia Minore","x":"Con 10 minuti di lavoro trasformi temporaneamente un oggetto di legno, pietra, ferro, rame o argento in un altro di questi materiali."},{"id":"mag-transmutation-6-pietra-del-trasmutatore","l":6,"n":"Pietra del Trasmutatore","x":"Crei una pietra che dà a chi la porta un beneficio a scelta: scurovisione 18 m, +3 m di velocità, competenza nei TS su Costituzione o resistenza a un tipo di energia."},{"id":"mag-transmutation-10-mutaforma","l":10,"n":"Mutaforma","x":"Aggiungi Metamorfosi al libro e puoi lanciarla su di te senza slot. Una volta per riposo breve o lungo."},{"id":"mag-transmutation-14-maestro-trasmutatore","l":14,"n":"Maestro Trasmutatore","x":"Distruggi la pietra per: trasformare un oggetto, curare malattie e condizioni, lanciare Rianimare Morti senza slot, o ringiovanire una creatura."}],"spells":null},{"k":"warmagic","n":"Magia da Guerra","src":"XGE","f":[{"id":"mag-warmagic-2-deviazione-arcana","l":2,"n":"Deviazione Arcana","x":"Quando vieni colpito o fallisci un TS, con la reazione ottieni +2 alla CA o +4 al TS; fino alla fine del turno successivo puoi lanciare solo trucchetti."},{"id":"mag-warmagic-2-saggezza-tattica","l":2,"n":"Saggezza Tattica","x":"Aggiungi il mod. di Intelligenza ai tiri di iniziativa."},{"id":"mag-warmagic-6-ondata-di-potere","l":6,"n":"Ondata di Potere","x":"Hai cariche di potere (una dopo ogni riposo lungo, massimo pari al mod. di Intelligenza): spendine una per infliggere danni da forza extra pari a metà del livello con un incantesimo. Ne guadagni una quando annulli un incantesimo con Controincantesimo o Dissolvi Magie."},{"id":"mag-warmagic-10-magia-durevole","l":10,"n":"Magia Durevole","x":"Mentre mantieni la concentrazione hai +2 alla CA e a tutti i TS."},{"id":"mag-warmagic-14-scudo-deflettente","l":14,"n":"Scudo Deflettente","x":"Quando usi la Deviazione Arcana, una creatura entro 18 m subisce danni da forza pari a metà del livello da mago + mod. di Intelligenza."}],"spells":null},{"k":"bladesinging","n":"Lama Cantante","src":"TCE","f":[{"id":"mag-bladesinging-2-addestramento-in-guerra-e-canto","l":2,"n":"Addestramento in Guerra e Canto","x":"Ottieni competenza con le armature leggere, un'arma da mischia a una mano e Intrattenere."},{"id":"mag-bladesinging-2-canto-della-lama","l":2,"n":"Canto della Lama","x":"Con un'azione bonus, per 1 minuto (senza armatura media o pesante né scudo): +mod. di Intelligenza alla CA, velocità +3 m, vantaggio ad Acrobazia e +mod. di Intelligenza ai TS su Costituzione per la concentrazione. Usi pari alla competenza per riposo lungo."},{"id":"mag-bladesinging-6-attacco-extra","l":6,"n":"Attacco Extra","x":"Con l'azione di Attacco attacchi due volte, e uno degli attacchi può essere sostituito da un trucchetto."},{"id":"mag-bladesinging-10-canto-della-difesa","l":10,"n":"Canto della Difesa","x":"Durante il Canto della Lama, quando subisci danni con la reazione spendi uno slot per ridurli di 5 × il livello dello slot."},{"id":"mag-bladesinging-14-canto-della-vittoria","l":14,"n":"Canto della Vittoria","x":"Durante il Canto della Lama aggiungi il mod. di Intelligenza ai danni in mischia con le armi."}],"spells":null},{"k":"scribes","n":"Ordine degli Scribi","src":"TCE","f":[{"id":"mag-scribes-2-penna-magica","l":2,"n":"Penna Magica","x":"Con un'azione bonus crei una penna magica: copiare incantesimi nel libro richiede 2 minuti per livello e la metà dell'inchiostro."},{"id":"mag-scribes-2-libro-risvegliato","l":2,"n":"Libro Risvegliato","x":"Il tuo libro diventa senziente: puoi cambiare il tipo di danno di un incantesimo con quello di un altro incantesimo del libro, e lanciare un rituale nel suo tempo normale una volta per riposo lungo."},{"id":"mag-scribes-6-mente-manifesta","l":6,"n":"Mente Manifesta","x":"Con un'azione bonus fai apparire la mente del libro entro 18 m: vede al buio e puoi lanciare incantesimi come se fossi nel suo spazio (usi pari alla competenza per riposo lungo)."},{"id":"mag-scribes-10-scriba-maestro","l":10,"n":"Scriba Maestro","x":"Dopo un riposo lungo crei una pergamena magica di un incantesimo del libro di 1° livello o superiore, lanciabile a un livello superiore."},{"id":"mag-scribes-14-uno-con-la-parola","l":14,"n":"Uno con la Parola","x":"Quando subisci danni mentre la mente è manifesta, puoi farli assorbire al libro, che perde temporaneamente incantesimi."}],"spells":null}]},{"k":"mon","n":"Monaco","src":"PHB","hd":"d8","subLabel":"Tradizione Monastica","subLvl":3,"list":"","f":[{"id":"mon-1-difesa-senza-armatura","l":1,"n":"Difesa senza Armatura","x":"Se non indossi armatura né scudo, la tua CA è 10 + mod. di Destrezza + mod. di Saggezza."},{"id":"mon-1-arti-marziali","l":1,"n":"Arti Marziali","x":"Con colpi senz'armi e armi da monaco usi Forza o Destrezza e il dado di Arti Marziali (d4; d6 al 5°, d8 all'11°, d10 al 17°). Quando attacchi con queste armi, puoi fare un colpo senz'armi con un'azione bonus."},{"id":"mon-2-ki","l":2,"n":"Ki","x":"Hai punti ki pari al livello da monaco, recuperati con un riposo breve o lungo. Raffica di Colpi (1 ki: due colpi senz'armi con un'azione bonus), Difesa Paziente (1 ki: Schivata con azione bonus), Passo del Vento (1 ki: Disimpegno o Scatto con azione bonus e salto raddoppiato). CD del ki: 8 + competenza + mod. di Saggezza."},{"id":"mon-2-movimento-senza-armatura","l":2,"n":"Movimento senza Armatura","x":"Senza armatura né scudo la tua velocità aumenta di 3 m (fino a 9 m al 18° livello); dal 9° livello corri su pareti verticali e sull'acqua."},{"id":"mon-2-arma-dedicata","l":2,"n":"Arma Dedicata","x":"Opzionale (Tasha): dopo un riposo scegli un'arma semplice o da guerra con cui sei competente (non pesante né speciale): conta come arma da monaco.","opt":1},{"id":"mon-3-deviare-proiettili","l":3,"n":"Deviare Proiettili","x":"Con la reazione riduci i danni di un attacco a distanza di 1d10 + mod. di Destrezza + livello da monaco; se li azzeri puoi afferrare il proiettile e rilanciarlo spendendo 1 ki."},{"id":"mon-3-attacco-alimentato-dal-ki","l":3,"n":"Attacco Alimentato dal Ki","x":"Opzionale (Tasha): se spendi ki con un'azione nel tuo turno, puoi fare un attacco con arma da monaco o senz'armi con un'azione bonus.","opt":1},{"id":"mon-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"mon-4-caduta-lenta","l":4,"n":"Caduta Lenta","x":"Con la reazione riduci i danni da caduta di 5 × il livello da monaco."},{"id":"mon-4-guarigione-rapida","l":4,"n":"Guarigione Rapida","x":"Opzionale (Tasha): con un'azione spendi 2 ki per recuperare PF pari a un tiro del dado di Arti Marziali + competenza.","opt":1},{"id":"mon-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco attacchi due volte."},{"id":"mon-5-colpo-stordente","l":5,"n":"Colpo Stordente","x":"Quando colpisci con un'arma in mischia puoi spendere 1 ki: il bersaglio deve superare un TS su Costituzione o restare stordito fino alla fine del tuo prossimo turno."},{"id":"mon-5-mira-concentrata","l":5,"n":"Mira Concentrata","x":"Opzionale (Tasha): quando manchi un attacco puoi spendere da 1 a 3 ki per aggiungere +2 per ki al tiro.","opt":1},{"id":"mon-6-colpi-potenziati-dal-ki","l":6,"n":"Colpi Potenziati dal Ki","x":"I tuoi colpi senz'armi contano come magici."},{"id":"mon-7-elusione","l":7,"n":"Elusione","x":"Nei TS su Destrezza per dimezzare i danni, se lo superi non subisci danni e se lo fallisci ne subisci metà."},{"id":"mon-7-calma-mentale","l":7,"n":"Calma Mentale","x":"Con un'azione poni fine a un effetto che ti rende affascinato o spaventato."},{"id":"mon-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mon-10-purezza-del-corpo","l":10,"n":"Purezza del Corpo","x":"Sei immune a malattie e veleni."},{"id":"mon-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mon-13-lingua-del-sole-e-della-luna","l":13,"n":"Lingua del Sole e della Luna","x":"Capisci tutte le lingue parlate, e chiunque capisca una lingua capisce ciò che dici."},{"id":"mon-14-anima-di-diamante","l":14,"n":"Anima di Diamante","x":"Ottieni competenza in tutti i TS; quando ne fallisci uno puoi spendere 1 ki per ritirarlo."},{"id":"mon-15-corpo-senza-tempo","l":15,"n":"Corpo Senza Tempo","x":"Non subisci gli effetti dell'età e non hai bisogno di cibo né acqua."},{"id":"mon-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mon-18-corpo-vuoto","l":18,"n":"Corpo Vuoto","x":"Con 4 ki diventi invisibile per 1 minuto con resistenza a tutti i danni tranne quelli da forza; con 8 ki lanci Proiezione Astrale su di te."},{"id":"mon-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"mon-20-autoperfezione","l":20,"n":"Autoperfezione","x":"Quando tiri l'iniziativa senza ki, ne recuperi 4."}],"subs":[{"k":"openhand","n":"Via della Mano Aperta","src":"PHB","f":[{"id":"mon-openhand-3-tecnica-della-mano-aperta","l":3,"n":"Tecnica della Mano Aperta","x":"Quando colpisci con la Raffica di Colpi, il bersaglio deve superare un TS su Destrezza o cadere prono, oppure un TS su Forza o essere spinto di 4,5 m, oppure non può fare reazioni fino al tuo prossimo turno."},{"id":"mon-openhand-6-integrit-del-corpo","l":6,"n":"Integrità del Corpo","x":"Con un'azione recuperi PF pari a 3 × il livello da monaco. Una volta per riposo lungo."},{"id":"mon-openhand-11-tranquillit","l":11,"n":"Tranquillità","x":"Alla fine di un riposo lungo ottieni l'effetto di Santuario fino al riposo lungo successivo."},{"id":"mon-openhand-17-palmo-tremante","l":17,"n":"Palmo Tremante","x":"Quando colpisci con un colpo senz'armi spendi 3 ki per creare vibrazioni letali: in seguito, con un'azione, il bersaglio deve superare un TS su Costituzione o scendere a 0 PF (altrimenti subisce 10d10 danni necrotici)."}],"spells":null},{"k":"shadow","n":"Via dell'Ombra","src":"PHB","f":[{"id":"mon-shadow-3-arti-dellombra","l":3,"n":"Arti dell'Ombra","x":"Spendendo 2 ki lanci Oscurità, Scurovisione, Passare Senza Tracce o Silenzio senza componenti materiali; conosci Illusione Minore."},{"id":"mon-shadow-6-passo-dombra","l":6,"n":"Passo d'Ombra","x":"In luce fioca o oscurità, con un'azione bonus ti teletrasporti fino a 18 m verso un'altra zona in penombra e hai vantaggio al primo attacco in mischia del turno."},{"id":"mon-shadow-11-manto-delle-ombre","l":11,"n":"Manto delle Ombre","x":"Con un'azione, in luce fioca o oscurità diventi invisibile finché non attacchi, lanci un incantesimo o entri in luce intensa."},{"id":"mon-shadow-17-opportunista","l":17,"n":"Opportunista","x":"Quando una creatura entro 1,5 m viene colpita da un altro, con la reazione fai un attacco in mischia contro di lei."}],"spells":null},{"k":"elements","n":"Via dei Quattro Elementi","src":"PHB","f":[{"id":"mon-elements-3-discepolo-degli-elementi","l":3,"n":"Discepolo degli Elementi","x":"Conosci Sintonia Elementale e un'altra disciplina elementale (ad esempio Pugno dell'Aria Inarrestabile, Frusta dell'Acqua, Colpo delle Fiamme Spazzanti), alimentate dal ki. Nuove discipline al 6°, 11° e 17° livello; il ki massimo per disciplina cresce col livello."},{"id":"mon-elements-6-disciplina-elementale","l":6,"n":"Disciplina Elementale","x":"Impari una nuova disciplina elementale (ad esempio Ruggito del Tuono Rimbombante o Nebbia Mutevole)."},{"id":"mon-elements-11-disciplina-elementale","l":11,"n":"Disciplina Elementale","x":"Impari una nuova disciplina elementale (ad esempio Fiume di Fiamma Affamata o Fiamme della Fenice)."},{"id":"mon-elements-17-disciplina-elementale","l":17,"n":"Disciplina Elementale","x":"Impari una nuova disciplina elementale (ad esempio Respiro dell'Inverno o Onda di Terra Rotolante)."}],"spells":null},{"k":"drunken","n":"Via del Maestro Ubriaco","src":"XGE","f":[{"id":"mon-drunken-3-competenze-bonus","l":3,"n":"Competenze Bonus","x":"Ottieni competenza in Intrattenere e con gli strumenti da birraio."},{"id":"mon-drunken-3-tecnica-dellubriaco","l":3,"n":"Tecnica dell'Ubriaco","x":"Quando usi la Raffica di Colpi ottieni anche Disimpegno e la tua velocità aumenta di 3 m fino alla fine del turno."},{"id":"mon-drunken-6-barcollo-sbilenco","l":6,"n":"Barcollo Sbilenco","x":"Rialzarti da prono costa solo 1,5 m; quando una creatura ti manca in mischia, con la reazione la fai colpire un'altra creatura vicina."},{"id":"mon-drunken-11-fortuna-dellubriaco","l":11,"n":"Fortuna dell'Ubriaco","x":"Quando fai una prova, un tiro per colpire o un TS con svantaggio, spendi 2 ki per annullarlo."},{"id":"mon-drunken-17-frenesia-inebriata","l":17,"n":"Frenesia Inebriata","x":"Con la Raffica di Colpi puoi fare fino a tre attacchi aggiuntivi, ognuno contro una creatura diversa."}],"spells":null},{"k":"kensei","n":"Via del Kensei","src":"XGE","f":[{"id":"mon-kensei-3-via-del-pennello","l":3,"n":"Via del Pennello","x":"Ottieni competenza con gli strumenti da calligrafo o da pittore."},{"id":"mon-kensei-3-armi-kensei","l":3,"n":"Armi Kensei","x":"Scegli due armi (una da mischia e una a distanza) che contano come armi da monaco; altre al 6°, 11° e 17° livello."},{"id":"mon-kensei-3-parata-agile","l":3,"n":"Parata Agile","x":"Se fai un colpo senz'armi mentre impugni un'arma kensei, ottieni +2 alla CA fino al tuo prossimo turno."},{"id":"mon-kensei-3-colpo-mirato-del-kensei","l":3,"n":"Colpo Mirato del Kensei","x":"Con un'azione bonus i tuoi attacchi a distanza con un'arma kensei infliggono 1d4 danni extra."},{"id":"mon-kensei-6-uno-con-la-lama","l":6,"n":"Uno con la Lama","x":"Le armi kensei contano come magiche. Colpo Preciso: spendi 1 ki per aggiungere un dado di Arti Marziali ai danni."},{"id":"mon-kensei-11-affinare-la-lama","l":11,"n":"Affinare la Lama","x":"Con un'azione bonus spendi da 1 a 3 ki per dare +1 a +3 ai tiri per colpire e ai danni di un'arma kensei per 1 minuto."},{"id":"mon-kensei-17-precisione-infallibile","l":17,"n":"Precisione Infallibile","x":"Una volta per turno, quando manchi con un'arma da monaco, puoi ritirare l'attacco."}],"spells":null},{"k":"longdeath","n":"Via della Lunga Morte","src":"XGE","f":[{"id":"mon-longdeath-3-tocco-della-morte","l":3,"n":"Tocco della Morte","x":"Quando uccidi una creatura entro 1,5 m ottieni PF temporanei pari a mod. di Saggezza + livello da monaco."},{"id":"mon-longdeath-6-ora-del-mietitore","l":6,"n":"Ora del Mietitore","x":"Con un'azione ogni creatura entro 9 m deve superare un TS su Saggezza o restare spaventata da te fino alla fine del tuo prossimo turno."},{"id":"mon-longdeath-11-maestria-della-morte","l":11,"n":"Maestria della Morte","x":"Quando scenderesti a 0 PF, spendi 1 ki per restare a 1 PF."},{"id":"mon-longdeath-17-tocco-della-lunga-morte","l":17,"n":"Tocco della Lunga Morte","x":"Con un'azione tocchi una creatura spendendo da 1 a 10 ki: TS su Costituzione, 2d10 danni necrotici per ki (metà se lo supera)."}],"spells":null},{"k":"sunsoul","n":"Via dell'Anima Solare","src":"XGE","f":[{"id":"mon-sunsoul-3-dardo-solare-radioso","l":3,"n":"Dardo Solare Radioso","x":"Ottieni un attacco a distanza con incantesimo (9 m) che infligge 1d4 + Destrezza danni radiosi, con il dado di Arti Marziali; puoi spendere 1 ki per due attacchi extra con un'azione bonus."},{"id":"mon-sunsoul-6-colpo-bruciante-dellarco","l":6,"n":"Colpo Bruciante dell'Arco","x":"Dopo l'azione di Attacco spendi 2 ki per lanciare Mani Brucianti con un'azione bonus (1 ki extra per ogni livello di slot superiore)."},{"id":"mon-sunsoul-11-esplosione-solare-ardente","l":11,"n":"Esplosione Solare Ardente","x":"Con un'azione crei una sfera di luce di 6 m entro 45 m: TS su Costituzione, 2d6 danni radiosi (+2d6 per ogni ki extra, massimo 3)."},{"id":"mon-sunsoul-17-scudo-solare","l":17,"n":"Scudo Solare","x":"Emani luce intensa in 9 m; quando una creatura entro 1,5 m ti colpisce in mischia, con la reazione le infliggi 5 + Saggezza danni radiosi."}],"spells":null},{"k":"mercy","n":"Via della Misericordia","src":"TCE","f":[{"id":"mon-mercy-3-strumenti-della-misericordia","l":3,"n":"Strumenti della Misericordia","x":"Ottieni competenza in Intuizione e Medicina e con il kit da erborista, e una maschera rituale."},{"id":"mon-mercy-3-mano-della-guarigione","l":3,"n":"Mano della Guarigione","x":"Con un'azione spendi 1 ki per curare un dado di Arti Marziali + Saggezza; può sostituire un colpo della Raffica di Colpi."},{"id":"mon-mercy-3-mano-del-danno","l":3,"n":"Mano del Danno","x":"Una volta per turno, quando colpisci con un colpo senz'armi, spendi 1 ki per infliggere un dado di Arti Marziali + Saggezza danni necrotici extra."},{"id":"mon-mercy-6-tocco-del-medico","l":6,"n":"Tocco del Medico","x":"La Mano della Guarigione cura anche una malattia o le condizioni accecato, assordato, paralizzato, avvelenato o stordito; la Mano del Danno può avvelenare."},{"id":"mon-mercy-11-raffica-di-guarigione-e-danno","l":11,"n":"Raffica di Guarigione e Danno","x":"Puoi sostituire ogni colpo della Raffica con una Mano della Guarigione senza spendere ki, e usare la Mano del Danno senza ki una volta per turno."},{"id":"mon-mercy-17-mano-della-misericordia-suprema","l":17,"n":"Mano della Misericordia Suprema","x":"Con un'azione tocchi il cadavere di una creatura morta da meno di 24 ore e spendi 5 ki: torna in vita con 4d10 + Saggezza PF. Una volta per riposo lungo."}],"spells":null},{"k":"astralself","n":"Via del Sé Astrale","src":"TCE","f":[{"id":"mon-astralself-3-braccia-del-s-astrale","l":3,"n":"Braccia del Sé Astrale","x":"Con un'azione bonus spendi 1 ki per evocare braccia spettrali per 10 minuti: le creature entro 3 m subiscono due dadi di Arti Marziali danni da forza (TS su Destrezza); usi la Saggezza per attacchi e danni senz'armi e hai portata +1,5 m."},{"id":"mon-astralself-6-volto-del-s-astrale","l":6,"n":"Volto del Sé Astrale","x":"Evocando il sé astrale ottieni visione nell'oscurità magica, vantaggio a Intuizione e Intimidire e puoi farti sentire solo da chi vuoi."},{"id":"mon-astralself-11-corpo-del-s-astrale","l":11,"n":"Corpo del Sé Astrale","x":"Con il sé astrale completo puoi ridurre i danni da acido, freddo, fuoco, forza, fulmine o tuono con la reazione, e aggiungi un dado di Arti Marziali ai danni delle braccia."},{"id":"mon-astralself-17-s-astrale-risvegliato","l":17,"n":"Sé Astrale Risvegliato","x":"Spendendo 5 ki evochi tutto il sé astrale: +2 alla CA e puoi fare tre attacchi con le braccia con l'azione di Attacco."}],"spells":null}]},{"k":"pal","n":"Paladino","src":"PHB","hd":"d10","subLabel":"Giuramento Sacro","subLvl":3,"list":"P","f":[{"id":"pal-1-percezione-divina","l":1,"n":"Percezione Divina","x":"Con un'azione percepisci fino al tuo prossimo turno celestiali, immondi e non morti entro 18 m non completamente coperti, e luoghi consacrati o dissacrati. Usi pari a 1 + mod. di Carisma per riposo lungo."},{"id":"pal-1-imposizione-delle-mani","l":1,"n":"Imposizione delle Mani","x":"Hai una riserva di PF pari a 5 × livello da paladino: con un'azione tocchi una creatura e le fai recuperare PF dalla riserva, oppure spendi 5 punti per curare una malattia o un veleno."},{"id":"pal-2-stile-di-combattimento","l":2,"n":"Stile di Combattimento","x":"Scegli Difesa, Duellare, Combattere con Armi Possenti o Protezione (Tasha aggiunge Combattimento alla Cieca, Intercettazione e Guerriero Benedetto)."},{"id":"pal-2-incantesimi","l":2,"n":"Incantesimi","x":"Sei un mezzo incantatore che usa il Carisma: ogni giorno prepari incantesimi dalla lista del paladino pari a mod. di Carisma + metà del livello."},{"id":"pal-2-punizione-divina","l":2,"n":"Punizione Divina","x":"Quando colpisci con un'arma da mischia, spendi uno slot per infliggere 2d8 danni radiosi extra, +1d8 per ogni livello di slot sopra il 1° (massimo 5d8), +1d8 contro non morti e immondi."},{"id":"pal-3-salute-divina","l":3,"n":"Salute Divina","x":"Sei immune alle malattie."},{"id":"pal-3-incanalare-divinit","l":3,"n":"Incanalare Divinità","x":"Il tuo giuramento ti concede due opzioni di Incanalare Divinità. Un uso per riposo breve o lungo; CD pari a quella degli incantesimi."},{"id":"pal-3-armonizzare-il-potere-divino","l":3,"n":"Armonizzare il Potere Divino","x":"Opzionale (Tasha): con un'azione bonus spendi Incanalare Divinità per recuperare uno slot di livello non superiore a metà della competenza (arrotondata per eccesso). Una volta per riposo lungo (due al 7°, tre al 15°).","opt":1},{"id":"pal-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"pal-4-versatilit-marziale","l":4,"n":"Versatilità Marziale","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi cambiare stile di combattimento.","opt":1},{"id":"pal-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco attacchi due volte."},{"id":"pal-6-aura-di-protezione","l":6,"n":"Aura di Protezione","x":"Tu e le creature amichevoli entro 3 m aggiungete il tuo mod. di Carisma (minimo +1) ai TS, se sei cosciente. Il raggio diventa 9 m al 18° livello."},{"id":"pal-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"pal-10-aura-di-coraggio","l":10,"n":"Aura di Coraggio","x":"Tu e le creature amichevoli entro 3 m (9 m al 18° livello) non potete essere spaventati mentre sei cosciente."},{"id":"pal-11-punizione-divina-migliorata","l":11,"n":"Punizione Divina Migliorata","x":"Ogni volta che colpisci con un'arma da mischia infliggi 1d8 danni radiosi extra."},{"id":"pal-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"pal-14-tocco-purificatore","l":14,"n":"Tocco Purificatore","x":"Con un'azione poni fine a un incantesimo su te stesso o su una creatura consenziente che tocchi. Usi pari al mod. di Carisma per riposo lungo."},{"id":"pal-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"pal-18-miglioramento-delle-aure","l":18,"n":"Miglioramento delle Aure","x":"Le tue aure di paladino raggiungono i 9 m."},{"id":"pal-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."}],"subs":[{"k":"devotion","n":"Giuramento di Devozione","src":"PHB","f":[{"id":"pal-devotion-3-incanalare-divinit-arma-sacra","l":3,"n":"Incanalare Divinità: Arma Sacra","x":"Con un'azione, per 1 minuto la tua arma emette luce e aggiungi il mod. di Carisma ai tiri per colpire; conta come magica."},{"id":"pal-devotion-3-incanalare-divinit-
