ello dello slot nelle statistiche dello spirito."],["summon-celestial","Summon Celestial","Convocare Celestiale",5,"evo","a","27 m","V, S, M (un reliquiario dorato del valore di 500 mo)","1 ora","c","CP","TCE","Evochi uno spirito celestiale Vendicatore o Difensore, con le statistiche dello Spirito Celestiale del manuale (CA 11 + livello dell'incantesimo, +2 per il Difensore; PF 40 + 10 per livello sopra il 5°). Attacca con arco o mazza radiosi e una volta al giorno può curare una creatura con il Tocco Guaritore. Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["summon-fiend","Summon Fiend","Convocare Immondo",6,"evo","a","27 m","V, S, M (sangue umanoide dentro una fiala di rubino del valore di 600 mo)","1 ora","c","WM","TCE","Evochi uno spirito immondo Demone, Diavolo o Yugoloth, con le statistiche dello Spirito Immondo del manuale (CA 12 + livello dell'incantesimo, PF 50, 40 o 60 in base alla forma, + 15 per livello sopra il 6°). Ogni forma ha attacchi e tratti propri. Obbedisce ai tuoi comandi verbali.","Usi il livello dello slot nelle statistiche dello spirito."],["tashas-otherworldly-guise","Tasha's Otherworldly Guise","Sembianza Ultraterrena di Tasha",6,"tra","ab","Sé","V, S, M (un oggetto inciso con il simbolo dei Piani Esterni del valore di almeno 500 mo)","1 minuto","c","SWM","TCE","Assumi un aspetto dei Piani Superiori o Inferiori. Ottieni immunità ai danni radiosi e necrotici (superiori) o da fuoco e veleno (inferiori), immunità all'essere affascinato, ali con volo 12 m, +2 alla CA, e i tuoi attacchi con arma diventano magici, usano la caratteristica da incantatore e puoi attaccare due volte con l'azione di Attacco.",""],["blade-of-disaster","Blade of Disaster","Lama del Disastro",9,"evo","ab","18 m","V, S","1 minuto","c","SWM","TCE","Crei una lama fatta di una frattura planare in uno spazio libero entro gittata. Al lancio puoi fare fino a due attacchi in mischia con incantesimo contro creature entro 1,5 m dalla lama: 4d12 danni da forza ciascuno, con critico su 18-20 (12d12). Con un'azione bonus nei turni successivi puoi spostarla di 9 m e ripetere i due attacchi. Attraversa qualsiasi barriera, anche un Muro di Forza.",""],["dream-of-the-blue-veil","Dream of the Blue Veil","Sogno del Velo Blu",7,"evo","10 minuti","6 m","V, S, M (un oggetto magico o una creatura consenziente del mondo di destinazione)","6 ore","","BSWM","TCE","Tu e fino a otto creature consenzienti entro gittata cadete privi di sensi e sognate un altro mondo del Piano Materiale che conosci. Alla fine dell'incantesimo, se il sogno non è stato interrotto, i vostri corpi svaniscono e ricompaiono in quel mondo, in un luogo appropriato.",""]];
const GAME = {"classes":[{"k":"bar","n":"Barbaro","src":"PHB","hd":"d12","subLabel":"Cammino Primordiale","subLvl":3,"list":"","f":[{"id":"bar-1-ira","l":1,"n":"Ira","x":"Con un'azione bonus entri in ira per 1 minuto (se non indossi armatura pesante): vantaggio alle prove e ai TS su Forza, bonus ai danni degli attacchi in mischia basati sulla Forza (+2, +3 al 9° livello, +4 al 16°) e resistenza ai danni contundenti, perforanti e taglienti. Non puoi lanciare né concentrarti su incantesimi. Termina prima se non attacchi e non subisci danni per un turno. Usi per riposo lungo: 2 (3 al 3°, 4 al 6°, 5 al 12°, 6 al 17°, illimitati al 20°)."},{"id":"bar-1-difesa-senza-armatura","l":1,"n":"Difesa senza Armatura","x":"Se non indossi armatura, la tua CA è 10 + mod. di Destrezza + mod. di Costituzione. Puoi usare uno scudo."},{"id":"bar-2-attacco-irruento","l":2,"n":"Attacco Irruento","x":"Al primo attacco del tuo turno puoi attaccare con irruenza: hai vantaggio ai tiri per colpire in mischia basati sulla Forza per tutto il turno, ma fino al tuo turno successivo gli attacchi contro di te hanno vantaggio."},{"id":"bar-2-percezione-del-pericolo","l":2,"n":"Percezione del Pericolo","x":"Hai vantaggio ai TS su Destrezza contro gli effetti che puoi vedere, come trappole e incantesimi, se non sei accecato, assordato o incapacitato."},{"id":"bar-3-conoscenza-primordiale","l":3,"n":"Conoscenza Primordiale","x":"Opzionale (Tasha): ottieni competenza in un'abilità della lista del barbaro; ne ottieni un'altra al 10° livello. In ira puoi anche usare la Forza per alcune prove di Acrobazia, Furtività, Intimidire, Percezione e Sopravvivenza.","opt":1},{"id":"bar-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"bar-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco nel tuo turno, puoi attaccare due volte invece di una."},{"id":"bar-5-movimento-veloce","l":5,"n":"Movimento Veloce","x":"La tua velocità aumenta di 3 m se non indossi un'armatura pesante."},{"id":"bar-7-istinto-ferino","l":7,"n":"Istinto Ferino","x":"Hai vantaggio ai tiri di iniziativa. Se sei sorpreso all'inizio di un combattimento puoi agire normalmente nel primo turno, a patto di entrare in ira prima di fare altro."},{"id":"bar-7-balzo-istintivo","l":7,"n":"Balzo Istintivo","x":"Opzionale (Tasha): quando entri in ira con un'azione bonus puoi muoverti fino a metà della tua velocità.","opt":1},{"id":"bar-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"bar-9-critico-brutale","l":9,"n":"Critico Brutale","x":"Quando metti a segno un colpo critico in mischia, tiri un dado di danno dell'arma aggiuntivo. Diventano due dadi al 13° livello e tre al 17°."},{"id":"bar-11-ira-implacabile","l":11,"n":"Ira Implacabile","x":"Se in ira scendi a 0 PF senza morire, puoi effettuare un TS su Costituzione CD 10: se lo superi resti a 1 PF. Ogni uso successivo aumenta la CD di 5, fino a un riposo breve o lungo."},{"id":"bar-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"bar-15-ira-persistente","l":15,"n":"Ira Persistente","x":"La tua ira termina prima del tempo solo se perdi i sensi o se scegli di terminarla."},{"id":"bar-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"bar-18-potenza-indomabile","l":18,"n":"Potenza Indomabile","x":"Se il totale di una prova di Forza è inferiore al tuo punteggio di Forza, puoi usare il punteggio al posto del totale."},{"id":"bar-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"bar-20-campione-primordiale","l":20,"n":"Campione Primordiale","x":"Forza e Costituzione aumentano di 4 ciascuna, e il loro massimo diventa 24."}],"subs":[{"k":"berserker","n":"Cammino del Berserker","src":"PHB","f":[{"id":"bar-berserker-3-frenesia","l":3,"n":"Frenesia","x":"Quando entri in ira puoi andare in frenesia: finché dura puoi fare un attacco in mischia con un'azione bonus in ogni tuo turno. Al termine dell'ira subisci un livello di indebolimento."},{"id":"bar-berserker-6-ira-incosciente","l":6,"n":"Ira Incosciente","x":"Mentre sei in ira non puoi essere affascinato né spaventato; se lo eri quando entri in ira, l'effetto è sospeso."},{"id":"bar-berserker-10-presenza-intimidatoria","l":10,"n":"Presenza Intimidatoria","x":"Con un'azione spaventi una creatura entro 9 m che puoi vedere (TS su Saggezza, CD 8 + competenza + mod. di Carisma). Puoi estendere l'effetto con un'azione in ogni turno successivo."},{"id":"bar-berserker-14-ritorsione","l":14,"n":"Ritorsione","x":"Quando subisci danni da una creatura entro 1,5 m, puoi usare la reazione per fare un attacco in mischia contro di lei."}],"spells":null},{"k":"totem","n":"Cammino del Guerriero Totemico","src":"PHB","f":[{"id":"bar-totem-3-cercatore-di-spiriti","l":3,"n":"Cercatore di Spiriti","x":"Puoi lanciare Sensi Bestiali e Parlare con gli Animali come rituali."},{"id":"bar-totem-3-spirito-totemico","l":3,"n":"Spirito Totemico","x":"Scegli un animale totem. Orso: in ira hai resistenza a tutti i danni tranne quelli psichici. Aquila: in ira gli attacchi di opportunità contro di te hanno svantaggio e puoi Scattare con un'azione bonus. Lupo: in ira i tuoi alleati hanno vantaggio agli attacchi in mischia contro i nemici entro 1,5 m da te."},{"id":"bar-totem-6-aspetto-della-bestia","l":6,"n":"Aspetto della Bestia","x":"Orso: capacità di carico raddoppiata e vantaggio alle prove di Forza per spingere, sollevare o rompere. Aquila: vedi fino a 1,5 km senza difficoltà e la luce fioca non ti dà svantaggio a Percezione. Lupo: segui tracce a passo veloce e ti muovi furtivamente a passo normale."},{"id":"bar-totem-10-camminatore-spirituale","l":10,"n":"Camminatore Spirituale","x":"Puoi lanciare Comunione con la Natura come rituale."},{"id":"bar-totem-14-sintonia-totemica","l":14,"n":"Sintonia Totemica","x":"Orso: in ira, i nemici entro 1,5 m da te hanno svantaggio ad attaccare altri bersagli. Aquila: in ira ottieni una velocità di volo pari a quella base, finché la usi nel turno. Lupo: in ira, quando colpisci in mischia una creatura Grande o più piccola puoi farla cadere prona con un'azione bonus."}],"spells":null},{"k":"ancestral","n":"Cammino del Guardiano Ancestrale","src":"XGE","f":[{"id":"bar-ancestral-3-protettori-ancestrali","l":3,"n":"Protettori Ancestrali","x":"In ira, la prima creatura che colpisci nel turno è ostacolata dai tuoi antenati: fino al tuo prossimo turno ha svantaggio agli attacchi contro bersagli diversi da te, e quei bersagli hanno resistenza ai suoi danni."},{"id":"bar-ancestral-6-scudo-spirituale","l":6,"n":"Scudo Spirituale","x":"In ira, quando una creatura che vedi entro 9 m subisce danni, puoi usare la reazione per ridurli di 2d6 (3d6 al 10° livello, 4d6 al 14°)."},{"id":"bar-ancestral-10-consultare-gli-spiriti","l":10,"n":"Consultare gli Spiriti","x":"Puoi lanciare Presagio o Chiaroveggenza senza slot né componenti materiali. Una volta per riposo breve o lungo."},{"id":"bar-ancestral-14-antenati-vendicativi","l":14,"n":"Antenati Vendicativi","x":"Quando usi lo Scudo Spirituale, l'attaccante subisce danni da forza pari ai danni che hai prevenuto."}],"spells":null},{"k":"storm","n":"Cammino dell'Araldo della Tempesta","src":"XGE","f":[{"id":"bar-storm-3-aura-della-tempesta","l":3,"n":"Aura della Tempesta","x":"In ira emani un'aura di 3 m. Scegli ogni volta (o quando sali di livello) Deserto (danni da fuoco a chi è vicino), Mare (fulmine su una creatura, TS su Destrezza) o Tundra (PF temporanei agli alleati). Puoi riattivarla con un'azione bonus; l'effetto cresce con il livello."},{"id":"bar-storm-6-anima-della-tempesta","l":6,"n":"Anima della Tempesta","x":"Deserto: resistenza al fuoco e accendi oggetti toccandoli. Mare: resistenza al fulmine e respiri sott'acqua, con velocità di nuoto. Tundra: resistenza al freddo e congeli l'acqua toccandola."},{"id":"bar-storm-10-tempesta-protettiva","l":10,"n":"Tempesta Protettiva","x":"Gli alleati nella tua aura ottengono la resistenza al danno della tua Anima della Tempesta."},{"id":"bar-storm-14-tempesta-furiosa","l":14,"n":"Tempesta Furiosa","x":"Deserto: reazione per infliggere danni da fuoco a chi ti colpisce. Mare: reazione per far cadere prona una creatura colpita dall'aura. Tundra: la creatura colpita dall'aura deve superare un TS su Forza o avere velocità 0."}],"spells":null},{"k":"zealot","n":"Cammino dello Zelota","src":"XGE","f":[{"id":"bar-zealot-3-furia-divina","l":3,"n":"Furia Divina","x":"In ira, la prima creatura che colpisci con un'arma in ogni tuo turno subisce danni extra pari a 1d6 + metà del tuo livello da barbaro, necrotici o radiosi a tua scelta."},{"id":"bar-zealot-3-guerriero-degli-dei","l":3,"n":"Guerriero degli Dei","x":"Gli incantesimi che servono a riportarti in vita non richiedono componenti materiali."},{"id":"bar-zealot-6-concentrazione-fanatica","l":6,"n":"Concentrazione Fanatica","x":"In ira, una volta per ira, puoi ritirare un TS fallito."},{"id":"bar-zealot-10-presenza-zelante","l":10,"n":"Presenza Zelante","x":"Con un'azione bonus fino a dieci creature a tua scelta entro 18 m ottengono vantaggio ai tiri per colpire e ai TS fino all'inizio del tuo prossimo turno. Una volta per riposo lungo."},{"id":"bar-zealot-14-ira-oltre-la-morte","l":14,"n":"Ira Oltre la Morte","x":"In ira, scendere a 0 PF non ti fa perdere i sensi; muori solo se hai ancora 0 PF quando l'ira termina."}],"spells":null},{"k":"beast","n":"Cammino della Bestia","src":"TCE","f":[{"id":"bar-beast-3-forma-della-bestia","l":3,"n":"Forma della Bestia","x":"Quando entri in ira ti spuntano armi naturali a scelta: Morso (1d8 perforanti; una volta per turno, se colpisci e hai meno di metà PF, recuperi PF pari alla competenza), Artigli (1d6 taglienti; se attacchi con gli artigli puoi fare un attacco extra con essi), Coda (1d8 perforanti con portata; reazione per +1d8 alla CA contro un attacco)."},{"id":"bar-beast-6-anima-bestiale","l":6,"n":"Anima Bestiale","x":"Le armi naturali contano come magiche. Dopo un riposo scegli: velocità di nuoto e respirare sott'acqua, velocità di scalata, oppure salti potenziati."},{"id":"bar-beast-10-furia-contagiosa","l":10,"n":"Furia Contagiosa","x":"Quando colpisci con le armi naturali in ira, una volta per turno il bersaglio deve superare un TS su Saggezza o attaccare un'altra creatura con la reazione, oppure subire 2d12 danni psichici."},{"id":"bar-beast-14-chiamata-della-caccia","l":14,"n":"Chiamata della Caccia","x":"Quando entri in ira puoi scegliere fino a un numero di alleati pari al tuo mod. di Costituzione: guadagnano +1d6 ai danni una volta per turno e tu ottieni 5 PF temporanei per alleato. Usi pari alla competenza per riposo lungo."}],"spells":null},{"k":"wild","n":"Cammino della Magia Selvaggia","src":"TCE","f":[{"id":"bar-wild-3-consapevolezza-magica","l":3,"n":"Consapevolezza Magica","x":"Con un'azione percepisci incantesimi e oggetti magici entro 18 m e ne scopri la scuola. Usi pari alla competenza per riposo lungo."},{"id":"bar-wild-3-ondata-selvaggia","l":3,"n":"Ondata Selvaggia","x":"Quando entri in ira tira sulla tabella della magia selvaggia: ottieni un effetto casuale (danni necrotici ai vicini, teletrasporto, arma luminosa, spiriti esplosivi e altro)."},{"id":"bar-wild-6-magia-rinvigorente","l":6,"n":"Magia Rinvigorente","x":"Con un'azione tocchi una creatura: per 10 minuti aggiunge 1d3 a tiri per colpire e prove, oppure recupera uno slot di livello pari al d3. Usi pari alla competenza per riposo lungo."},{"id":"bar-wild-10-reazione-instabile","l":10,"n":"Reazione Instabile","x":"Quando subisci danni o fallisci un TS in ira, puoi usare la reazione per tirare di nuovo sulla tabella della magia selvaggia e sostituire l'effetto attuale."},{"id":"bar-wild-14-ondata-controllata","l":14,"n":"Ondata Controllata","x":"Quando tiri sulla tabella della magia selvaggia tiri due volte e scegli il risultato."}],"spells":null}]},{"k":"brd","n":"Bardo","src":"PHB","hd":"d8","subLabel":"Collegio Bardico","subLvl":3,"list":"B","f":[{"id":"brd-1-incantesimi","l":1,"n":"Incantesimi","x":"Sei un incantatore completo che usa il Carisma. Conosci un numero fisso di incantesimi della lista del bardo e usi uno strumento musicale come focus."},{"id":"brd-1-ispirazione-bardica","l":1,"n":"Ispirazione Bardica","x":"Con un'azione bonus dai a una creatura entro 18 m che ti sente un dado di ispirazione (d6; d8 al 5° livello, d10 al 10°, d12 al 15°): entro 10 minuti può aggiungerlo a un tiro per colpire, una prova o un TS. Usi pari al mod. di Carisma per riposo lungo."},{"id":"brd-2-factotum","l":2,"n":"Factotum","x":"Aggiungi metà del bonus di competenza, arrotondato per difetto, alle prove di caratteristica in cui non sei competente."},{"id":"brd-2-canto-di-riposo","l":2,"n":"Canto di Riposo","x":"Durante un riposo breve, chi recupera PF spendendo Dadi Vita e ti ascolta recupera 1d6 PF extra (1d8 al 9°, 1d10 al 13°, 1d12 al 17°)."},{"id":"brd-2-ispirazione-magica","l":2,"n":"Ispirazione Magica","x":"Opzionale (Tasha): chi ha un tuo dado di ispirazione può aggiungerlo ai danni o alle cure di un suo incantesimo.","opt":1},{"id":"brd-3-maestria","l":3,"n":"Maestria","x":"Scegli due abilità in cui sei competente: il tuo bonus di competenza raddoppia per le prove che le usano. Altre due al 10° livello."},{"id":"brd-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"brd-4-versatilit-bardica","l":4,"n":"Versatilità Bardica","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi sostituire un'abilità della Maestria o un trucchetto.","opt":1},{"id":"brd-5-fonte-di-ispirazione","l":5,"n":"Fonte di Ispirazione","x":"Recuperi tutti gli usi di Ispirazione Bardica anche con un riposo breve."},{"id":"brd-6-controfascino","l":6,"n":"Controfascino","x":"Con un'azione inizi un'esibizione: fino alla fine del tuo prossimo turno tu e gli alleati entro 9 m avete vantaggio ai TS contro l'essere spaventati o affascinati."},{"id":"brd-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"brd-10-maestria","l":10,"n":"Maestria","x":"Scegli altre due abilità in cui raddoppiare il bonus di competenza."},{"id":"brd-10-segreti-magici","l":10,"n":"Segreti Magici","x":"Impari due incantesimi da qualsiasi lista di classe, che contano come incantesimi da bardo. Altri due al 14° e al 18° livello."},{"id":"brd-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"brd-14-segreti-magici","l":14,"n":"Segreti Magici","x":"Impari altri due incantesimi da qualsiasi lista."},{"id":"brd-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"brd-18-segreti-magici","l":18,"n":"Segreti Magici","x":"Impari altri due incantesimi da qualsiasi lista."},{"id":"brd-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"brd-20-ispirazione-superiore","l":20,"n":"Ispirazione Superiore","x":"Quando tiri l'iniziativa e non hai usi di Ispirazione Bardica, ne recuperi uno."}],"subs":[{"k":"lore","n":"Collegio della Sapienza","src":"PHB","f":[{"id":"brd-lore-3-competenze-bonus","l":3,"n":"Competenze Bonus","x":"Ottieni competenza in tre abilità a tua scelta."},{"id":"brd-lore-3-parole-taglienti","l":3,"n":"Parole Taglienti","x":"Quando una creatura entro 18 m effettua un tiro per colpire, una prova o un tiro per i danni, puoi usare la reazione e un'Ispirazione Bardica per sottrarre il dado dal risultato."},{"id":"brd-lore-6-segreti-magici-aggiuntivi","l":6,"n":"Segreti Magici Aggiuntivi","x":"Impari due incantesimi da qualsiasi lista di classe, che contano come incantesimi da bardo."},{"id":"brd-lore-14-abilit-impareggiabile","l":14,"n":"Abilità Impareggiabile","x":"Quando effettui una prova di caratteristica puoi spendere un'Ispirazione Bardica e aggiungerne il dado."}],"spells":null},{"k":"valor","n":"Collegio del Valore","src":"PHB","f":[{"id":"brd-valor-3-competenze-bonus","l":3,"n":"Competenze Bonus","x":"Ottieni competenza con armature medie, scudi e armi da guerra."},{"id":"brd-valor-3-ispirazione-in-combattimento","l":3,"n":"Ispirazione in Combattimento","x":"Chi ha un tuo dado di ispirazione può aggiungerlo ai danni di un attacco con arma, oppure alla CA con la reazione contro un attacco."},{"id":"brd-valor-6-attacco-extra","l":6,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco puoi attaccare due volte."},{"id":"brd-valor-14-magia-da-battaglia","l":14,"n":"Magia da Battaglia","x":"Quando usi l'azione per lanciare un incantesimo da bardo, puoi fare un attacco con arma con un'azione bonus."}],"spells":null},{"k":"glamour","n":"Collegio del Fascino","src":"XGE","f":[{"id":"brd-glamour-3-manto-di-ispirazione","l":3,"n":"Manto di Ispirazione","x":"Con un'azione bonus spendi un'Ispirazione Bardica: fino a tante creature quante il tuo mod. di Carisma entro 18 m ottengono 5 PF temporanei (8 al 5° livello, 11 al 10°, 14 al 15°) e possono muoversi con la reazione senza provocare attacchi di opportunità."},{"id":"brd-glamour-3-esibizione-ammaliante","l":3,"n":"Esibizione Ammaliante","x":"Dopo un'esibizione di 1 minuto, fino a tante creature quante il tuo mod. di Carisma devono superare un TS su Saggezza o restare affascinate da te per 1 ora. Una volta per riposo breve o lungo."},{"id":"brd-glamour-6-manto-di-maest","l":6,"n":"Manto di Maestà","x":"Con un'azione bonus assumi un aspetto ultraterreno per 1 minuto: in ogni turno puoi lanciare Comando con un'azione bonus senza spendere slot. Una volta per riposo lungo."},{"id":"brd-glamour-14-maest-infrangibile","l":14,"n":"Maestà Infrangibile","x":"Con un'azione bonus, per 1 minuto chi ti attacca per la prima volta nel turno deve superare un TS su Carisma o scegliere un altro bersaglio. Una volta per riposo breve o lungo."}],"spells":null},{"k":"swords","n":"Collegio delle Spade","src":"XGE","f":[{"id":"brd-swords-3-competenze-bonus","l":3,"n":"Competenze Bonus","x":"Ottieni competenza con armature medie e scimitarre; puoi usare un'arma da mischia come focus."},{"id":"brd-swords-3-stile-di-combattimento","l":3,"n":"Stile di Combattimento","x":"Scegli Duellare o Combattere con Due Armi."},{"id":"brd-swords-3-fioriture-con-la-lama","l":3,"n":"Fioriture con la Lama","x":"Quando attacchi, la tua velocità aumenta di 3 m nel turno. Quando colpisci puoi spendere un'Ispirazione Bardica per una fioritura: Difensiva (aggiungi il dado ai danni e alla CA), Tagliente (danni del dado a un'altra creatura vicina) o Mobile (aggiungi il dado ai danni e spingi il bersaglio)."},{"id":"brd-swords-6-attacco-extra","l":6,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco puoi attaccare due volte."},{"id":"brd-swords-14-fioritura-del-maestro","l":14,"n":"Fioritura del Maestro","x":"Quando usi una fioritura puoi tirare un d6 invece di spendere un'Ispirazione Bardica."}],"spells":null},{"k":"whispers","n":"Collegio dei Sussurri","src":"XGE","f":[{"id":"brd-whispers-3-lame-psichiche","l":3,"n":"Lame Psichiche","x":"Quando colpisci con un'arma puoi spendere un'Ispirazione Bardica per infliggere 2d6 danni psichici extra (3d6 al 5° livello, 5d6 al 10°, 8d6 al 15°), una volta per turno."},{"id":"brd-whispers-3-parole-del-terrore","l":3,"n":"Parole del Terrore","x":"Dopo 1 minuto di conversazione privata, una creatura deve superare un TS su Saggezza o restare spaventata da te o da un'altra creatura per 1 ora. Una volta per riposo breve o lungo."},{"id":"brd-whispers-6-manto-dei-sussurri","l":6,"n":"Manto dei Sussurri","x":"Quando un umanoide muore entro 9 m, con la reazione ne catturi l'ombra: per 1 ora puoi assumerne l'aspetto e conoscerne alcune informazioni. Una volta per riposo breve o lungo."},{"id":"brd-whispers-14-conoscenza-oscura","l":14,"n":"Conoscenza Oscura","x":"Con un'azione una creatura entro 9 m deve superare un TS su Saggezza o restare affascinata per 1 ora, rivelandoti un segreto e obbedendo a tue richieste ragionevoli. Una volta per riposo lungo."}],"spells":null},{"k":"creation","n":"Collegio della Creazione","src":"TCE","f":[{"id":"brd-creation-3-nota-di-potenziale","l":3,"n":"Nota di Potenziale","x":"Quando dai Ispirazione Bardica, crei una nota fluttuante con un effetto extra: in base all'uso del dado può infliggere danni da tuono vicini, dare PF temporanei o creare un piccolo oggetto."},{"id":"brd-creation-3-esibizione-della-creazione","l":3,"n":"Esibizione della Creazione","x":"Con un'azione crei un oggetto non magico Medio o più piccolo del valore massimo di 20 mo per livello da bardo, che dura ore pari alla competenza. Una volta per riposo lungo, oppure spendendo uno slot di 2° livello o superiore."},{"id":"brd-creation-6-esibizione-animatrice","l":6,"n":"Esibizione Animatrice","x":"Con un'azione animi un oggetto Grande o più piccolo, che combatte al tuo fianco per 1 ora come Oggetto Danzante. Una volta per riposo lungo, oppure spendendo uno slot di 3° livello o superiore."},{"id":"brd-creation-14-crescendo-creativo","l":14,"n":"Crescendo Creativo","x":"Con Esibizione della Creazione puoi creare più oggetti (quanti il tuo mod. di Carisma), e uno di essi può superare i limiti di valore."}],"spells":null},{"k":"eloquence","n":"Collegio dell'Eloquenza","src":"TCE","f":[{"id":"brd-eloquence-3-lingua-dargento","l":3,"n":"Lingua d'Argento","x":"Nelle prove di Carisma (Persuasione) e Carisma (Inganno), un 9 o meno sul d20 conta come 10."},{"id":"brd-eloquence-3-parole-inquietanti","l":3,"n":"Parole Inquietanti","x":"Con un'azione bonus spendi un'Ispirazione Bardica: una creatura entro 18 m sottrae il dado dal suo prossimo TS entro il tuo turno successivo."},{"id":"brd-eloquence-6-ispirazione-infallibile","l":6,"n":"Ispirazione Infallibile","x":"Quando una creatura aggiunge il tuo dado e fallisce comunque, conserva l'Ispirazione Bardica."},{"id":"brd-eloquence-6-lingua-universale","l":6,"n":"Lingua Universale","x":"Con un'azione scegli fino a tante creature quante il tuo mod. di Carisma: per 1 ora ti capiscono qualunque lingua conoscano. Una volta per riposo lungo."},{"id":"brd-eloquence-14-ispirazione-contagiosa","l":14,"n":"Ispirazione Contagiosa","x":"Quando una creatura riesce grazie al tuo dado, puoi usare la reazione per dare Ispirazione Bardica a un'altra creatura senza spendere usi. Usi pari al mod. di Carisma per riposo lungo."}],"spells":null}]},{"k":"chr","n":"Chierico","src":"PHB","hd":"d8","subLabel":"Dominio Divino","subLvl":1,"list":"C","f":[{"id":"chr-1-incantesimi","l":1,"n":"Incantesimi","x":"Sei un incantatore completo che usa la Saggezza. Ogni giorno prepari incantesimi dalla lista del chierico pari a mod. di Saggezza + livello, e usi un simbolo sacro come focus."},{"id":"chr-2-incanalare-divinit","l":2,"n":"Incanalare Divinità","x":"Canalizzi il potere del tuo dio per effetti speciali, tra cui Scacciare Non Morti e quelli del tuo dominio. Usi per riposo breve o lungo: 1 (2 al 6° livello, 3 al 18°)."},{"id":"chr-2-scacciare-non-morti","l":2,"n":"Scacciare Non Morti","x":"Con un'azione e un uso di Incanalare Divinità, ogni non morto entro 9 m che ti vede o ti sente deve superare un TS su Saggezza o essere scacciato per 1 minuto: deve fuggire da te e non può avvicinarsi."},{"id":"chr-2-armonizzare-il-potere-divino","l":2,"n":"Armonizzare il Potere Divino","x":"Opzionale (Tasha): con un'azione bonus spendi Incanalare Divinità per recuperare uno slot di livello non superiore a metà della competenza (arrotondata per eccesso). Una volta per riposo lungo (due al 6°, tre al 18°).","opt":1},{"id":"chr-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"chr-4-versatilit-dei-trucchetti","l":4,"n":"Versatilità dei Trucchetti","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi sostituire un trucchetto con un altro della lista del chierico.","opt":1},{"id":"chr-5-distruggere-non-morti","l":5,"n":"Distruggere Non Morti","x":"Quando un non morto fallisce il TS contro Scacciare Non Morti ed è di GS 1/2 o inferiore, viene distrutto. Il GS sale a 1 all'8° livello, 2 all'11°, 3 al 14°, 4 al 17°."},{"id":"chr-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"chr-8-colpi-benedetti","l":8,"n":"Colpi Benedetti","x":"Opzionale (Tasha, sostituisce Colpo Divino o Incantesimi Potenti del dominio): una volta per turno, quando infliggi danni con un trucchetto o un attacco con arma, aggiungi 1d8 danni radiosi.","opt":1},{"id":"chr-10-intervento-divino","l":10,"n":"Intervento Divino","x":"Con un'azione implori il tuo dio: se tiri un d100 pari o inferiore al tuo livello da chierico, interviene (il DM sceglie l'effetto). Se riesce non puoi riprovare per 7 giorni, altrimenti dopo un riposo lungo. Al 20° livello riesce automaticamente."},{"id":"chr-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"chr-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"chr-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."}],"subs":[{"k":"life","n":"Dominio della Vita","src":"PHB","f":[{"id":"chr-life-1-competenza-bonus","l":1,"n":"Competenza Bonus","x":"Ottieni competenza con le armature pesanti."},{"id":"chr-life-1-discepolo-della-vita","l":1,"n":"Discepolo della Vita","x":"Gli incantesimi di cura di 1° livello o superiore fanno recuperare PF extra pari a 2 + il livello dell'incantesimo."},{"id":"chr-life-2-incanalare-divinit-preservare-la-vita","l":2,"n":"Incanalare Divinità: Preservare la Vita","x":"Con un'azione ripartisci PF pari a 5 × il tuo livello da chierico tra creature entro 9 m, fino a metà del loro massimo."},{"id":"chr-life-6-guaritore-benedetto","l":6,"n":"Guaritore Benedetto","x":"Quando lanci un incantesimo di cura di 1° livello o superiore su un'altra creatura, recuperi anche tu 2 + il livello dell'incantesimo in PF."},{"id":"chr-life-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni radiosi extra (2d8 al 14° livello)."},{"id":"chr-life-17-guarigione-suprema","l":17,"n":"Guarigione Suprema","x":"Quando tiri dadi per curare con un incantesimo, usi il massimo di ogni dado."}],"spells":{"mode":"always","g":[[1,"bless"],[1,"cure-wounds"],[3,"lesser-restoration"],[3,"spiritual-weapon"],[5,"beacon-of-hope"],[5,"revivify"],[7,"death-ward"],[7,"guardian-of-faith"],[9,"mass-cure-wounds"],[9,"raise-dead"]]}},{"k":"light","n":"Dominio della Luce","src":"PHB","f":[{"id":"chr-light-1-trucchetto-bonus","l":1,"n":"Trucchetto Bonus","x":"Conosci il trucchetto Luce, se non lo conosci già."},{"id":"chr-light-1-lampo-protettivo","l":1,"n":"Lampo Protettivo","x":"Quando una creatura entro 9 m ti attacca, con la reazione le imponi svantaggio. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"chr-light-2-incanalare-divinit-radiosit-dellalba","l":2,"n":"Incanalare Divinità: Radiosità dell'Alba","x":"Con un'azione dissolvi l'oscurità magica entro 9 m e ogni nemico entro 9 m effettua un TS su Costituzione: 2d10 + livello da chierico danni radiosi, metà se lo supera."},{"id":"chr-light-6-lampo-migliorato","l":6,"n":"Lampo Migliorato","x":"Puoi usare Lampo Protettivo anche quando viene attaccata un'altra creatura entro 9 m."},{"id":"chr-light-8-incantesimi-potenti","l":8,"n":"Incantesimi Potenti","x":"Aggiungi il mod. di Saggezza ai danni dei trucchetti da chierico."},{"id":"chr-light-17-corona-di-luce","l":17,"n":"Corona di Luce","x":"Con un'azione emani luce solare per 1 minuto (18 m): i nemici nella luce hanno svantaggio ai TS contro incantesimi di fuoco o radiosi."}],"spells":{"mode":"always","g":[[1,"burning-hands"],[1,"faerie-fire"],[3,"flaming-sphere"],[3,"scorching-ray"],[5,"daylight"],[5,"fireball"],[7,"guardian-of-faith"],[7,"wall-of-fire"],[9,"flame-strike"],[9,"scrying"]]}},{"k":"knowledge","n":"Dominio della Conoscenza","src":"PHB","f":[{"id":"chr-knowledge-1-benedizioni-della-conoscenza","l":1,"n":"Benedizioni della Conoscenza","x":"Impari due lingue e ottieni competenza, con bonus raddoppiato, in due abilità tra Arcano, Storia, Natura e Religione."},{"id":"chr-knowledge-2-incanalare-divinit-conoscenza-dei-secoli","l":2,"n":"Incanalare Divinità: Conoscenza dei Secoli","x":"Con un'azione ottieni per 10 minuti competenza in un'abilità o in uno strumento a scelta."},{"id":"chr-knowledge-6-incanalare-divinit-leggere-i-pensieri","l":6,"n":"Incanalare Divinità: Leggere i Pensieri","x":"Una creatura entro 18 m deve superare un TS su Saggezza o per 1 minuto ne leggi i pensieri superficiali; puoi anche lanciarle Suggestione senza slot."},{"id":"chr-knowledge-8-incantesimi-potenti","l":8,"n":"Incantesimi Potenti","x":"Aggiungi il mod. di Saggezza ai danni dei trucchetti da chierico."},{"id":"chr-knowledge-17-visioni-del-passato","l":17,"n":"Visioni del Passato","x":"Meditando per 1 minuto vedi il passato di un oggetto che tieni o del luogo in cui ti trovi. Una volta per riposo breve o lungo."}],"spells":{"mode":"always","g":[[1,"command"],[1,"identify"],[3,"augury"],[3,"suggestion"],[5,"nondetection"],[5,"speak-with-dead"],[7,"arcane-eye"],[7,"confusion"],[9,"legend-lore"],[9,"scrying"]]}},{"k":"nature","n":"Dominio della Natura","src":"PHB","f":[{"id":"chr-nature-1-accolito-della-natura","l":1,"n":"Accolito della Natura","x":"Impari un trucchetto da druido e ottieni competenza in Addestrare Animali, Natura o Sopravvivenza."},{"id":"chr-nature-1-competenza-bonus","l":1,"n":"Competenza Bonus","x":"Ottieni competenza con le armature pesanti."},{"id":"chr-nature-2-incanalare-divinit-charme-su-animali-e-vegetali","l":2,"n":"Incanalare Divinità: Charme su Animali e Vegetali","x":"Con un'azione ogni bestia o creatura vegetale entro 9 m che ti vede deve superare un TS su Saggezza o restare affascinata da te per 1 minuto."},{"id":"chr-nature-6-smorzare-elementi","l":6,"n":"Smorzare Elementi","x":"Quando tu o una creatura entro 9 m subite danni da acido, freddo, fuoco, fulmine o tuono, con la reazione concedi resistenza a quel danno."},{"id":"chr-nature-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni extra da freddo, fuoco o fulmine (2d8 al 14° livello)."},{"id":"chr-nature-17-signore-della-natura","l":17,"n":"Signore della Natura","x":"Puoi dare ordini verbali alle creature affascinate dal tuo Incanalare Divinità."}],"spells":{"mode":"always","g":[[1,"animal-friendship"],[1,"speak-with-animals"],[3,"barkskin"],[3,"spike-growth"],[5,"plant-growth"],[5,"wind-wall"],[7,"dominate-beast"],[7,"grasping-vine"],[9,"insect-plague"],[9,"tree-stride"]]}},{"k":"tempest","n":"Dominio della Tempesta","src":"PHB","f":[{"id":"chr-tempest-1-competenze-bonus","l":1,"n":"Competenze Bonus","x":"Ottieni competenza con armi da guerra e armature pesanti."},{"id":"chr-tempest-1-ira-della-tempesta","l":1,"n":"Ira della Tempesta","x":"Quando una creatura entro 1,5 m ti colpisce, con la reazione le infliggi 2d8 danni da fulmine o tuono (TS su Destrezza per dimezzarli). Usi pari al mod. di Saggezza per riposo lungo."},{"id":"chr-tempest-2-incanalare-divinit-ira-distruttiva","l":2,"n":"Incanalare Divinità: Ira Distruttiva","x":"Quando tiri danni da fulmine o tuono, puoi usare Incanalare Divinità per infliggere il massimo invece di tirare."},{"id":"chr-tempest-6-colpo-tonante","l":6,"n":"Colpo Tonante","x":"Quando infliggi danni da fulmine a una creatura Grande o più piccola, puoi spingerla di 3 m lontano da te."},{"id":"chr-tempest-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni da tuono extra (2d8 al 14° livello)."},{"id":"chr-tempest-17-figlio-della-tempesta","l":17,"n":"Figlio della Tempesta","x":"Ottieni una velocità di volo pari alla tua velocità base quando non sei sottoterra o al chiuso."}],"spells":{"mode":"always","g":[[1,"fog-cloud"],[1,"thunderwave"],[3,"gust-of-wind"],[3,"shatter"],[5,"call-lightning"],[5,"sleet-storm"],[7,"control-water"],[7,"ice-storm"],[9,"destructive-wave"],[9,"insect-plague"]]}},{"k":"trickery","n":"Dominio dell'Inganno","src":"PHB","f":[{"id":"chr-trickery-1-benedizione-dellingannatore","l":1,"n":"Benedizione dell'Ingannatore","x":"Con un'azione tocchi una creatura consenziente: ha vantaggio alle prove di Destrezza (Furtività) per 1 ora."},{"id":"chr-trickery-2-incanalare-divinit-invocare-duplicato","l":2,"n":"Incanalare Divinità: Invocare Duplicato","x":"Con un'azione crei un tuo duplicato illusorio entro 9 m per 1 minuto (concentrazione): puoi lanciare incantesimi come se fossi nel suo spazio e hai vantaggio agli attacchi contro chi è vicino a entrambi."},{"id":"chr-trickery-6-incanalare-divinit-manto-delle-ombre","l":6,"n":"Incanalare Divinità: Manto delle Ombre","x":"Con un'azione diventi invisibile fino alla fine del tuo prossimo turno, o finché non attacchi o lanci un incantesimo."},{"id":"chr-trickery-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni da veleno extra (2d8 al 14° livello)."},{"id":"chr-trickery-17-duplicati-migliorati","l":17,"n":"Duplicati Migliorati","x":"Con Invocare Duplicato crei fino a quattro duplicati."}],"spells":{"mode":"always","g":[[1,"charm-person"],[1,"disguise-self"],[3,"mirror-image"],[3,"pass-without-trace"],[5,"blink"],[5,"dispel-magic"],[7,"dimension-door"],[7,"polymorph"],[9,"dominate-person"],[9,"modify-memory"]]}},{"k":"war","n":"Dominio della Guerra","src":"PHB","f":[{"id":"chr-war-1-competenze-bonus","l":1,"n":"Competenze Bonus","x":"Ottieni competenza con armi da guerra e armature pesanti."},{"id":"chr-war-1-sacerdote-della-guerra","l":1,"n":"Sacerdote della Guerra","x":"Quando usi l'azione di Attacco puoi fare un attacco con arma con un'azione bonus. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"chr-war-2-incanalare-divinit-colpo-guidato","l":2,"n":"Incanalare Divinità: Colpo Guidato","x":"Quando fai un tiro per colpire, puoi usare Incanalare Divinità per aggiungere +10 al tiro, dopo averlo visto."},{"id":"chr-war-6-incanalare-divinit-benedizione-del-dio-della-guerra","l":6,"n":"Incanalare Divinità: Benedizione del Dio della Guerra","x":"Quando una creatura entro 9 m fa un tiro per colpire, con la reazione le concedi +10 al tiro."},{"id":"chr-war-8-colpo-divino","l":8,"n":"Colpo Divino","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d8 danni extra del tipo dell'arma (2d8 al 14° livello)."},{"id":"chr-war-17-avatar-della-battaglia","l":17,"n":"Avatar della Battaglia","x":"Hai resistenza ai danni contundenti, perforanti e taglienti delle armi non magiche."}],"spells":{"mode":"always","g":[[1,"divine-favor"],[1,"shield-of-faith"],[3,"magic-weapon"],[3,"spiritual-weapon"],[5,"crusaders-mantle"],[5,"spirit-guardians"],[7,"freedom-of-movement"],[7,"stoneskin"],[9,"flame-strike"],[9,"hold-monster"]]}},{"k":"death","n":"Dominio della Morte","src":"DMG","f":[{"id":"chr-death-1-competenza-bonus","l":1,"n":"Competenza Bonus","x":"Ottieni competenza con le armi da guerra."
