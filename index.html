Saggezza, il terreno difficile non rallenta il gruppo, non ti perdi e trovi il doppio del cibo. Nuovi terreni al 6° e al 10° livello."},{"id":"ran-1-esploratore-esperto","l":1,"n":"Esploratore Esperto","x":"Opzionale (Tasha, sostituisce Esploratore Nato): Maestria in un'abilità e due lingue; al 6° Vagabondo (+1,5 m di velocità, scalare e nuotare); al 10° Instancabile (PF temporanei con un'azione e meno indebolimento con i riposi).","opt":1},{"id":"ran-2-stile-di-combattimento","l":2,"n":"Stile di Combattimento","x":"Scegli Arciere, Difesa, Duellare o Combattere con Due Armi (Tasha aggiunge Combattimento alla Cieca, Stile Druidico, Intercettazione e Armi da Lancio)."},{"id":"ran-2-incantesimi","l":2,"n":"Incantesimi","x":"Sei un mezzo incantatore che usa la Saggezza e conosci un numero fisso di incantesimi della lista del ranger."},{"id":"ran-2-focus-magico","l":2,"n":"Focus Magico","x":"Opzionale (Tasha): puoi usare un focus druidico per i tuoi incantesimi da ranger.","opt":1},{"id":"ran-3-consapevolezza-primordiale","l":3,"n":"Consapevolezza Primordiale","x":"Spendi uno slot per sapere per 1 minuto (1 minuto per livello dello slot) se nemici prescelti si trovano entro 1,5 km (9 km nel terreno prediletto)."},{"id":"ran-3-consapevolezza-primordiale-tasha","l":3,"n":"Consapevolezza Primordiale (Tasha)","x":"Opzionale (Tasha, sostituisce la versione originale): impari automaticamente Parlare con gli Animali, Sensi Bestiali, Localizzare Creatura e altri incantesimi e puoi lanciare ciascuno una volta senza slot.","opt":1},{"id":"ran-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"ran-4-versatilit-marziale","l":4,"n":"Versatilità Marziale","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi cambiare stile di combattimento.","opt":1},{"id":"ran-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco attacchi due volte."},{"id":"ran-8-passo-sulla-terra","l":8,"n":"Passo sulla Terra","x":"Il terreno difficile non magico non ti rallenta, le piante non magiche non ti danneggiano e hai vantaggio ai TS contro le piante magiche."},{"id":"ran-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"ran-10-nascondersi-in-vista","l":10,"n":"Nascondersi in Vista","x":"Con 1 minuto di preparazione ti mimetizzi: +10 alle prove di Furtività finché resti immobile."},{"id":"ran-10-velo-della-natura","l":10,"n":"Velo della Natura","x":"Opzionale (Tasha, sostituisce Nascondersi in Vista): con un'azione bonus diventi invisibile fino all'inizio del tuo prossimo turno. Usi pari alla competenza per riposo lungo.","opt":1},{"id":"ran-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"ran-14-svanire","l":14,"n":"Svanire","x":"Puoi Nasconderti con un'azione bonus e non puoi essere seguito con mezzi non magici."},{"id":"ran-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"ran-18-sensi-ferini","l":18,"n":"Sensi Ferini","x":"Non hai svantaggio ad attaccare creature che non vedi e conosci la posizione delle creature invisibili entro 9 m."},{"id":"ran-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"ran-20-sterminatore-di-nemici","l":20,"n":"Sterminatore di Nemici","x":"Una volta per turno aggiungi il mod. di Saggezza al tiro per colpire o ai danni contro un nemico prescelto."}],"subs":[{"k":"hunter","n":"Cacciatore","src":"PHB","f":[{"id":"ran-hunter-3-preda-del-cacciatore","l":3,"n":"Preda del Cacciatore","x":"Scegli: Sterminatore di Colossi (+1d8 una volta per turno a una creatura ferita), Uccisore di Giganti (reazione per attaccare una creatura Grande che ti attacca) o Frantumatore di Orde (un attacco extra a una creatura vicina al bersaglio)."},{"id":"ran-hunter-7-tattiche-difensive","l":7,"n":"Tattiche Difensive","x":"Scegli: Fuga dall'Orda (attacchi di opportunità con svantaggio), Difesa contro Multiattacco (+4 CA dopo il primo colpo della stessa creatura) o Volontà d'Acciaio (vantaggio contro lo spavento)."},{"id":"ran-hunter-11-multiattacco","l":11,"n":"Multiattacco","x":"Scegli: Raffica (un attacco a distanza contro ogni creatura in un raggio di 3 m) o Attacco Turbinante (un attacco in mischia contro ogni creatura entro 1,5 m)."},{"id":"ran-hunter-15-difesa-superiore-del-cacciatore","l":15,"n":"Difesa Superiore del Cacciatore","x":"Scegli: Elusione, Resistere alla Marea (fai colpire un'altra creatura con un attacco che ti manca) o Schivata Prodigiosa (dimezzi i danni con la reazione)."}],"spells":null},{"k":"beastmaster","n":"Signore delle Bestie","src":"PHB","f":[{"id":"ran-beastmaster-3-compagno-del-ranger","l":3,"n":"Compagno del Ranger","x":"Ottieni una bestia compagna di taglia Media o più piccola e GS 1/4 o inferiore, che somma la tua competenza a CA, attacchi, danni e abilità. Con un'azione le fai attaccare o compiere altre azioni. Opzionale (Tasha): puoi scegliere invece un Compagno Primordiale (Bestia della Terra, del Mare o del Cielo) che agisce con la tua azione bonus."},{"id":"ran-beastmaster-7-addestramento-eccezionale","l":7,"n":"Addestramento Eccezionale","x":"Con un'azione bonus fai compiere al compagno Scatto, Disimpegno, Schivata o Aiuto; i suoi attacchi contano come magici."},{"id":"ran-beastmaster-11-furia-bestiale","l":11,"n":"Furia Bestiale","x":"Il compagno può attaccare due volte quando gli ordini di attaccare."},{"id":"ran-beastmaster-15-condividere-incantesimi","l":15,"n":"Condividere Incantesimi","x":"Quando lanci un incantesimo che bersaglia te, puoi fargli bersagliare anche il compagno entro 9 m."}],"spells":null},{"k":"gloomstalker","n":"Cacciatore delle Tenebre","src":"XGE","f":[{"id":"ran-gloomstalker-3-agguato-terrificante","l":3,"n":"Agguato Terrificante","x":"Aggiungi il mod. di Saggezza all'iniziativa; nel primo turno di ogni combattimento la velocità aumenta di 3 m e con l'azione di Attacco fai un attacco extra che infligge 1d8 danni aggiuntivi."},{"id":"ran-gloomstalker-3-vista-nellombra","l":3,"n":"Vista nell'Ombra","x":"Hai scurovisione entro 18 m (o +9 m se l'avevi) e sei invisibile alle creature che si affidano alla scurovisione per vederti al buio."},{"id":"ran-gloomstalker-7-mente-di-ferro","l":7,"n":"Mente di Ferro","x":"Ottieni competenza nei TS su Saggezza (o Intelligenza o Carisma se l'avevi già)."},{"id":"ran-gloomstalker-11-raffica-del-predatore","l":11,"n":"Raffica del Predatore","x":"Una volta per turno, quando manchi un attacco con arma, puoi fare un altro attacco."},{"id":"ran-gloomstalker-15-schivata-ombrosa","l":15,"n":"Schivata Ombrosa","x":"Quando una creatura ti attacca senza vantaggio, con la reazione le imponi svantaggio."}],"spells":{"mode":"always","g":[[3,"disguise-self"],[5,"rope-trick"],[9,"fear"],[13,"greater-invisibility"],[17,"seeming"]]}},{"k":"horizonwalker","n":"Viandante dell'Orizzonte","src":"XGE","f":[{"id":"ran-horizonwalker-3-individuare-portale","l":3,"n":"Individuare Portale","x":"Con un'azione percepisci la direzione e la distanza del portale planare più vicino entro 1,5 km. Una volta per riposo breve o lungo."},{"id":"ran-horizonwalker-3-guerriero-planare","l":3,"n":"Guerriero Planare","x":"Con un'azione bonus scegli una creatura entro 9 m: al prossimo colpo del turno infliggi 1d8 danni da forza extra (2d8 all'11° livello)."},{"id":"ran-horizonwalker-7-passo-etereo","l":7,"n":"Passo Etereo","x":"Con un'azione bonus lanci Forma Eterea senza slot fino alla fine del turno. Una volta per riposo breve o lungo."},{"id":"ran-horizonwalker-11-colpo-remoto","l":11,"n":"Colpo Remoto","x":"Con l'azione di Attacco ti teletrasporti fino a 3 m prima di ogni attacco; se attacchi almeno due creature, una subisce 1d8 danni da forza extra."},{"id":"ran-horizonwalker-15-difesa-spettrale","l":15,"n":"Difesa Spettrale","x":"Quando subisci danni, con la reazione ottieni resistenza a quei danni."}],"spells":{"mode":"always","g":[[3,"protection-from-evil-and-good"],[5,"misty-step"],[9,"haste"],[13,"banishment"],[17,"teleportation-circle"]]}},{"k":"monsterslayer","n":"Sterminatore di Mostri","src":"XGE","f":[{"id":"ran-monsterslayer-3-senso-del-cacciatore","l":3,"n":"Senso del Cacciatore","x":"Con un'azione scopri immunità, resistenze e vulnerabilità di una creatura entro 18 m. Usi pari al mod. di Saggezza per riposo lungo."},{"id":"ran-monsterslayer-3-preda-dello-sterminatore","l":3,"n":"Preda dello Sterminatore","x":"Con un'azione bonus designi una creatura entro 18 m: la prima volta per turno che la colpisci infliggi 1d6 danni extra."},{"id":"ran-monsterslayer-7-difesa-soprannaturale","l":7,"n":"Difesa Soprannaturale","x":"Quando la tua preda ti costringe a un TS o a una prova per sfuggire a una presa, aggiungi 1d6."},{"id":"ran-monsterslayer-11-nemesi-dei-magi","l":11,"n":"Nemesi dei Magi","x":"Quando una creatura entro 18 m lancia un incantesimo o si teletrasporta, con la reazione la costringi a un TS su Saggezza: se fallisce l'incantesimo o il teletrasporto è sprecato."},{"id":"ran-monsterslayer-15-contrattacco-dello-sterminatore","l":15,"n":"Contrattacco dello Sterminatore","x":"Quando la tua preda ti costringe a un TS, con la reazione la attacchi: se colpisci superi automaticamente il TS."}],"spells":{"mode":"always","g":[[3,"protection-from-evil-and-good"],[5,"zone-of-truth"],[9,"magic-circle"],[13,"banishment"],[17,"hold-monster"]]}},{"k":"feywanderer","n":"Viandante Fatato","src":"TCE","f":[{"id":"ran-feywanderer-3-colpi-terribili","l":3,"n":"Colpi Terribili","x":"Una volta per turno, quando colpisci con un'arma, infliggi 1d4 danni psichici extra (1d6 all'11° livello)."},{"id":"ran-feywanderer-3-dono-ultraterreno","l":3,"n":"Dono Ultraterreno","x":"Aggiungi il mod. di Saggezza alle prove di Carisma e ottieni competenza in Inganno, Intrattenere o Persuasione."},{"id":"ran-feywanderer-7-fascino-allettante","l":7,"n":"Fascino Allettante","x":"Hai vantaggio ai TS contro charme e paura; quando superi uno di questi TS puoi costringere un'altra creatura vicina a un TS su Saggezza o restare affascinata o spaventata."},{"id":"ran-feywanderer-11-rinforzi-fatati","l":11,"n":"Rinforzi Fatati","x":"Conosci Convocare Folletto e puoi lanciarlo una volta senza slot né componenti materiali, anche senza concentrazione (durata 1 minuto)."},{"id":"ran-feywanderer-15-passo-nebbioso-del-viandante","l":15,"n":"Passo Nebbioso del Viandante","x":"Puoi lanciare Passo Velato senza slot (usi pari alla competenza) e portare con te una creatura consenziente entro 1,5 m."}],"spells":{"mode":"always","g":[[3,"charm-person"],[5,"misty-step"],[9,"dispel-magic"],[13,"dimension-door"],[17,"mislead"]]}},{"k":"swarmkeeper","n":"Custode dello Sciame","src":"TCE","f":[{"id":"ran-swarmkeeper-3-sciame-raccolto","l":3,"n":"Sciame Raccolto","x":"Uno sciame di spiriti naturali ti accompagna: una volta per turno, quando colpisci, infliggi 1d6 perforanti extra, oppure spingi il bersaglio di 4,5 m (TS su Forza), oppure ti muovi di 1,5 m."},{"id":"ran-swarmkeeper-7-marea-contorta","l":7,"n":"Marea Contorta","x":"Con un'azione bonus ottieni una velocità di volo di 3 m per 1 minuto. Usi pari alla competenza per riposo lungo."},{"id":"ran-swarmkeeper-11-sciame-potente","l":11,"n":"Sciame Potente","x":"I danni dello sciame diventano 1d8, la spinta può far cadere proni e il tuo movimento ti dà copertura parziale."},{"id":"ran-swarmkeeper-15-dispersione-dello-sciame","l":15,"n":"Dispersione dello Sciame","x":"Quando subisci danni, con la reazione ottieni resistenza e ti teletrasporti fino a 9 m. Usi pari alla competenza per riposo lungo."}],"spells":{"mode":"always","g":[[3,"faerie-fire"],[3,"mage-hand"],[5,"web"],[9,"gaseous-form"],[13,"arcane-eye"],[17,"insect-plague"]]}}]},{"k":"str","n":"Stregone","src":"PHB","hd":"d6","subLabel":"Origine Stregonesca","subLvl":1,"list":"S","f":[{"id":"str-1-incantesimi","l":1,"n":"Incantesimi","x":"Sei un incantatore completo che usa il Carisma: conosci un numero fisso di incantesimi della lista dello stregone e puoi sostituirne uno a ogni livello."},{"id":"str-2-fonte-della-magia","l":2,"n":"Fonte della Magia","x":"Hai punti stregoneria pari al livello da stregone (recuperati con un riposo lungo): puoi convertirli in slot (2 punti per un 1°, 3 per un 2°, 5 per un 3°, 6 per un 4°, 7 per un 5°) o convertire slot in punti."},{"id":"str-3-metamagia","l":3,"n":"Metamagia","x":"Scegli due opzioni: Incantesimo Accurato, Distante, Esteso, Potenziato, Rapido, Silenzioso, Gemello, Intensificato (Tasha aggiunge Cercante e Trasmutato). Nuove opzioni al 10° e al 17° livello."},{"id":"str-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"str-4-versatilit-stregonesca","l":4,"n":"Versatilità Stregonesca","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi sostituire un'opzione di Metamagia o un trucchetto.","opt":1},{"id":"str-5-guida-magica","l":5,"n":"Guida Magica","x":"Opzionale (Tasha): quando fallisci una prova di caratteristica puoi spendere 1 punto stregoneria per ritirare il d20.","opt":1},{"id":"str-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"str-10-metamagia","l":10,"n":"Metamagia","x":"Impari un'altra opzione di Metamagia."},{"id":"str-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"str-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"str-17-metamagia","l":17,"n":"Metamagia","x":"Impari un'altra opzione di Metamagia."},{"id":"str-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"str-20-ristoro-stregonesco","l":20,"n":"Ristoro Stregonesco","x":"Recuperi 4 punti stregoneria alla fine di ogni riposo breve."}],"subs":[{"k":"draconic","n":"Discendenza Draconica","src":"PHB","f":[{"id":"str-draconic-1-antenato-draconico","l":1,"n":"Antenato Draconico","x":"Scegli un tipo di drago (e il relativo tipo di danno): parli il draconico e raddoppi la competenza alle prove di Carisma con i draghi."},{"id":"str-draconic-1-resilienza-draconica","l":1,"n":"Resilienza Draconica","x":"Il tuo massimo di PF aumenta di 1 per livello da stregone; senza armatura la tua CA è 13 + mod. di Destrezza."},{"id":"str-draconic-6-affinit-elementale","l":6,"n":"Affinità Elementale","x":"Aggiungi il mod. di Carisma ai danni degli incantesimi del tipo del tuo antenato; spendendo 1 punto ottieni resistenza a quel tipo per 1 ora."},{"id":"str-draconic-14-ali-di-drago","l":14,"n":"Ali di Drago","x":"Con un'azione bonus fai spuntare ali: velocità di volo pari a quella base."},{"id":"str-draconic-18-presenza-draconica","l":18,"n":"Presenza Draconica","x":"Con un'azione e 5 punti stregoneria emani un'aura di 18 m per 1 minuto: le creature ostili devono superare un TS su Saggezza o restare affascinate o spaventate."}],"spells":null},{"k":"wildmagic","n":"Magia Selvaggia","src":"PHB","f":[{"id":"str-wildmagic-1-ondata-di-magia-selvaggia","l":1,"n":"Ondata di Magia Selvaggia","x":"Quando lanci un incantesimo da stregone di 1° livello o superiore, il DM può farti tirare un d20: con 1 tiri sulla tabella della magia selvaggia."},{"id":"str-wildmagic-1-maree-del-caos","l":1,"n":"Maree del Caos","x":"Ottieni vantaggio a un tiro per colpire, una prova o un TS. Si ricarica dopo un riposo lungo o dopo un'Ondata di Magia Selvaggia."},{"id":"str-wildmagic-6-piegare-la-fortuna","l":6,"n":"Piegare la Fortuna","x":"Quando una creatura che vedi fa un tiro, con la reazione e 2 punti stregoneria aggiungi o sottrai 1d4."},{"id":"str-wildmagic-14-caos-controllato","l":14,"n":"Caos Controllato","x":"Quando tiri sulla tabella della magia selvaggia, tiri due volte e scegli."},{"id":"str-wildmagic-18-bombardamento-incantato","l":18,"n":"Bombardamento Incantato","x":"Quando tiri i danni di un incantesimo e ottieni il massimo su un dado, ne tiri un altro e lo aggiungi."}],"spells":null},{"k":"divinesoul","n":"Anima Divina","src":"XGE","f":[{"id":"str-divinesoul-1-magia-divina","l":1,"n":"Magia Divina","x":"Puoi scegliere incantesimi anche dalla lista del chierico. In base all'affinità (buona, malvagia, legale, caotica, neutrale) conosci un incantesimo bonus: Cura Ferite, Infliggi Ferite, Benedizione, Anatema o Protezione dal Bene e dal Male."},{"id":"str-divinesoul-1-favorito-dagli-dei","l":1,"n":"Favorito dagli Dei","x":"Quando fallisci un TS o manchi un attacco, puoi aggiungere 2d4 al tiro. Una volta per riposo breve o lungo."},{"id":"str-divinesoul-6-guarigione-potenziata","l":6,"n":"Guarigione Potenziata","x":"Quando tu o un alleato entro 1,5 m tirate dadi di cura, puoi spendere 1 punto stregoneria per ritirarne alcuni."},{"id":"str-divinesoul-14-ali-ultraterrene","l":14,"n":"Ali Ultraterrene","x":"Con un'azione bonus fai spuntare ali spettrali: velocità di volo di 9 m."},{"id":"str-divinesoul-18-recupero-ultraterreno","l":18,"n":"Recupero Ultraterreno","x":"Con un'azione bonus, se hai meno di metà PF, recuperi PF pari a metà del massimo. Una volta per riposo lungo."}],"spells":null},{"k":"shadow","n":"Magia delle Ombre","src":"XGE","f":[{"id":"str-shadow-1-occhi-del-buio","l":1,"n":"Occhi del Buio","x":"Hai scurovisione entro 36 m; dal 3° livello conosci Oscurità e, spendendo 2 punti, la lanci potendo vedere attraverso di essa."},{"id":"str-shadow-1-forza-della-tomba","l":1,"n":"Forza della Tomba","x":"Quando scenderesti a 0 PF senza essere ucciso da un critico o da danni radiosi, puoi fare un TS su Carisma (CD 5 + danni) per restare a 1 PF. Una volta per riposo lungo."},{"id":"str-shadow-6-mastino-dei-presagi","l":6,"n":"Mastino dei Presagi","x":"Con un'azione bonus e 3 punti evochi un mastino ombra che insegue una creatura: questa ha svantaggio ai TS contro i tuoi incantesimi finché il mastino le è vicino."},{"id":"str-shadow-14-passo-dombra","l":14,"n":"Passo d'Ombra","x":"In luce fioca o oscurità, con un'azione bonus ti teletrasporti fino a 36 m verso un'altra zona in penombra."},{"id":"str-shadow-18-forma-umbrale","l":18,"n":"Forma Umbrale","x":"Con un'azione bonus e 6 punti diventi un'ombra per 1 minuto: resistenza a tutti i danni tranne forza e radiosi, e attraversi creature e oggetti."}],"spells":null},{"k":"stormsorcery","n":"Stregoneria della Tempesta","src":"XGE","f":[{"id":"str-stormsorcery-1-mente-del-vento","l":1,"n":"Mente del Vento","x":"Parli, leggi e scrivi il primordiale."},{"id":"str-stormsorcery-1-magia-tempestosa","l":1,"n":"Magia Tempestosa","x":"Prima o dopo aver lanciato un incantesimo di 1° livello o superiore, con un'azione bonus voli fino a 3 m senza provocare attacchi di opportunità."},{"id":"str-stormsorcery-6-cuore-della-tempesta","l":6,"n":"Cuore della Tempesta","x":"Hai resistenza a fulmine e tuono; quando lanci un incantesimo di questi tipi, le creature a tua scelta entro 3 m subiscono danni pari a metà del tuo livello."},{"id":"str-stormsorcery-6-guida-della-tempesta","l":6,"n":"Guida della Tempesta","x":"Con un'azione fermi la pioggia attorno a te o cambi la direzione del vento entro 30 m."},{"id":"str-stormsorcery-14-furia-della-tempesta","l":14,"n":"Furia della Tempesta","x":"Quando una creatura ti colpisce in mischia, con la reazione le infliggi danni da fulmine pari al tuo livello e la spingi fino a 6 m (TS su Forza)."},{"id":"str-stormsorcery-18-anima-del-vento","l":18,"n":"Anima del Vento","x":"Sei immune a fulmine e tuono, hai volo 18 m e, con un'azione, puoi dare volo 9 m ad alleati per 1 ora (una volta per riposo breve o lungo)."}],"spells":null},{"k":"aberrantmind","n":"Mente Aberrante","src":"TCE","f":[{"id":"str-aberrantmind-1-incantesimi-psionici","l":1,"n":"Incantesimi Psionici","x":"Impari gli incantesimi psionici della sottoclasse, che non contano tra quelli conosciuti e puoi sostituire con altri di divinazione o ammaliamento."},{"id":"str-aberrantmind-1-parlare-telepatico","l":1,"n":"Parlare Telepatico","x":"Con un'azione bonus crei un legame telepatico con una creatura entro 9 m per minuti pari al tuo livello."},{"id":"str-aberrantmind-6-stregoneria-psionica","l":6,"n":"Stregoneria Psionica","x":"Puoi lanciare gli incantesimi psionici spendendo punti stregoneria pari al livello, senza componenti verbali né somatiche."},{"id":"str-aberrantmind-6-difese-psichiche","l":6,"n":"Difese Psichiche","x":"Hai resistenza ai danni psichici e vantaggio ai TS contro charme e paura."},{"id":"str-aberrantmind-14-rivelazione-nella-carne","l":14,"n":"Rivelazione nella Carne","x":"Con un'azione bonus e 1 o più punti ottieni per 10 minuti: vedere l'invisibile, volo, nuoto e respiro subacqueo, oppure passare per spazi strettissimi."},{"id":"str-aberrantmind-18-implosione-deformante","l":18,"n":"Implosione Deformante","x":"Con un'azione ti teletrasporti fino a 36 m e le creature entro 9 m dal punto di partenza subiscono 3d10 danni da forza e vengono attirate lì. Una volta per riposo lungo (o 5 punti)."}],"spells":{"mode":"always","g":[[1,"arms-of-hadar"],[1,"dissonant-whispers"],[1,"mind-sliver"],[3,"calm-emotions"],[3,"detect-thoughts"],[5,"hunger-of-hadar"],[5,"sending"],[7,"evards-black-tentacles"],[7,"summon-aberration"],[9,"rarys-telepathic-bond"],[9,"telekinesis"]]}},{"k":"clockwork","n":"Anima del Meccanismo","src":"TCE","f":[{"id":"str-clockwork-1-magia-dei-meccanismi","l":1,"n":"Magia dei Meccanismi","x":"Impari gli incantesimi della sottoclasse, che non contano tra quelli conosciuti; puoi sostituirli con altri di abiurazione o trasmutazione."},{"id":"str-clockwork-1-ristabilire-lequilibrio","l":1,"n":"Ristabilire l'Equilibrio","x":"Quando una creatura entro 18 m tira con vantaggio o svantaggio, con la reazione lo annulli. Usi pari alla competenza per riposo lungo."},{"id":"str-clockwork-6-bastione-della-legge","l":6,"n":"Bastione della Legge","x":"Con un'azione spendi da 1 a 5 punti per proteggere una creatura con altrettanti d8: quando subisce danni può spenderli per ridurli."},{"id":"str-clockwork-14-trance-dellordine","l":14,"n":"Trance dell'Ordine","x":"Con un'azione bonus, per 1 minuto gli attacchi contro di te non hanno vantaggio e nei tuoi tiri un 9 o meno conta come 10. Una volta per riposo lungo (o 5 punti)."},{"id":"str-clockwork-18-cavalcata-meccanica","l":18,"n":"Cavalcata Meccanica","x":"Con un'azione evochi spiriti di Mechanus in un cubo di 9 m: ripartisci 100 PF di cura, ripari oggetti e termini incantesimi di 6° livello o inferiore. Una volta per riposo lungo (o 7 punti)."}],"spells":{"mode":"always","g":[[1,"alarm"],[1,"protection-from-evil-and-good"],[3,"aid"],[3,"lesser-restoration"],[5,"dispel-magic"],[5,"protection-from-energy"],[7,"freedom-of-movement"],[7,"summon-construct"],[9,"greater-restoration"],[9,"wall-of-force"]]}}]},{"k":"war","n":"Warlock","src":"PHB","hd":"d8","subLabel":"Patrono Ultraterreno","subLvl":1,"list":"W","f":[{"id":"war-1-magia-del-patto","l":1,"n":"Magia del Patto","x":"Usi il Carisma. Hai pochi slot, tutti del livello massimo disponibile (fino al 5°), recuperati con un riposo breve o lungo; conosci un numero fisso di incantesimi della lista del warlock."},{"id":"war-2-suppliche-occulte","l":2,"n":"Suppliche Occulte","x":"Impari due suppliche occulte, doni permanenti del patrono (ad esempio Deflagrazione Agonizzante, Vista del Diavolo, Armatura d'Ombre). Ne impari altre al 5°, 7°, 9°, 12°, 15° e 18° livello e puoi sostituirne una a ogni livello."},{"id":"war-3-dono-del-patto","l":3,"n":"Dono del Patto","x":"Scegli Patto della Catena (famiglio speciale), della Lama (arma magica evocata) o del Tomo (Libro delle Ombre con tre trucchetti). Tasha aggiunge il Patto del Talismano (+1d4 alle prove fallite)."},{"id":"war-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"war-4-versatilit-occulta","l":4,"n":"Versatilità Occulta","x":"Opzionale (Tasha): ogni volta che ottieni un Aumento dei Punteggi di Caratteristica puoi sostituire un trucchetto, il Dono del Patto o un Arcanum Mistico.","opt":1},{"id":"war-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"war-11-arcanum-mistico-6","l":11,"n":"Arcanum Mistico (6°)","x":"Scegli un incantesimo di 6° livello dalla lista del warlock: puoi lanciarlo una volta senza slot, recuperando l'uso con un riposo lungo."},{"id":"war-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"war-13-arcanum-mistico-7","l":13,"n":"Arcanum Mistico (7°)","x":"Scegli un incantesimo di 7° livello, lanciabile una volta per riposo lungo senza slot."},{"id":"war-15-arcanum-mistico-8","l":15,"n":"Arcanum Mistico (8°)","x":"Scegli un incantesimo di 8° livello, lanciabile una volta per riposo lungo senza slot."},{"id":"war-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"war-17-arcanum-mistico-9","l":17,"n":"Arcanum Mistico (9°)","x":"Scegli un incantesimo di 9° livello, lanciabile una volta per riposo lungo senza slot."},{"id":"war-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"war-20-maestro-dellocculto","l":20,"n":"Maestro dell'Occulto","x":"Con 1 minuto di supplica recuperi tutti gli slot della Magia del Patto. Una volta per riposo lungo."}],"subs":[{"k":"archfey","n":"L'Arcifata","src":"PHB","f":[{"id":"war-archfey-1-presenza-fatata","l":1,"n":"Presenza Fatata","x":"Con un'azione le creature in un cubo di 3 m attorno a te devono superare un TS su Saggezza o restare affascinate o spaventate (a tua scelta) fino alla fine del tuo prossimo turno. Una volta per riposo breve o lungo."},{"id":"war-archfey-6-fuga-nebbiosa","l":6,"n":"Fuga Nebbiosa","x":"Quando subisci danni, con la reazione diventi invisibile e ti teletrasporti fino a 18 m. Una volta per riposo breve o lungo."},{"id":"war-archfey-10-difese-seducenti","l":10,"n":"Difese Seducenti","x":"Sei immune al charme; quando qualcuno tenta di affascinarti, con la reazione puoi rivolgere il charme contro di lui."},{"id":"war-archfey-14-delirio-oscuro","l":14,"n":"Delirio Oscuro","x":"Con un'azione una creatura entro 18 m deve superare un TS su Saggezza o restare affascinata o spaventata per 1 minuto, perduta in un regno illusorio. Una volta per riposo breve o lungo."}],"spells":{"mode":"list","g":[[1,"faerie-fire"],[1,"sleep"],[3,"calm-emotions"],[3,"phantasmal-force"],[5,"blink"],[5,"plant-growth"],[7,"dominate-beast"],[7,"greater-invisibility"],[9,"dominate-person"],[9,"seeming"]]}},{"k":"fiend","n":"L'Immondo","src":"PHB","f":[{"id":"war-fiend-1-benedizione-delloscuro","l":1,"n":"Benedizione dell'Oscuro","x":"Quando riduci una creatura ostile a 0 PF, ottieni PF temporanei pari a mod. di Carisma + livello da warlock."},{"id":"war-fiend-6-fortuna-delloscuro","l":6,"n":"Fortuna dell'Oscuro","x":"Quando fai una prova di caratteristica o un TS, puoi aggiungere 1d10. Una volta per riposo breve o lungo."},{"id":"war-fiend-10-resilienza-immonda","l":10,"n":"Resilienza Immonda","x":"Dopo un riposo scegli un tipo di danno: hai resistenza a esso (tranne se da armi magiche o d'argento)."},{"id":"war-fiend-14-scagliare-allinferno","l":14,"n":"Scagliare all'Inferno","x":"Quando colpisci una creatura, la scagli per un istante nei piani inferiori: subisce 10d10 danni psichici se non è un immondo. Una volta per riposo lungo."}],"spells":{"mode":"list","g":[[1,"burning-hands"],[1,"command"],[3,"blindness-deafness"],[3,"scorching-ray"],[5,"fireball"],[5,"stinking-cloud"],[7,"fire-shield"],[7,"wall-of-fire"],[9,"flame-strike"],[9,"hallow"]]}},{"k":"greatoldone","n":"Il Grande Antico","src":"PHB","f":[{"id":"war-greatoldone-1-mente-risvegliata","l":1,"n":"Mente Risvegliata","x":"Puoi parlare telepaticamente con qualsiasi creatura entro 9 m che conosca una lingua."},{"id":"war-greatoldone-6-protezione-entropica","l":6,"n":"Protezione Entropica","x":"Quando una creatura ti attacca, con la reazione le imponi svantaggio; se manca, hai vantaggio al tuo prossimo attacco contro di lei. Una volta per riposo breve o lungo."},{"id":"war-greatoldone-10-scudo-del-pensiero","l":10,"n":"Scudo del Pensiero","x":"I tuoi pensieri non possono essere letti, hai resistenza ai danni psichici e chi te li infligge ne subisce altrettanti."},{"id":"war-greatoldone-14-creare-schiavo","l":14,"n":"Creare Schiavo","x":"Con un'azione tocchi un umanoide incapacitato: resta affascinato da te finché Rimuovi Maledizione non lo libera."}],"spells":{"mode":"list","g":[[1,"dissonant-whispers"],[1,"tashas-hideous-laughter"],[3,"detect-thoughts"],[3,"phantasmal-force"],[5,"clairvoyance"],[5,"sending"],[7,"dominate-beast"],[7,"evards-black-tentacles"],[9,"dominate-person"],[9,"telekinesis"]]}},{"k":"celestial","n":"Il Celestiale","src":"XGE","f":[{"id":"war-celestial-1-trucchetti-bonus","l":1,"n":"Trucchetti Bonus","x":"Impari Luce e Fiamma Sacra, che contano come trucchetti da warlock."},{"id":"war-celestial-1-luce-guaritrice","l":1,"n":"Luce Guaritrice","x":"Hai una riserva di d6 pari a 1 + livello da warlock: con un'azione bonus ne spendi fino al tuo mod. di Carisma per curare una creatura entro 18 m."},{"id":"war-celestial-6-anima-radiosa","l":6,"n":"Anima Radiosa","x":"Hai resistenza ai danni radiosi; aggiungi il mod. di Carisma a un tiro di danni degli incantesimi di fuoco o radiosi."},{"id":"war-celestial-10-resilienza-celestiale","l":10,"n":"Resilienza Celestiale","x":"Alla fine di un riposo ottieni PF temporanei pari a livello + Carisma, e fino a cinque alleati metà di quel valore."},{"id":"war-celestial-14-vendetta-ardente","l":14,"n":"Vendetta Ardente","x":"Quando fai un TS contro la morte, puoi rialzarti con metà dei PF e infliggere 2d8 + Carisma danni radiosi alle creature entro 9 m, accecandole. Una volta per riposo lungo."}],"spells":{"mode":"list","g":[[1,"cure-wounds"],[1,"guiding-bolt"],[3,"flaming-sphere"],[3,"lesser-restoration"],[5,"daylight"],[5,"revivify"],[7,"guardian-of-faith"],[7,"wall-of-fire"],[9,"flame-strike"],[9,"greater-restoration"]]}},{"k":"hexblade","n":"Il Sigillo","src":"XGE","f":[{"id":"war-hexblade-1-guerriero-maledetto","l":1,"n":"Guerriero Maledetto","x":"Ottieni competenza con armature medie, scudi e armi da guerra; per un'arma a una mano (o l'arma del patto) usi il Carisma per attacchi e danni."},{"id":"war-hexblade-1-maledizione-del-sigillo","l":1,"n":"Maledizione del Sigillo","x":"Con un'azione bonus maledici una creatura entro 9 m per 1 minuto: aggiungi la competenza ai danni contro di lei, fai critico con 19-20 e quando muore recuperi PF pari a livello + Carisma. Una volta per riposo breve o lungo."},{"id":"war-hexblade-6-spettro-maledetto","l":6,"n":"Spettro Maledetto","x":"Quando uccidi un umanoide, ne rialzi lo spirito come spettro al tuo servizio fino alla fine del tuo prossimo riposo lungo. Una volta per riposo lungo."},{"id":"war-hexblade-10-armatura-dei-sortilegi","l":10,"n":"Armatura dei Sortilegi","x":"Quando la creatura maledetta ti colpisce, con la reazione tiri un d6: con 4 o più l'attacco manca."},{"id":"war-hexblade-14-padrone-dei-sortilegi","l":14,"n":"Padrone dei Sortilegi","x":"Quando la creatura maledetta muore, puoi trasferire la maledizione a un'altra creatura entro 9 m senza recuperare PF."}],"spells":{"mode":"list","g":[[1,"shield"],[1,"wrathful-smite"],[3,"blur"],[3,"branding-smite"],[5,"blink"],[5,"elemental-weapon"],[7,"phantasmal-killer"],[7,"staggering-smite"],[9,"banishing-smite"],[9,"cone-of-cold"]]}},{"k":"fathomless","n":"L'Insondabile","src":"TCE","f":[{"id":"war-fathomless-1-tentacolo-degli-abissi","l":1,"n":"Tentacolo degli Abissi","x":"Con un'azione bonus evochi un tentacolo spettrale per 1 minuto: attacca con un'azione bonus, 1d8 danni da freddo (2d8 al 10°) e velocità del bersaglio −3 m. Usi pari alla competenza per riposo lungo."},{"id":"war-fathomless-1-dono-del-mare","l":1,"n":"Dono del Mare","x":"Hai velocità di nuoto di 12 m e respiri sott'acqua."},{"id":"war-fathomless-6-anima-oceanica","l":6,"n":"Anima Oceanica","x":"Hai resistenza ai danni da freddo e puoi comunicare sott'acqua con chi conosce una lingua."},{"id":"war-fathomless-6-spire-protettive","l":6,"n":"Spire Protettive","x":"Quando tu o una creatura vicina al tentacolo subite danni, con la reazione li riducete di 1d8 (2d8 al 10°)."},{"id":"war-fathomless-10-tentacoli-afferranti","l":10,"n":"Tentacoli Afferranti","x":"Impari Tentacoli Neri di Evard e puoi lanciarlo una volta senza slot; lanciandolo ottieni PF temporanei e i danni non ti fanno perdere la concentrazione."},{"id":"war-fathomless-14-tuffo-insondabile","l":14,"n":"Tuffo Insondabile","x":"Con 1 minuto di rituale teletrasporti te e fino a cinque alleati verso uno specchio d'acqua che conosci entro 1,5 km. Una volta per riposo lungo."}],"spells":{"mode":"list","g":[[1,"create-or-destroy-water"],[1,"thunderwave"],[3,"gust-of-wind"],[3,"silence"],[5,"lightning-bolt"],[5,"sleet-storm"],[7,"control-water"],[7,"summon-elemental"],[9,"bigbys-hand"],[9,"cone-of-cold"]]}},{"k":"genie","n":"Il Genio","src":"TCE","f":[{"id":"war-genie-1-vaso-del-genio","l":1,"n":"Vaso del Genio","x":"Il patrono ti dà un piccolo vaso: con un'azione puoi entrarvi per riposare (ore pari alla competenza). Ira del Genio: una volta per turno aggiungi la competenza ai danni di un colpo, del tipo del tuo genio (Dao, Djinni, Efreeti, Marid)."},{"id":"war-genie-1-incantesimi-del-genio","l":1,"n":"Incantesimi del Genio","x":"In base al tipo di genio ottieni una lista ampliata (ad esempio Djinni: Onda Tonante, Folata di Vento, Protezione dall'Energia; Efreeti: Mani Brucianti, Raggio Rovente, Palla di Fuoco) più incantesimi comuni come Individuazione del Bene e del Male e Desiderio al 9° livello del patto. Aggiungili dalla tua lista con «Da un'altra classe»."},{"id":"war-genie-6-dono-elementale","l":6,"n":"Dono Elementale","x":"Hai resistenza al tipo di danno del tuo genio e, con un'azione bonus, volo 9 m per 10 minuti (usi pari alla competenza)."},{"id":"war-genie-10-vaso-santuario","l":10,"n":"Vaso Santuario","x":"Puoi portare fino a cinque creature nel vaso, e un riposo breve lì dura 10 minuti e fa recuperare PF extra."},{"id":"war-genie-14-desiderio-limitato","l":14,"n":"Desiderio Limitato","x":"Con un'azione lanci un incantesimo di 6° livello o inferiore da qualsiasi lista, con tempo di lancio di 1 azione, senza componenti. Poi non puoi riusarlo per 1d4 riposi lunghi."}],"spells":null}]},{"k":"art","n":"Artefice","src":"TCE","hd":"d8","subLabel":"Specialista","subLvl":3,"list":"A","f":[{"id":"art-1-artigiano-magico","l":1,"n":"Artigiano Magico","x":"Con un'azione e strumenti da ladro o da artigiano infondi un oggetto minuscolo di una piccola proprietà magica (luce, messaggio registrato, odore o suono, immagine). Ne puoi avere tanti quanto il tuo mod. di Intelligenza."},{"id":"art-1-incantesimi","l":1,"n":"Incantesimi","x":"Sei un mezzo incantatore (arrotondato per eccesso) che usa l'Intelligenza: ogni giorno prepari incantesimi dalla lista dell'artefice pari a mod. di Intelligenza + metà del livello, e usi strumenti come focus."},{"id":"art-2-infondere-oggetti","l":2,"n":"Infondere Oggetti","x":"Conosci quattro infusioni (ad esempio Arma Potenziata, Armatura Potenziata, Borsa Conservante, Scudo Respingente) e puoi averne due attive dopo un riposo lungo. Il numero cresce con il livello."},{"id":"art-3-lo-strumento-giusto","l":3,"n":"Lo Strumento Giusto","x":"Con 1 ora di lavoro crei un set di strumenti da artigiano che dura fino al riposo successivo."},{"id":"art-4-aumento-dei-punteggi-di-caratteristica","l":4,"n":"Aumento dei Punteggi di Caratteristica","x":"Aumenta un punteggio di caratteristica di 2 o due punteggi di 1 (massimo 20), oppure scegli un talento. Anche all'8°, 12°, 16° e 19° livello."},{"id":"art-6-maestria-negli-strumenti","l":6,"n":"Maestria negli Strumenti","x":"Raddoppi il bonus di competenza nelle prove con gli strumenti in cui sei competente."},{"id":"art-7-lampo-di-genio","l":7,"n":"Lampo di Genio","x":"Quando tu o una creatura entro 9 m fate una prova o un TS, con la reazione aggiungete il tuo mod. di Intelligenza. Usi pari al mod. di Intelligenza per riposo lungo."},{"id":"art-8-aumento-dei-punteggi-di-caratteristica","l":8,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"art-10-esperto-di-oggetti-magici","l":10,"n":"Esperto di Oggetti Magici","x":"Puoi essere in sintonia con quattro oggetti magici e creare oggetti comuni e non comuni in un quarto del tempo e a metà prezzo."},{"id":"art-11-oggetto-conservaincantesimi","l":11,"n":"Oggetto Conservaincantesimi","x":"Dopo un riposo lungo immagazzini in un oggetto un incantesimo da artefice di 1° o 2° livello con tempo di lancio di 1 azione: chi lo tiene può lanciarlo un numero di volte pari al doppio del tuo mod. di Intelligenza."},{"id":"art-12-aumento-dei-punteggi-di-caratteristica","l":12,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"art-14-sapiente-di-oggetti-magici","l":14,"n":"Sapiente di Oggetti Magici","x":"Puoi essere in sintonia con cinque oggetti e ignori i requisiti di classe, specie, incantesimi e livello per usarli."},{"id":"art-16-aumento-dei-punteggi-di-caratteristica","l":16,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"art-18-maestro-di-oggetti-magici","l":18,"n":"Maestro di Oggetti Magici","x":"Puoi essere in sintonia con sei oggetti magici."},{"id":"art-19-aumento-dei-punteggi-di-caratteristica","l":19,"n":"Aumento dei Punteggi di Caratteristica","x":"Come al 4° livello."},{"id":"art-20-anima-dellartificio","l":20,"n":"Anima dell'Artificio","x":"Ottieni +1 a tutti i TS per ogni oggetto in sintonia; quando scenderesti a 0 PF puoi porre fine a un'infusione per restare a 1 PF."}],"subs":[{"k":"alchemist","n":"Alchimista","src":"TCE","f":[{"id":"art-alchemist-3-competenza-con-gli-strumenti","l":3,"n":"Competenza con gli Strumenti","x":"Ottieni competenza con le scorte da alchimista."},{"id":"art-alchemist-3-elisir-sperimentale","l":3,"n":"Elisir Sperimentale","x":"Dopo un riposo lungo crei gratis un elisir casuale (Guarigione, Rapidità, Resilienza, Audacia, Volo, Trasformazione); puoi crearne altri spendendo slot."},{"id":"art-alchemist-5-studioso-alchemico","l":5,"n":"Studioso Alchemico","x":"Una volta per turno, con un incantesimo che usa le scorte da alchimista aggiungi il mod. di Intelligenza a un tiro di cura o di danni da acido, fuoco, necrotico o veleno."},{"id":"art-alchemist-9-reagenti-rigeneranti","l":9,"n":"Reagenti Rigeneranti","x":"Chi beve un tuo elisir ottiene PF temporanei pari a 2d6 + Intelligenza; puoi lanciare Ristorare Inferiore gratis (usi pari all'Intelligenza)."},{"id":"art-alchemist-15-padronanza-chimica","l":15,"n":"Padronanza Chimica","x":"Hai resistenza ad acido e veleno e sei immune all'avvelenamento; puoi lanciare Ristorare Superiore e Guarigione una volta ciascuno senza slot."}],"spells":{"mode":"always","g":[[3,"healing-word"],[3,"ray-of-sickness"],[5,"flaming-sphere"],[5,"melfs-acid-arrow"],[9,"gaseous-form"],[9,"mass-healing-word"],[13,"blight"],[13,"death-ward"],[17,"cloudkill"],[17,"raise-dead"]]}},{"k":"armorer","n":"Corazzato","src":"TCE","f":[{"id":"art-armorer-3-strumenti-del-mestiere","l":3,"n":"Strumenti del Mestiere","x":"Ottieni competenza con le armature pesanti e con gli strumenti da fabbro."},{"id":"art-armorer-3-armatura-arcana","l":3,"n":"Armatura Arcana","x":"La tua armatura diventa il tuo focus, copre tutto il corpo, sostituisce gli arti mancanti e puoi indossarla o toglierla con un'azione."},{"id":"art-armorer-3-modello-darmatura","l":3,"n":"Modello d'Armatura","x":"Guardiano: Guanti del Tuono (1d8 tuono, svantaggio ad attaccare altri) e Campo Difensivo (PF temporanei con azione bonus). Infiltratore: Lanciafulmini (1d6 fulmine, +1d6 una volta per turno), passi silenziosi e velocità +1,5 m."},{"id":"art-armorer-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco attacchi due volte."},{"id":"art-armorer-9-modifiche-allarmatura","l":9,"n":"Modifiche all'Armatura","x":"L'armatura conta come più oggetti per le infusioni: ne puoi avere due in più attive su di essa."},{"id":"art-armorer-15-armatura-perfezionata","l":15,"n":"Armatura Perfezionata","x":"Guardiano: con la reazione attiri una creatura Enorme o più piccola e la colpisci. Infiltratore: il bersaglio del Lanciafulmini brilla e subisce danni extra."}],"spells":{"mode":"always","g":[[3,"magic-missile"],[3,"thunderwave"],[5,"mirror-image"],[5,"shatter"],[9,"hypnotic-pattern"],[9,"lightning-bolt"],[13,"fire-shield"],[13,"greater-invisibility"],[17,"passwall"],[17,"wall-of-force"]]}},{"k":"artillerist","n":"Artigliere","src":"TCE","f":[{"id":"art-artillerist-3-competenza-con-gli-strumenti","l":3,"n":"Competenza con gli Strumenti","x":"Ottieni competenza con gli strumenti da intagliatore."},{"id":"art-artillerist-3-cannone-occulto","l":3,"n":"Cannone Occulto","x":"Con un'azione crei un cannone (una volta per riposo lungo, o spendendo uno slot): Lanciafiamme (cono di 4,5 m, 2d8 fuoco), Balista di Forza (2d8 forza e spinta) o Protettore (1d8 + Intelligenza PF temporanei agli alleati). Lo attivi con un'azione bonus."},{"id":"art-artillerist-5-arma-da-fuoco-arcana","l":5,"n":"Arma da Fuoco Arcana","x":"Intagli una bacchetta o un bastone: gli incantesimi da artefice lanciati attraverso di esso infliggono 1d8 danni extra."},{"id":"art-artillerist-9-cannone-esplosivo","l":9,"n":"Cannone Esplosivo","x":"I danni del cannone aumentano di 1d8; con un'azione puoi farlo esplodere (3d8 forza in 6 m)."},{"id":"art-artillerist-15-posizione-fortificata","l":15,"n":"Posizione Fortificata","x":"Puoi avere due cannoni attivi, e tu e gli alleati entro 3 m da un cannone avete copertura parziale."}],"spells":{"mode":"always","g":[[3,"shield"],[3,"thunderwave"],[5,"scorching-ray"],[5,"shatter"],[9,"fireball"],[9,"wind-wall"],[13,"ice-storm"],[13,"wall-of-fire"],[17,"cone-of-cold"],[17,"wall-of-force"]]}},{"k":"battlesmith","n":"Fabbro da Battaglia","src":"TCE","f":[{"id":"art-battlesmith-3-competenza-con-gli-strumenti","l":3,"n":"Competenza con gli Strumenti","x":"Ottieni competenza con gli strumenti da fabbro."},{"id":"art-battlesmith-3-pronto-alla-battaglia","l":3,"n":"Pronto alla Battaglia","x":"Ottieni competenza con le armi da guerra e usi l'Intelligenza per attacchi e danni con le armi magiche."},{"id":"art-battlesmith-3-difensore-dacciaio","l":3,"n":"Difensore d'Acciaio","x":"Costruisci un difensore d'acciaio, un costrutto che combatte al tuo fianco: agisce nel tuo turno con la tua azione bonus e può proteggere gli alleati con la reazione."},{"id":"art-battlesmith-5-attacco-extra","l":5,"n":"Attacco Extra","x":"Quando effettui l'azione di Attacco attacchi due volte."},{"id":"art-battlesmith-9-scarica-arcana","l":9,"n":"Scarica Arcana","x":"Una volta per turno, quando tu o il difensore colpite, infliggete 2d6 danni da forza extra oppure curate 2d6 una creatura entro 9 m."},{"id":"art-battlesmith-15-difensore-migliorato","l":15,"n":"Difensore Migliorato","x":"La Scarica Arcana diventa 4d6, il difensore ha +2 alla CA e la sua reazione infligge danni da forza all'attaccante."}],"spells":{"mode":"always","g":[[3,"heroism"],[3,"shield"],[5,"branding-smite"],[5,"warding-bond"],[9,"aura-of-vitality"],[9,"conjure-barrage"],[13,"aura-of-purity"],[13,"fire-shield"],[17,"banishing-smite"],[17,"mass-cure-wounds"]]}}]}],"feats":[{"id":"alert","en":"Alert","n":"Allerta","pre":"","src":"PHB","x":"+5 all'iniziativa; non puoi essere sorpreso mentre sei cosciente; le creature nascoste non ottengono vantaggio ad attaccarti."},{"id":"athlete","en":"Athlete","n":"Atleta","pre":"","src":"PHB","x":"+1 a Forza o Destrezza. Rialzarti da prono costa solo 1,5 m, scalare non costa movimento extra e puoi saltare con soli 1,5 m di rincorsa."},{"id":"actor","en":"Actor","n":"Attore","pre":"","src":"PHB","x":"+1 a Carisma. Vantaggio alle prove di Inganno e Intrattenere quando ti spacci per qualcun altro, e puoi imitare voci e suoni (Intuizione contro il tuo Inganno per smascherarti)."},{"id":"charger","en":"Charger","n":"Caricatore","pre":"","src":"PHB","x":"Quando Scatti, con un'azione bonus puoi fare un attacco in mischia (+5 ai danni) o spingere il bersaglio di 3 m, se ti sei mosso di almeno 3 m in linea retta."},{"id":"crossbow-expert","en":"Crossbow Expert","n":"Esperto di Balestre","pre":"","src":"PHB","x":"Ignori la proprietà ricarica delle balestre, non hai svantaggio agli attacchi a distanza con un nemico vicino e, attaccando con un'arma a una mano, puoi sparare con una balestra a mano con un'azione bonus."},{"id":"defensive-duelist","en":"Defensive Duelist","n":"Duellante Difensivo","pre":"Destrezza 13","src":"PHB","x":"Impugnando un'arma accurata in cui sei competente, con la reazione aggiungi la competenza alla CA contro un attacco in mischia."},{"id":"dual-wielder","en":"Dual Wielder","n":"Combattere con Due Armi","pre":"","src":"PHB","x":"+1 alla CA quando impugni due armi da mischia, puoi combattere con due armi anche non leggere e puoi estrarre o riporre due armi insieme."},{"id":"dungeon-delver","en":"Dungeon Delver","n":"Esploratore di Dungeon","pre":"","src":"PHB","x":"Vantaggio alle prove per individuare porte segrete e ai TS contro le trappole, resistenza ai danni delle trappole, e cerchi trappole a velocità normale."},{"id":"durable","en":"Durable","n":"Resistente","pre":"","src":"PHB","x":"+1 a Costituzione. Quando spendi un Dado Vita per curarti, recuperi almeno il doppio del tuo mod. di Costituzione (minimo 2)."},{"id":"elemental-adept","en":"Elemental Adept","n":"Adepto Elementale","pre":"Capacità di lanciare almeno un incantesimo","src":"PHB","x":"Scegli acido, freddo, fuoco, fulmine o tuono: i tuoi incantesimi ignorano la resistenza a quel danno e i dadi che fanno 1 contano come 2. Puoi prenderlo più volte."},{"id":"grappler","en":"Grappler","n":"Lottatore","pre":"Forza 13","src":"PHB","x":"Hai vantaggio agli attacchi contro una creatura che stai afferrando e puoi tentare di immobilizzarla (entrambi trattenuti)."},{"id":"great-weapon-master","en":"Great Weapon Master","n":"Maestro delle Armi Possenti","pre":"","src":"PHB","x":"Quando metti a segno un critico o riduci una creatura a 0 PF in mischia, fai un attacco con un'azione bonus. Prima di attaccare con un'arma pesante puoi subire −5 al tiro per colpire per +10 ai danni."},{"id":"healer","en":"Healer","n":"Guaritore","pre":"","src":"PHB","x":"Stabilizzare con il kit del guaritore fa recuperare 1 PF; con un'azione e un uso del kit curi 1d6 + 4 + i Dadi Vita della creatura (una volta per riposo per creatura)."},{"id":"heavily-armored","en":"Heavily Armored","n":"Addestrato nelle Armature Pesanti","pre":"Competenza con armature medie","src":"PHB","x":"+1 a Forza. Ottieni competenza con le armature pesanti."},{"id":"heavy-armor-master","en":"Heavy Armor Master","n":"Maestro delle Armature Pesanti","pre":"Competenza con armature pesanti","src":"PHB","x":"+1 a Forza. Con un'armatura pesante riduci di 3 i danni contundenti, perforanti e taglienti delle armi non magiche."},{"id":"inspiring-leader","en":"Inspiring Leader","n":"Leader Ispiratore","pre":"Carisma 13","src":"PHB","x":"Con un discorso di 10 minuti fino a sei creature ottengono PF temporanei pari a livello + mod. di Carisma. Una volta per riposo per creatura."},{"id":"keen-mind","en":"Keen Mind","n":"Mente Acuta","pre":"","src":"PHB","x":"+1 a Intelligenza. Sai sempre dov'è il nord e quante ore mancano all'alba o al tramonto, e ricordi tutto ciò che hai visto o sentito nell'ultimo mese."},{"id":"lightly-armored","en":"Lightly Armored","n":"Addestrato nelle Armature Leggere","pre":"","src":"PHB","x":"+1 a Forza o Destrezza. Ottieni competenza con le armature leggere."},{"id":"linguist","en":"Linguist","n":"Linguista","pre":"","src":"PHB","x":"+1 a Intelligenza. Impari tre lingue e sai creare cifrari scritti (Intelligenza CD pari a punteggio + competenza per decifrarli)."},{"id":"lucky","en":"Lucky","n":"Fortunato","pre":"","src":"PHB","x":"Hai 3 punti fortuna per riposo lungo: spendine uno per tirare un d20 aggiuntivo in un tuo tiro per colpire, prova o TS, oppure in un attacco contro di te, e scegli quale usare."},{"id":"mage-slayer","en":"Mage Slayer","n":"Uccisore di Maghi","pre":"","src":"PHB","x":"Quando una creatura entro 1,5 m lancia un incantesimo, con la reazione la attacchi in mischia; chi colpisci ha svantaggio a mantenere la concentrazione; hai vantaggio ai TS contro incantesimi lanciati da creature entro 1,5 m."},{"id":"magic-initiate","en":"Magic Initiate","n":"Iniziato alla Magia","pre":"","src":"PHB","x":"Scegli una classe tra bardo, chierico, druido, stregone, warlock e mago: impari due trucchetti e un incantesimo di 1° livello della sua lista, che puoi lanciare una volta per riposo lungo senza slot. Aggiungili con «Da un'altra classe»."},{"id":"martial-adept","en":"Martial Adept","n":"Adepto Marziale","pre":"","src":"PHB","x":"Impari due manovre del Maestro di Battaglia e ottieni un dado di superiorità (d6), recuperato con un riposo breve o lungo."},{"id":"medium-armor-master","en":"Medium Armor Master","n":"Maestro delle Armature Medie","pre":"Competenza con armature medie","src":"PHB","x":"Le armature medie non ti danno svantaggio a Furtività e ti permettono di sommare fino a +3 di Destrezza alla CA."},{"id":"mobile","en":"Mobile","n":"Mobile","pre":"","src":"PHB","x":"La tua velocità aumenta di 3 m; Scattando ignori il terreno difficile; le creature che attacchi in mischia non possono fare attacchi di opportunità contro di te nel turno."},{"id":"moderately-armored","en":"Moderately Armored","n":"Addestrato nelle Armature Medie","pre":"Competenza con armature leggere","src":"PHB","x":"+1 a Forza o Destrezza. Ottieni competenza con armature medie e scudi."},{"id":"mounted-combatant","en":"Mounted Combatant","n":"Combattente in Sella","pre":"","src":"PHB","x":"In sella hai vantaggio contro le creature non montate più piccole della tua cavalcatura, puoi deviare su di te gli attacchi alla cavalcatura, e questa ottiene l'Elusione."},{"id":"observant","en":"Observant","n":"Osservatore","pre":"","src":"PHB","x":"+1 a Intelligenza o Saggezza. Leggi le labbra e ottieni +5 alla Percezione e all'Indagare passivi."},{"id":"polearm-master","en":"Polearm Master","n":"Maestro delle Armi ad Asta","pre":"","src":"PHB","x":"Con alabarda, falcione, bastone o lancia puoi fare un attacco bonus con l'altra estremità (1d4 contundenti); le creature che entrano nella tua portata provocano un attacco di opportunità."},{"id":"resilient","en":"Resilient","n":"Resiliente","pre":"","src":"PHB","x":"Scegli una caratteristica: il suo punteggio aumenta di 1 (massimo 20) e ottieni competenza nei tiri salvezza di quella caratteristica."},{"id":"ritual-caster","en":"Ritual Caster","n":"Incantatore Rituale","pre":"Intelligenza o Saggezza 13","src":"PHB","x":"Ottieni un libro dei rituali con due incantesimi rituali di 1° livello di una classe a scelta e puoi copiarvi altri rituali che trovi."},{"id":"savage-attacker","en":"Savage Attacker","n":"Aggressore Selvaggio","pre":"","src":"PHB","x":"Una volta per turno, quando tiri i danni di un'arma da mischia, puoi ritirarli e usare il risultato migliore."},{"id":"sentinel","en":"Sentinel","n":"Sentinella","pre":"","src":"PHB","x":"Chi colpisci con un attacco di opportunità ha velocità 0 per il turno; provocano attacchi di opportunità anche con il Disimpegno; con la reazione attacchi chi colpisce un altro vicino a te."},{"id":"sharpshooter","en":"Sharpshooter","n":"Tiratore Scelto","pre":"","src":"PHB","x":"Nessuno svantaggio a lunga gittata, ignori copertura parziale e tre quarti, e puoi subire −5 al tiro per colpire per +10 ai danni con un'arma a distanza."},{"id":"shield-master","en":"Shield Master","n":"Maestro degli Scudi","pre":"","src":"PHB","x":"Con l'azione di Attacco puoi spingere con lo scudo come azione bonus; aggiungi la CA dello scudo ai TS su Destrezza; con l'Elusione dello scudo non subisci danni se superi il TS."},{"id":"skilled","en":"Skilled","n":"Abile","pre":"","src":"PHB","x":"Ottieni competenza in tre abilità o strumenti a tua scelta."},{"id":"skulker","en":"Skulker","n":"Furtivo","pre":"Destrezza 13","src":"PHB","x":"Puoi nasconderti anche se sei leggermente oscurato; mancare un attacco a distanza non rivela la tua posizione; la luce fioca non ti dà svantaggio a Percezione."},{"id":"spell-sniper","en":"Spell Sniper","n":"Cecchino Magico","pre":"Capacità di lanciare almeno un incantesimo","src":"PHB","x":"La gittata degli incantesimi con tiro per colpire raddoppia, ignori copertura parziale e tre quarti e impari un trucchetto con tiro per colpire."},{"id":"tavern-brawler","en":"Tavern Brawler","n":"Rissaiolo","pre":"","src":"PHB","x":"+1 a Forza o Costituzione. Sei competente con le armi improvvisate, il colpo senz'armi fa 1d4 e, dopo aver colpito, puoi afferrare con un'azione bonus."},{"id":"tough","en":"Tough","n":"Robusto","pre":"","src":"PHB","x":"Il tuo massimo di PF aumenta di 2 per ogni tuo livello, ora e in futuro."},{"id":"war-caster","en":"War Caster","n":"Incantatore da Guerra","pre":"Capacità di lanciare almeno un incantesimo","src":"PHB","x":"Vantaggio ai TS su vello dell'artefice (lanciabile una volta per riposo lungo senza slot, con l'Intelligenza) e ottieni competenza con un tipo di strumenti da artigiano."},{"id":"chef","en":"Chef","n":"Cuoco","pre":"","src":"TCE","x":"+1 a Costituzione o Saggezza e competenza con gli utensili da cuoco. Durante un riposo breve chi mangia il tuo cibo recupera 1d8 PF extra; dopo un riposo lungo prepari dolcetti che danno PF temporanei."},{"id":"crusher","en":"Crusher","n":"Frantumatore","pre":"","src":"TCE","x":"+1 a Forza o Costituzione. Quando colpisci con danni contundenti puoi spostare il bersaglio di 1,5 m; con un critico, gli attacchi contro di lui hanno vantaggio fino al tuo prossimo turno."},{"id":"eldritch-adept","en":"Eldritch Adept","n":"Adepto Occulto","pre":"Incantesimi o Magia del Patto","src":"TCE","x":"Impari una supplica occulta del warlock (senza prerequisiti di livello), che puoi cambiare a ogni livello."},{"id":"fey-touched","en":"Fey Touched","n":"Toccato dai Folletti","pre":"","src":"TCE","x":"+1 a Intelligenza, Saggezza o Carisma. Impari Passo Velato e un incantesimo di 1° livello di divinazione o ammaliamento, lanciabili una volta per riposo lungo senza slot."},{"id":"fighting-initiate","en":"Fighting Initiate","n":"Iniziato al Combattimento","pre":"Competenza con un'arma da guerra","src":"TCE","x":"Impari uno stile di combattimento del guerriero, che puoi cambiare quando ottieni un Aumento dei Punteggi di Caratteristica."},{"id":"gunner","en":"Gunner","n":"Pistolero","pre":"","src":"TCE","x":"+1 a Destrezza. Competenza con le armi da fuoco, ignori il caricamento e non hai svantaggio agli attacchi a distanza con nemici vicini."},{"id":"metamagic-adept","en":"Metamagic Adept","n":"Adepto di Metamagia","pre":"Incantesimi o Magia del Patto","src":"TCE","x":"Impari due opzioni di Metamagia e ottieni 2 punti stregoneria per usarle, recuperati con un riposo lungo."},{"id":"piercer","en":"Piercer","n":"Perforatore","pre":"","src":"TCE","x":"+1 a Forza o Destrezza. Una volta per turno ritiri un dado dei danni perforanti; con un critico perforante aggiungi un dado di danno extra."},{"id":"poisoner","en":"Poisoner","n":"Avvelenatore","pre":"","src":"TCE","x":"Ignori la resistenza al veleno, applichi veleno con un'azione bonus e crei dosi di veleno potente (2d8 e avvelenato, TS su Costituzione CD 14)."},{"id":"shadow-touched","en":"Shadow Touched","n":"Toccato dalle Ombre","pre":"","src":"TCE","x":"+1 a Intelligenza, Saggezza o Carisma. Impari Invisibilità e un incantesimo di 1° livello di illusione o necromanzia, lanciabili una volta per riposo lungo senza slot."},{"id":"skill-expert","en":"Skill Expert","n":"Esperto di Abilità","pre":"","src":"TCE","x":"+1 a una caratteristica, competenza in un'abilità e Maestria in un'abilità in cui sei competente."},{"id":"slasher","en":"Slasher","n":"Squartatore","pre":"","src":"TCE","x":"+1 a Forza o Destrezza. Una volta per turno, colpendo con danni taglienti riduci la velocità del bersaglio di 3 m; con un critico il bersaglio ha svantaggio agli attacchi fino al tuo prossimo turno."},{"id":"telekinetic","en":"Telekinetic","n":"Telecinetico","pre":"","src":"TCE","x":"+1 a Intelligenza, Saggezza o Carisma. Impari Mano Magica (invisibile, gittata +9 m) e con un'azione bonus spingi una creatura entro 9 m di 1,5 m (TS su Forza)."},{"id":"telepathic","en":"Telepathic","n":"Telepatico","pre":"","src":"TCE","x":"+1 a Intelligenza, Saggezza o Carisma. Parli telepaticamente con creature entro 18 m e puoi lanciare Individuazione dei Pensieri una volta per riposo lungo senza slot."}],"bgs":[{"id":"acolyte","n":"Accolito","sk":"Intuizione, Religione","tools":"—","lang":"Due a scelta","eq":"Simbolo sacro, libro di preghiere, 5 bastoncini d'incenso, paramenti, abiti comuni, 15 mo","fn":"Rifugio del Fedele","fx":"Tu e i compagni ricevete cure gratuite e ospitalità nei templi della tua fede, che ti sostengono se non ti metti contro di loro. Hai legami con un tempio specifico dove hai una residenza."},{"id":"charlatan","n":"Ciarlatano","sk":"Inganno, Rapidità di Mano","tools":"Trucchi per il travestimento, falsario","lang":"—","eq":"Abiti pregiati, trucchi per il travestimento, strumenti per il raggiro, 15 mo","fn":"Falsa Identità","fx":"Hai una seconda identità con documenti, conoscenze e travestimenti. Sai falsificare documenti e firme se ne vedi un esempio."},{"id":"criminal","n":"Criminale","sk":"Inganno, Furtività","tools":"Un gioco, strumenti da scasso","lang":"—","eq":"Piede di porco, abiti scuri con cappuccio, 15 mo","fn":"Contatto Criminale","fx":"Hai un contatto affidabile nel mondo criminale, con cui comunichi a distanza tramite corrieri, locandieri e marinai compiacenti. (Variante: Spia.)"},{"id":"entertainer","n":"Intrattenitore","sk":"Acrobazia, Intrattenere","tools":"Trucchi per il travestimento, uno strumento musicale","lang":"—","eq":"Strumento musicale, pegno di un ammiratore, costume, 15 mo","fn":"A Grande Richiesta","fx":"Trovi sempre un posto dove esibirti in cambio di vitto e alloggio modesti o agiati; la gente del posto ti riconosce. (Variante: Gladiatore.)"},{"id":"folkhero","n":"Eroe Popolare","sk":"Addestrare Animali, Sopravvivenza","tools":"Un tipo di strumenti da artigiano, veicoli terrestri","lang":"—","eq":"Strumenti da artigiano, pala, pentola di ferro, abiti comuni, 10 mo","fn":"Ospitalità Rustica","fx":"La gente comune ti accoglie e ti nasconde dalla legge o da chi ti cerca, purché tu non la metta in pericolo."},{"id":"guildartisan","n":"Artigiano di Gilda","sk":"Intuizione, Persuasione","tools":"Un tipo di strumenti da artigiano","lang":"Una a scelta","eq":"Strumenti da artigiano, lettera di presentazione della gilda, abiti da viaggio, 15 mo","fn":"Membro della Gilda","fx":"La gilda ti offre alloggio, sostegno legale e contatti con persone influenti, in cambio di una quota mensile. (Variante: Mercante di Gilda.)"},{"id":"hermit","n":"Eremita","sk":"Medicina, Religione","tools":"Kit da erborista","lang":"Una a scelta","eq":"Custodia per perg icizia del Mare","x":"Puoi comunicare idee semplici alle bestie e ai mostri che respirano acqua."},{"id":"seaelf-trance","n":"Trance","x":"Non hai bisogno di dormire: mediti 4 ore e ottieni il beneficio di un riposo lungo, con due competenze temporanee."}],"subs":[]},{"id":"shadarkai","n":"Shadar-kai","src":"MOM","size":"Media","speed":"9 m","dv":"18 m","asi":"+2 a una e +1 a un'altra, oppure +1 a tre","lang":"Comune e una a scelta","t":[{"id":"shadarkai-resistenza-necrotica","n":"Resistenza Necrotica","x":"Hai resistenza ai danni necrotici."},{"id":"shadarkai-benedizione-della-regina-corvo","n":"Benedizione della Regina Corvo","x":"Con un'azione bonus ti teletrasporti fino a 9 m in uno spazio che vedi. Usi pari alla competenza per riposo lungo. Dal 3° livello dopo il teletrasporto hai resistenza a tutti i danni fino all'inizio del tuo prossimo turno."},{"id":"shadarkai-retaggio-fatato","n":"Retaggio Fatato","x":"Hai vantaggio ai tiri salvezza contro l'essere affascinato."},{"id":"shadarkai-trance","n":"Trance","x":"Non hai bisogno di dormire: mediti 4 ore e ottieni il beneficio di un riposo lungo, con due competenze temporanee."}],"subs":[]},{"id":"shifter","n":"Cangiante","src":"MOM","size":"Media","speed":"9 m","dv":"18 m","asi":"+2 a una e +1 a un'altra, oppure +1 a tre","lang":"Comune e una a scelta","t":[{"id":"shifter-istinti-bestiali","n":"Istinti Bestiali","x":"Hai competenza in un'abilità a scelta tra Acrobazia, Atletica, Intimidire e Sopravvivenza."},{"id":"shifter-mutazione","n":"Mutazione","x":"Con un'azione bonus assumi un aspetto bestiale per 1 minuto e ottieni PF temporanei pari al doppio della competenza, più un effetto in base alla tua stirpe: Pellecoriacea (+1 CA), Zannelunghe (morso con azione bonus), Corsacelere (velocità +3 m e reazione per muoverti) o Ferocia (vantaggio a Saggezza e alle prove contro l'essere affascinato o spaventato). Usi pari alla competenza per riposo lungo."}],"subs":[]},{"id":"tabaxi","n":"Tabaxi","src":"MOM","size":"Medi function newBook(name, cls){
  return { name: name || "Il mio personaggio", cls: cls || "X", sub:"", lvl:1, score:16, bg:"", race:"", subrace:"",
    prep:{}, book:{}, always:{}, extra:{}, used:[0,0,0,0,0,0,0,0,0], pact:0, arc:{}, conc:"", hidden:{}, edits:{}, custom:[],
    feats:{}, xedits:{}, xhidden:{}, xcustom:[], uses:{}, portrait:null, fileSavedAt:0, updated:Date.now() };
}
function normBook(o){
  const b = newBook();
  if (!o || typeof o !== "object") return b;
  if (typeof o.name === "string" && o.name.trim()) b.name = o.name.slice(0, 60);
  const k = OLD_CLS[o.cls] || o.cls;
  if (k === "X" || CLASS_BY[k]) b.cls = k;
  if (typeof o.sub === "string" && CLASS_BY[b.cls] && CLASS_BY[b.cls].subs.some(s => s.k === o.sub)) b.sub = o.sub;
  if (typeof o.bg === "string" && (BG_BY.has(o.bg) || o.bg === "")) b.bg = o.bg;
  if (typeof o.race === "string" && SPECIES_BY.has(o.race)){ b.race = o.race; if (typeof o.subrace === "string" && SPECIES_BY.get(o.race).subs.some(x => x.id === o.subrace)) b.subrace = o.subrace; }
  b.lvl = clamp(parseInt(o.lvl, 10) || 1, 1, 20);
  b.score = clamp(parseInt(o.score, 10) || 10, 1, 30);
  for (const key of ["prep","book","always","arc","hidden","edits","extra","feats","xedits","xhidden","uses"])
    if (o[key] && typeof o[key] === "object" && !Array.isArray(o[key])) b[key] = JSON.parse(JSON.stringify(o[key]));
  if (Array.isArray(o.used)) b.used = Array.from({length:9}, (_, i) => Math.max(0, parseInt(o.used[i], 10) || 0));
  b.pact = Math.max(0, parseInt(o.pact, 10) || 0);
  b.conc = typeof o.conc === "string" ? o.conc : "";
  if (Array.isArray(o.custom)) b.custom = o.custom.filter(s => s && typeof s.id === "string" && typeof s.n === "string").map(s => Object.assign({}, s));
  if (Array.isArray(o.xcustom)) b.xcustom = o.xcustom.filter(s => s && typeof s.id === "string" && typeof s.n === "string" && (s.kind === "f" || s.kind === "t")).map(s => Object.assign({}, s));
  b.portrait = normPortrait(o.portrait);
  b.fileSavedAt = Number(o.fileSavedAt) || 0;
  b.updated = Number(o.updated) || Date.now();
  return b;
}

/* ================= Regole incantesimi ================= */
function castCfg(b){ if (b.cls === "X") return CAST.X; return CAST[b.cls] || THIRD[b.cls + ":" + b.sub] || null; }
function listLetter(b){ if (b.cls === "X") return ""; const c = clsOf(b); if (c && c.list) return c.list; return THIRD[b.cls + ":" + b.sub] ? "M" : ""; }
function slotTotals(b){
  const c = castCfg(b); if (!c || c.caster === "pact") return [0,0,0,0,0,0,0,0,0];
  const table = c.caster === "half" ? HALF : c.caster === "art" ? ARTS : c.caster === "third" ? THIRDS : FULL;
  const row = table[b.lvl - 1] || [];
  return Array.from({length:9}, (_, i) => row[i] || 0);
}
const pactInfo = b => { const p = PACT[b.lvl - 1]; return { n:p[0], lv:p[1] }; };
const arcanumLevels = b => [[6,11],[7,13],[8,15],[9,17]].filter(([,need]) => b.lvl >= need).map(([lv]) => lv);
function maxSpellLevel(b){
  const c = castCfg(b); if (!c) return 0;
  if (c.caster === "pact") return Math.max(pactInfo(b).lv, ...arcanumLevels(b));
  let m = 0; slotTotals(b).forEach((n, i) => { if (n > 0) m = i + 1; }); return m;
}
function cantripMax(b){ const c = castCfg(b); return c && c.can ? c.can(b.lvl) : null; }
function spellMax(b){
  const c = castCfg(b), m = abMod(b);
  if (!c || c.mode === "free") return null;
  if (c.mode === "known") return c.known[b.lvl - 1];
  if (c.prepHalf === "pal") return b.lvl < 2 ? 0 : Math.max(1, m + Math.floor(b.lvl / 2));
  if (c.prepHalf === "art") return Math.max(1, m + Math.floor(b.lvl / 2));
  return Math.max(1, m + b.lvl);
}
function labels(b, s){
  const c = castCfg(b);
  if ((s && s.l === 0) || (c && c.mode === "known")) return { on:"Conosciuto", verb:"Impara", un:"Dimentica" };
  if (!c || c.mode === "free") return { on:"Pronto", verb:"Segna come pronto", un:"Togli dai pronti" };
  return { on:"Preparato", verb:"Prepara", un:"Togli dai preparati" };
}
function readyTabName(b){ const c = castCfg(b); return c && c.mode === "known" ? "Conosciuti" : c && c.mode !== "free" ? "Preparati" : "Pronti"; }
let gCache = { key:"", val:null };
function grants(b){
  const key = b.cls + "|" + b.sub + "|" + b.lvl;
  if (gCache.key === key) return gCache.val;
  const s = subOf(b), val = { always:new Map(), list:new Map() };
  if (s && s.spells) for (const [lv, id] of s.spells.g) if (b.lvl >= lv) val[s.spells.mode === "always" ? "always" : "list"].set(id, s.n);
  gCache = { key, val }; return val;
}

/* ================= Incantesimi effettivi ================= */
function getSpell(id){
  const b = book(), base = BASE_BY_ID.get(id);
  if (!base){ const c = (b.custom || []).find(s => s.id === id); return c ? Object.assign({}, c, {custom:true}) : null; }
  const e = b.edits[id];
  return e ? Object.assign({}, base, e, {edited:true}) : base;
}
function allSpells(){ const b = book(); return BASE.map(s => b.edits[s.id] ? getSpell(s.id) : s).concat((b.custom || []).map(s => Object.assign({}, s, {custom:true}))); }
const isReady = (b, id) => !!(b.prep[id] || b.always[id] || grants(b).always.has(id));
function inMyList(b, s){
  const L = listLetter(b), G = grants(b);
  return (L && (s.k || "").includes(L)) || !!b.extra[s.id] || G.always.has(s.id) || G.list.has(s.id) || !!s.custom;
}
function countReady(b, cantrips){
  const G = grants(b); let n = 0;
  for (const id of Object.keys(b.prep)){
    if (b.always[id] || G.always.has(id)) continue;
    const s = getSpell(id); if (s && (s.l === 0) === cantrips) n++;
  }
  return n;
}
const countBook = b => Object.keys(b.book).filter(id => getSpell(id)).length;
const readyCount = b => allSpells().filter(s => isReady(b, s.id)).length;

/* ================= Privilegi, talenti, background ================= */
function spellsText(s){
  const byLv = new Map();
  s.spells.g.forEach(([lv, id]) => { if (!byLv.has(lv)) byLv.set(lv, []); const sp = getSpell(id); byLv.get(lv).push(sp ? sp.n : id); });
  const list = [...byLv].map(([lv, names]) => `${ord(lv)} livello: ${names.join(", ")}`).join("\n");
  return (s.spells.mode === "always"
    ? "Questi incantesimi sono sempre preparati e non contano nel limite: compaiono da soli tra i tuoi incantesimi quando raggiungi il livello indicato."
    : "Questi incantesimi si aggiungono alla lista della tua classe: li trovi nel compendio e puoi sceglierli tra quelli che conosci.") + "\n" + list;
}
function featureItems(b){
  const c = clsOf(b), s = subOf(b), items = [];
  if (c){
    c.f.forEach(f => items.push({ key:"f:" + f.id, l:f.l, n:f.n, x:f.x, opt:!!f.opt, kind:"class", owner:c.n, src:f.opt ? "TCE" : c.src }));
    if (s){
      s.f.forEach(f => items.push({ key:"f:" + f.id, l:f.l, n:f.n, x:f.x, kind:"sub", owner:s.n, src:s.src }));
      if (s.spells) items.push({ key:`f:spells-${c.k}-${s.k}`, l:Math.min(...s.spells.g.map(g => g[0])), n:s.spells.mode === "always" ? "Incantesimi della sottoclasse" : "Lista ampliata della sottoclasse",
        x:spellsText(s), kind:"sub", owner:s.n, src:s.src, auto:true, spellIds:s.spells.g });
    } else if (c.subs.length){
      items.push({ key:"f:choose-sub", l:c.subLvl, n:`Scegli: ${c.subLabel}`, x:`Al ${ord(c.subLvl)} livello il ${c.n.toLowerCase()} sceglie ${c.subLabel.toLowerCase()}. Selezionala in alto, nel menu «${c.subLabel}»: qui compariranno i suoi privilegi e, se ne ha, i suoi incantesimi.`, kind:"sub", owner:c.subLabel, placeholder:true });
    }
  }
  (b.xcustom || []).filter(x => x.kind === "f").forEach(x => items.push({ key:"f:" + x.id, l:x.l || 1, n:x.n, x:x.x, kind:"custom", owner:"Personalizzato", src:"HB", custom:true, rawId:x.id }));
  return items.map(it => b.xedits[it.key] ? Object.assign({}, it, b.xedits[it.key], {edited:true}) : it);
}
function featItems(b){
  return FEATS.map(f => ({ key:"t:" + f.id, n:f.n, en:f.en, pre:f.pre, src:f.src, x:f.x }))
    .concat((b.xcustom || []).filter(x => x.kind === "t").map(x => ({ key:"t:" + x.id, n:x.n, en:"", pre:x.pre || "", src:"HB", x:x.x, custom:true, rawId:x.id })))
    .map(it => b.xedits[it.key] ? Object.assign({}, it, b.xedits[it.key], {edited:true}) : it);
}
function bgItem(b){
  const g = BG_BY.get(b.bg); if (!g) return null;
  const it = { key:"b:" + g.id, n:g.fn, x:g.fx, bg:g, kind:"bg", owner:"Background · " + g.n, src:"PHB", l:0 };
  return b.xedits[it.key] ? Object.assign({}, it, b.xedits[it.key], {edited:true}) : it;
}
function findEntry(key){
  const b = book();
  if (key.startsWith("f:")) return featureItems(b).find(x => x.key === key) || null;
  if (key.startsWith("t:")) return featItems(b).find(x => x.key === key) || null;
  if (key.startsWith("b:")) { const it = bgItem(b); return it && it.key === key ? it : null; }
  if (key.startsWith("r:")) return raceItems(b).find(x => x.key === key) || null;
  return null;
}

/* ================= Salvataggio ================= */
const fileName = b => (b.name.replace(/[\\/:*?"<>|]+/g, " ").trim() || "Personaggio") + ".incantesimi.json";
const serialize = b => JSON.stringify({ app:"libro-incantesimi", v:3, book:b }, null, 2);
const canPickFile = () => { try { return typeof window.showSaveFilePicker === "function" && window.self === window.top; } catch(e){ return false; } };
const stamp = t => new Date(t).toLocaleString("it-IT", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
let quotaWarned = false;
function cacheLocal(){
  const ok = lsSet(LS_KEY, { books:S.books, active:S.active });
  updateSaveBtn();
  if (!ok && !quotaWarned){ quotaWarned = true; toast("Memoria del browser piena: salva la scheda su file per non perdere le modifiche"); }

  return ok;
}
function saveUI(){ const u = Object.assign({}, UI); delete u.q; delete u.tq; delete u.sel; lsSet(UI_KEY, u); }
function setStatus(txt, kind){ const el = $("#sync"); el.className = "sync" + (kind ? " " + kind : ""); $("#syncTxt").textContent = txt; el.title = txt; }
function localStatus(){ const h = S.handles[S.active]; if (quotaWarned){ setStatus("Memoria del browser piena: salva la scheda su file", "err"); return; } setStatus(h ? `Salvato sul dispositivo e in ${h.name}` : "Salvato su questo dispositivo", "ok"); }
function commit(){
  const b = book(); if (!b) return;
  b.updated = Date.now(); cacheLocal(); localStatus();
  const id = S.active;
  if (S.handles[id]){ clearTimeout(S.fileTimer); setStatus("Salvataggio nel file…", "busy"); S.fileTimer = setTimeout(() => writeFile(id), 700); }
}
async function writeFile(id){
  const h = S.handles[id], b = S.books[id]; if (!h || !b) return;
  try { const w = await h.createWritable(); await w.write(serialize(b)); await w.close(); b.fileSavedAt = Date.now(); cacheLocal(); if (id === S.active) localStatus(); }
  catch(e){ delete S.handles[id]; setStatus("File non raggiungibile: salva di nuovo dal menu", "err"); }
}
/* ---------- Salva / Carica: un unico file con tutti i personaggi ---------- */
const ALL_NAME = "Grimorio - personaggi.json", ALL_KEY = "libro-incantesimi:allsave";
const allSig = () => Object.keys(S.books).sort().map(k => k + ":" + (S.books[k].updated || 0)).join("|");
function updateSaveBtn(){
  const el = document.getElementById("saveAllBtn"); if (!el) return;
  const st = lsGet(ALL_KEY), dirty = !st || st.sig !== allSig();
  el.classList.toggle("dirty", dirty);
  el.title = dirty ? "Ci sono modifiche da salvare su file" : `Tutto salvato su file (${stamp(st.at)})`;
}
function allPayload(at){ return JSON.stringify({ app:"libro-incantesimi", v:3, kind:"tutti", savedAt:at, active:S.active, books:S.books }); }
async function saveAll(){
  const at = Date.now(), payload = allPayload(at), n = Object.keys(S.books).length;
  const done = how => {
    Object.values(S.books).forEach(b => { b.fileSavedAt = at; });
    lsSet(ALL_KEY, { at, sig:allSig() }); cacheLocal(); localStatus();
    toast(`${n === 1 ? "Personaggio salvato" : n + " personaggi salvati"}${how ? " " + how : ""}`);
  };
  if (canPickFile()){
    if (S.allHandle){
      try { const w = await S.allHandle.createWritable(); await w.write(payload); await w.close(); done(`in ${S.allHandle.name}`); return; }
      catch(e){ S.allHandle = null; }
    }
    try {
      const h = await window.showSaveFilePicker({ id:"grimorio-salvataggio", startIn:"documents", suggestedName:ALL_NAME, types:[{ description:"Salvataggio del Grimorio", accept:{ "application/json":[".json"] } }] });
      const w = await h.createWritable(); await w.write(payload); await w.close(); S.allHandle = h; done(`in ${h.name}`); return;
    } catch(e){ if (e && e.name === "AbortError") return; }
  }
  if (S.downloads){
    try { await S.downloads.save({ filename:ALL_NAME, data:payload }); done(""); }
    catch(e){ if (!e || e.code !== "declined") showCopy(payload); }
    return;
  }
  if (!window.claude){
    const shared = await shareFile(new Blob([payload], {type:"application/json"}), ALL_NAME, "application/json");
    if (shared === "ok"){ done(""); return; }
    if (shared === "abort") return;
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([payload], {type:"application/json"}));
      a.download = ALL_NAME; document.body.appendChild(a); a.click(); a.remove(); done("(nei download)"); return;
    } catch(e){}
  }
  showCopy(payload);
}
const isBlankBook = b => b.name === "Il mio personaggio" && !b.portrait && !b.race && !b.bg && !b.custom.length && !b.xcustom.length
  && !Object.keys(b.prep).length && !Object.keys(b.book).length && !Object.keys(b.feats).length;
function mergeAll(o, handle){
  const inFile = new Set(), kept = [];
  let added = 0, updated = 0;
  for (const fid of Object.keys(o.books)){
    const src = o.books[fid]; if (!src || typeof src !== "object") continue;
    const nb = normBook(src);
    const local = S.books[fid] ? fid : Object.keys(S.books).find(k => !inFile.has(k) && S.books[k].name === nb.name);
    if (!local){ S.books[fid] = nb; inFile.add(fid); added++; continue; }
    const cur = S.books[local];
    if (nb.updated > cur.updated){
      if (local !== fid){
        delete S.books[local];
        if (S.handles[local]){ S.handles[fid] = S.handles[local]; delete S.handles[local]; }
        if (S.active === local) S.active = fid;
      }
      S.books[fid] = nb; inFile.add(fid); updated++;
    } else {
      inFile.add(local);
      if (nb.updated < cur.updated) kept.push(cur.name);
    }
  }
  // il personaggio vuoto creato al primo avvio non serve più
  if (inFile.size) for (const k of Object.keys(S.books)) if (!inFile.has(k) && isBlankBook(S.books[k])){ delete S.books[k]; delete S.handles[k]; }
  if (!S.books[S.active]) S.active = S.books[o.active] ? o.active : Object.keys(S.books)[0];
  const same = !kept.length && Object.keys(S.books).every(k => inFile.has(k));
  lsSet(ALL_KEY, { at:Number(o.savedAt) || Date.now(), sig: same ? allSig() : "" });
  if (handle) S.allHandle = handle;
  cacheLocal(); localStatus(); closeSheet(); closeDetail(); renderAll(true);
  const parts = [];
  if (added) parts.push(added === 1 ? "1 personaggio nuovo" : `${added} personaggi nuovi`);
  if (updated) parts.push(updated === 1 ? "1 aggiornato" : `${updated} aggiornati`);
  const newer = kept.length ? `su questo dispositivo ${kept.length === 1 ? "è più recente" : "sono più recenti"}: ${kept.join(", ")}` : "";
  let msg = parts.length ? "Caricati: " + parts.join(", ") + (newer ? " · " + newer : "") : newer ? "Niente da caricare: " + newer : "Era già tutto aggiornato";
  toast(msg);
}
/* Su iPad e iPhone il salvataggio affidabile passa dal foglio di condivisione («Salva su File»). */
async function shareFile(blob, fname, mime){
  try {
    const file = new File([blob], fname, { type:mime });
    if (!navigator.canShare || !navigator.canShare({ files:[file] })) return "no";
    await navigator.share({ files:[file], title:fname });
    return "ok";
  } catch(e){ return e && e.name === "AbortError" ? "abort" : "no"; }
}
const IS_PWA = !!window.GRIMORIO_PWA;
const IS_NATIVE = !!window.GRIMORIO_NATIVE;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_STANDALONE = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
async function saveToFile(){
  const id = S.active, b = book(), payload = serialize(b), fname = fileName(b);
  if (canPickFile()){
    try {
      const h = await window.showSaveFilePicker({ id:"grimorio-personaggi", startIn:"documents", suggestedName:fname, types:[{ description:"Scheda del personaggio", accept:{ "application/json":[".json"] } }] });
      S.handles[id] = h; await writeFile(id);
      if (S.handles[id]) toast(`Salvato in ${h.name}: da ora ogni modifica viene scritta anche lì`);
      return;
    } catch(e){ if (e && e.name === "AbortError") return; }
  }
  if (S.downloads){
    try { await S.downloads.save({ filename:fname, data:payload }); b.fileSavedAt = Date.now(); cacheLocal(); toast("Scheda salvata: su iPad scegli «Salva su File» e la cartella del personaggio"); }
    catch(e){ if (!e || e.code !== "declined") showCopy(payload); }
    return;
  }
  if (!window.claude){
    const shared = await shareFile(new Blob([payload], {type:"application/json"}), fname, "application/json");
    if (shared === "ok"){ b.fileSavedAt = Date.now(); cacheLocal(); toast("Scheda salvata"); return; }
    if (shared === "abort") return;
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([payload], {type:"application/json"}));
      a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      b.fileSavedAt = Date.now(); cacheLocal(); toast("Scheda scaricata: spostala nella cartella del personaggio"); return;
    } catch(e){}
  }
  showCopy(payload);
}

function renderHeader(){

    if (UI.lv !== "" && s.l !== Number(UI.lv)) return false;
    if (UI.sch && s.s !== UI.sch) return false;
