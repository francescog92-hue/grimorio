pra il 2° (entro 9 m l'uno dall'altro)."],["invisibility","Invisibility","Invisibilità",2,"ill","a","Contatto","V, S, M","1 ora","c","ABSWM","PHB","Una creatura che tocchi diventa invisibile fino alla fine dell'incantesimo, insieme a tutto ciò che indossa o trasporta finché lo tiene su di sé. L'incantesimo termina per un bersaglio che attacca o lancia un incantesimo.","Una creatura aggiuntiva per ogni livello di slot sopra il 2°."],["knock","Knock","Scassinare",2,"tra","a","18 m","V","Istantanea","","BSM","PHB","Scegli un oggetto che puoi vedere e che impedisce l'accesso (porta, scatola, forziere, manette, lucchetto): una serratura normale o bloccata si apre; se ne ha più di una se ne apre una. Sopprime Serratura Arcana per 10 minuti. Al lancio si sente un colpo forte, udibile fino a 90 m.",""],["lesser-restoration","Lesser Restoration","Ristorare Inferiore",2,"abi","a","Contatto","V, S","Istantanea","","ABCDPR","PHB","Tocchi una creatura e poni fine a una malattia o a una condizione che la affligge: accecato, assordato, paralizzato o avvelenato.",""],["levitate","Levitate","Levitazione",2,"tra","a","18 m","V, S, M","10 minuti","c","ASM","PHB","Una creatura o un oggetto libero a tua scelta (fino a 250 kg) si solleva verticalmente fino a 6 m e resta sospeso; una creatura non consenziente può evitarlo con un TS su Costituzione. Il bersaglio può spostarsi solo spingendosi o tirandosi su oggetti fissi. Con un'azione puoi cambiarne l'altezza di 6 m. Al termine scende dolcemente a terra.",""],["locate-animals-or-plants","Locate Animals or Plants","Localizzare Animali o Vegetali",2,"div","a","Sé","V, S, M","Istantanea","r","BDR","PHB","Descrivi o nomini un tipo specifico di bestia o di pianta. Concentrandoti sulla voce della natura, scopri direzione e distanza dell'esemplare più vicino di quel tipo entro 7,5 km, se presente.",""],["locate-object","Locate Object","Localizzare Oggetto",2,"div","a","Sé","V, S, M","10 minuti","c","BCDPRM","PHB","Descrivi o nomini un oggetto che ti è familiare: percepisci la direzione in cui si trova, se è entro 300 m, e se si sta muovendo. Può trovare un oggetto specifico che hai visto da vicino almeno una volta, o il più vicino di un certo tipo. È bloccato da un sottile foglio di piombo.",""],["magic-mouth","Magic Mouth","Bocca Magica",2,"ill","1 minuto","9 m","V, S, M (polvere di giada del valore di 10 mo, consumata)","Fino a dissolto","r","ABM","PHB","Imprimi in un oggetto un messaggio (fino a 25 parole, recitato in massimo 10 minuti) e una condizione di attivazione. Quando la condizione si verifica, sull'oggetto compare una bocca magica che recita il messaggio con la tua voce. La condizione deve basarsi su ciò che si vede o si sente entro 9 m dall'oggetto.",""],["magic-weapon","Magic Weapon","Arma Magica",2,"tra","ab","Contatto","V, S","1 ora","c","APM","PHB","Tocchi un'arma non magica: diventa un'arma magica con +1 ai tiri per colpire e ai danni fino alla fine dell'incantesimo.","Con slot di 4° o 5° il bonus diventa +2; con slot di 6° o superiore +3."],["melfs-acid-arrow","Melf's Acid Arrow","Freccia Acida di Melf",2,"inv","a","27 m","V, S, M","Istantanea","","M","PHB","Una freccia verde e scintillante saetta verso un bersaglio e lo inonda di acido. Fai un attacco a distanza con incantesimo: se colpisce infligge subito 4d4 danni da acido e altri 2d4 alla fine del suo prossimo turno. Se manca, lo schizza infliggendo metà del danno iniziale e nessun danno successivo.","Entrambi i danni aumentano di 1d4 per ogni livello di slot sopra il 2°."],["mirror-image","Mirror Image","Immagine Speculare",2,"ill","a","Sé","V, S","1 minuto","","SWM","PHB","Tre duplicati illusori di te compaiono nel tuo spazio e si muovono con te. Quando una creatura ti attacca, tira 1d20 per vedere se colpisce un duplicato: con 3 duplicati basta 6 o più, con 2 serve 8 o più, con 1 serve 11 o più. Un duplicato ha CA 10 + tuo mod. di Destrezza e svanisce se colpito. Non funziona contro chi non si affida alla vista.",""],["misty-step","Misty Step","Passo Velato",2,"evo","ab","Sé","V","Istantanea","","SWM","PHB","Brevemente avvolto da una nebbia argentea, ti teletrasporti fino a 9 m in uno spazio libero che puoi vedere.",""],["moonbeam","Moonbeam","Raggio di Luna",2,"inv","a","36 m","V, S, M","1 minuto","c","D","PHB","Un raggio argenteo di luce pallida illumina un cilindro di 1,5 m di raggio e 12 m di altezza. Quando una creatura entra nell'area per la prima volta in un turno o vi inizia il turno, effettua un TS su Costituzione: 2d10 danni radiosi se fallisce, metà se lo supera. I mutaforma hanno svantaggio e, se falliscono, riprendono la forma originale. Nei tuoi turni successivi puoi usare un'azione per spostare il raggio di 18 m.","+1d10 per ogni livello di slot sopra il 2°."],["nystuls-magic-aura","Nystul's Magic Aura","Aura Magica di Nystul",2,"ill","a","Contatto","V, S, M","24 ore","","M","PHB","Poni un'illusione su una creatura o un oggetto che tocchi per ingannare la magia di divinazione. Aura falsa: fai apparire un oggetto magico come non magico (o viceversa) o cambi la scuola della sua aura. Maschera: cambi il tipo di creatura che il bersaglio sembra essere agli incantesimi che lo rivelano.",""],["pass-without-trace","Pass without Trace","Passare Senza Tracce",2,"abi","a","Sé","V, S, M","1 ora","c","DR","PHB","Un velo di ombre e silenzio si irradia da te. Per la durata ogni creatura a tua scelta entro 9 m da te, te compreso, ottiene +10 alle prove di Destrezza (Furtività) e non lascia tracce, quindi non può essere seguita se non con mezzi magici.",""],["phantasmal-force","Phantasmal Force","Forza Fantasmatica",2,"ill","a","18 m","V, S, M","1 minuto","c","BSWM","PHB","Crei un'illusione nella mente di una creatura che puoi vedere: deve superare un TS su Intelligenza o percepire un oggetto, una creatura o un fenomeno fantasmatico (non più grande di un cubo di 3 m) che vede solo lei e che razionalizza come reale. Può esaminarlo con un'azione e una prova di Intelligenza (Indagare). Se l'illusione è pericolosa, infligge 1d6 danni psichici in ogni tuo turno al bersaglio che si trova al suo interno o entro 1,5 m.",""],["prayer-of-healing","Prayer of Healing","Preghiera di Guarigione",2,"inv","10 minuti","9 m","V","Istantanea","","C","PHB","Fino a sei creature a tua scelta che puoi vedere entro gittata recuperano ciascuna punti ferita pari a 2d8 + il tuo modificatore da incantatore. Non ha effetto su non morti e costrutti.","+1d8 per ogni livello di slot sopra il 2°."],["protection-from-poison","Protection from Poison","Protezione dal Veleno",2,"abi","a","Contatto","V, S","1 ora","","ACDPR","PHB","Tocchi una creatura: se è avvelenata neutralizzi il veleno (se sono più d'uno, ne neutralizzi uno noto o uno a caso). Per la durata ha vantaggio ai TS contro l'essere avvelenata e resistenza ai danni da veleno.",""],["ray-of-enfeeblement","Ray of Enfeeblement","Raggio di Indebolimento",2,"nec","a","18 m","V, S","1 minuto","c","WM","PHB","Un raggio nero di energia snervante: fai un attacco a distanza con incantesimo. Se colpisci, il bersaglio infligge solo metà danni con gli attacchi con armi basati sulla Forza fino alla fine dell'incantesimo. Alla fine di ogni suo turno può effettuare un TS su Costituzione per porvi fine.",""],["rope-trick","Rope Trick","Trucco della Corda",2,"tra","a","Contatto","V, S, M","1 ora","","AM","PHB","Tocchi una corda lunga fino a 18 m: un capo si solleva finché la corda non resta verticale, e in cima si apre un portale invisibile verso uno spazio extradimensionale che ospita fino a otto creature Medie o più piccole. Si entra arrampicandosi, e la corda può essere ritirata dentro. Attacchi e incantesimi non attraversano il portale; da dentro si vede fuori come da una finestra di 90 × 150 cm. Al termine, ciò che è dentro cade fuori.",""],["scorching-ray","Scorching Ray","Raggio Rovente",2,"inv","a","36 m","V, S","Istantanea","","SM","PHB","Crei tre raggi di fuoco e li scagli contro uno o più bersagli entro gittata. Fai un attacco a distanza con incantesimo per ogni raggio: ciascuno che colpisce infligge 2d6 danni da fuoco.","Un raggio aggiuntivo per ogni livello di slot sopra il 2°."],["see-invisibility","See Invisibility","Vedere Invisibilità",2,"div","a","Sé","V, S, M","1 ora","","ABSM","PHB","Per la durata vedi le creature e gli oggetti invisibili come se fossero visibili, e puoi vedere nel Piano Etereo, dove creature e oggetti appaiono spettrali e traslucidi.",""],["shatter","Shatter","Frantumare",2,"inv","a","18 m","V, S, M","Istantanea","","BSWM","PHB","Un suono squillante e dolorosamente forte esplode da un punto entro gittata. Ogni creatura in una sfera di 3 m di raggio effettua un TS su Costituzione: 3d8 danni da tuono se fallisce, metà se lo supera; le creature fatte di materiale inorganico (pietra, cristallo, metallo) hanno svantaggio. Anche gli oggetti non magici non indossati né trasportati subiscono i danni.","+1d8 per ogni livello di slot sopra il 2°."],["silence","Silence","Silenzio",2,"ill","a","36 m","V, S","10 minuti","cr","BCR","PHB","Per la durata nessun suono può essere prodotto all'interno di una sfera di 6 m di raggio centrata su un punto entro gittata, né attraversarla. Chi si trova interamente nella sfera è immune ai danni da tuono ed è assordato. Al suo interno è impossibile lanciare incantesimi con componente verbale.",""],["spider-climb","Spider Climb","Movimenti del Ragno",2,"tra","a","Contatto","V, S, M","1 ora","c","ASWM","PHB","Una creatura consenziente che tocchi può muoversi su, giù e attraverso superfici verticali e a testa in giù sui soffitti lasciando le mani libere, e ottiene una velocità di scalata pari alla sua velocità base.",""],["spike-growth","Spike Growth","Crescita di Spine",2,"tra","a","45 m","V, S, M","10 minuti","c","DR","PHB","Il terreno in un raggio di 6 m attorno a un punto entro gittata si riempie di spine e aculei e diventa terreno difficile. Una creatura che si muove nell'area subisce 2d4 danni perforanti per ogni 1,5 m percorsi. La trasformazione è mimetizzata: chi non l'ha vista comparire deve superare una prova di Saggezza (Percezione) contro la tua CD per accorgersi del pericolo.",""],["spiritual-weapon","Spiritual Weapon","Arma Spirituale",2,"inv","ab","18 m","V, S","1 minuto","","C","PHB","Crei un'arma spettrale fluttuante entro gittata. Al lancio puoi fare un attacco in mischia con incantesimo contro una creatura entro 1,5 m dall'arma: se colpisce infligge 1d8 + il tuo modificatore da incantatore danni da forza. Nei tuoi turni successivi, con un'azione bonus, puoi spostarla di 6 m e ripetere l'attacco.","+1d8 ogni due livelli di slot sopra il 2°."],["suggestion","Suggestion","Suggestione",2,"amm","a","9 m","V, M","8 ore","c","BSWM","PHB","Suggerisci un'azione (una o due frasi, che sembri ragionevole) a una creatura che puoi vedere, che ti sente e ti capisce. Deve superare un TS su Saggezza o seguire il suggerimento al meglio delle sue capacità. Non funziona sulle creature immuni allo charme, e chiederle di ferirsi pone fine all'incantesimo. Se il compito si conclude prima, l'incantesimo termina.",""],["warding-bond","Warding Bond","Legame Interdittivo",2,"abi","a","Contatto","V, S, M (due anelli di platino del valore di 50 mo ciascuno, indossati da te e dal bersaglio)","1 ora","","C","PHB","Crei un legame mistico con una creatura consenziente che tocchi. Finché resta entro 18 m da te ha +1 alla CA e ai tiri salvezza e resistenza a tutti i danni, ma ogni volta che subisce danni tu subisci la stessa quantità. Termina se scendi a 0 PF, se vi separate di oltre 18 m o se l'incantesimo viene lanciato di nuovo su uno di voi.",""],["web","Web","Ragnatela",2,"evo","a","18 m","V, S, M","1 ora","c","ASM","PHB","Crei una massa di ragnatele spesse e appiccicose in un cubo di 6 m entro gittata, ancorata tra due superfici solide o su pavimento, muro o soffitto. L'area è terreno difficile e leggermente oscurata. Chi vi inizia il turno o vi entra deve superare un TS su Destrezza o restare trattenuto; con un'azione può liberarsi con una prova di Forza contro la tua CD. Le ragnatele bruciano: un cubo di 1,5 m brucia in un round, infliggendo 2d4 danni da fuoco a chi è dentro.",""],["zone-of-truth","Zone of Truth","Zona di Verità",2,"amm","a","18 m","V, S","10 minuti","","BCP","PHB","Crei una zona che protegge dall'inganno, una sfera di 4,5 m di raggio centrata su un punto entro gittata. Una creatura che vi entra per la prima volta in un turno o vi inizia il turno effettua un TS su Carisma: se fallisce non può mentire deliberatamente finché resta nell'area. Sai chi supera e chi fallisce il TS. Chi è influenzato può comunque essere evasivo.",""],["aganazzars-scorcher","Aganazzar's Scorcher","Vampa di Aganazzar",2,"inv","a","9 m","V, S, M","Istantanea","","SM","XGE","Una linea di fiamme ruggenti lunga 9 m e larga 1,5 m parte da te nella direzione che scegli. Ogni creatura nella linea effettua un TS su Destrezza: 3d8 danni da fuoco se fallisce, metà se lo supera.","+1d8 per ogni livello di slot sopra il 2°."],["dragons-breath","Dragon's Breath","Soffio del Drago",2,"tra","ab","Contatto","V, S, M","1 minuto","c","SM","XGE","Tocchi una creatura consenziente e scegli acido, freddo, fuoco, fulmine o veleno. Fino alla fine dell'incantesimo può usare un'azione per esalare energia di quel tipo in un cono di 4,5 m: ogni creatura nell'area effettua un TS su Destrezza, 3d6 danni se fallisce, metà se lo supera.","+1d6 per ogni livello di slot sopra il 2°."],["dust-devil","Dust Devil","Diavolo di Polvere",2,"evo","a","18 m","V, S, M","1 minuto","c","DSM","XGE","Crei un piccolo turbine elementale in un cubo di 1,5 m entro gittata. Ogni creatura, te escluso, che termina il turno entro 1,5 m da esso effettua un TS su Forza: se fallisce subisce 1d8 danni contundenti ed è spinta di 3 m lontano; se lo supera subisce metà danni. Con un'azione bonus puoi spostarlo di 9 m; se passa su sabbia, polvere o terra sciolta solleva una nube che oscura pesantemente un raggio di 3 m.","+1d8 per ogni livello di slot sopra il 2°."],["earthbind","Earthbind","Vincolo Terreno",2,"tra","a","90 m","V","1 minuto","c","DSWM","XGE","Filamenti di energia avvolgono una creatura che puoi vedere: deve superare un TS su Forza o la sua velocità di volo, se ne ha una, diventa 0 per la durata. Una creatura in volo che ne è influenzata scende di 18 m per round finché non atterra o l'incantesimo termina.",""],["healing-spirit","Healing Spirit","Spirito Guaritore",2,"evo","ab","18 m","V, S","1 minuto","c","DR","XGE","Evochi uno spirito della natura in un cubo di 1,5 m entro gittata. Quando tu o una creatura che puoi vedere entrate nel suo spazio per la prima volta in un turno o vi iniziate il turno, puoi farle recuperare 1d6 punti ferita (nessun effetto su non morti e costrutti). Lo spirito può curare un numero di volte pari a 1 + il tuo modificatore da incantatore (minimo 2). Con un'azione bonus puoi spostarlo di 9 m.","La guarigione aumenta di 1d6 per ogni livello di slot sopra il 2°."],["maximilians-earthen-grasp","Maximilian's Earthen Grasp","Stretta Terrosa di Maximilian",2,"tra","a","9 m","V, S, M","1 minuto","c","SM","XGE","Una mano di terra di taglia Media spunta dal suolo in un quadrato di 1,5 m entro gittata. Una creatura entro 1,5 m dalla mano deve superare un TS su Forza o subire 2d6 danni contundenti ed essere trattenuta. Con un'azione puoi far attaccare di nuovo la mano oppure farle stringere la creatura trattenuta (2d6 danni contundenti). Per liberarsi serve una prova di Forza contro la tua CD.",""],["mind-spike","Mind Spike","Spina Mentale",2,"div","a","18 m","S","1 ora","c","SWM","XGE","Penetri nella mente di una creatura che puoi vedere: effettua un TS su Saggezza, 3d8 danni psichici se fallisce, metà se lo supera. Se fallisce, per la durata sai sempre dove si trova (se siete sullo stesso piano), e non può nascondersi da te né beneficiare dell'invisibilità contro di te.","+1d8 per ogni livello di slot sopra il 2°."],["pyrotechnics","Pyrotechnics","Pirotecnica",2,"tra","a","18 m","V, S","Istantanea","","ABSM","XGE","Scegli una fiamma non magica che puoi vedere, fino a un cubo di 3 m, la spegni e crei: Fuochi d'artificio (ogni creatura entro 3 m dalla fiamma deve superare un TS su Costituzione o restare accecata fino alla fine del tuo prossimo turno) oppure Fumo (una nube di 6 m di raggio che oscura pesantemente l'area per 1 minuto o finché un vento forte non la disperde).",""],["shadow-blade","Shadow Blade","Lama d'Ombra",2,"ill","ab","Sé","V, S","1 minuto","c","SWM","XGE","Intrecci ombre in una spada nella tua mano: è un'arma semplice da mischia con cui sei competente, infligge 2d8 danni psichici e ha le proprietà accurata, leggera e da lancio (gittata 6/18 m). In luce fioca o oscurità hai vantaggio ai tiri per colpire con essa. Se la lasci o la lanci svanisce alla fine del turno; con un'azione bonus puoi farla ricomparire in mano.","Con slot di 3° o 4° il danno diventa 3d8; con slot di 5° o 6° diventa 4d8; con slot di 7° o superiore 5d8."],["skywrite","Skywrite","Scrittura Celeste",2,"tra","a","Vista","V, S","1 ora","cr","ABDM","XGE","Fai apparire in cielo fino a dieci parole formate da nuvole, leggibili fino a 75 km di distanza. Restano immobili per la durata; un vento forte le disperde e pone fine all'incantesimo.",""],["snillocs-snowball-swarm","Snilloc's Snowball Swarm","Sciame di Palle di Neve di Snilloc",2,"inv","a","27 m","V, S, M","Istantanea","","SM","XGE","Una raffica di palle di neve magiche esplode da un punto entro gittata. Ogni creatura in una sfera di 1,5 m di raggio effettua un TS su Destrezza: 3d6 danni da freddo se fallisce, metà se lo supera.","+1d6 per ogni livello di slot sopra il 2°."],["warding-wind","Warding Wind","Vento Protettivo",2,"inv","a","Sé","V","10 minuti","c","BDSM","XGE","Un vento forte turbina attorno a te in un raggio di 3 m e si muove con te. Per la durata tu e le altre creature nell'area siete assordati; il vento spegne le fiamme non protette, disperde nebbie e vapori, rende l'area terreno difficile per le altre creature e impone svantaggio agli attacchi con armi a distanza che lo attraversano.",""],["animate-dead","Animate Dead","Animare Morti",3,"nec","1 minuto","3 m","V, S, M","Istantanea","","CM","PHB","Crei un servitore non morto: un mucchio di ossa o il cadavere di un umanoide Medio o Piccolo entro gittata diventa uno scheletro (ossa) o uno zombi (cadavere). In ogni tuo turno, con un'azione bonus, puoi dare comandi mentali a qualsiasi creatura animata così entro 18 m. Resta sotto il tuo controllo per 24 ore; per mantenerlo devi rilanciare l'incantesimo su di essa prima della scadenza (fino a quattro creature per lancio).","Animi o riaffermi il controllo su due non morti aggiuntivi per ogni livello di slot sopra il 3°."],["aura-of-vitality","Aura of Vitality","Aura di Vitalità",3,"inv","a","Sé (raggio 9 m)","V","1 minuto","c","P","PHB","Un'energia curativa si irradia da te in un'aura di 9 m di raggio che si muove con te. Fino alla fine dell'incantesimo puoi usare un'azione bonus per far recuperare 2d6 punti ferita a una creatura nell'aura, te compreso.",""],["beacon-of-hope","Beacon of Hope","Faro di Speranza",3,"abi","a","9 m","V, S","1 minuto","c","C","PHB","Scegli un qualsiasi numero di creature entro gittata: per la durata hanno vantaggio ai TS su Saggezza e ai tiri salvezza contro la morte, e recuperano il massimo possibile di punti ferita da qualsiasi cura.",""],["bestow-curse","Bestow Curse","Scagliare Maledizione",3,"nec","a","Contatto","V, S","1 minuto","c","BCM","PHB","Tocchi una creatura: deve superare un TS su Saggezza o essere maledetta. Scegli l'effetto: svantaggio alle prove e ai TS di una caratteristica; svantaggio ai tiri per colpire contro di te; un TS su Saggezza all'inizio di ogni suo turno per non perdere l'azione; oppure i tuoi attacchi e incantesimi le infliggono 1d8 danni necrotici extra. Rimuovi Maledizione pone fine all'effetto.","Con slot di 4° dura 10 minuti; di 5° o 6° 8 ore; di 7° o 8° 24 ore; di 9° fino a dissolto. Dal 5° in su non richiede concentrazione."],["blinding-smite","Blinding Smite","Punizione Accecante",3,"inv","ab","Sé","V","1 minuto","c","P","PHB","La prossima volta che colpisci con un attacco con arma in mischia prima della fine dell'incantesimo, l'arma sprigiona una luce abbagliante: l'attacco infligge 3d8 danni radiosi extra e il bersaglio deve superare un TS su Costituzione o restare accecato fino alla fine dell'incantesimo. Alla fine di ogni suo turno ripete il TS, terminando l'effetto se lo supera.",""],["blink","Blink","Intermittenza",3,"tra","a","Sé","V, S","1 minuto","","ASM","PHB","Alla fine di ogni tuo turno per la durata tira 1d20: con 11 o più svanisci dal piano in cui sei e compari nel Piano Etereo. All'inizio del tuo turno successivo, o quando l'incantesimo termina, ritorni in uno spazio libero a tua scelta entro 3 m dal punto da cui eri svanito. Nel Piano Etereo vedi e senti il piano d'origine in toni di grigio fino a 18 m e interagisci solo con creature eteree.",""],["call-lightning","Call Lightning","Invocare il Fulmine",3,"evo","a","36 m","V, S","10 minuti","c","D","PHB","Una nube temporalesca cilindrica (alta 3 m, raggio 18 m) compare 30 m sopra un punto che puoi vedere; se non c'è spazio l'incantesimo fallisce. Al lancio, e poi con un'azione in ogni tuo turno, fai cadere un fulmine su un punto sotto la nube: ogni creatura entro 1,5 m effettua un TS su Destrezza, 3d10 danni da fulmine se fallisce, metà se lo supera. All'aperto durante un temporale il danno aumenta di 1d10.","+1d10 per ogni livello di slot sopra il 3°."],["clairvoyance","Clairvoyance","Chiaroveggenza",3,"div","10 minuti","1,5 km","V, S, M (un focus del valore di 100 mo: un corno ingemmato per udire o un occhio di vetro per vedere)","10 minuti","c","BCSM","PHB","Crei un sensore invisibile in un luogo entro gittata che conosci o che è ovvio (dietro una porta, oltre un angolo). Scegli se vedere o udire attraverso il sensore, come se fossi lì; con un'azione puoi passare da un senso all'altro. Chi vede l'invisibile percepisce il sensore come un globo luminoso grande quanto un pugno.",""],["conjure-animals","Conjure Animals","Evocare Animali",3,"evo","a","18 m","V, S","1 ora","c","DR","PHB","Evochi spiriti fatati in forma di bestie in spazi liberi entro gittata: una bestia di GS 2 o inferiore, due di GS 1, quattro di GS 1/2 oppure otto di GS 1/4. Sono amichevoli verso di te e i tuoi compagni, tirano l'iniziativa come gruppo e obbediscono ai tuoi comandi verbali; senza ordini si difendono. Scompaiono a 0 PF o quando l'incantesimo termina.","Con slot di 5° evochi il doppio delle creature, di 7° il triplo, di 9° il quadruplo."],["conjure-barrage","Conjure Barrage","Evocare Sbarramento",3,"evo","a","Sé (cono di 18 m)","V, S, M","Istantanea","","R","PHB","Lanci un'arma non magica o spari una munizione non magica in aria e crei un cono di armi identiche che sfrecciano in avanti e poi svaniscono. Ogni creatura nel cono di 18 m effettua un TS su Destrezza: 3d8 danni se fallisce, metà se lo supera. Il tipo di danno è quello dell'arma o della munizione usata.",""],["counterspell","Counterspell","Controincantesimo",3,"abi","r","18 m","S","Istantanea","","SWM","PHB","Reazione da usare quando vedi una creatura entro 18 m lanciare un incantesimo. Tenti di interromperla: se l'incantesimo è di 3° livello o inferiore, fallisce senza effetto. Se è di 4° livello o superiore, effettui una prova della tua caratteristica da incantatore con CD 10 + il livello dell'incantesimo: se riesci, fallisce senza effetto.","L'incantesimo bersaglio fallisce automaticamente se il suo livello non supera quello dello slot che usi."],["create-food-and-water","Create Food and Water","Creare Cibo e Acqua",3,"evo","a","9 m","V, S","Istantanea","","ACP","PHB","Crei 22,5 kg di cibo e 120 litri d'acqua a terra o in contenitori entro gittata, abbastanza per quindici umanoidi o cinque cavalcature per 24 ore. Il cibo è insipido ma nutriente e si guasta dopo 24 ore; l'acqua è pulita e non si guasta.",""],["crusaders-mantle","Crusader's Mantle","Manto del Crociato",3,"inv","a","Sé","V","1 minuto","c","P","PHB","Un potere sacro si irradia da te in un'aura di 9 m di raggio che si muove con te. Fino alla fine dell'incantesimo ogni creatura non ostile nell'aura, te compreso, infligge 1d4 danni radiosi extra quando colpisce con un attacco con arma.",""],["daylight","Daylight","Luce del Giorno",3,"inv","a","18 m","V, S","1 ora","","CDPRS","PHB","Una sfera di luce di 18 m di raggio si diffonde da un punto entro gittata: luce intensa nella sfera e fioca per altri 18 m. Se scegli un oggetto che porti o uno non indossato, la luce si muove con esso; coprirlo la blocca. Dissolve l'oscurità magica di 3° livello o inferiore con cui si sovrappone.",""],["dispel-magic","Dispel Magic","Dissolvi Magie",3,"abi","a","36 m","V, S","Istantanea","","ABCDPSWM","PHB","Scegli una creatura, un oggetto o un effetto magico entro gittata: ogni incantesimo di 3° livello o inferiore su di esso termina. Per ogni incantesimo di 4° livello o superiore effettui una prova della tua caratteristica da incantatore con CD 10 + il livello dell'incantesimo: se riesci, termina.","Termina automaticamente gli incantesimi di livello pari o inferiore a quello dello slot usato."],["elemental-weapon","Elemental Weapon","Arma Elementale",3,"tra","a","Contatto","V, S","1 ora","c","AP","PHB","Un'arma non magica che tocchi diventa magica. Scegli acido, freddo, fuoco, fulmine o tuono: per la durata l'arma ha +1 ai tiri per colpire e infligge 1d4 danni extra del tipo scelto quando colpisce.","Con slot di 5° o 6° il bonus diventa +2 e il danno 2d4; con slot di 7° o superiore +3 e 3d4."],["fear","Fear","Paura",3,"ill","a","Sé (cono di 9 m)","V, S, M","1 minuto","c","BSWM","PHB","Proietti un'immagine fantasmatica delle peggiori paure di chi ti sta davanti. Ogni creatura nel cono di 9 m deve superare un TS su Saggezza o lasciar cadere ciò che tiene e restare spaventata per la durata. In ogni suo turno deve usare l'azione di Scatto per fuggire da te per la via più sicura. Se termina il turno fuori dalla tua linea di vista ripete il TS, e se lo supera l'effetto termina per lei.",""],["feign-death","Feign Death","Morte Apparente",3,"nec","a","Contatto","V, S, M","1 ora","r","BCDM","PHB","Tocchi una creatura consenziente e la fai cadere in uno stato catalettico indistinguibile dalla morte, anche per la magia. Per la durata è accecata e incapacitata, ha velocità 0, resistenza a tutti i danni tranne quelli psichici, e malattie e veleni che la affliggono sono sospesi.",""],["fireball","Fireball","Palla di Fuoco",3,"inv","a","45 m","V, S, M","Istantanea","","SM","PHB","Un lampo luminoso sfreccia dal tuo dito verso un punto entro gittata ed esplode in un boato di fiamme. Ogni creatura in una sfera di 6 m di raggio effettua un TS su Destrezza: 8d6 danni da fuoco se fallisce, metà se lo supera. Il fuoco aggira gli angoli e incendia gli oggetti infiammabili nell'area non indossati né trasportati.","+1d6 per ogni livello di slot sopra il 3°."],["fly","Fly","Volare",3,"tra","a","Contatto","V, S, M","10 minuti","c","ASWM","PHB","Tocchi una creatura consenziente: ottiene una velocità di volo di 18 m per la durata. Quando l'incantesimo termina, se è ancora in volo cade, a meno che non possa fermare la caduta.","Una creatura aggiuntiva per ogni livello di slot sopra il 3°."],["gaseous-form","Gaseous Form","Forma Gassosa",3,"tra","a","Contatto","V, S, M","1 ora","c","SWM","PHB","Trasformi una creatura consenziente, con tutto ciò che indossa e porta, in una nube nebbiosa. Ha velocità di volo di 3 m, può fluttuare, attraversare lo spazio di altre creature e passare per piccole fessure; ha resistenza ai danni non magici e vantaggio ai TS su Forza, Destrezza e Costituzione. Non può parlare, manipolare oggetti, attaccare né lanciare incantesimi.",""],["glyph-of-warding","Glyph of Warding","Glifo di Interdizione",3,"abi","1 ora","Contatto","V, S, M (incenso e polvere di diamante del valore di 200 mo, consumati)","Fino a dissolto o attivato","","ABCM","PHB","Incidi un glifo su una superficie o dentro un oggetto chiudibile, con condizioni di attivazione a tua scelta. È quasi invisibile (prova di Intelligenza (Indagare) contro la tua CD). Rune esplosive: sfera di 6 m, TS su Destrezza, 5d8 danni di acido, freddo, fuoco, fulmine o tuono (metà se superato). Glifo magico: vi conservi un incantesimo di 3° livello o inferiore che si attiva quando il glifo scatta.","Le rune esplosive infliggono +1d8 per ogni livello di slot sopra il 3°; il glifo magico può contenere un incantesimo fino al livello dello slot usato."],["haste","Haste","Velocità",3,"tra","a","9 m","V, S, M","1 minuto","c","ASM","PHB","Una creatura consenziente che puoi vedere raddoppia la sua velocità, ottiene +2 alla CA, vantaggio ai TS su Destrezza e un'azione aggiuntiva in ogni suo turno, utilizzabile solo per Attacco (un solo attacco con arma), Scatto, Disimpegno, Nascondersi o Usare un Oggetto. Quando l'incantesimo termina, il bersaglio non può muoversi né agire fino alla fine del suo turno successivo, sopraffatto dalla letargia.",""],["hunger-of-hadar","Hunger of Hadar","Fame di Hadar",3,"evo","a","45 m","V, S, M","1 minuto","c","W","PHB","Apri un varco verso il vuoto tra le stelle: una sfera di oscurità gelida di 6 m di raggio. Nessuna luce la illumina, chi è dentro è accecato e l'area è terreno difficile. Chi inizia il turno nell'area subisce 2d6 danni da freddo; chi termina il turno nell'area deve superare un TS su Destrezza o subire 2d6 danni da acido, toccato da tentacoli invisibili.",""],["hypnotic-pattern","Hypnotic Pattern","Trama Ipnotica",3,"ill","a","36 m","S, M","1 minuto","c","BSWM","PHB","Crei un intreccio di colori cangianti in un cubo di 9 m entro gittata. Ogni creatura nell'area che vede la trama deve superare un TS su Saggezza o restare affascinata per la durata: è incapacitata e ha velocità 0. L'effetto termina per una creatura che subisce danni o che viene scossa da qualcuno con un'azione.",""],["leomunds-tiny-hut","Leomund's Tiny Hut","Piccolo Rifugio di Leomund",3,"inv","1 minuto","Sé (semisfera di 3 m di raggio)","V, S, M","8 ore","r","BM","PHB","Una cupola di forza immobile di 3 m di raggio compare attorno e sopra di te e ospita fino a nove creature Medie o più piccole. Chi è dentro al lancio può entrare e uscire liberamente; le altre creature e gli oggetti non possono attraversarla, né incantesimi ed effetti magici. Dentro è asciutto e a temperatura confortevole, e da fuori la cupola è opaca. Termina se esci dall'area.",""],["lightning-arrow","Lightning Arrow","Freccia Fulminante",3,"tra","ab","Sé","V, S","1 minuto","c","R","PHB","La prossima volta che fai un attacco con arma a distanza prima della fine dell'incantesimo, la munizione diventa un fulmine. Il bersaglio subisce 4d8 danni da fulmine se colpito, metà se mancato, invece dei danni normali. Colpito o no, ogni creatura entro 3 m dal bersaglio effettua un TS su Destrezza: 2d8 danni da fulmine se fallisce, metà se lo supera.","Entrambi i danni aumentano di 1d8 per ogni livello di slot sopra il 3°."],["lightning-bolt","Lightning Bolt","Fulmine",3,"inv","a","Sé (linea di 30 m)","V, S, M","Istantanea","","SM","PHB","Un fulmine forma una linea lunga 30 m e larga 1,5 m che parte da te nella direzione che scegli. Ogni creatura nella linea effettua un TS su Destrezza: 8d6 danni da fulmine se fallisce, metà se lo supera. Incendia gli oggetti infiammabili nell'area non indossati né trasportati.","+1d6 per ogni livello di slot sopra il 3°."],["magic-circle","Magic Circle","Cerchio Magico",3,"abi","1 minuto","3 m","V, S, M (acqua santa o polvere d'argento e ferro del valore di 100 mo, consumate)","1 ora","","CPWM","PHB","Crei un cilindro di energia di 3 m di raggio e 6 m di altezza. Scegli uno o più tipi tra celestiali, elementali, folletti, immondi e non morti: non possono entrare volontariamente nel cilindro con mezzi non magici (per teletrasportarsi dentro devono superare un TS su Carisma), hanno svantaggio agli attacchi contro chi è dentro, e chi è dentro non può essere affascinato, spaventato o posseduto da loro. Puoi invertire l'effetto per imprigionare invece di escludere.","La durata aumenta di 1 ora per ogni livello di slot sopra il 3°."],["major-image","Major Image","Immagine Maggiore",3,"ill","a","36 m","V, S, M","10 minuti","c","BSWM","PHB","Crei l'immagine di un oggetto, una creatura o un fenomeno non più grande di un cubo di 6 m. Sembra reale, con suoni, odori e temperatura adeguati, ma non può infliggere danni. Con un'azione puoi muoverla e alterarne suoni ed espressioni. Il contatto fisico rivela l'illusione; una creatura può esaminarla con una prova di Intelligenza (Indagare) contro la tua CD.","Con slot di 6° o superiore l'illusione dura fino a dissolto, senza concentrazione."],["mass-healing-word","Mass Healing Word","Parola Guaritrice di Massa",3,"inv","ab","18 m","V","Istantanea","","C","PHB","Fino a sei creature a tua scelta che puoi vedere entro gittata recuperano punti ferita pari a 1d4 + il tuo modificatore da incantatore. Non ha effetto su non morti e costrutti.","+1d4 per ogni livello di slot sopra il 3°."],["meld-into-stone","Meld into Stone","Fondersi nella Pietra",3,"tra","a","Contatto","V, S","8 ore","r","CD","PHB","Entri in un oggetto o una superficie di pietra abbastanza grande da contenerti interamente, insieme al tuo equipaggiamento. Non sei visibile né individuabile con sensi non magici; senti ciò che accade fuori ma non vedi. Puoi lanciare incantesimi su di te. Se la pietra viene distrutta o modellata vieni espulso e subisci danni (6d6 contundenti se viene completamente distrutta).",""],["nondetection","Nondetection","Anti-Individuazione",3,"abi","a","Contatto","V, S, M (polvere di diamante del valore di 25 mo, consumata)","8 ore","","BRM","PHB","Per la durata nascondi alla magia di divinazione una creatura consenziente o un oggetto che tocchi: non può essere bersaglio di tali incantesimi né percepito da sensori magici di scrutamento.",""],["phantom-steed","Phantom Steed","Destriero Fantomatico",3,"ill","1 minuto","9 m","V, S","1 ora","r","M","PHB","Una creatura Grande, quasi reale e simile a un cavallo compare entro gittata, con sella, morso e briglie. Ha le statistiche di un cavallo da galoppo ma velocità 30 m, e percorre 15 km in un'ora (20 a passo veloce). Tu o una creatura che scegli potete cavalcarla. Termina se la congedi con un'azione o se subisce danni.",""],["plant-growth","Plant Growth","Crescita Vegetale",3,"tra","1 azione o 8 ore","45 m","V, S","Istantanea","","BDR","PHB","Infondi vitalità nelle piante. In 1 azione: le piante normali in un raggio di 30 m da un punto diventano fitte e intricate, e ogni 1,5 m di movimento costa 6 m (puoi escludere delle zone). In 8 ore: arricchisci il terreno in un raggio di 750 m, che per un anno dà raccolti doppi.",""],["protection-from-energy","Protection from Energy","Protezione dall'Energia",3,"abi","a","Contatto","V, S","1 ora","c","ACDRSM","PHB","Per la durata una creatura consenziente che tocchi ha resistenza a un tipo di danno a tua scelta: acido, freddo, fuoco, fulmine o tuono.",""],["remove-curse","Remove Curse","Rimuovi Maledizione",3,"abi","a","Contatto","V, S","Istantanea","","CPWM","PHB","Al tuo tocco terminano tutte le maledizioni che affliggono una creatura o un oggetto. Se l'oggetto è un oggetto magico maledetto, la maledizione resta ma la sintonia del proprietario si spezza, così che possa liberarsene.",""],["revivify","Revivify","Rianimare",3,"nec","a","Contatto","V, S, M (diamanti del valore di 300 mo, consumati)","Istantanea","","ACP","PHB","Tocchi una creatura morta da non più di 1 minuto: torna in vita con 1 punto ferita. Non funziona su chi è morto di vecchiaia e non ripristina parti del corpo mancanti.",""],["sending","Sending","Inviare",3,"inv","a","Illimitata","V, S, M","1 round","","BCM","PHB","Invii un messaggio di massimo 25 parole a una creatura che conosci. Il bersaglio lo sente nella mente, ti riconosce e può rispondere subito allo stesso modo. Funziona a qualsiasi distanza e anche verso altri piani, dove però c'è il 5% di probabilità che il messaggio non arrivi.",""],["sleet-storm","Sleet Storm","Tempesta di Nevischio",3,"evo","a","45 m","V, S, M","1 minuto","c","DSM","PHB","Cade nevischio in un cilindro di 12 m di raggio e 6 m di altezza entro gittata. L'area è pesantemente oscurata, le fiamme libere si spengono e il terreno ghiacciato è difficile. Chi entra nell'area per la prima volta in un turno o vi inizia il turno deve superare un TS su Destrezza o cadere prono; chi si sta concentrando nell'area deve superare un TS su Costituzione o perdere la concentrazione.",""],["slow","Slow","Lentezza",3,"tra","a","36 m","V, S, M","1 minuto","c","SM","PHB","Alteri il tempo attorno a fino a sei creature a tua scelta in un cubo di 12 m entro gittata. Chi fallisce un TS su Saggezza ha velocità dimezzata, −2 alla CA e ai TS su Destrezza, niente reazioni, solo un'azione o un'azione bonus per turno e al massimo un attacco. Se lancia un incantesimo con tempo di 1 azione, tira 1d20: con 11 o più ha effetto solo nel turno successivo. Ripete il TS alla fine di ogni suo turno.",""],["speak-with-dead","Speak with Dead","Parlare con i Morti",3,"nec","a","3 m","V, S, M","10 minuti","","BC","PHB","Concedi una parvenza di vita a un cadavere entro gittata che abbia la bocca e non sia un non morto: risponde fino a cinque domande. Sa solo ciò che sapeva in vita, risponde spesso in modo breve o criptico e non è obbligato a dire il vero se ti era ostile. Non richiama l'anima e non funziona sullo stesso cadavere più di una volta ogni 10 giorni.",""],["speak-with-plants","Speak with Plants","Parlare con i Vegetali",3,"tra","a","Sé (raggio 9 m)","V, S","10 minuti","","BDR","PHB","Le piante entro 9 m da te acquisiscono una limitata consapevolezza: puoi comunicare con loro, interrogarle sugli eventi dell'ultimo giorno e dar loro semplici ordini, come rendere normale un terreno reso difficile dalla vegetazione (o viceversa) o liberare una creatura che trattengono.",""],["spirit-guardians","Spirit Guardians","Guardiani Spirituali",3,"evo","a","Sé (raggio 4,5 m)","V, S, M","10 minuti","c","C","PHB","Spiriti protettivi fluttuano attorno a te in un raggio di 4,5 m e si muovono con te; puoi escludere le creature che vuoi. Nell'area la velocità dei nemici è dimezzata, e quando uno vi entra per la prima volta in un turno o vi inizia il turno effettua un TS su Saggezza: 3d8 danni radiosi (o necrotici, se sei malvagio) se fallisce, metà se lo supera.","+1d8 per ogni livello di slot sopra il 3°."],["stinking-cloud","Stinking Cloud","Nube Maleodorante",3,"evo","a","27 m","V, S, M","1 minuto","c","BSM","PHB","Crei una sfera di 6 m di raggio di gas giallo e nauseabondo centrata su un punto entro gittata. Si estende dietro gli angoli e l'area è pesantemente oscurata. Chi inizia il turno nella nube deve superare un TS su Costituzione o spendere l'azione a vomitare; chi non respira o è immune al veleno lo supera automaticamente.",""],["tongues","Tongues","Linguaggi",3,"div","a","Contatto","V, M","1 ora","","BCSWM","PHB","Una creatura che tocchi comprende qualsiasi lingua parlata che sente, e quando parla viene capita da qualsiasi creatura che conosca almeno una lingua e possa sentirla.",""],["vampiric-touch","Vampiric Touch","Tocco del Vampiro",3,"nec","a","Sé","V, S","1 minuto","c","WM","PHB","La tua mano avvolta nell'ombra risucchia la vita. Fai un attacco in mischia con incantesimo contro una creatura a portata: se colpisci infliggi 3d6 danni necrotici e recuperi punti ferita pari a metà dei danni inflitti. Finché dura, puoi ripetere l'attacco con un'azione in ogni tuo turno.","+1d6 per ogni livello di slot sopra il 3°."],["water-breathing","Water Breathing","Respirare sott'Acqua",3,"tra","a","9 m","V, S, M","24 ore","r","ADRSM","PHB","Fino a dieci creature consenzienti che puoi vedere entro gittata possono respirare sott'acqua fino alla fine dell'incantesimo, mantenendo anche la respirazione normale.",""],["water-walk","Water Walk","Camminare sull'Acqua",3,"tra","a","9 m","V, S, M","1 ora","r","ACDRS","PHB","Fino a dieci creature consenzienti entro gittata possono muoversi su qualsiasi superficie liquida (acqua, acido, fango, neve, sabbie mobili, lava) come se fosse terreno solido; la lava però continua a bruciare. Una creatura sommersa risale in superficie a 18 m per round.",""],["wind-wall","Wind Wall","Muro di Vento",3,"inv","a","36 m","V, S, M","1 minuto","c","DR","PHB","Un muro di vento forte lungo fino a 15 m, alto 4,5 m e spesso 30 cm si alza da terra entro gittata. Quando compare, ogni creatura nella sua area effettua un TS su Forza: 3d8 danni contundenti se fallisce, metà se lo supera. Il vento disperde nebbie e gas, respinge le creature volanti Piccole o più piccole, e frecce, quadrelli e altre munizioni ordinarie che lo attraversano vengono deviate e mancano.",""],["catnap","Catnap","Pisolino",3,"amm","a","9 m","S, M","10 minuti","","ABSM","XGE","Fino a tre creature consenzienti che puoi vedere entro gittata cadono prive di sensi per la durata, o finché non subiscono danni o qualcuno non le sveglia con un'azione. Chi dorme per tutti i 10 minuti ottiene i benefici di un riposo breve e non può essere influenzato di nuovo finché non completa un riposo lungo.","Una creatura aggiuntiva per ogni livello di slot sopra il 3°."],["enemies-abound","Enemies Abound","Nemici Ovunque",3,"amm","a","36 m","V, S","1 minuto","c","BSWM","XGE","Una creatura che puoi vedere deve superare un TS su Intelligenza o perdere la capacità di distinguere amici e nemici: considera ostili tutte le creature che vede e, quando sceglie i bersagli di attacchi o incantesimi, li sceglie a caso. Ogni volta che subisce danni ripete il TS, terminando l'effetto se lo supera.",""],["erupting-earth","Erupting Earth","Terra Eruttante",3,"tra","a","36 m","V, S, M","Istantanea","","DSM","XGE","Una fontana di terra e roccia smossa erutta in un cubo di 6 m centrato su un punto a terra entro gittata. Ogni creatura nell'area effettua un TS su Destrezza: 3d12 danni contundenti se fallisce, metà se lo supera. L'area diventa terreno difficile finché non viene sgomberata.","+1d12 per ogni livello di slot sopra il 3°."],["flame-arrows","Flame Arrows","Frecce Infuocate",3,"tra","a","Contatto","V, S","1 ora","c","ADRSM","XGE","Tocchi una faretra di frecce o quadrelli e ne infondi di fuoco le munizioni. Quando una creatura colpisce con un attacco con arma a distanza usando una di quelle munizioni, il bersaglio subisce 1d6 danni da fuoco extra. L'incantesimo termina dopo dodici munizioni estratte.","Due munizioni in più per ogni livello di slot sopra il 3°."],["life-transference","Life Transference","Trasferimento Vitale",3,"nec","a","9 m","V, S","Istantanea","","CM","XGE","Sacrifichi parte della tua salute per curare un'altra creatura: subisci 4d8 danni necrotici, che non possono essere ridotti in alcun modo, e una creatura a tua scelta che puoi vedere recupera punti ferita pari al doppio dei danni subiti.","+1d8 danni subiti per ogni livello di slot sopra il 3°."],["melfs-minute-meteors","Melf's Minute Meteors","Meteore Minuscole di Melf",3,"inv","a","Sé","V, S, M","10 minuti","c","SM","XGE","Crei sei piccole meteore che orbitano attorno a te. Al lancio, e poi con un'azione bonus in ogni turno, puoi scagliarne una o due verso punti entro 36 m: ognuna esplode e ogni creatura entro 1,5 m dal punto effettua un TS su Destrezza, 2d6 danni da fuoco se fallisce, metà se lo supera. L'incantesimo termina quando le meteore finiscono.","Due meteore aggiuntive per ogni livello di slot sopra il 3°."],["summon-lesser-demons","Summon Lesser Demons","Evocare Demoni Minori",3,"evo","a","18 m","V, S, M","1 ora","c","WM","XGE","Pronunci parole blasfeme ed evochi demoni dal caos: tira sulla tabella per sapere quanti e di quale grado di sfida (ad esempio due di GS 1, quattro di GS 1/2 o otto di GS 1/4). Sono ostili a tutte le creature non demoniache, te compreso, e agiscono da soli attaccando la creatura più vicina. Un cerchio tracciato con il sangue come componente materiale li tiene lontani da te.","Con slot di 6° o 7° evochi il doppio dei demoni; con slot di 8° o 9° il triplo."],["thunder-step","Thunder Step","Passo Tonante",3,"evo","a","27 m","V","Istantanea","","SWM","XGE","Ti teletrasporti in uno spazio libero che puoi vedere entro gittata, e dove eri esplode un tuono: ogni creatura entro 3 m da quel punto effettua un TS su Costituzione, 3d10 danni da tuono se fallisce, metà se lo supera. Puoi portare con te una creatura consenziente Media o più piccola entro 1,5 m.","+1d10 per ogni livello di slot sopra il 3°."],["tidal-wave","Tidal Wave","Onda di Marea",3,"evo","a","36 m","V, S, M","Istantanea","","DSM","XGE","Un'onda si abbatte su un'area lunga fino a 9 m, larga 3 m e alta 3 m entro gittata. Ogni creatura nell'area effettua un TS su Destrezza: se fallisce subisce 4d8 danni contundenti e cade prona; se lo supera subisce metà danni e resta in piedi. Poi l'acqua si disperde, spegnendo le fiamme non protette.",""],["tiny-servant","Tiny Servant","Piccolo Servitore",3,"tra","1 minuto","Contatto","V, S","8 ore","","AM","XGE","Tocchi un oggetto Minuscolo non magico non indossato né trasportato: gli spuntano zampette e diventa una creatura sotto il tuo controllo. Con un'azione bonus puoi dargli ordini mentali se è entro 36 m. Esegue compiti semplici e, al termine, torna un oggetto.","Animi due oggetti in più per ogni livello di slot sopra il 3°."],["wall-of-sand","Wall of Sand","Muro di Sabbia",3,"inv","a","27 m","V, S, M","10 minuti","c","M","XGE","Crei un muro di sabbia turbinante lungo fino a 9 m, alto 3 m e spesso 3 m entro gittata. Blocca la linea di vista ma non il movimento: chi è al suo interno è accecato e ogni 30 cm di movimento gli costa 90 cm.",""],["wall-of-water","Wall of Water","Muro d'Acqua",3,"inv","a","18 m","V, S, M","10 minuti","c","DSM","XGE","Crei un muro d'acqua a terra, lungo fino a 9 m, alto 3 m e spesso 30 cm, oppure un anello di 6 m di diametro. Il suo spazio è terreno difficile. Gli attacchi con armi a distanza che lo attraversano hanno svantaggio, i danni da fuoco attraverso il muro sono dimezzati, e un effetto di freddo lo congela a sezioni.",""],["arcane-eye","Arcane Eye","Occhio Arcano",4,"div","a","9 m","V, S, M","1 ora","c","AM","PHB","Crei un occhio magico invisibile entro gittata che fluttua per la durata. Ricevi mentalmente ciò che vede: ha vista normale e scurovisione fino a 9 m e guarda in ogni direzione. Con un'azione puoi spostarlo di 9 m, senza limiti di distanza da te. Non attraversa barriere solide ma passa per aperture di almeno 2,5 cm di diametro.",""],["aura-of-life","Aura of Life","Aura di Vita",4,"abi","a","Sé (raggio 9 m)","V","10 minuti","c","P","PHB","Un'energia che preserva la vita si irradia da te in un'aura di 9 m di raggio. Ogni creatura non ostile nell'aura, te compreso, ha resistenza ai danni necrotici e il suo massimo di punti ferita non può essere ridotto. Una creatura non ostile vivente che inizia il turno nell'aura con 0 PF recupera 1 punto ferita.",""],["aura-of-purity","Aura of Purity","Aura di Purezza",4,"abi","a","Sé (raggio 9 m)","V","10 minuti","c","P","PHB","Un'energia purificante si irradia da te in un'aura di 9 m di raggio. Ogni creatura non ostile nell'aura, te compreso, non può ammalarsi, ha resistenza ai danni da veleno e vantaggio ai TS contro gli effetti che la renderebbero accecata, affascinata, assordata, spaventata, paralizzata, avvelenata o stordita.",""],["banishment","Banishment","Esilio",4,"abi","a","18 m","V, S, M","1 minuto","c","CPSWM","PHB","Tenti di spedire in un altro piano una creatura che puoi vedere: deve superare un TS su Carisma o essere esiliata. Se è nativa del piano in cui vi trovate, finisce in un semipiano innocuo dove è incapacitata e ritorna al termine. Se è nativa di un altro piano torna al suo piano d'origine e, se l'incantesimo dura l'intero minuto, non fa ritorno.","Una creatura aggiuntiva per ogni livello di slot sopra il 4°."],["blight","Blight","Avvizzire",4,"nec","a","9 m","V, S","Istantanea","","DSWM","PHB","Un'energia necromantica prosciuga umidità e vitalità da una creatura che puoi vedere: effettua un TS su Costituzione, 8d8 danni necrotici se fallisce, metà se lo supera. Non ha effetto su non morti e costrutti. Le creature vegetali hanno svantaggio e subiscono il danno massimo; una pianta non magica appassisce e muore.","+1d8 per ogni livello di slot sopra il 4°."],["compulsion","Compulsion","Costrizione",4,"amm","a","9 m","V, S","1 minuto","c","B","PHB","Le creature a tua scelta che puoi vedere entro gittata e che ti sentono effettuano un TS su Saggezza (le creature immuni allo charme lo superano automaticamente). Finché dura, con un'azione bonus in ogni tuo turno indichi una direzione: chi ha fallito deve usare al meglio il movimento per spostarsi in quella direzione nel suo turno successivo, poi ripete il TS.",""],["confusion","Confusion","Confusione",4,"amm","a","27 m","V, S, M","1 minuto","c","BDSM","PHB","Ogni creatura in una sfera di 3 m di raggio entro gittata deve superare un TS su Saggezza o restare confusa. All'inizio di ogni suo turno tira 1d10: 1, si muove in una direzione casuale senza agire; 2-6, non si muove né agisce; 7-8, attacca una creatura a caso entro portata; 9-10, agisce normalmente. Alla fine di ogni suo turno ripete il TS.","Il raggio aumenta di 1,5 m per ogni livello di slot sopra il 4°."],["conjure-minor-elementals","Conjure Minor Elementals","Evocare Elementali Minori",4,"evo","1 minuto","27 m","V, S","1 ora","c","DM","PHB","Evochi elementali in spazi liberi entro gittata: uno di GS 2 o inferiore, due di GS 1, quattro di GS 1/2 oppure otto di GS 1/4. Sono amichevoli verso di te e i tuoi compagni, tirano l'iniziativa come gruppo e obbediscono ai tuoi comandi verbali. Scompaiono a 0 PF o alla fine dell'incantesimo.","Con slot di 6° il doppio delle creature, con slot di 8° il triplo."],["conjure-woodland-beings","Conjure Woodland Beings","Evocare Creature Silvane",4,"evo","a","18 m","V, S, M","1 ora","c","DR","PHB","Evochi creature fatate in spazi liberi entro gittata: una di GS 2 o inferiore, due di GS 1, quattro di GS 1/2 oppure otto di GS 1/4. Sono amichevoli verso di te e i tuoi compagni, tirano l'iniziativa come gruppo e obbediscono ai tuoi comandi verbali. Scompaiono a 0 PF o alla fine dell'incantesimo.","Con slot di 6° il doppio delle creature, con slot di 8° il triplo."],["control-water","Control Water","Controllare Acqua",4,"tra","a","90 m","V, S, M","10 minuti","c","CDM","PHB","Controlli l'acqua in un cubo di 30 m di lato. Scegli un effetto, che puoi ripetere o cambiare con un'azione: Inondazione (il livello dell'acqua sale di 6 m, con possibile onda), Dividere le acque (apri un corridoio asciutto), Deviare il flusso, Vortice (in acque profonde: chi è dentro deve superare un TS su Forza o subire 2d8 danni contundenti e restare trattenuto).",""],["death-ward","Death Ward","Interdizione alla Morte",4,"abi","a","Contatto","V, S","8 ore","","CP","PHB","Tocchi una creatura e la proteggi dalla morte. La prima volta che scenderebbe a 0 PF per dei danni, scende invece a 1 PF e l'incantesimo termina. Se l'incantesimo è ancora attivo quando il bersaglio subisce un effetto che lo ucciderebbe istantaneamente senza infliggere danni, l'effetto viene annullato e l'incantesimo termina.",""],["dimension-door","Dimension Door","Porta Dimensionale",4,"evo","a","150 m","V","Istantanea","","BSWM","PHB","Ti teletrasporti in qualsiasi punto entro gittata che puoi vedere, indicare o descrivere (ad esempio «60 m in linea retta verso nord-ovest»). Puoi portare oggetti entro il tuo limite di carico e una creatura consenziente della tua taglia o più piccola entro 1,5 m da te. Se arrivi in uno spazio occupato subisci 4d6 danni da forza e il teletrasporto fallisce.",""],["divination","Divination","Divinazione",4,"div","a","Sé","V, S, M (incenso e un'offerta sacrificale del valore di 25 mo, consumati)","Istantanea","r","C","PHB","La tua magia e un'offerta ti mettono in contatto con il tuo dio o i suoi servitori. Poni una singola domanda su un obiettivo, un evento o un'attività che avverrà entro 7 giorni: il DM dà una risposta veritiera, come una breve frase, una rima criptica o un presagio. Ogni lancio aggiuntivo prima di un riposo lungo ha una probabilità cumulativa del 25% di dare un risultato casuale.",""],["dominate-beast","Dominate Beast","Dominare Bestie",4,"amm","a","18 m","V, S","1 minuto","c","DS","PHB","Tenti di soggiogare una bestia che puoi vedere: deve superare un TS su Saggezza (vantaggio se la state combattendo) o restare affascinata da te. Finché lo è avete un legame telepatico e puoi darle ordini, oppure con un'azione controllarla completamente. Ogni volta che subisce danni ripete il TS.","Con slot di 5° dura fino a 10 minuti, di 6° fino a 1 ora, di 7° o superiore fino a 8 ore."],["evards-black-tentacles","Evard's Black Tentacles","Tentacoli Neri di Evard",4,"evo","a","27 m","V, S, M","1 minuto","c","M","PHB","Tentacoli neri e contorti riempiono un quadrato di 6 m di lato a terra entro gittata, che diventa terreno difficile. Chi vi entra per la prima volta in un turno o vi inizia il turno deve superare un TS su Destrezza o subire 3d6 danni contundenti e restare trattenuto. Chi inizia il turno già trattenuto subisce 3d6 danni contundenti; con un'azione può liberarsi con una prova di Forza o Destrezza contro la tua CD.",""],["fabricate","Fabricate","Fabbricare",4,"tra","10 minuti","36 m","V, S","Istantanea","","AM","PHB","Trasformi materie prime in prodotti finiti dello stesso materiale: legno in un ponte, canapa in una corda, lino o lana in abiti. Puoi creare un oggetto Grande o più piccolo (in un cubo di 3 m, o otto cubi collegati di 1,5 m) oppure, con i minerali, un oggetto Medio o più piccolo. Oggetti che richiedono grande maestria, come gioielli, armi e armature, richiedono la competenza negli strumenti adatti.",""],["fire-shield","Fire Shield","Scudo di Fuoco",4,"inv","a","Sé","V, S, M","10 minuti","","M","PHB","Fiamme sottili ti avvolgono ed emettono luce intensa in 3 m e fioca per altri 3 m. Scegli scudo caldo (resistenza ai danni da freddo) o scudo freddo (resistenza ai danni da fuoco). Quando una creatura entro 1,5 m ti colpisce con un attacco in mischia, subisce 2d8 danni da fuoco (scudo caldo) o da freddo (scudo freddo). Puoi congedarlo con un'azione.",""],["freedom-of-movement","Freedom of Movement","Libertà di Movimento",4,"abi","a","Contatto","V, S, M","1 ora","","ABCDR","PHB","Tocchi una creatura consenziente: per la durata il suo movimento non è ostacolato dal terreno difficile, e la magia non può ridurne la velocità né renderla paralizzata o trattenuta. Può spendere 1,5 m di movimento per liberarsi automaticamente da vincoli non magici, come manette o una presa. Sott'acqua non subisce penalità al movimento e agli attacchi.",""],["giant-insect","Giant Insect","Insetto Gigante",4,"tra","a","9 m","V, S","10 minuti","c","D","PHB","Trasformi in versioni giganti fino a dieci millepiedi, tre ragni, cinque vespe o uno scorpione entro gittata. Ognuno obbedisce ai tuoi comandi verbali e in combattimento agisce nel tuo turno. Restano giganti finché non scendono a 0 PF o l'incantesimo termina.",""],["grasping-vine","Grasping Vine","Rampicante Afferrante",4,"evo","ab","9 m","V, S","1 minuto","c","DR","PHB","Evochi un rampicante che spunta dal terreno in uno spazio libero che puoi vedere entro gittata. Al lancio puoi fargli sferzare una creatura entro 9 m da esso che puoi vedere: deve superare un TS su Destrezza o essere trascinata di 6 m verso il rampicante. Finché dura puoi ripetere l'attacco con un'azione bonus in ogni tuo turno.",""],["greater-invisibility","Greater Invisibility","Invisibilità Superiore",4,"ill","a","Contatto","V, S","1 minuto","c","BSM","PHB","Tu o una creatura che tocchi diventate invisibili fino alla fine dell'incantesimo, insieme a tutto ciò che indossate o trasportate. A differenza di Invisibilità, l'effetto non termina quando il bersaglio attacca o lancia incantesimi.",""],["guardian-of-faith","Guardian of Faith","Guardiano della Fede",4,"evo","a","9 m","V","8 ore","","C","PHB","Un guardiano spettrale Grande compare in uno spazio libero che puoi vedere entro gittata e lo occupa per la durata; si distinguono solo un'arma e uno scudo luminosi con il simbolo della tua divinità. Una creatura ostile che si muove entro 3 m da esso per la prima volta in un turno deve superare un TS su Destrezza o subire 20 danni radiosi (10 se lo supera). Il guardiano svanisce dopo aver inflitto 60 danni in totale.",""],["hallucinatory-terrain","Hallucinatory Terrain","Terreno Illusorio",4,"ill","10 minuti","90 m","V, S, M","24 ore","","BDWM","PHB","Fai sembrare il terreno naturale in un cubo di 45 m entro gittata un altro tipo di terreno: un campo può sembrare una palude, una strada un acquitrino. Cambiano aspetto, suoni e odori, ma non strutture, attrezzature e creature. Il tatto non viene ingannato, quindi chi interagisce può scoprire l'illusione; una creatura può esaminarla con una prova di Intelligenza (Indagare) contro la tua CD.",""],["ice-storm","Ice Storm","Tempesta di Ghiaccio",4,"inv","a","90 m","V, S, M","Istantanea","","DSM","PHB","Una grandinata di ghiaccio duro come la roccia si abbatte in un cilindro di 6 m di raggio e 12 m di altezza centrato su un punto entro gittata. Ogni creatura nel cilindro effettua un TS su Destrezza: 2d8 danni contundenti e 4d6 danni da freddo se fallisce, metà se lo supera. L'area diventa terreno difficile fino alla fine del tuo prossimo turno.","I danni contundenti aumentano di 1d8 per ogni livello di slot sopra il 4°."],["leomunds-secret-chest","Leomund's Secret Chest","Forziere Segreto di Leomund",4,"evo","a","Contatto","V, S, M (un forziere pregiato del valore di almeno 5.000 mo e una sua replica Minuscola del valore di 50 mo)","Istantanea","","AM","PHB","Nascondi un forziere e il suo contenuto nel Piano Etereo toccando il forziere e la sua replica. Con un'azione, toccando la replica, puoi richiamarlo accanto a te, e rimandarlo indietro toccando entrambi. Dopo 60 giorni c'è una probabilità cumulativa del 5% al giorno che l'effetto termini e il forziere vada perduto.",""],["locate-creature","Locate Creature","Localizzare Creatura",4,"div","a","Sé","V, S, M","1 ora","c","BCDPRM","PHB","Descrivi o nomini una creatura che ti è familiare: percepisci in che direzione si trova, se è entro 300 m, e se si sta muovendo. Puoi cercare una creatura specifica che conosci o la più vicina di un certo tipo, se l'hai vista da vicino almeno una volta. È bloccato da acqua corrente larga almeno 3 m e non trova creature trasformate (ad esempio da Metamorfosi).",""],["mordenkainens-faithful-hound","Mordenkainen's Faithful Hound","Segugio Fedele di Mordenkainen",4,"evo","a","9 m","V, S, M","8 ore","","AM","PHB","Evochi un cane da guardia fantasma, invisibile a tutti tranne che a te, in uno spazio libero entro gittata. Quando una creatura Piccola o più grande si avvicina entro 9 m senza pronunciare la parola d'ordine, il segugio abbaia forte. Vede l'invisibile e nel Piano Etereo. All'inizio di ogni tuo turno morde una creatura ostile entro 1,5 m: il bonus al tiro per colpire è il tuo modificatore da incantatore + competenza, e infligge 4d8 danni perforanti.",""],["mordenkainens-private-sanctum","Mordenkainen's Private Sanctum","Santuario Privato di Mordenkainen",4,"abi","10 minuti","36 m","V, S, M","24 ore","","AM","PHB","Rendi un'area (un cubo da 1,5 a 30 m di lato) magicamente sicura. Scegli le protezioni: i suoni non ne attraversano i confini; la barriera appare scura e nebbiosa e impedisce di vedere dentro; i sensori di divinazione non possono entrare; le creature non possono teletrasportarsi dentro o fuori; il viaggio planare è bloccato. Lanciarlo nello stesso punto ogni giorno per un anno lo rende permanente.","Il cubo può essere più grande di 30 m di lato per ogni livello di slot sopra il 4°."],["otilukes-resilient-sphere","Otiluke's Resilient Sphere","Sfera Elastica di Otiluke",4,"inv","a","9 m","V, S, M","1 minuto","c","AM","PHB","Una sfera di forza scintillante racchiude una creatura o un oggetto Grande o più piccolo entro gittata; una creatura non consenziente può evitarla con un TS su Destrezza. Niente può attraversarla, né oggetti né energia né incantesimi, in nessuna direzione, ma chi è dentro può respirare. È immune ai danni; Disintegrazione la distrugge. Chi è dentro può farla rotolare a metà della sua velocità.",""],["phantasmal-killer","Phantasmal Killer","Assassino Fantasmatico",4,"ill","a","36 m","V, S","1 minuto","c","M","PHB","Dai forma alle paure più profonde di una creatura che puoi vedere, in un'illusione che solo lei percepisce. Deve superare un TS su Saggezza o restare spaventata per la durata. Alla fine di ogni suo turno ripete il TS: se fallisce subisce 4d10 danni psichici, se lo supera l'incantesimo termina.","+1d10 per ogni livello di slot sopra il 4°."],["polymorph","Polymorph","Metamorfosi",4,"tra","a","18 m","V, S, M","1 ora","c","BDSM","PHB","Trasformi una creatura che puoi vedere in una bestia con GS pari o inferiore al suo (o al suo livello); una creatura non consenziente può resistere con un TS su Saggezza, e non ha effetto sui mutaforma o su chi ha 0 PF. Il bersaglio assume statistiche, PF e mentalità della bestia. Quando la nuova forma scende a 0 PF torna alla forma originale con i PF che aveva, e l'eccesso di danni si riporta.",""],["staggering-smite","Staggering Smite","Punizione Barcollante",4,"inv","ab","Sé","V","1 minuto","c","P","PHB","La prossima volta che colpisci una creatura con un attacco con arma in mischia prima della fine dell'incantesimo, l'arma trafigge corpo e mente: l'attacco infligge 4d6 danni psichici extra e il bersaglio deve superare un TS su Saggezza o avere svantaggio ai tiri per colpire e alle prove di caratteristica, e non poter effettuare reazioni, fino alla fine del suo prossimo turno.",""],["stone-shape","Stone Shape","Scolpire Pietra",4,"tra","a","Contatto","V, S, M","Istantanea","","ACDM","PHB","Tocchi un oggetto di pietra Medio o più piccolo, o una sezione di pietra non più grande di 1,5 m in ogni dimensione, e le dai la forma che vuoi: un'arma grezza, una statua, un passaggio in un muro sottile, una porta sigillata. L'oggetto può avere fino a due cardini e un chiavistello, ma nessun dettaglio meccanico più fine.",""],["stoneskin","Stoneskin","Pelle di Pietra",4,"abi","a","Contatto","V, S, M (polvere di diamante del valore di 100 mo, consumata)","1 ora","c","ADRSM","PHB","La pelle di una creatura consenziente che tocchi diventa dura come la pietra: fino alla fine dell'incantesimo ha resistenza ai danni contundenti, perforanti e taglienti non magici.",""],["wall-of-fire","Wall of Fire","Muro di Fuoco",4,"inv","a","36 m","V, S, M","1 minuto","c","DSM","PHB","Crei un muro di fuoco su una superficie solida entro gittata: lungo fino a 18 m, alto 6 m e spesso 30 cm, oppure un anello di 6 m di diametro. Quando compare, ogni creatura nella sua area effettua un TS su Destrezza: 5d8 danni da fuoco se fallisce, metà se lo supera. Uno dei due lati, a tua scelta, infligge 5d8 danni da fuoco a chi termina il turno entro 3 m da esso o dentro il muro; l'altro lato non fa danni.","+1d8 per ogni livello di slot sopra il 4°."],["charm-monster","Charm Monster","Charme sui Mostri",4,"amm","a","9 m","V, S","1 ora","","BDSWM","XGE","Tenti di affascinare una creatura che puoi vedere. Deve superare un TS su Saggezza (vantaggio se tu o i tuoi compagni la state combattendo) o restare affascinata da te finché l'incantesimo non termina o finché tu o i tuoi compagni non le fate qualcosa di dannoso. Ti considera un conoscente amichevole. Al termine sa di essere stata affascinata.","Una creatura aggiuntiva per ogni livello di slot sopra il 4° (entro 9 m l'una dall'altra)."],["elemental-bane","Elemental Bane","Flagello Elementale",4,"tra","a","27 m","V, S","1 minuto","c","ADWM","XGE","Scegli una creatura che puoi vedere e un tipo di danno tra acido, freddo, fuoco, fulmine e tuono. Deve superare un TS su Costituzione o, per la durata, perdere la resistenza a quel tipo di danno e subire 2d6 danni extra di quel tipo la prima volta in ogni turno in cui ne subisce.","Una creatura aggiuntiva per ogni livello di slot sopra il 4° (entro 9 m l'una dall'altra)."],["find-greater-steed","Find Greater Steed","Trova Destriero Superiore",4,"evo","10 minuti","9 m","V, S","Istantanea","","P","XGE","Evochi uno spirito che assume la forma di una cavalcatura maestosa e leale: grifone, pegaso, peryton, lupo feroce, rinoceronte o tigre dai denti a sciabola. Ha le statistiche della creatura ma è un celestiale, folletto o immondo, con Intelligenza almeno 6 e capace di capire una tua lingua. Come per Trova Destriero, comunicate telepaticamente e condivide gli incantesimi che bersagliano solo te.",""],["guardian-of-nature","Guardian of Nature","Guardiano della Natura",4,"tra","ab","Sé","V","1 minuto","c","DR","XGE","Uno spirito della natura ti trasforma. Bestia Primordiale: velocità +3 m, scurovisione 36 m, vantaggio agli attacchi basati sulla Forza e +1d6 danni da forza con le armi in mischia. Grande Albero: 10 PF temporanei, vantaggio alle prove e ai TS su Costituzione, vantaggio agli attacchi con armi basati su Destrezza o Saggezza, e il terreno entro 4,5 m da te diventa difficile per i nemici.",""],["shadow-of-moil","Shadow of Moil","Ombra di Moil",4,"nec","a","Sé","V, S, M (un occhio di non morto racchiuso in una gemma del valore di 150 mo)","1 minuto","c","W","XGE","Ombre simili a fiamme ti avvolgono: sei pesantemente oscurato agli occhi degli altri, hai resistenza ai danni radiosi e ogni creatura entro 3 m che ti colpisce con un attacco subisce 2d8 danni necrotici. Entro 3 m da te la luce intensa diventa fioca e quella fioca diventa oscurità.",""],["sickening-radiance","Sickening Radiance","Radiosità Nauseante",4,"inv","a","36 m","V, S","10 minuti","c","SWM","XGE","Una luce verdastra e fioca riempie una sfera di 9 m di raggio entro gittata. Chi vi entra per la prima volta in un turno o vi inizia il turno deve superare un TS su Costituzione o subire 4d10 danni radiosi e un livello di indebolimento, ed emette una luce verdastra che gli impedisce di beneficiare dell'invisibilità. Gli indebolimenti causati svaniscono quando l'incantesimo termina.",""],["storm-sphere","Storm Sphere","Sfera di Tempesta",4,"inv","a","45 m","V, S","1 minuto","c","SM","XGE","Una sfera di aria turbinante di 6 m di raggio compare entro gittata; l'area è terreno difficile. Chi vi si trova al lancio o vi termina il turno deve superare un TS su Forza o subire 2d6 danni contundenti. Finché dura, con un'azione bonus puoi far partire dal centro un fulmine contro una creatura entro 18 m: attacco a distanza con incantesimo, 4d6 danni da fulmine, con vantaggio se il bersaglio è dentro la sfera.","Entrambi i danni aumentano di 1d6 per ogni livello di slot sopra il 4°."],["summon-greater-demon","Summon Greater Demon","Evocare Demone Superiore",4,"evo","a","18 m","V, S, M","1 ora","c","WM","XGE","Evochi dall'Abisso un demone di GS 5 o inferiore in uno spazio libero entro gittata e puoi dargli ordini verbali. Alla fine di ogni suo turno effettua un TS su Carisma (con svantaggio se conosci il suo vero nome): se lo supera si libera dal tuo controllo e attacca chiunque, te compreso. Un cerchio tracciato col sangue può impedirgli di raggiungerti.","Il GS massimo aumenta di 1 per ogni livello di slot sopra il 4°."],["vitriolic-sphere","Vitriolic Sphere","Sfera Vetriolica",4,"inv","a","45 m","V, S, M","Istantanea","","SM","XGE","Scagli una sfera di acido verde smeraldo che esplode in un raggio di 6 m su un punto entro gittata. Ogni creatura nell'area effettua un TS su Destrezza: se fallisce subisce 10d4 danni da acido subito e altri 5d4 alla fine del suo prossimo turno; se lo supera subisce metà del danno iniziale e nient'altro.","Il danno iniziale aumenta di 2d4 per ogni livello di slot sopra il 4°."],["watery-sphere","Watery Sphere","Sfera d'Acqua",4,"evo","a","27 m","V, S, M","1 minuto","c","DSM","XGE","Evochi una sfera d'acqua di 1,5 m di raggio entro gittata, che può contenere fino a quattro creature Medie o più piccole o una Grande. Chi si trova nel suo spazio deve superare un TS su Forza o esserne intrappolato: è trattenuto e non può respirare, se non respira sott'acqua. Con un'azione puoi spostare la sfera di 9 m. Chi è intrappolato ripete il TS alla fine di ogni suo turno. Al termine la sfera si rompe.",""],["animate-objects","Animate Objects","Animare Oggetti",5,"tra","a","36 m","V, S","1 minuto","c","ABSM","PHB","Dai vita a fino a dieci oggetti non magici entro gittata, non indossati né trasportati: un oggetto Medio conta come due, uno Grande come quattro, uno Enorme come otto. Diventano creature sotto il tuo controllo, con statistiche che dipendono dalla taglia (ad esempio un oggetto Minuscolo ha +8 al tiro per colpire e infligge 1d4 + 4 danni). Con un'azione bonus comandi mentalmente gli oggetti entro 150 m.","Due oggetti in più per ogni livello di slot sopra il 5°."],["antilife-shell","Antilife Shell","Guscio Anti-Vita",5,"abi","a","Sé (raggio 3 m)","V, S","1 ora","c","D","PHB","Una barriera scintillante si estende da te in un raggio di 3 m e si muove con te. Le creature che non sono non morti né costrutti non possono attraversarla né allungarsi attraverso di essa, ma possono lanciare incantesimi o attaccare a distanza o con armi con portata oltre la barriera. Se muovendoti costringi una di queste creature ad attraversarla, l'incantesimo termina.",""],["awaken","Awaken","Risvegliare",5,"tra","8 ore","Contatto","V, S, M (un'agata del valore di 1.000 mo, consumata)","Istantanea","","BD","PHB","Tocchi una bestia Enorme o più piccola, oppure una pianta, con Intelligenza 3 o meno: ottiene Intelligenza 10 e la capacità di parlare una lingua che conosci. Una pianta ottiene anche la capacità di muovere rami e radici e sensi simili a quelli umani. Il bersaglio resta affascinato da te per 30 giorni o finché non lo danneggiate, poi decide se restarti amico.",""],["banishing-smite","Banishing Smite","Punizione Esiliante",5,"abi","ab","Sé","V","1 minuto","c","P","PHB","La prossima volta che colpisci una creatura con un attacco con arma prima della fine dell'incantesimo, l'arma crepita di forza: l'attacco infligge 5d10 danni da forza extra. Se questo attacco la porta a 50 PF o meno, la esili: se è nativa di un altro piano torna lì, altrimenti svanisce in un semipiano innocuo e ricompare alla fine dell'incantesimo.",""],["bigbys-hand","Bigby's Hand","Mano di Bigby",5,"inv","a","36 m","V, S, M","1 minuto","c","AM","PHB","Crei una mano Grande di forza scintillante (CA 20, PF pari al tuo massimo, Forza 26). Al lancio e con un'azione bonus nei turni successivi puoi spostarla di 18 m e usarla per: Pugno serrato (attacco in mischia con incantesimo, 4d8 danni da forza), Mano possente (spinge via una creatura), Mano afferrante (afferra una creatura e la stritola per 2d6 + mod. da incantatore danni contundenti), Mano interposta (ti dà copertura contro una creatura).","Il pugno serrato infligge +2d8 e la mano afferrante +2d6 per ogni livello di slot sopra il 5°."],["circle-of-power","Circle of Power","Cerchio di Potere",5,"abi","a","Sé (raggio 9 m)","V","10 minuti","c","P","PHB","Un'energia divina si irradia da te in un'aura di 9 m di raggio che distorce la magia. Ogni creatura amichevole nell'aura, te compreso, ha vantaggio ai TS contro incantesimi ed effetti magici; inoltre, quando supera un TS contro un effetto che dimezzerebbe i danni, non subisce alcun danno.",""],["cloudkill","Cloudkill","Nube Mortale",5,"evo","a","36 m","V, S","10 minuti","c","SM","PHB","Crei una sfera di 6 m di raggio di nebbia velenosa giallo-verde centrata su un punto entro gittata. Aggira gli angoli e l'area è pesantemente oscurata. Chi vi entra per la prima volta in un turno o vi inizia il turno effettua un TS su Costituzione: 5d8 danni da veleno se fallisce, metà se lo supera. All'inizio di ogni tuo turno la nube si allontana da te di 3 m, scivolando sul terreno.","+1d8 per ogni livello di slot sopra il 5°."],["commune","Commune","Comunione",5,"div","1 minuto","Sé","V, S, M (incenso e una fiala di acqua santa o sacrilega)","1 minuto","r","C","PHB","Contatti la tua divinità o un suo emissario e poni fino a tre domande con risposta sì o no, ricevendo una risposta corretta a ciascuna. Gli esseri divini non sono onniscienti: la risposta può essere «non chiaro». Ogni lancio aggiuntivo prima di un riposo lungo ha una probabilità cumulativa del 25% di restare senza risposta.",""],["commune-with-nature","Commune with Nature","Comunione con la Natura",5,"div","1 minuto","Sé","V, S","Istantanea","r","DR","PHB","Diventi tutt'uno con la natura e ottieni conoscenza dei dintorni: fino a 4,5 km all'aperto, fino a 90 m nelle caverne. Apprendi fino a tre fatti a scelta tra: terreno e corsi d'acqua, piante, minerali, animali o popolazioni prevalenti, celestiali, folletti, immondi, elementali o non morti potenti, influenze di altri piani, edifici.",""],["cone-of-cold","Cone of Cold","Cono di Freddo",5,"inv","a","Sé (cono di 18 m)","V, S, M","Istantanea","","SM","PHB","Un'esplosione di aria gelida erompe dalle tue mani. Ogni creatura nel cono di 18 m effettua un TS su Costituzione: 8d8 danni da freddo se fallisce, metà se lo supera. Chi muore per questo incantesimo diventa una statua ghiacciata finché non si scongela.","+1d8 per ogni livello di slot sopra il 5°."],["conjure-elemental","Conjure Elemental","Evocare Elementale",5,"evo","1 minuto","27 m","V, S, M","1 ora","c","DM","PHB","Scegli una massa di aria, terra, fuoco o acqua che riempia un cubo di 3 m entro gittata: un elementale di quel tipo di GS 5 o inferiore compare entro 3 m da essa. È amichevole verso di te e i tuoi compagni e obbedisce ai tuoi comandi. Se perdi la concentrazione non svanisce: diventa ostile e può attaccarti, e resta per tutta l'ora.","Il GS aumenta di 1 per ogni livello di slot sopra il 5°."],["conjure-volley","Conjure Volley","Evocare Salva",5,"evo","a","45 m","V, S, M","Istantanea","","R","PHB","Scagli in aria un'arma o una munizione non magica e scegli un punto entro gittata: centinaia di copie piovono giù prima di svanire. Ogni creatura in un cilindro di 12 m di raggio e 6 m di altezza centrato su quel punto effettua un TS su Destrezza: 8d8 danni se fallisce, metà se lo supera. Il tipo di danno è quello dell'arma o della munizione.",""],["contact-other-plane","Contact Other Plane","Contattare Altri Piani",5,"div","1 minuto","Sé","V","1 minuto","r","WM","PHB","Contatti mentalmente un semidio, lo spirito di un saggio defunto o un'altra entità di un altro piano. Effettui un TS su Intelligenza CD 15: se fallisci subisci 6d6 danni psichici e impazzisci fino a un riposo lungo. Se lo superi puoi porre fino a cinque domande, a cui il DM risponde con una parola come «sì», «no», «forse», «mai», «irrilevante» o «non chiaro».",""],["contagion","Contagion","Contagio",5,"nec","a","Contatto","V, S","7 giorni","","CD","PHB","Il tuo tocco infligge una malattia. Fai un attacco in mischia con incantesimo: se colpisci, il bersaglio è avvelenato. Alla fine di ogni suo turno effettua un TS su Costituzione: dopo tre fallimenti smette di essere avvelenato e contrae una malattia a tua scelta (febbre accecante, morbo della carne, fuoco mentale, brividi convulsi, putrefazione viscida, marciume), che dura 7 giorni; dopo tre successi guarisce.",""],["creation","Creation","Creazione",5,"ill","1 minuto","9 m","V, S, M","Speciale","","ASM","PHB","Estrai materia d'ombra dalla Coltre Oscura per creare un oggetto non vivente di materia vegetale (tessuto, corda, legno) o minerale (pietra, cristallo, metallo), non più grande di un cubo di 1,5 m. Dura in base al materiale: materia vegetale 1 giorno, pietra o cristallo 12 ore, metalli preziosi 1 ora, gemme 10 minuti, adamantio o mithral 1 minuto. Usarlo come componente materiale fa fallire l'incantesimo.","Il cubo aumenta di 1,5 m per ogni livello di slot sopra il 5°."],["destructive-wave","Destructive Wave","Onda Distruttiva",5,"inv","a","Sé (raggio 9 m)","V","Istantanea","","P","PHB","Colpisci il suolo e un'ondata di energia divina si propaga da te. Ogni creatura a tua scelta entro 9 m effettua un TS su Costituzione: se fallisce subisce 5d6 danni da tuono e 5d6 danni radiosi o necrotici (a tua scelta) e cade prona; se lo supera subisce metà danni e resta in piedi.",""],["dispel-evil-and-good","Dispel Evil and Good","Dissolvi il Bene e il Male",5,"abi","a","Sé","V, S, M","1 minuto","c","CP","PHB","Un'energia scintillante ti avvolge: celestiali, elementali, folletti, immondi e non morti hanno svantaggio ai tiri per colpire contro di te. Puoi terminare l'incantesimo in anticipo per: Spezzare l'incantamento (tocchi una creatura affascinata, spaventata o posseduta da quelle creature e la liberi) oppure Congedo (attacco in mischia con incantesimo contro una di quelle creature: con un TS su Carisma fallito torna al suo piano).",""],["dominate-person","Dominate Person","Dominare Persone",5,"amm","a","18 m","V, S","1 minuto","c","BSM","PHB","Tenti di soggiogare un umanoide che puoi vedere: deve superare un TS su Saggezza (vantaggio se lo state combattendo) o restare affascinato da te. Finché lo è avete un legame telepatico e puoi dargli ordini, oppure con un'azione controllarlo completamente. Ogni volta che subisce danni ripete il TS.","Con slot di 6° dura fino a 10 minuti, di 7° fino a 1 ora, di 8° o superiore fino a 8 ore."],["dream","Dream","Sogno",5,"ill","1 minuto","Speciale","V, S, M","8 ore","","BWM","PHB","Plasmi i sogni di una creatura che conosci, sullo stesso piano. Tu o una creatura consenziente che tocchi cadete in trance come messaggeri: se il bersaglio dorme, il messaggero compare nel suo sogno e può parlargli. Puoi anche rendere il sogno un incubo: il bersaglio deve superare un TS su Saggezza o non trarre beneficio dal riposo e subire 3d6 danni psichici al risveglio.",""],["flame-strike","Flame Strike","Colpo Infuocato",5,"inv","a","18 m","V, S, M","Istantanea","","C","PHB","Una colonna di fuoco divino ruggisce dal cielo in un cilindro di 3 m di raggio e 12 m di altezza centrato su un punto entro gittata. Ogni creatura nel cilindro effettua un TS su Destrezza: 4d6 danni da fuoco e 4d6 danni radiosi se fallisce, metà se lo supera.","Il danno da fuoco o quello radioso (a tua scelta) aumenta di 1d6 per ogni livello di slot sopra il 5°."],["geas","Geas","Geas",5,"amm","1 minuto","18 m","V","30 giorni","","BCDPM","PHB","Imponi un comando magico a una creatura che puoi vedere: compiere un servizio o astenersi da un'azione. Se ti capisce, deve superare un TS su Saggezza o restare affascinata per la durata. Ogni volta che agisce in modo contrario al comando subisce 5d10 danni psichici, non più di una volta al giorno. Non puoi ordinarle di fare qualcosa che la porterebbe a morte certa. Rimuovi Maledizione, Ristorare Superiore o Desiderio pongono fine all'effetto.","Con slot di 7° o 8° dura 1 anno; con slot di 9° fino a dissolto."],["greater-restoration","Greater Restoration","Ristorare Superiore",5,"abi","a","Contatto","V, S, M (polvere di diamante del valore di 100 mo, consumata)","Istantanea","","ABCD","PHB","Tocchi una creatura e riduci di uno il suo livello di indebolimento, oppure poni fine a uno di questi effetti: charme o pietrificazione, una maledizione (inclusa la sintonia con un oggetto maledetto), una riduzione di un punteggio di caratteristica, una riduzione del massimo dei punti ferita.",""],["hallow","Hallow","Santificare",5,"inv","24 ore","Contatto","V, S, M (erbe, oli e incenso del valore di almeno 1.000 mo, consumati)","Fino a dissolto","","C","PHB","Consacri (o sconsacri) un'area fino a 18 m di raggio attorno a un punto che tocchi. Celestiali, elementali, folletti, immondi e non morti non possono entrarvi né affascinare, spaventare o possedere chi è dentro. Puoi
