    out.innerHTML = `<div class="empty-list"><p>Scegli la <b>classe</b> in alto per vedere i suoi privilegi livello per livello, e <b>specie</b> e <b>background</b> qui sopra.</p></div>`;
    $("#count").textContent = ""; return;
  }
  let items = featureItems(b);
  if (!UI.tasha) items = items.filter(x => !x.opt);
  if (!UI.showHidden) items = items.filter(x => !b.xhidden[x.key]);
  if (UI.fKind) items = items.filter(x => x.kind === UI.fKind);
  if (!UI.future) items = items.filter(x => x.l <= b.lvl);
  const bgIt = bgItem(b);
  const showBg = bgIt && (!UI.fKind || UI.fKind === "bg") && (UI.showHidden || !b.xhidden[bgIt.key]);
  const rItems = raceItems(b).filter(x => UI.showHidden || !b.xhidden[x.key]);
  const showRace = rItems.length && (!UI.fKind || UI.fKind === "race");
  const shown = items.length + (showBg ? 1 : 0) + (showRace ? rItems.length : 0);
  $("#count").textContent = `${shown} privileg${shown === 1 ? "io" : "i"}${!UI.future && b.cls !== "X" ? ` fino al ${ord(b.lvl)} livello` : ""}`;
  let html = showRace ? `<section class="group"><div class="group-h"><h3>Specie</h3><span class="aside">${esc(raceName(b))}</span></div><div class="list">${rItems.map(x => entryRow(x, b)).join("")}</div></section>` : "";
  if (showBg) html += `<section class="group"><div class="group-h"><h3>Background</h3><span class="aside">${esc(bgIt.bg.n)}</span></div><div class="list">${entryRow(bgIt, b)}</div></section>`;
  const groups = new Map(); items.sort((a, c) => a.l - c.l).forEach(x => { if (!groups.has(x.l)) groups.set(x.l, []); groups.get(x.l).push(x); });
  for (const [l, arr] of groups){
    html += `<section class="group"><div class="group-h"><h3>${ord(l)} livello</h3><span class="aside">${l > b.lvl ? "livello futuro" : ""}</span></div><div class="list">${arr.map(x => entryRow(x, b, { future:l > b.lvl })).join("")}</div></section>`;
  }
  out.innerHTML = html || `<div class="empty-list"><p>Nessun privilegio con questi filtri.</p></div>`;
}
function renderFeatResults(out, b){
  const ws = words(UI.tq);

  if (UI.tTab === "mine") items = items.filter(x => b.feats[x.key.slice(2)]);
  if (UI.tSrc) items = items.filter(x => x.src === UI.tSrc);
  if (!UI.showHidden) items = items.filter(x => !b.xhidden[x.key] || b.feats[x.key.slice(2)]);
  if (ws.length) items = items.filter(x => { const hay = norm(x.n + " " + x.en + " " + x.x); return ws.every(w => hasWord(hay, w)); });
  items.sort((a, c) => a.n.localeCompare(c.n, "it"));
  const cnt = $("#count"); if (cnt) cnt.textContent = `${items.length} talent${items.length === 1 ? "o" : "i"}`;
  if (!items.length){
    out.innerHTML = `<div class="empty-list">${UI.tTab === "mine" ? `<p>Non hai ancora talenti. Sceglili tra tutti quelli disponibili.</p><button class="btn primary" data-act="ttab" data-v="all">Tutti i talenti</button>` : `<p>Nessun talento trovato.</p>`}</div>`; return;

}

function castOptions(s, b){
  const c = castCfg(b); if (!s || s.l === 0 || !c) return [];
  const opts = [];
  if (c.caster === "pact"){
    const p = pactInfo(b);
    if (s.l <= p.lv) opts.push({ kind:"pact", lv:p.lv, left:Math.max(0, p.n - b.pact), total:p.n, label:`Patto ${ord(p.lv)}` });
    if (s.l >= 6 && arcanumLevels(b).includes(s.l)) opts.push({ kind:"arc", lv:s.l, left:b.arc[s.l] ? 0 : 1, total:1, label:`Arcanum ${ord(s.l)}` });
    return opts;
  }
  const tot = slotTotals(b);
  for (let L = s.l; L <= 9; L++) if (tot[L - 1]) opts.push({ kind:"slot", lv:L, left:Math.max(0, tot[L - 1] - b.used[L - 1]), total:tot[L - 1], label:ord(L) });
  return opts;
}

/* ---------- Apertura e chiusura della scheda (su iPad verticale diventa una pagina) ---------- */
let listScroll = 0;
function setSel(v){ if (UI.section === "spells") UI.selS = v; else if (UI.section === "trait") UI.selF = v; else UI.selT = v; saveUI(); }
function openCard(){
  if (!document.documentElement.classList.contains("detail-open")) listScroll = window.scrollY;

  document.documentElement.classList.add("detail-open");

}
function openDetail(kind, id){
  cardOpen = false;

  if (UI.section !== sec){ UI.section = sec; renderHeader(); renderTop(true); }
  setSel(id);
  const wasOpen = document.documentElement.classList.contains("detail-open");
  renderDetail(); renderResults();
  if (narrow()){
    if (!wasOpen) listScroll = window.scrollY;
    document.documentElement.classList.add("detail-open");
    window.scrollTo(0, 0);
  } else {
    $("#detailPane").scrollTop = 0;
    const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`); if (row) row.focus({preventScroll:true});
  }
}
function closeDetail(){
  const wasOpen = document.documentElement.classList.contains("detail-open");
  if (cardOpen){ cardOpen = false; renderDetail(); }
  document.documentElement.classList.remove("detail-open");
  if (wasOpen){
    window.scrollTo(0, listScroll);
    const k = selKey(), row = k && document.querySelector(`.row[data-id="${CSS.escape(k)}"]`); if (row) row.focus({preventScroll:true});
  }
}
function renderAll(force){
  if (!book()) return;
  renderHeader(); renderTop(force !== false); renderResults(); renderDetail();
}
function refresh(){ renderHeader(); renderTop(false); renderResults(); renderDetail(); }

/* ================= Azioni ================= */
function togglePrep(id){
  const b = book(), s = getSpell(id); if (!s) return;
  if (grants(b).always.has(id)){ toast(`${s.n}: concesso da ${grants(b).always.get(id)}, sempre preparato`); return; }
  const lab = labels(b, s), c = castCfg(b);
  if (b.prep[id] || b.always[id]){ delete b.prep[id]; delete b.always[id]; toast(`${s.n}: ${lab.un.toLowerCase()}`); }
  else {
    b.prep[id] = 1;
    if (c && c.mode === "book" && s.l > 0 && !b.book[id] && !b.extra[id]){ b.book[id] = 1; toast(`${s.n}: copiato nel libro e preparato`); }
    else { const max = s.l === 0 ? cantripMax(b) : spellMax(b), n = countReady(b, s.l === 0); toast(max != null && n > max ? `Attenzione: ${n}/${max}, oltre il limite` : `${s.n}: ${lab.on.toLowerCase()}`); }
  }
  commit(); refresh();
}
function startConc(b, s){
  const prev = b.conc && b.conc !== s.id ? getSpell(b.conc) : null;
  b.conc = s.id;
  return prev ? `${prev.n} termina: ora ti concentri su ${s.n}` : `Concentrazione su ${s.n}`;
}
function cast(id, kind, lv){
  const b = book(), s = getSpell(id); if (!s) return; lv = Number(lv);
  let left;
  if (kind === "pact"){ const p = pactInfo(b); if (b.pact >= p.n) return; b.pact++; left = `${p.n - b.pact}/${p.n} slot del patto`; }
  else if (kind === "arc"){ if (b.arc[lv]) return; b.arc[lv] = 1; left = "arcanum usato fino al riposo lungo"; }
  else { const i = lv - 1, tot = slotTotals(b)[i]; if (b.used[i] >= tot) return; b.used[i]++; left = `${tot - b.used[i]}/${tot} slot di ${ord(lv)}`; }
  let msg = `${s.n} lanciato · restano ${left}`;
  if ((s.f || "").includes("c")) msg = startConc(b, s) + " · " + msg;
  toast(msg); commit(); refresh();
}
function rest(kind){
  const b = book();
  if (kind === "long"){ b.used = [0,0,0,0,0,0,0,0,0]; b.arc = {}; b.conc = ""; }
  b.pact = 0;
  for (const k of Object.keys(b.uses)){ const u = b.uses[k]; if (kind === "long" || u.rest === "breve") u.used = 0; }
  commit(); renderAll(true);
  toast(kind === "long" ? "Riposo lungo: slot, arcanum e usi recuperati" : "Riposo breve: slot del patto e usi «a riposo breve» recuperati");
}
function spendSlot(key, spent){
  const b = book();
  if (key === "pact"){ b.pact = clamp(b.pact + (spent ? -1 : 1), 0, pactInfo(b).n); }
  else if (key.startsWith("arc")){ const lv = key.slice(3); if (spent) delete b.arc[lv]; else b.arc[lv] = 1; }
  else { const i = Number(key.slice(2)) - 1; b.used[i] = clamp(b.used[i] + (spent ? -1 : 1), 0, slotTotals(b)[i]); }
  commit(); refresh();
}
function useToggle(key, spent){
  const b = book(), u = b.uses[key]; if (!u) return;
  u.used = clamp(u.used + (spent ? -1 : 1), 0, u.max);
  commit(); refresh();
}

function importText(txt, handle){

  const src = o && (o.book || o);
  if (!src || typeof src !== "object" || (!src.prep && !src.name)){
    const e = $("#impErr");
    if (e){ e.textContent = "Il contenuto non sembra una scheda di quest'app: controlla di aver scelto il file giusto o di aver copiato tutto il testo."; e.hidden = false; }
    else toast("Il file non sembra una scheda di quest'app");

  }
  const nb = normBook(src), same = Object.keys(S.books).find(k => S.books[k].name === nb.name);
  if (!same){ finishImport(rid("pg-"), nb, handle); return; }
  openSheet(`<h2 tabindex="-1" autofocus>«${esc(nb.name)}» è già presente</h2><p>Vuoi sostituire la scheda che hai su questo dispositivo con quella del file, oppure tenerle entrambe?</p>

const SHAPES = {
  rect:{ n:"Rettangolare", ar:[3,4] },
  oval:{ n:"Ovale", ar:[3,4] },
  square:{ n:"Quadrata", ar:[1,1] },
  round:{ n:"Tonda", ar:[1,1] }
};
const PORTRAIT_W = 600, SOURCE_MAX = 1000;

function portraitHTML(b, cls){
  const p = b.portrait, sh = p ? p.shape : "rect";
  return p ? `<span class="portrait sh-${sh}${SHAPES[sh].ar[0] === 3 ? " r34" : ""}${cls ? " " + cls : ""}"><img src="${p.img}" alt=""></span>`
    : `<span class="portrait empty${cls ? " " + cls : ""}" aria-hidden="true">${esc((b.name || "?").trim().charAt(0).toUpperCase())}<span class="plus">＋</span></span>`;
}
function normPortrait(p){
  if (!p || typeof p !== "object" || typeof p.img !== "string" || !p.img.startsWith("data:image/")) return null;

function paintPortrait(ctx, img, st, W, H){

  const scale = Math.max(W / iw, H / ih) * st.zoom;
  const maxX = (iw * scale - W) / 2 / W, maxY = (ih * scale - H) / 2 / H;

function raceItems(b){

function drawIcon(ctx, S, img){
  const g = ctx.createRadialGradient(S * .5, S * .36, S * .05, S * .5, S * .5, S * .78);
  g.addColorStop(0, "#3B4BB0"); g.addColorStop(1, "#0E1120");
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2;
  if (img){
    const r = S * .37, k = Math.max(2 * r / img.width, 2 * r / img.height);
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(img, cx - img.width * k / 2, cy - img.height * k / 2, img.width * k, img.height * k); ctx.restore();
    ctx.lineWidth = S * .035; ctx.strokeStyle = "#E8B44F"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    return;
  }
  const R = S * .35, P = [...Array(6)].map((_, i) => [cx + R * Math.cos(-Math.PI / 2 + i * Math.PI / 3), cy + R * Math.sin(-Math.PI / 2 + i * Math.PI / 3)]);
  const A = [cx, cy - R * .5], B = [cx - R * .56, cy + R * .34], C = [cx + R * .56, cy + R * .34];
  const gold = ctx.createLinearGradient(0, cy - R, 0, cy + R); gold.addColorStop(0, "#F3D58A"); gold.addColorStop(1, "#B8862B");
  ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = gold; ctx.fill();
  ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.closePath(); ctx.fillStyle = "#FBE7B0"; ctx.fill();
  ctx.lineJoin = "round"; ctx.strokeStyle = "#5A3E0E"; ctx.lineWidth = S * .012;
  const seg = (p, q) => { ctx.beginPath(); ctx.moveTo(...p); ctx.lineTo(...q); ctx.stroke(); };
  seg(P[0], A); seg(P[1], A); seg(P[1], C); seg(P[2], C); seg(P[3], B); seg(P[3], C); seg(P[4], B); seg(P[5], A); seg(P[5], B);
  seg(A, B); seg(B, C); seg(C, A);
  ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.lineWidth = S * .02; ctx.stroke();
  ctx.fillStyle = "#1A1E2C"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `700 ${Math.round(S * .15)}px "IM Fell English", Georgia, serif`; ctx.fillText("20", cx, cy + R * .08);
}

    <p>Con l'app <b>Comandi</b> di Apple crei sulla schermata Home un'icona «Grimorio» che apre l'app con un tocco, come un'applicazione. Si fa una volta sola, in due minuti. Serve aver fatto l'accesso a Claude in Safari.</p>
    <h3>1 · Copia l'indirizzo</h3>
    <div class="copyrow"><input type="text" id="appUrl" readonly value="${APP_URL}" aria-label="Indirizzo del Grimorio"><button class="btn primary" id="copyUrl">Copia</button></div>
    <h3>2 · Salva l'icona</h3>
    <div class="icon-choices">
      <figure><canvas id="icoA" width="240" height="240"></canvas><figcaption>Stemma</figcaption><button class="btn" id="saveIcoA">Salva</button></figure>
      ${b.portrait ? `<figure><canvas id="icoB" width="240" height="240"></canvas><figcaption>Ritratto di ${esc(b.name)}</figcaption><button class="btn" id="saveIcoB">Salva</button></figure>` : ""}
    </div>
    <h3>3 · Crea il comando</h3>
    <ol class="steps">
      <li>Apri l'app <b>Comandi</b> (se non c'è, è gratis sull'App Store).</li>
      <li>Tocca <b>＋</b> in alto a destra.</li>
      <li>Tocca <b>Aggiungi azione</b>, cerca <b>Apri URL</b> e selezionala.</li>
      <li>Tocca il campo <b>URL</b> e incolla l'indirizzo copiato al punto 1.</li>
      <li>Tocca il nome del comando in alto › <b>Rinomina</b> e scrivi «Grimorio».</li>
      <li>Dallo stesso menu scegli <b>Aggiungi alla schermata Home</b>, tocca l'icona e scegli <b>Scegli foto</b> o <b>Scegli file</b> per usare l'immagine del punto 2.</li>
      <li>Tocca <b>Aggiungi</b>: l'icona Grimorio compare sulla Home e apre l'app in Safari.</li>
    </ol>
    <h3>Alternativa veloce</h3>
    <p>In Safari, con il Grimorio aperto: <b>Condividi › Aggiungi alla schermata Home</b>. È più rapida ma l'icona sarà quella di Claude, e l'app potrebbe aprirsi in una finestra con una memoria separata da Safari: in quel caso sposta i personaggi con «Salva» e «Apri una scheda da file».</p>
    <div class="sheet-foot"><button class="btn" data-act="sheet-close">Chiudi</button></div>`, async sh => {
    drawIcon(sh.querySelector("#icoA").getContext("2d"), 240, null);
    const cb = sh.querySelector("#icoB");
    if (cb && b.portrait){ try { drawIcon(cb.getContext("2d"), 240, await loadImage(b.portrait.img)); } catch(e){} }
    sh.querySelector("#saveIcoA").addEventListener("click", () => saveIcon(false));
    const sb = sh.querySelector("#saveIcoB"); if (sb) sb.addEventListener("click", () => saveIcon(true));
    sh.querySelector("#copyUrl").addEventListener("click", () => {
      const inp = sh.querySelector("#appUrl");
      if (navigator.clipboard) navigator.clipboard.writeText(APP_URL).then(() => toast("Indirizzo copiato"), () => { inp.focus(); inp.select(); toast("Seleziona e copia l'indirizzo"); });
      else { inp.focus(); inp.select(); }
    });
  });
}

/* ================= Eventi ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id, b = book();
  switch (act){
    case "open": openDetail(el.dataset.kind || "s", id); break;
    case "close-detail": closeDetail(); break;
    case "section": closeDetail(); UI.section = el.dataset.v; saveUI(); renderAll(true); window.scrollTo(0, 0); break;
    case "tab": UI.tab = el.dataset.v; saveUI(); renderTop(true); renderResults(); break;
    case "ttab": UI.tTab = el.dataset.v; saveUI(); renderTop(true); renderResults(); break;
    case "prep": togglePrep(id); break;
    case "book": {
      const s = getSpell(id); if (!s) break;
      if (b.book[id]){ delete b.book[id]; delete b.prep[id]; toast(`${s.n}: tolto dal libro`); } else { b.book[id] = 1; toast(`${s.n}: copiato nel libro`); }
      commit(); refresh(); break;
    }
    case "always": {
      const s = getSpell(id); if (!s) break;
      if (b.always[id]) delete b.always[id]; else { b.always[id] = 1; delete b.prep[id]; if (castCfg(b) && castCfg(b).mode === "book") b.book[id] = 1; }
      toast(b.always[id] ? `${s.n}: sempre preparato, non conta nel limite` : `${s.n}: non più sempre preparato`);
      commit(); refresh(); break;
    }
    case "lv": UI.lv = el.dataset.v; saveUI(); syncFilterChips(); renderResults(); break;
    case "flt": UI[el.dataset.k] = !UI[el.dataset.k]; saveUI(); syncFilterChips(); renderResults(); break;
    case "clear-filters": Object.assign(UI, { lv:"", sch:"", src:"", conc:false, rit:false, q:"" }); saveUI(); renderTop(true); renderResults(); break;
    case "hint-done": UI.hintDone = true; saveUI(); renderTop(true); break;
    case "fkind": UI.fKind = el.dataset.v; saveUI(); renderTop(true); renderResults(); break;
    case "ftoggle": UI[el.dataset.k] = !UI[el.dataset.k]; saveUI(); renderTop(true); renderResults(); break;
    case "step": {
      const k = el.dataset.k, d = Number(el.dataset.d);
      if (k === "lvl") b.lvl = clamp(b.lvl + d, 1, 20); else b.score = clamp(b.score + d, 1, 30);
      if (k === "lvl"){ const tot = slotTotals(b); b.used = b.used.map((u, i) => Math.min(u, tot[i])); b.pact = Math.min(b.pact, pactInfo(b).n); }
      commit(); refresh(); if (UI.section === "spells" && UI.tab !== "compendio") buildSubTop(); break;
    }
    case "pip": spendSlot(el.dataset.k, el.dataset.spent === "1"); break;
    case "use": useToggle(el.dataset.key, el.dataset.spent === "1"); break;
    case "use-max": {
      const key = el.dataset.key, u = b.uses[key] || { max:0, used:0, rest:"lungo" };
      u.max = clamp(u.max + Number(el.dataset.d), 0, 20); u.used = Math.min(u.used, u.max);
      if (u.max) b.uses[key] = u; else delete b.uses[key];
      commit(); refresh(); break;
    }
    case "cast": cast(id, el.dataset.kind, el.dataset.lv); break;
    case "ritual": { const s = getSpell(id); if (!s) break; toast((s.f || "").includes("c") ? startConc(b, s) + " · lanciato come rituale" : `${s.n}: lanciato come rituale, nessuno slot speso`); commit(); refresh(); break; }
    case "conc-start": { const s = getSpell(id); if (!s) break; toast(startConc(b, s)); commit(); refresh(); break; }
    case "conc-end": { const s = getSpell(b.conc); b.conc = ""; commit(); refresh(); toast(s ? `${s.n}: concentrazione terminata` : "Concentrazione terminata"); break; }
    case "rest": rest(el.dataset.v); break;
    case "goto-spell": openDetail("s", id); break;
    case "edit": openEdit(id); break;
    case "new-spell": openEdit(null); break;
    case "import-spell": openImportSpell(); break;
    case "hide": { if (b.hidden[id]) delete b.hidden[id]; else b.hidden[id] = 1; toast(b.hidden[id] ? "Nascosto (lo ritrovi dal Menu)" : "Di nuovo visibile"); commit(); refresh(); break; }
    case "reset": delete b.edits[id]; commit(); refresh(); toast("Testo originale ripristinato"); break;
    case "del-spell": {
      const s = getSpell(id);
      confirmSheet("Eliminare l'incantesimo?", `«${s ? s.n : ""}» verrà eliminato da questo personaggio. L'operazione non si può annullare.`, "Elimina", () => {
        b.custom = b.custom.filter(x => x.id !== id); delete b.prep[id]; delete b.book[id]; delete b.always[id]; delete b.hidden[id];
        if (b.conc === id) b.conc = ""; UI.selS = null; commit(); closeDetail(); renderAll(false); toast("Incantesimo eliminato");
      }); break;
    }
    case "extra-add": {
      const s = getSpell(id), L = listLetter(b); if (!s) break;
      b.extra[id] = { from:(s.k || "").split("").find(k => k !== L) || "", why:"" };
      commit(); refresh(); toast(`${s.n}: aggiunto alla tua lista`); break;
    }
    case "extra-del": { const s = getSpell(id); delete b.extra[id]; delete b.prep[id]; delete b.always[id]; commit(); refresh(); toast(`${s ? s.n : "Incantesimo"}: tolto dalla tua lista`); break; }
    case "feat-toggle": {
      const it = findEntry("t:" + id); if (!it) break;
      if (b.feats[id]){ delete b.feats[id]; toast(`${it.n}: talento rimosso`); } else { b.feats[id] = 1; toast(`${it.n}: talento aggiunto`); }
      commit(); refresh(); break;
    }
    case "new-entry": openEditEntry(el.dataset.kind, null); break;
    case "edit-entry": openEditEntry(id[0], id); break;
    case "hide-entry": { if (b.xhidden[id]) delete b.xhidden[id]; else b.xhidden[id] = 1; toast(b.xhidden[id] ? "Nascosto (lo ritrovi dal Menu)" : "Di nuovo visibile"); commit(); refresh(); break; }
    case "reset-entry": delete b.xedits[id]; commit(); refresh(); toast("Testo originale ripristinato"); break;
    case "del-entry": {
      const it = findEntry(id);
      confirmSheet("Eliminare?", `«${it ? it.n : ""}» verrà eliminato da questo personaggio. L'operazione non si può annullare.`, "Elimina", () => {
        const raw = id.slice(2); b.xcustom = b.xcustom.filter(x => x.id !== raw); delete b.feats[raw]; delete b.uses[id]; delete b.xhidden[id];
        setSel(null); commit(); closeDetail(); renderAll(false); toast("Eliminato");
      }); break;
    }
    case "menu": openMenu(); break;
    case "save-all": closeSheet(); saveAll(); break;
    case "load-all": closeSheet(); pickAndOpen(); break;
    case "install": openInstall(); break;
    case "portrait": if (narrow() && !el.closest(".pg-card")) openCard(); else openPortrait(); break;
    case "p-pick": closeSheet(); pickPortrait(); break;
    case "p-edit": { const pp = b.portrait; if (pp) openPortraitEditor({ src:pp.src, shape:pp.shape, rot:pp.rot, zoom:pp.zoom, ox:pp.ox, oy:pp.oy }); break; }
    case "p-shape": changeShape(el.dataset.v); break;
    case "p-save": savePortraitImage(); break;
    case "p-remove": confirmSheet("Rimuovere il ritratto?", `Il ritratto di «${b.name}» verrà tolto dalla scheda. Le copie già salvate come immagine restano.`, "Rimuovi", () => { b.portrait = null; commit(); renderHeader(); toast("Ritratto rimosso"); }); break;
    case "chars": openChars(); break;
    case "char": S.active = id; cacheLocal(); localStatus(); closeSheet(); closeDetail(); renderAll(true); toast(`Scheda di ${S.books[id].name}`); break;
    case "char-new": { const nid = rid("pg-"); S.books[nid] = newBook("Nuovo personaggio"); S.active = nid; UI.tab = "compendio"; commit(); closeSheet(); closeDetail(); renderAll(true); openChars(); break; }
    case "char-rename": { const v = ($("#rn").value || "").trim(); if (!v){ $("#rn").focus(); break; } b.name = v.slice(0, 60); commit(); closeSheet(); renderHeader(); toast("Nome salvato"); break; }
    case "char-del":
      confirmSheet("Eliminare il personaggio?", `La scheda di «${b.name}», con incantesimi, privilegi, talenti e modifiche, verrà eliminata da questo dispositivo. I file già salvati restano. L'operazione non si può annullare.`, "Elimina", () => {
        const old = S.active; delete S.books[old]; delete S.handles[old];
        if (!Object.keys(S.books).length) S.books[rid("pg-")] = newBook();
        S.active = Object.keys(S.books)[0]; cacheLocal(); localStatus(); closeDetail(); renderAll(true); toast("Personaggio eliminato");
      }); break;
    case "toggle-hidden": UI.showHidden = !UI.showHidden; saveUI(); closeSheet(); renderResults(); toast(UI.showHidden ? "Gli elementi nascosti sono visibili" : "Elementi nascosti di nuovo"); break;
    case "export": closeSheet(); saveToFile(); break;
    case "import": closeSheet(); openImport(); break;
    case "sheet-close": closeSheet(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (!$("#sheet").hidden) closeSheet(); else if (document.documentElement.classList.contains("detail-open")) closeDetail(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("row") && e.target.dataset.act === "open"){ e.preventDefault(); openDetail(e.target.dataset.kind || "s", e.target.dataset.id); }
});
$("#scrim").addEventListener("click", closeSheet);
$("#cls").addEventListener("change", e => {
  const b = book(); b.cls = e.target.value;
  const c = clsOf(b); if (!c || !c.subs.some(s => s.k === b.sub)) b.sub = "";
  const tot = slotTotals(b); b.used = b.used.map((u, i) => Math.min(u, tot[i])); b.pact = 0; b.arc = {};
  commit(); closeDetail(); renderAll(true); toast(`Classe: ${className(b)}`);
});
$("#sub").addEventListener("change", e => {
  const b = book(); b.sub = e.target.value;
  const s = subOf(b); commit(); renderAll(true);
  toast(s ? `${s.n}${s.spells ? ": incantesimi della sottoclasse aggiunti" : ""}` : "Nessuna sottoclasse");
});
let qTimer = null;
document.addEventListener("input", e => {
  if (e.target.id === "q"){ clearTimeout(qTimer); qTimer = setTimeout(() => { UI.q = e.target.value; renderResults(); }, 90); }
  if (e.target.id === "tq"){ clearTimeout(qTimer); qTimer = setTimeout(() => { UI.tq = e.target.value; renderResults(); }, 90); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fSch"){ UI.sch = t.value; saveUI(); renderResults(); }
  if (t.id === "fSrc"){ UI.src = t.value; saveUI(); renderResults(); }
  if (t.id === "tSrc"){ UI.tSrc = t.value; saveUI(); renderResults(); }
  if (t.id === "raceSel"){ const b = book(); b.race = t.value; b.subrace = ""; commit(); renderTop(true); renderResults(); const r = raceOf(b); toast(r ? `Specie: ${r.n}${r.subs.length ? " · scegli la variante" : ""}` : "Nessuna specie"); }
  if (t.id === "subraceSel"){ const b = book(); b.subrace = t.value; commit(); renderTop(true); renderResults(); toast(b.subrace ? `Variante: ${raceName(b)}` : "Nessuna variante"); }
  if (t.id === "bgSel"){ const b = book(); b.bg = t.value; commit(); renderTop(true); renderResults(); const g = BG_BY.get(b.bg); toast(g ? `Background: ${g.n}` : "Nessun background"); }
  if (t.id === "useRest"){ const b = book(), key = t.dataset.key, u = b.uses[key] || { max:0, used:0, rest:"lungo" }; u.rest = t.value; b.uses[key] = u; if (!u.max) delete b.uses[key]; commit(); toast(`Recupero: riposo ${t.value}`); }
});
$("#portraitFile").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; onPortraitFile(f); });
$("#importFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const ta = $("#imp"); if (ta) ta.value = String(r.result); importText(String(r.result)); };
  r.readAsText(f); e.target.value = "";
});
(function(){ const mq = window.matchMedia("(max-width: 899.98px)"), fn = ev => { if (!ev.matches) document.documentElement.classList.remove("detail-open"); };
  if (mq.addEventListener) mq.addEventListener("change", fn); else if (mq.addListener) mq.addListener(fn); })();
(function watchHeader(){
  const h = $("#top"), set = () => document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px");
  set(); if (window.ResizeObserver) new ResizeObserver(set).observe(h); else window.addEventListener("resize", set);
})();

/* ================= Avvio ================= */
const cache = lsGet(LS_KEY);
if (cache && cache.books && typeof cache.books === "object"){
  for (const id of Object.keys(cache.books)) S.books[id] = normBook(cache.books[id]);
  S.active = cache.active;
}
if (!Object.keys(S.books).length) S.books.principale = newBook();
if (!S.books[S.active]) S.active = Object.keys(S.books)[0];
if (!["spells","trait","feat"].includes(UI.section)) UI.section = "spells";
renderAll(true);
localStatus();
updateSaveBtn();
if (IS_PWA && IS_IOS && !IS_STANDALONE){
  let seen = null; try { seen = localStorage.getItem("grimorio:install-hint"); } catch(e){}
  if (!seen) setTimeout(() => { toast("Per averlo come app offline: Condividi › Aggiungi alla schermata Home"); try { localStorage.setItem("grimorio:install-hint", "1"); } catch(e){} }, 1200);
}
if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => { S.downloads = d; }).catch(() => {});
})();
</script>

<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  // La pagina si aggiorna da sola (arriva dalla rete quando c'è); qui si tiene aggiornato anche il
  // componente offline, all'avvio e ogni volta che l'app torna in primo piano.
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.update().catch(function(){});
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") reg.update().catch(function(){}); });
  }).catch(function(){});
}
</script>
